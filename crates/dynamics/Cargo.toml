[package]
name = "dynamics"
version = "1.0.0"
edition = "2021"
description = "Deterministic ODE-based dynamics models for SimOps digital twin projections."
authors = ["Ivan Labra"]

[dependencies]
ode_solvers = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
thiserror = "1.0"

[dev-dependencies]
approx = "0.5"
