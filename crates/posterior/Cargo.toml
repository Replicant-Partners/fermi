[package]
name = "posterior"
version = "0.1.0"
edition = "2021"
authors = ["Fermi Team"]
description = "BayesOps Phase 1 — marginal distribution fitting. Produces FittedDistribution from scalar observations, directly convertible to FPL Driver parameters. See docs/specs/14_BAYESOPS_SPEC.md."

[dependencies]
# Sampling + statistical distributions (CDFs, inverse CDFs, special functions)
rand = "0.8"
rand_distr = "0.4"
statrs = "0.16"

# Serde for FittedDistribution round-trip through harness_snapshots.bayesops_params JSONB
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# FitMetadata.fitted_at timestamp
chrono = { version = "0.4", features = ["serde"] }

# Typed errors
thiserror = "1.0"

[dev-dependencies]
# For deterministic test seeding
rand = "0.8"
