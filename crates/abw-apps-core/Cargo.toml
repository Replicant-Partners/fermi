[package]
name = "abw-apps-core"
version = "0.1.0"
edition = "2021"
description = "ABW App manifest builder + validator. Pure logic, no I/O. Shared by the CLI, the server, and any future App-creation surface."

[lib]
name = "abw_apps_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# (none yet — tests are inline)
