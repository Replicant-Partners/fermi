[package]
name = "projections"
version = "0.1.0"
edition = "2021"
description = "Platform-level distributional projection engine. Runs any registered deterministic executor N times with varied inputs sampled from declared distributions. Not SimOps-specific."
authors = ["Ivan Labra"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# SimOps executor — optional, enabled via feature flag
simops = { path = "../simops", optional = true }

[features]
default = []
simops-executor = ["dep:simops"]

[dev-dependencies]
approx = "0.5"
