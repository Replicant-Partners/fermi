[package]
name = "simops"
version = "0.1.0"
edition = "2021"
description = "SimOps — Universal Resource Efficiency Engine (SOSA-aligned)"
authors = ["Kask R&D Team"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
approx = "0.5"
