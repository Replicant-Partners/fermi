[package]
name = "fermi-console"
version = "0.10.4"
edition = "2021"
description = "MMOG-style forecasting command center built on GPUI"
license = "MIT"

[[bin]]
name = "fermi-console"
path = "src/main.rs"

[dependencies]
# GPU-accelerated UI framework (Zed's framework)
gpui = "0.2"

# Local database for portfolio, drafts, agent cache
rusqlite = { version = "0.31", features = ["bundled"] }

# HTTP client for ABW API calls
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "deflate", "brotli"], default-features = false }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1"
thiserror = "2"

# SSE client for real-time events (leaderboard, forecast resolution)
eventsource-client = "0.13"

# Random (for Monte Carlo simulation)
rand = "0.8"
rand_distr = "0.4"

# Unicode text handling
unicode-segmentation = "1.11"

# Open URLs in default browser (for OAuth flow)
open = "5"

# FPL parser and executor (local simulation)
fermi = { path = "../.." }

# BayesOps posterior types — needed to discriminate FittedDistribution
# variants when surfacing learnable-driver status badges in the UI.
posterior = { path = "../posterior" }

# Charting — renders to pixel buffer for GPUI display
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "ab_glyph", "line_series", "area_series"] }
image = "0.25"
rfd = "0.15"
