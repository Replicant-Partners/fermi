[package]
name = "fermi-console"
version = "0.15.0"
edition = "2021"
description = "MMOG-style forecasting command center built on GPUI"
license = "MIT"

# Library target holding the GPUI-free modules, so their tests can
# actually run. The bin target can't be tested at all: rustc segfaults
# expanding GPUI's element chains under `--test`. See src/lib.rs.
[lib]
name = "fermi_console"
path = "src/lib.rs"

[[bin]]
name = "fermi-console"
path = "src/main.rs"

[dependencies]
# GPU-accelerated UI framework (Zed's framework)
gpui = "0.2"

# Local database for portfolio, drafts, agent cache
rusqlite = { version = "0.31", features = ["bundled"] }

# HTTP client for ABW API calls
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "deflate", "brotli"], default-features = false }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1"
thiserror = "2"

# SSE client for real-time events (leaderboard, forecast resolution)
eventsource-client = "0.13"

# Random (for Monte Carlo simulation)
rand = "0.8"
rand_distr = "0.4"

# Unicode text handling
unicode-segmentation = "1.11"

# Open URLs in default browser (for OAuth flow)
open = "5"

# FPL parser and executor (local simulation)
fermi = { path = "../.." }

# Activity-log event model (GPUI-free so its tests actually build —
# see crates/fermi-activity/Cargo.toml).
fermi-activity = { path = "../fermi-activity" }

# BayesOps posterior types — needed to discriminate FittedDistribution
# variants when surfacing learnable-driver status badges in the UI.
posterior = { path = "../posterior" }

# Charting needs no dependency: charts are vector paths painted straight
# into the GPUI scene by `src/viz`, with geometry and statistics in
# `src/plot`. The former `plotters` + `image` pipeline rasterised into
# `RenderImage`s, which GPUI never reclaims from the sprite atlas — a
# tile leaked per frame, and that was the chart flicker.
rfd = "0.15"
