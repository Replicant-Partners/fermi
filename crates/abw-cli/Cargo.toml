[package]
name = "abw-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for building, validating, and deploying Apps on the Agent Bestiary Workspace platform"

[[bin]]
name = "abw"
path = "src/main.rs"

[dependencies]
# Pure manifest builder + validator. Tiny crate (serde + serde_json only) so
# the CLI builds standalone without pulling in the fermi server's transitive
# graph (axum, sqlx, agent-bestiary crates, etc.). Same code the server's
# `crate::apps::builder` re-exports.
abw-apps-core = { path = "../abw-apps-core" }

clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "time"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
anyhow = "1.0"
colored = "2.0"
dirs = "5.0"
url = "2.5"
open = "5"
