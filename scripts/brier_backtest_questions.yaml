# Historical backtest questions for Brier calibration seeding.
#
# Each question was resolved on a real-world outcome. The `actual_outcome`
# field is the ground truth (true = YES resolved, false = NO resolved).
#
# predicted_probability is a neutral prior (0.5) for questions where we
# have no agent-specific prediction — the point is to populate resolved
# forecast rows so the BrierEvaluator has data to score against.
# For questions where we have a strong prior from base rates, we use that.
#
# To add new questions:
#   1. Add an entry with a unique id
#   2. Set actual_outcome to the known resolution
#   3. Set predicted_probability to the best available prior (base rate,
#      market consensus, or 0.5 if truly unknown)
#   4. Set agents to the agent(s) that would have worked this question
#   5. Run: cargo run --bin brier-backtest-seed -- --database-url $DATABASE_URL
#
# Format:
#   id: unique slug
#   question: the forecast question text
#   domain: economics | markets | sports | biotech | geopolitics
#   actual_outcome: true | false
#   predicted_probability: float 0.0-1.0
#   resolved_date: YYYY-MM-DD (approximate)
#   agents: list of agent_ids that handle this domain
#   tags: list of string tags for domain decomposition

