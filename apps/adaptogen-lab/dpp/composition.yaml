# ─────────────────────────────────────────────────────────────────────────────
# DPP Composition — Bill of Materials
# Schema: bom:Item / bom:consistsOf (JSON-LD aligned)
#
# This is the canonical DPP document for product composition.
# Sources:  hand-authored | derived from SimOps cascade | imported from ERP
# Consumers: supply_chain_oracle (pricing), compare_lenses (regulatory),
#            label_generator (output), regulatory_scanner (compliance)
#
# role vocabulary matches SimOps InputRole exactly:
#   principal   — primary flow; declared as ingredient on label
#   consumable  — additive; included in final product; declared on label
#   catalyst    — process aid (e.g. SCOBY); not declared as ingredient
#
# DATA: [SYNTHETIC] — structurally representative only.
# ─────────────────────────────────────────────────────────────────────────────

