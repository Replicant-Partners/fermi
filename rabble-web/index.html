<!doctype html>
<html>
  <head>
    <base href="/" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      name="description"
      content="Collect creatures. Gather in the wild. AR insect swarms at real locations."
    />

    <!-- Permissions Policy: allow geolocation, camera, sensors for AR -->
    <meta
      http-equiv="Permissions-Policy"
      content="geolocation=(self), camera=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self)"
    />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Rabble" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Theme color for browser chrome -->
    <meta name="theme-color" content="#FFB224" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Rabble</title>
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <script src="flutter_bootstrap.js" async></script>
    <script>
      // Register custom service worker with push notification support.
      // This wraps Flutter's service worker and adds push event handling.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("/custom-sw.js", { scope: "/" })
            .then(function (reg) {
              console.log(
                "[App] Push-enabled service worker registered:",
                reg.scope,
              );
            })
            .catch(function (err) {
              console.warn(
                "[App] SW registration failed, falling back to Flutter SW:",
                err,
              );
            });
        });
      }
    </script>
  </body>
</html>
