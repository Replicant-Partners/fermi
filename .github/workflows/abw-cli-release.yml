name: Release abw CLI

# Builds and publishes pre-built `abw` binaries for all major platforms.
#
# Trigger options:
#   git tag abw-vX.Y.Z && git push origin abw-vX.Y.Z   — full release
#   workflow_dispatch (GitHub UI)                       — manual release
#
# The CLI versions independently from the rest of the platform — it has its
# own tag prefix (`abw-v*`) so cutting a CLI release doesn't imply cutting a
# server release.
#
# Output: a GitHub Release with one tarball (Linux/macOS) or zip (Windows)
# per target triple, plus a SHA256 checksums file. The install script at
# scripts/install-abw.sh consumes these artifacts.

on:
  push:
    tags:
      - "abw-v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. abw-v0.1.0) — leave empty for 'abw-latest'"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: abw
  CRATE_NAME: abw-cli

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive_ext: tar.gz
            binary_ext: ""
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            archive_ext: tar.gz
            binary_ext: ""
            # aarch64 Linux requires a cross-compiler — see "Install cross-compiler" step
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive_ext: tar.gz
            binary_ext: ""
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive_ext: tar.gz
            binary_ext: ""
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive_ext: zip
            binary_ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-abw-cli-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-abw-cli-cargo-

      - name: Cache build target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-abw-cli-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-abw-cli-target-

      # Cross-compilation for aarch64-unknown-linux-gnu needs gcc-aarch64-linux-gnu.
      # rustls is pure-Rust so no OpenSSL system libs are required for any target.
      - name: Install cross-compiler (aarch64 Linux)
        if: matrix.cross
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binary
        run: cargo build --release -p ${{ env.CRATE_NAME }} --target ${{ matrix.target }}

      - name: Strip binary (unix)
        if: runner.os != 'Windows'
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip "$BIN_PATH" || true
          else
            strip "$BIN_PATH" || true
          fi

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=abw-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Package binary (unix tarball)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          BIN="${{ env.BINARY_NAME }}"
          ARCHIVE="${BIN}-${TAG}-${TARGET}.tar.gz"

          # Lay the binary out flat in a staging dir alongside README + LICENSE
          # so `tar xzf` produces a clean directory.
          STAGE=$(mktemp -d)
          cp "target/${TARGET}/release/${BIN}" "${STAGE}/${BIN}"
          cp crates/abw-cli/Cargo.toml "${STAGE}/" || true
          [ -f LICENSE ] && cp LICENSE "${STAGE}/" || true
          [ -f docs/specs/03_CREATING_APPS.md ] && cp docs/specs/03_CREATING_APPS.md "${STAGE}/README.md" || true

          tar -czf "${ARCHIVE}" -C "${STAGE}" .

          # Plain binary with a stable name for the install script
          cp "target/${TARGET}/release/${BIN}" "${BIN}-${TARGET}"

          # SHA256s
          if command -v sha256sum >/dev/null; then
            sha256sum "${ARCHIVE}" "${BIN}-${TARGET}" > "checksums-${TARGET}.txt"
          else
            shasum -a 256 "${ARCHIVE}" "${BIN}-${TARGET}" > "checksums-${TARGET}.txt"
          fi
          cat "checksums-${TARGET}.txt"

          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          echo "PLAIN_BIN=${BIN}-${TARGET}" >> "$GITHUB_ENV"
          echo "CHECKSUMS=checksums-${TARGET}.txt" >> "$GITHUB_ENV"

      - name: Package binary (windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TAG = "${{ steps.tag.outputs.tag }}"
          $TARGET = "${{ matrix.target }}"
          $BIN = "${{ env.BINARY_NAME }}"
          $EXE = "${BIN}.exe"
          $ARCHIVE = "${BIN}-${TAG}-${TARGET}.zip"

          $stage = New-TemporaryFile | ForEach-Object { Remove-Item $_; New-Item -ItemType Directory -Path $_ }
          Copy-Item "target/${TARGET}/release/${EXE}" -Destination "${stage}/${EXE}"
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination "${stage}/" }
          if (Test-Path "docs/specs/03_CREATING_APPS.md") {
            Copy-Item "docs/specs/03_CREATING_APPS.md" -Destination "${stage}/README.md"
          }

          Compress-Archive -Path "${stage}/*" -DestinationPath $ARCHIVE -Force

          # Plain binary with a stable name for the install script
          Copy-Item "target/${TARGET}/release/${EXE}" -Destination "${BIN}-${TARGET}.exe"

          # SHA256s
          $hash1 = (Get-FileHash $ARCHIVE -Algorithm SHA256).Hash.ToLower()
          $hash2 = (Get-FileHash "${BIN}-${TARGET}.exe" -Algorithm SHA256).Hash.ToLower()
          "${hash1}  ${ARCHIVE}`n${hash2}  ${BIN}-${TARGET}.exe" | Out-File -Encoding ascii "checksums-${TARGET}.txt"
          Get-Content "checksums-${TARGET}.txt"

          "ARCHIVE=${ARCHIVE}" | Out-File -Encoding ascii -Append $env:GITHUB_ENV
          "PLAIN_BIN=${BIN}-${TARGET}.exe" | Out-File -Encoding ascii -Append $env:GITHUB_ENV
          "CHECKSUMS=checksums-${TARGET}.txt" | Out-File -Encoding ascii -Append $env:GITHUB_ENV

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: abw CLI ${{ steps.tag.outputs.tag }}
          body: |
            ## abw CLI — ${{ steps.tag.outputs.tag }}

            The `abw` command-line is the developer-facing path for building
            Apps on the Agent Bestiary Workspace platform. See [Doc 3 — Building
            Creating Apps on ABW](https://github.com/Replicant-Partners/fermi/blob/main/docs/specs/03_CREATING_APPS.md)
            and the [runtime-UX guide](https://github.com/Replicant-Partners/fermi/blob/main/docs/specs/07_BUILDING_WITH_ABW.md)
            for the three drop-dead-easy paths.

            ### Quick install (any platform)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/Replicant-Partners/fermi/main/scripts/install-abw.sh | bash
            ```

            ### Manual install

            Pick the archive for your platform from the assets below:

            - `abw-${{ steps.tag.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz`
            - `abw-${{ steps.tag.outputs.tag }}-aarch64-unknown-linux-gnu.tar.gz`
            - `abw-${{ steps.tag.outputs.tag }}-x86_64-apple-darwin.tar.gz` (Intel Mac)
            - `abw-${{ steps.tag.outputs.tag }}-aarch64-apple-darwin.tar.gz` (Apple Silicon)
            - `abw-${{ steps.tag.outputs.tag }}-x86_64-pc-windows-msvc.zip`

            Extract, drop `abw` (or `abw.exe`) on your `$PATH`, then:

            ```bash
            abw login
            abw app new my_first_app
            abw app deploy
            ```

            ### Verify

            Each platform has a `checksums-<target>.txt` listing SHA256s of both
            the archive and the plain binary.
          draft: false
          prerelease: ${{ steps.tag.outputs.tag == 'abw-latest' }}
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.PLAIN_BIN }}
            ${{ env.CHECKSUMS }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
