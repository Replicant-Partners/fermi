name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fermi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Pin dependency versions
        run: |
          cargo update time --precise 0.3.36
          cargo update home --precise 0.5.9

      - name: Set up database
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fermi_test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for postgres..."
            sleep 1
          done

          # Enable required extensions
          psql -h localhost -U postgres -d fermi_test -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
          psql -h localhost -U postgres -d fermi_test -c 'CREATE EXTENSION IF NOT EXISTS "vector";'

          # Apply migrations in api_server::run_migrations() order.
          #
          # This loop used to be `ls migrations/*.sql | sort`, which is NOT the
          # runner's order and is not the set the runner applies. Two concrete
          # consequences we hit: CI applied migrations/126 while production
          # never did (it was missing from the hardcoded list), and CI built a
          # schema in an order production never uses. Parse the real list.
          grep -oE '"migrations/[^"]+\.sql"' src/api_server.rs | tr -d '"' > /tmp/migration_order.txt
          echo "Applying $(wc -l < /tmp/migration_order.txt) migrations in runner order"

          FAILED=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! psql -h localhost -U postgres -d fermi_test -v ON_ERROR_STOP=1 -f "$f" >/tmp/mig.out 2>&1; then
              echo "::warning file=$f::migration failed to apply on a fresh database"
              grep -E 'ERROR|FATAL' /tmp/mig.out | head -2 | sed 's/^/    /'
              FAILED=$((FAILED + 1))
            fi
          done < /tmp/migration_order.txt

          echo "Migrations applied with $FAILED failure(s)"

          # RATCHET, not a gate.
          #
          # 26 migrations currently fail against an empty database — the set
          # cannot rebuild the schema from scratch, because migrations have been
          # edited in place after having been applied (e.g. nothing in the repo
          # creates users.id, yet fermi-auth JOINs on it). Fixing that is Phase 2
          # of docs/SCHEMA_AND_RULE_INTEGRITY_RECONCILIATION.md.
          #
          # Until then: freeze the number so it cannot grow. Previously this loop
          # ended in `|| true`, so newly-broken migrations were invisible in CI
          # exactly as they are in production's runner.
          #
          # When you fix migrations, LOWER this number. Never raise it.
          BASELINE=26
          if [ "$FAILED" -gt "$BASELINE" ]; then
            echo "::error::$FAILED migrations fail to apply, baseline is $BASELINE."
            echo "A migration that previously applied cleanly now does not."
            exit 1
          fi
          if [ "$FAILED" -lt "$BASELINE" ]; then
            echo "::notice::Only $FAILED migrations fail (baseline $BASELINE)."
            echo "Please lower BASELINE in .github/workflows/ci.yml to $FAILED."
          fi

      # SPEC_28 — an LLM provider key read from env in execution code
      # silently bills the platform for a user's agent. Cheap grep-level
      # guard; runs before the build so a regression fails fast.
      - name: Lint — no env-sourced LLM provider credentials
        run: ./scripts/lint-no-env-credentials.sh

      # These two ran only in a local pre-commit hook, so they were bypassable
      # with --no-verify and absent from any clone that never ran
      # install-git-hooks.sh. Both pass cleanly today, so they are blocking.
      - name: Lint — SQL column refs resolve to a migration
        run: python3 scripts/lint-schema-consistency.py $(git ls-files '*.rs')

      - name: Lint — user-reference columns FK to users(user_id)
        run: ./scripts/lint-owner-columns.sh

      - name: Check all binaries compile
        run: cargo check --bins --workspace

      - name: Run unit tests (non-DB crates)
        run: cargo test --lib --workspace --exclude agent-bestiary-memory

      - name: Run agent-bestiary-memory unit tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fermi_test
        run: cargo test --lib -p agent-bestiary-memory -- --test-threads=1

      - name: Run API integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fermi_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fermi_test
        run: cargo test --test api_tests -- --test-threads=1

      # Contract hygiene tier: no DATABASE_URL, so the live checks self-skip.
      # Asserts the schema_trust contract is internally coherent — the class of
      # defect that made it unsatisfiable from v0.11.0 to v0.11.8 unnoticed.
      # Blocking.
      - name: Schema trust contract — hygiene
        run: cargo test --test schema_trust_contract

      # Live tier: does the contract actually hold against a built schema?
      # ADVISORY FOR NOW — CI's schema is built by the same migration set that
      # cannot rebuild from empty (see the ratchet above), so failures here are
      # currently downstream of that, not of the contract.
      #
      # Flip to blocking (drop continue-on-error) once the migration baseline
      # reaches 0. That is the point at which SCHEMA_STRICT=1 becomes safe to
      # enable in production.
      - name: Schema trust contract — live verification (advisory)
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fermi_test
        run: cargo test --test schema_trust_contract -- --nocapture

      # TODO: fermi-memory integration tests need rework — they insert episodes
      # without creating agents first, violating FK constraints added in migration 010.
      # Re-enable after updating tests to create agents before episodes.

  agent-card-lint:
    name: Agent Card Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      - name: Pin dependency versions
        run: |
          cargo update time --precise 0.3.36
          cargo update home --precise 0.5.9
      - name: Run agent card conformance tests
        run: cargo test --lib -p fermi agent_card::tests -- --nocapture

  migration-lint:
    name: Migration Lint
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the changed-migrations diff below has a base commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # scripts/lint-migrations.sh checks three PgBouncer-safety rules;
      # the inline check below reimplements only the first. Run the real
      # script on migrations touched by this change — scoping to changed
      # files is what keeps the older, grandfathered migrations out of it.
      - name: Lint changed migrations (PgBouncer safety)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.before }}"; fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No usable base ref; skipping changed-file migration lint."
            exit 0
          fi
          CHANGED=$(git diff --name-only --diff-filter=d "$BASE" HEAD -- 'migrations/*.sql' | grep -v rollback || true)
          if [ -z "$CHANGED" ]; then
            echo "No migrations changed."
            exit 0
          fi
          echo "Linting: $CHANGED"
          ./scripts/lint-migrations.sh $CHANGED

      - name: Check for BEGIN/COMMIT in migrations (banned with PgBouncer)
        run: |
          FAILED=0
          for f in migrations/*.sql; do
            # Skip rollback files
            case "$f" in *rollback*) continue ;; esac

            # Grandfathered: migrations 001-025 predate the lint rule.
            # Only enforce on 026+ where BEGIN/COMMIT caused production outages.
            NUM=$(basename "$f" | grep -oP '^\d+' || echo "0")
            if [ "$NUM" -lt 26 ] 2>/dev/null; then
              continue
            fi

            # Check for bare transaction BEGIN/COMMIT (not PL/pgSQL DO $$ blocks)
            # PL/pgSQL uses BEGIN without semicolon as block opener — that's fine.
            # Transaction control uses BEGIN; or COMMIT; as standalone statements.
            if grep -Pn '^\s*BEGIN\s*;\s*$' "$f" 2>/dev/null || \
               grep -Pn '^\s*COMMIT\s*;\s*$' "$f" 2>/dev/null; then
              echo "ERROR: $f contains BEGIN;/COMMIT; — banned with PgBouncer transaction mode"
              echo "  Use IF NOT EXISTS / DROP IF EXISTS for idempotency instead"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "Migrations must not use explicit BEGIN/COMMIT."
            echo "Neon uses PgBouncer in transaction mode which silently fails"
            echo "when migrations contain transaction control statements."
            exit 1
          fi

          echo "All migrations clean (026+) — no BEGIN/COMMIT found"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy
      - name: Pin dependency versions
        run: |
          cargo update time --precise 0.3.36
          cargo update home --precise 0.5.9
      - name: Run clippy
        run: |
          cargo clippy --lib --bins --tests --all-features -- \
            -W clippy::all \
            -A dead_code \
            -A unused_variables \
            -A unused_imports \
            -A unused_mut \
            -A clippy::too_many_arguments \
            -A clippy::should_implement_trait \
            -A ambiguous_glob_reexports \
            -A private_interfaces \
            -A clippy::manual_clamp \
            -A clippy::approx_constant \
            -A clippy::only_used_in_recursion \
            -A clippy::empty_line_after_doc_comments \
            -A clippy::unnecessary_cast \
            -A clippy::derivable_impls

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    # Advisory-only: don't block CI on upstream dependency vulnerabilities
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Install cargo-audit via binstall
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm cargo-audit
      - name: Run security audit
        run: cargo audit
