name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fermi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Pin dependency versions
        run: |
          cargo update time --precise 0.3.36
          cargo update home --precise 0.5.9

      - name: Set up database
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fermi_test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for postgres..."
            sleep 1
          done

          # Enable required extensions
          psql -h localhost -U postgres -d fermi_test -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
          psql -h localhost -U postgres -d fermi_test -c 'CREATE EXTENSION IF NOT EXISTS "vector";'

          # Apply migrations in api_server::run_migrations() order.
          #
          # This loop used to be `ls migrations/*.sql | sort`, which is NOT the
          # runner's order and is not the set the runner applies. Two concrete
          # consequences we hit: CI applied migrations/126 while production
          # never did (it was missing from the hardcoded list), and CI built a
          # schema in an order production never uses. Parse the real list.
          grep -oE '"migrations/[^"]+\.sql"' src/api_server.rs | tr -d '"' > /tmp/migration_order.txt
          echo "Applying $(wc -l < /tmp/migration_order.txt) migrations in runner order"

          FAILED=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! psql -h localhost -U postgres -d fermi_test -v ON_ERROR_STOP=1 -f "$f" >/tmp/mig.out 2>&1; then
              echo "::warning file=$f::migration failed to apply on a fresh database"
              grep -E 'ERROR|FATAL' /tmp/mig.out | head -2 | sed 's/^/    /'
              FAILED=$((FAILED + 1))
            fi
          done < /tmp/migration_order.txt

          echo "Migrations applied with $FAILED failure(s)"

          # RATCHET, not a gate.
          #
          # 6 migrations currently fail against an empty database. Was 26 until
          # migrations 195/196 declared the schema objects production has and no
          # migration creates — see docs/plans/CI_MIGRATION_RATCHET.md for the
          # full accounting. The cause was one shape repeated: `IF NOT EXISTS`
          # silently skipping a schema change, with run_migrations swallowing
          # the error that followed.
          #
          # The remaining 6 are not one-line fixes:
          #   006, 007  ordering — they ALTER agents/episodes, which the runner
          #             creates later in the list; fixing means reordering
          #   089, 095  PostGIS is absent from the pgvector service image; add
          #             the extension or guard the two files
          #   163       needs ar_beacons.location_name, which 089 adds
          #   096       indexes activity_events(creature_id), a column no
          #             migration creates and nothing writes — declaring it
          #             would manufacture exactly the write-orphaned column the
          #             rollup tripwire below exists to catch, so it needs an
          #             owner's decision, not a guess
          #
          # Freeze the number so it cannot grow. Previously this loop ended in
          # `|| true`, so newly-broken migrations were invisible in CI exactly
          # as they are in production's runner.
          #
          # When you fix migrations, LOWER this number. Never raise it.
          BASELINE=6
          if [ "$FAILED" -gt "$BASELINE" ]; then
            echo "::error::$FAILED migrations fail to apply, baseline is $BASELINE."
            echo "A migration that previously applied cleanly now does not."
            exit 1
          fi
          if [ "$FAILED" -lt "$BASELINE" ]; then
            echo "::notice::Only $FAILED migrations fail (baseline $BASELINE)."
            echo "Please lower BASELINE in .github/workflows/ci.yml to $FAILED."
          fi

      # SPEC_28 — an LLM provider key read from env in execution code
      # silently bills the platform for a user's agent. Cheap grep-level
      # guard; runs before the build so a regression fails fast.
      - name: Lint — no env-sourced LLM provider credentials
        run: ./scripts/lint-no-env-credentials.sh

      # These two ran only in a local pre-commit hook, so they were bypassable
      # with --no-verify and absent from any clone that never ran
      # install-git-hooks.sh. Both pass cleanly today, so they are blocking.
      - name: Lint — SQL column refs resolve to a migration
        run: python3 scripts/lint-schema-consistency.py $(git ls-files '*.rs')

      - name: Lint — user-reference columns FK to users(user_id)
        run: ./scripts/lint-owner-columns.sh

      # SPEC_30 — gate=derived fails only on machine-checkable defects (a
      # rank contradicting its own card, a broken suffix, species != agent_id).
      # Editorial naming gaps are reported but do not fail the build; flip to
      # `--gate all` once agents/taxonomy_vocab.json is fully populated.
      - name: Lint — agent taxonomy conformance
        run: ./scripts/taxonomy.py audit --gate derived

      # `node --check` is a syntax check and the trace's client has shipped
      # three runtime failures past one: a deleted `ladder()` (blank page in
      # production), a renamed `esc(head)`, and `h is not defined` — which made a
      # tool call that worked report itself as a network outage. All three live
      # inside a `try`, so only running the page finds them. This renders it
      # across every lens and presses every probe against every response shape.
      - name: Trace client renders — every lens, every probe
        run: node scripts/check_trace_probe_render.js

      - name: Check all binaries compile
        run: cargo check --bins --workspace

      - name: Run unit tests (non-DB crates)
        run: cargo test --lib --workspace --exclude agent-bestiary-memory

      # `handlers` is a module of the api-server BINARY, not of the lib,
      # so `--lib` above cannot see its tests. Without this line the
      # /fermi-console/download platform allowlist — which guards an
      # outbound redirect — would be tested only in principle. The binary
      # is already compiled by `cargo check --bins --workspace`, so this
      # costs a test-profile link, not a fresh build.
      - name: Run api-server binary unit tests
        run: cargo test --bin api-server

      - name: Run agent-bestiary-memory unit tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fermi_test
        run: cargo test --lib -p agent-bestiary-memory -- --test-threads=1

      - name: Run API integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fermi_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fermi_test
        run: cargo test --test api_tests -- --test-threads=1

      # Contract hygiene tier: no DATABASE_URL, so the live checks self-skip.
      # Asserts the schema_trust contract is internally coherent — the class of
      # defect that made it unsatisfiable from v0.11.0 to v0.11.8 unnoticed.
      # Blocking.
      - name: Schema trust contract — hygiene
        run: cargo test --test schema_trust_contract

      # Live tier: does the contract actually hold against a built schema?
      # ADVISORY FOR NOW — CI's schema is built by the same migration set that
      # cannot rebuild from empty (see the ratchet above), so failures here are
      # currently downstream of that, not of the contract.
      #
      # Flip to blocking (drop continue-on-error) once the migration baseline
      # reaches 0. That is the point at which SCHEMA_STRICT=1 becomes safe to
      # enable in production.
      - name: Schema trust contract — live verification (advisory)
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fermi_test
        run: cargo test --test schema_trust_contract -- --nocapture

      # Rollup contract, offline tier. The tripwire for columns that EXIST
      # but LIE: `agents.total_executions` was present, correctly typed,
      # declared in SCHEMA_COLUMNS, and permanently zero because no code
      # path wrote it. Six handlers read it and served zeros to users.
      #
      # Every check above passed the whole time — they all reason about
      # shape, and this was a content failure. Blocking, and needs no
      # database, so there is no reason for it not to be.
      - name: Rollup contract — write-orphaned column tripwire
        run: cargo test --test rollup_contract

      # Live tier: do the denormalised columns actually agree with their
      # source of truth? ADVISORY, for the same reason as the schema live
      # tier — CI's database is seeded by `api_tests` and may not carry
      # enough episodes to distinguish a stale column from an accurate one,
      # which the contract deliberately treats as a failure rather than a
      # pass. Run `scripts/rollup_contract_live.sh` against a real database
      # for the authoritative answer.
      - name: Rollup contract — live verification (advisory)
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fermi_test
        run: cargo test --test rollup_contract -- --ignored --nocapture --test-threads=1

      # Grounding contract. The third in the family, after presence
      # (schema_trust) and truth (rollup_trust): could this value have come
      # from anywhere at all? `genome_profiler` was asked for genome size,
      # karyotype, divergence date and IUCN status with two GBIF tools that
      # return taxonomy, and filled every one of them for 56 episodes.
      #
      # Offline and blocking — pure functions over JSON, no database, no LLM.
      - name: Grounding contract — ungrounded output fields
        run: cargo test --lib -p fermi grounding_trust

      # Grounding coverage. Offline and blocking, a source scan.
      #
      # `grounding_trust` declares contracts for nine agents; enforcement used
      # to reach four of them. The five with a written contract and no call
      # site on the generic execute path were checked when another agent
      # called them and unchecked when a person did. This fails if any execute
      # boundary stops enforcing, or a new one is added that never started.
      - name: Grounding — every execute boundary enforces
        run: cargo test --test grounding_execute_coverage

      # Liveness contracts. Offline and blocking: this asserts the contracts
      # are well-formed, read-only, and that `inert` cannot be spelled `pass`.
      #
      # It is here because until now nothing ran this rung at all. It had a
      # module, a contract list, a test file and a shell script, and executed
      # only when a human typed the script's name — the cheapest rung on the
      # ladder, and the only one with no schedule, no endpoint and no CI step.
      # A check nobody runs is indistinguishable from a check that passes.
      #
      # The live tier (`scripts/liveness_contract_live.sh`, which needs
      # DATABASE_URL) is what actually answers "has this write path ever run";
      # the server now also sweeps it on a timer and serves the verdict at
      # GET /api/admin/liveness.
      - name: Liveness contract — the checks are well-formed
        run: cargo test --lib -p fermi liveness_trust

      # Port binding parity. `scripts/port_census.py` reports the port-typing
      # burn-down; `src/port_trust.rs` enforces at both execute boundaries.
      # If the two rules drift, the scoreboard stops describing the gate —
      # a number that still looks healthy while the thing it measures does
      # something else, which is the defect class this whole line of work
      # exists to catch.
      #
      # Fixture: agents/port_binding_expected.json, regenerated with
      #   scripts/port_census.py --emit-expected agents/port_binding_expected.json
      - name: Port binding — census and gate agree
        run: cargo test --test port_binding_parity

      # The census must also be self-consistent. Its headline counts were
      # derived by hand twice and were wrong both times (508 and 511 distinct
      # labels; the answer is 510), each wrong figure internally consistent,
      # which is how they survived. `--self-check` recomputes them two ways.
      - name: Port census — self-check
        run: ./scripts/port_census.py

      # Burn-down ratchet. Not a target — it does not demand progress, only
      # that nothing regresses while nobody is looking. Same mechanism as the
      # migration baseline that went 26 -> 6.
      #
      # `registered` leads deliberately: `unresolved` falling is not evidence
      # of progress, because deleting a fake port shrinks it exactly as well
      # as typing a real one. Retiring genome_profiler's two invented ports
      # moved the corpus from 513 labels to 510 without typing anything.
      #
      # Loosening is allowed and must be deliberate: regenerate
      # agents/port_burndown_baseline.json in the same commit, so it shows up
      # in review instead of in six months.
      - name: Port burn-down — no regressions
        run: ./scripts/port_census.py --gate

      # TODO: fermi-memory integration tests need rework — they insert episodes
      # without creating agents first, violating FK constraints added in migration 010.
      # Re-enable after updating tests to create agents before episodes.

  # The console ships for Linux AND macOS from the same tag, but the test
  # job above only ever compiles for Linux. Without this, a macOS-only
  # build break (a `cfg`ed branch that doesn't compile, a gpui API that
  # differs per platform, a system dep we assumed) stays invisible until
  # someone cuts a release — at which point the Linux binary publishes and
  # the macOS one silently doesn't, which is exactly the drift that made
  # the console Linux-only in the first place.
  #
  # `cargo check`, not `cargo build`: we want the type/cfg errors, not a
  # 20-minute optimised link on a paid runner.
  console-macos:
    name: Console builds on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-console-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-console-cargo-
      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-console-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-console-check-
      - name: Pin dependency versions
        run: |
          cargo update time --precise 0.3.36
          cargo update home --precise 0.5.9
      - name: Check fermi-console compiles for macOS
        run: cargo check -p fermi-console --bins
      # Covers the updater's platform-asset contract and the .app bundle
      # path arithmetic, which only *runs* on macOS.
      - name: Run fermi-console unit tests
        run: cargo test --lib -p fermi-console

  agent-card-lint:
    name: Agent Card Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      - name: Pin dependency versions
        run: |
          cargo update time --precise 0.3.36
          cargo update home --precise 0.5.9
      - name: Run agent card conformance tests
        run: cargo test --lib -p fermi agent_card::tests -- --nocapture

  migration-lint:
    name: Migration Lint
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the changed-migrations diff below has a base commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # scripts/lint-migrations.sh checks three PgBouncer-safety rules;
      # the inline check below reimplements only the first. Run the real
      # script on migrations touched by this change — scoping to changed
      # files is what keeps the older, grandfathered migrations out of it.
      - name: Lint changed migrations (PgBouncer safety)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.before }}"; fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No usable base ref; skipping changed-file migration lint."
            exit 0
          fi
          CHANGED=$(git diff --name-only --diff-filter=d "$BASE" HEAD -- 'migrations/*.sql' | grep -v rollback || true)
          if [ -z "$CHANGED" ]; then
            echo "No migrations changed."
            exit 0
          fi
          echo "Linting: $CHANGED"
          ./scripts/lint-migrations.sh $CHANGED

      - name: Check for BEGIN/COMMIT in migrations (banned with PgBouncer)
        run: |
          FAILED=0
          for f in migrations/*.sql; do
            # Skip rollback files
            case "$f" in *rollback*) continue ;; esac

            # Grandfathered: migrations 001-025 predate the lint rule.
            # Only enforce on 026+ where BEGIN/COMMIT caused production outages.
            NUM=$(basename "$f" | grep -oP '^\d+' || echo "0")
            if [ "$NUM" -lt 26 ] 2>/dev/null; then
              continue
            fi

            # Check for bare transaction BEGIN/COMMIT (not PL/pgSQL DO $$ blocks)
            # PL/pgSQL uses BEGIN without semicolon as block opener — that's fine.
            # Transaction control uses BEGIN; or COMMIT; as standalone statements.
            if grep -Pn '^\s*BEGIN\s*;\s*$' "$f" 2>/dev/null || \
               grep -Pn '^\s*COMMIT\s*;\s*$' "$f" 2>/dev/null; then
              echo "ERROR: $f contains BEGIN;/COMMIT; — banned with PgBouncer transaction mode"
              echo "  Use IF NOT EXISTS / DROP IF EXISTS for idempotency instead"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "Migrations must not use explicit BEGIN/COMMIT."
            echo "Neon uses PgBouncer in transaction mode which silently fails"
            echo "when migrations contain transaction control statements."
            exit 1
          fi

          echo "All migrations clean (026+) — no BEGIN/COMMIT found"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy
      - name: Pin dependency versions
        run: |
          cargo update time --precise 0.3.36
          cargo update home --precise 0.5.9
      - name: Run clippy
        run: |
          cargo clippy --lib --bins --tests --all-features -- \
            -W clippy::all \
            -A dead_code \
            -A unused_variables \
            -A unused_imports \
            -A unused_mut \
            -A clippy::too_many_arguments \
            -A clippy::should_implement_trait \
            -A ambiguous_glob_reexports \
            -A private_interfaces \
            -A clippy::manual_clamp \
            -A clippy::approx_constant \
            -A clippy::only_used_in_recursion \
            -A clippy::empty_line_after_doc_comments \
            -A clippy::unnecessary_cast \
            -A clippy::derivable_impls

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    # Advisory-only: don't block CI on upstream dependency vulnerabilities
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Install cargo-audit via binstall
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm cargo-audit
      - name: Run security audit
        run: cargo audit
