name: Release Console

# Builds and publishes a pre-built fermi-console binary.
#
# Trigger options:
#   git tag v0.x.y && git push origin v0.x.y   — full release
#   workflow_dispatch (GitHub UI)               — manual release from any branch

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0) — leave empty to use 'latest'"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: fermi-console

jobs:
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache build target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-console-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-console-release-

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libwayland-dev \
            libvulkan-dev \
            wayland-protocols \
            pkg-config

      - name: Pin dependency versions
        run: |
          cargo update time --precise 0.3.36
          cargo update home --precise 0.5.9

      # The in-app updater compares the highest release TAG against the
      # running binary's env!("CARGO_PKG_VERSION"). If they don't match,
      # the client is told an update is available forever — it downloads a
      # binary that STILL reports the old version, so it never converges.
      # That happens whenever a tag ships without bumping
      # crates/fermi-console/Cargo.toml (e.g. backend/CLI-only releases,
      # which still trigger this workflow). Stamp the version FROM the tag
      # so the published binary always reports exactly the tag it ships
      # under. No manual Cargo.toml bump discipline required.
      - name: Stamp console version to match the release tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VER="${TAG#v}"
          if echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            sed -i -E "0,/^version = \"[^\"]*\"/s//version = \"$VER\"/" crates/fermi-console/Cargo.toml
            echo "Stamped fermi-console version = $VER (from tag $TAG)"
            grep -m1 '^version' crates/fermi-console/Cargo.toml
          else
            echo "Tag '$TAG' is not semver ('$VER'); leaving Cargo.toml as-is"
          fi

      - name: Build release binary
        run: cargo build --release -p fermi-console

      - name: Strip binary
        run: strip target/release/fermi-console

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release body
        id: notes
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          NOTES_FILE="RELEASE_NOTES_${TAG}.md"
          # The in-app updater reads this body verbatim, so it should
          # read like a changelog to a human tester — not a git log dump.
          # Convention: land a RELEASE_NOTES_<tag>.md at repo root before
          # tagging. If missing, we ship a minimal auto-generated body
          # so the release still succeeds.
          BODY_FILE="$(mktemp)"
          if [ -f "$NOTES_FILE" ]; then
            echo "Using $NOTES_FILE"
            cat "$NOTES_FILE" >> "$BODY_FILE"
            echo "" >> "$BODY_FILE"
            echo "---" >> "$BODY_FILE"
          else
            echo "No $NOTES_FILE — using generic body"
            echo "## Fermi Console $TAG" >> "$BODY_FILE"
            echo "" >> "$BODY_FILE"
          fi
          {
            echo ""
            echo "## Install / Update"
            echo ""
            echo "Existing users: **Help → Check for Updates…** inside the app."
            echo ""
            echo "New users:"
            echo ""
            echo '```bash'
            echo 'curl -fsSL https://raw.githubusercontent.com/Replicant-Partners/fermi/main/scripts/install-fermi-console.sh | bash'
            echo '```'
          } >> "$BODY_FILE"
          {
            echo 'body<<EOF_NOTES'
            cat "$BODY_FILE"
            echo 'EOF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Package binary
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          ARCHIVE=fermi-console-${TAG}-linux-x86_64.tar.gz
          cp target/release/fermi-console fermi-console
          tar -czf "$ARCHIVE" fermi-console crates/fermi-console/README.md
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          # Also keep a plain binary with a fixed name for the install script
          cp fermi-console fermi-console-linux-x86_64
          sha256sum "$ARCHIVE" fermi-console-linux-x86_64 > checksums.txt
          cat checksums.txt

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Fermi Console ${{ steps.tag.outputs.tag }}
          # Body assembled by the previous step: RELEASE_NOTES_<tag>.md
          # if present, else a generic header, always suffixed with the
          # install/update snippet. The in-app updater renders this
          # markdown as-is, so keep it user-facing.
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ steps.tag.outputs.tag == 'latest' }}
          files: |
            ${{ env.ARCHIVE }}
            fermi-console-linux-x86_64
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
