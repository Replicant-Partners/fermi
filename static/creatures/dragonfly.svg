<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <style>
      .dragonfly-wing { fill: none; stroke: #5A9BD5; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .dragonfly-body { fill: #5A9BD5; }
    </style>
  </defs>

  <!-- Left upper wing -->
  <path class="dragonfly-wing" d="M 200,180 Q 140,150 100,130 Q 70,120 60,125 Q 50,130 65,140 Q 80,150 120,160 Q 160,170 185,175 Z"/>

  <!-- Left upper wing veins -->
  <path class="dragonfly-wing" d="M 185,175 L 110,145"/>
  <path class="dragonfly-wing" d="M 180,173 L 105,140"/>
  <path class="dragonfly-wing" d="M 175,171 L 100,135"/>
  <path class="dragonfly-wing" d="M 170,169 L 95,130"/>
  <path class="dragonfly-wing" d="M 150,168 Q 130,155 110,145"/>
  <path class="dragonfly-wing" d="M 145,166 Q 125,150 105,140"/>

  <!-- Right upper wing -->
  <path class="dragonfly-wing" d="M 200,180 Q 260,150 300,130 Q 330,120 340,125 Q 350,130 335,140 Q 320,150 280,160 Q 240,170 215,175 Z"/>

  <!-- Right upper wing veins -->
  <path class="dragonfly-wing" d="M 215,175 L 290,145"/>
  <path class="dragonfly-wing" d="M 220,173 L 295,140"/>
  <path class="dragonfly-wing" d="M 225,171 L 300,135"/>
  <path class="dragonfly-wing" d="M 230,169 L 305,130"/>
  <path class="dragonfly-wing" d="M 250,168 Q 270,155 290,145"/>
  <path class="dragonfly-wing" d="M 255,166 Q 275,150 295,140"/>

  <!-- Left lower wing -->
  <path class="dragonfly-wing" d="M 200,190 Q 150,200 110,210 Q 80,215 70,218 Q 60,220 65,225 Q 70,230 100,225 Q 130,220 170,210 Q 185,205 195,195 Z"/>

  <!-- Left lower wing veins -->
  <path class="dragonfly-wing" d="M 195,195 L 100,217"/>
  <path class="dragonfly-wing" d="M 190,197 L 95,219"/>
  <path class="dragonfly-wing" d="M 185,199 L 90,221"/>
  <path class="dragonfly-wing" d="M 150,203 Q 120,210 100,217"/>

  <!-- Right lower wing -->
  <path class="dragonfly-wing" d="M 200,190 Q 250,200 290,210 Q 320,215 330,218 Q 340,220 335,225 Q 330,230 300,225 Q 270,220 230,210 Q 215,205 205,195 Z"/>

  <!-- Right lower wing veins -->
  <path class="dragonfly-wing" d="M 205,195 L 300,217"/>
  <path class="dragonfly-wing" d="M 210,197 L 305,219"/>
  <path class="dragonfly-wing" d="M 215,199 L 310,221"/>
  <path class="dragonfly-wing" d="M 250,203 Q 280,210 300,217"/>

  <!-- Body -->
  <ellipse class="dragonfly-body" cx="200" cy="195" rx="6" ry="65"/>

  <!-- Body segments -->
  <line class="dragonfly-wing" x1="197" y1="145" x2="203" y2="145"/>
  <line class="dragonfly-wing" x1="197" y1="155" x2="203" y2="155"/>
  <line class="dragonfly-wing" x1="197" y1="165" x2="203" y2="165"/>
  <line class="dragonfly-wing" x1="197" y1="175" x2="203" y2="175"/>
  <line class="dragonfly-wing" x1="197" y1="185" x2="203" y2="185"/>
  <line class="dragonfly-wing" x1="197" y1="195" x2="203" y2="195"/>
  <line class="dragonfly-wing" x1="197" y1="205" x2="203" y2="205"/>
  <line class="dragonfly-wing" x1="197" y1="215" x2="203" y2="215"/>
  <line class="dragonfly-wing" x1="197" y1="225" x2="203" y2="225"/>
  <line class="dragonfly-wing" x1="197" y1="235" x2="203" y2="235"/>

  <!-- Head -->
  <circle class="dragonfly-body" cx="200" cy="135" r="9"/>

  <!-- Eyes -->
  <circle class="dragonfly-wing" cx="195" cy="133" r="5"/>
  <circle class="dragonfly-wing" cx="205" cy="133" r="5"/>

  <!-- Antennae -->
  <path class="dragonfly-wing" d="M 197,128 L 195,122"/>
  <path class="dragonfly-wing" d="M 203,128 L 205,122"/>
</svg>
