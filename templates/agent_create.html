<!doctype html>
<html lang="en" class="theme-hasui">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Agent - Agent Bestiary</title>
    <style>
      :root {
        --bg0-hard: #1d2021;
        --bg0: #282828;
        --bg1: #3c3836;
        --bg2: #504945;
        --bg3: #665c54;
        --fg0: #fbf1c7;
        --fg1: #ebdbb2;
        --fg2: #d5c4a1;
        --fg3: #bdae93;
        --yellow: #fabd2f;
        --green: #b8bb26;
        --red: #fb4934;
        --aqua: #8ec07c;
        --gray: #928374;
      }
      .theme-op1 {
        --bg0-hard: #f5f5f0;
        --bg0: #ffffff;
        --bg1: #f0f0eb;
        --bg2: #e0e0db;
        --bg3: #c8c8c3;
        --fg0: #1a1a1a;
        --fg1: #2d2d2d;
        --fg2: #4a4a4a;
        --fg3: #6b6b6b;
        --yellow: #ff6b00;
        --green: #00c853;
        --red: #ff1744;
        --aqua: #00b8d4;
        --gray: #9e9e9e;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: var(--bg0-hard);
        color: var(--fg1);
        font-family: "Berkeley Mono", "JetBrains Mono", monospace;
        line-height: 1.6;
      }
      header {
        background: var(--bg0);
        border-bottom: 1px solid var(--bg2);
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header h1 { font-size: 1.2rem; color: var(--fg0); }
      header a { color: var(--fg3); text-decoration: none; font-size: 0.85rem; margin-left: 16px; }
      header a:hover { color: var(--yellow); }
      .container { max-width: 700px; margin: 0 auto; padding: 24px; }
      .form-section {
        background: var(--bg0);
        border: 1px solid var(--bg2);
        padding: 24px;
        margin-bottom: 16px;
      }
      .form-title {
        font-size: 0.85rem;
        color: var(--yellow);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 16px;
      }
      .form-group { margin-bottom: 14px; }
      label {
        display: block;
        font-size: 0.8rem;
        color: var(--fg3);
        margin-bottom: 4px;
      }
      input, select, textarea {
        width: 100%;
        background: var(--bg1);
        border: 1px solid var(--bg3);
        color: var(--fg0);
        padding: 8px 12px;
        font-family: inherit;
        font-size: 0.9rem;
      }
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--yellow);
      }
      textarea { min-height: 120px; resize: vertical; }
      .hint { font-size: 0.75rem; color: var(--fg3); margin-top: 2px; }
      .row { display: flex; gap: 12px; }
      .row > * { flex: 1; }
      .btn {
        background: transparent;
        border: 1px solid var(--bg3);
        padding: 10px 24px;
        cursor: pointer;
        font-size: 0.9rem;
        color: var(--fg3);
        font-family: inherit;
        width: 100%;
      }
      .btn:hover { border-color: var(--green); color: var(--green); }
      .btn-create {
        border-color: var(--yellow);
        color: var(--yellow);
        font-size: 1rem;
        padding: 12px;
      }
      .btn-create:hover { background: var(--yellow); color: var(--bg0-hard); }
      .btn-create:disabled { opacity: 0.4; cursor: not-allowed; }
      .error-msg { color: var(--red); font-size: 0.85rem; margin-top: 8px; display: none; }
      .success-msg { color: var(--green); font-size: 0.85rem; margin-top: 8px; display: none; }
      .slider-row { display: flex; align-items: center; gap: 12px; }
      .slider-row input[type="range"] { flex: 1; }
      .slider-value { font-size: 0.85rem; color: var(--fg2); min-width: 30px; }
      .theme-toggle-btn {
        background: transparent;
        border: 1px solid var(--bg3);
        padding: 4px 10px;
        cursor: pointer;
        font-size: 0.8rem;
        color: var(--fg3);
        font-family: inherit;
      }
      .theme-toggle-btn:hover { border-color: var(--yellow); color: var(--yellow); }
    </style>
  </head>
  <body>
    <header>
      <div><h1>Create Agent</h1></div>
      <div>
        <a href="/dashboard">Dashboard</a>
        <a href="/">Catalogue</a>
        <button id="theme-toggle" class="theme-toggle-btn" title="Toggle Theme (Ctrl+T)">OP-1</button>
      </div>
    </header>

    <div class="container">
      <!-- Identity -->
      <div class="form-section">
        <div class="form-title">Identity</div>
        <div class="form-group">
          <label for="agent-name">Agent Name *</label>
          <input type="text" id="agent-name" placeholder="my_research_agent" pattern="[a-z0-9_-]+" />
          <div class="hint">Lowercase letters, numbers, underscores, hyphens</div>
        </div>
        <div class="row">
          <div class="form-group">
            <label for="agent-type">Type</label>
            <select id="agent-type">
              <option value="research">Research</option>
              <option value="risk">Risk</option>
              <option value="sentiment">Sentiment</option>
              <option value="analysis">Analysis</option>
              <option value="forecasting">Forecasting</option>
              <option value="creative">Creative</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="visibility">Visibility</label>
            <select id="visibility">
              <option value="private">Private</option>
              <option value="shared">Shared</option>
              <option value="public">Public</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <input type="text" id="description" placeholder="What does this agent do?" />
        </div>
        <div class="form-group">
          <label for="tags">Tags</label>
          <input type="text" id="tags" placeholder="comma, separated, tags" />
          <div class="hint">Comma-separated list of tags</div>
        </div>
      </div>

      <!-- Capabilities -->
      <div class="form-section">
        <div class="form-title">Capabilities</div>
        <div class="row">
          <div class="form-group">
            <label for="model">Model</label>
            <select id="model">
              <option value="claude-3-haiku-20240307">Claude 3 Haiku</option>
              <option value="claude-sonnet-4-5-20250929">Claude 4.5 Sonnet</option>
              <option value="claude-opus-4-6">Claude 4.6 Opus</option>
            </select>
          </div>
          <div class="form-group">
            <label for="executor">Executor</label>
            <select id="executor">
              <option value="llm">LLM</option>
              <option value="mcp">MCP</option>
              <option value="skill">Skill</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Temperature</label>
          <div class="slider-row">
            <input type="range" id="temperature" min="0" max="100" value="30" />
            <span class="slider-value" id="temp-display">0.3</span>
          </div>
        </div>
        <div class="form-group">
          <label for="system-prompt">System Prompt</label>
          <textarea id="system-prompt" placeholder="You are a specialist in...&#10;&#10;Describe the agent's role, expertise, and how it should approach tasks."></textarea>
          <div class="hint">The core instruction that defines this agent's behavior</div>
        </div>
      </div>

      <!-- Economics -->
      <div class="form-section">
        <div class="form-title">Economics (AKP)</div>
        <div class="form-group">
          <label>Education Budget</label>
          <div class="slider-row">
            <input type="range" id="education-budget" min="0" max="50" value="0" />
            <span class="slider-value" id="edu-display">0 credits</span>
          </div>
          <div class="hint">Credits allocated for A2A learning (deducted from your wallet)</div>
        </div>
      </div>

      <!-- Submit -->
      <button class="btn btn-create" id="create-btn">Create Agent</button>
      <div class="error-msg" id="error-msg"></div>
      <div class="success-msg" id="success-msg"></div>
    </div>

    <script>
      // Auth check
      (async () => {
        const res = await fetch("/api/auth/me");
        if (!res.ok) { window.location.href = "/"; }
      })();

      // Temperature slider
      document.getElementById("temperature").addEventListener("input", (e) => {
        document.getElementById("temp-display").textContent = (e.target.value / 100).toFixed(2);
      });

      // Education budget slider
      document.getElementById("education-budget").addEventListener("input", (e) => {
        document.getElementById("edu-display").textContent = e.target.value + " credits";
      });

      // Create agent
      document.getElementById("create-btn").addEventListener("click", async () => {
        const btn = document.getElementById("create-btn");
        const errEl = document.getElementById("error-msg");
        const sucEl = document.getElementById("success-msg");
        errEl.style.display = "none";
        sucEl.style.display = "none";

        const name = document.getElementById("agent-name").value.trim();
        if (!name) { errEl.textContent = "Agent name is required"; errEl.style.display = "block"; return; }

        const tagsRaw = document.getElementById("tags").value.trim();
        const tags = tagsRaw ? tagsRaw.split(",").map(t => t.trim()).filter(t => t) : [];

        const body = {
          agent_name: name,
          agent_type: document.getElementById("agent-type").value,
          description: document.getElementById("description").value.trim() || null,
          system_prompt: document.getElementById("system-prompt").value.trim() || null,
          model: document.getElementById("model").value,
          temperature: parseInt(document.getElementById("temperature").value) / 100,
          executor_type: document.getElementById("executor").value,
          tags: tags,
          visibility: document.getElementById("visibility").value,
          education_budget_credits: parseInt(document.getElementById("education-budget").value),
        };

        btn.disabled = true;
        btn.textContent = "Creating...";

        try {
          const res = await fetch("/api/agents", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });

          if (res.ok) {
            const data = await res.json();
            sucEl.textContent = "Agent created: " + data.agent_name;
            sucEl.style.display = "block";
            setTimeout(() => { window.location.href = "/dashboard"; }, 1500);
          } else {
            const err = await res.text();
            errEl.textContent = err;
            errEl.style.display = "block";
          }
        } catch (e) {
          errEl.textContent = "Network error: " + e.message;
          errEl.style.display = "block";
        }

        btn.disabled = false;
        btn.textContent = "Create Agent";
      });

      // Theme toggle
      const themes = ["hasui", "op1"];
      const labels = { hasui: "OP-1", op1: "Hasui" };
      function setTheme(t) {
        document.documentElement.className = "theme-" + t;
        localStorage.setItem("fermi-theme", t);
        document.getElementById("theme-toggle").textContent = labels[t];
      }
      const saved = localStorage.getItem("fermi-theme");
      if (saved && themes.includes(saved)) setTheme(saved);
      document.getElementById("theme-toggle").addEventListener("click", () => {
        const current = localStorage.getItem("fermi-theme") || "hasui";
        setTheme(current === "hasui" ? "op1" : "hasui");
      });
      document.addEventListener("keydown", (e) => {
        if (e.ctrlKey && e.key === "t") { e.preventDefault(); document.getElementById("theme-toggle").click(); }
      });
    </script>
  </body>
</html>
