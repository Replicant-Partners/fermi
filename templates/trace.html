<!doctype html>
<html lang="en" class="theme-hasui">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Trace — Agent Bestiary</title>
  <link rel="stylesheet" href="/static/css/variables.css"/>
  <link rel="stylesheet" href="/static/css/common.css"/>
  <link rel="stylesheet" href="/static/css/components.css"/>
  <style>
  body{font-family:"Berkeley Mono","JetBrains Mono",monospace;line-height:1.5;background:var(--bg0-hard);font-size:13px;margin:0;}
  a{color:var(--fg3);text-decoration:none;} a:hover{color:var(--yellow);}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px 60px;}

  .head{padding:18px 0 12px;border-bottom:1px solid var(--bg2);margin-bottom:18px;}
  .head h1{font-size:1rem;color:var(--yellow);margin:0 0 3px;}
  .head .sub{font-size:0.72rem;color:var(--fg4);}
  .head .meta{font-size:0.7rem;color:var(--fg4);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;}

  /* The badge names the row it summarises. Unlabelled it read as a verdict on
     the artifact entire, when `reading()` returns `Fault` on `violations > 0`
     and on nothing else — so it has always been reporting one row of one of the
     two standards. */
  .badge-of{margin-left:5px;padding-left:5px;border-left:1px solid currentColor;
            opacity:0.7;font-size:0.9em;}
  .badge{display:inline-block;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.06em;
         padding:1px 6px;border:1px solid;}
  .r-idle{color:var(--fg3);border-color:var(--bg3);}
  .r-fault{color:var(--red,#fb4934);border-color:var(--red,#fb4934);}
  .r-unknown{color:var(--purple,#d3869b);border-color:var(--purple,#d3869b);border-style:dashed;}

  /* ── The payload is the protagonist, not italic prose ───────────────────
     It is a typed token — it may be a document, an image, a video — and the
     question the whole screen answers is how deep anything looked into it. */
  .payload{border:1px solid var(--bg3);background:var(--bg1);padding:11px 13px;margin-bottom:14px;}
  .payload-t{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--fg4);}
  .payload-ty{font-size:0.72rem;color:var(--aqua);margin-top:2px;}
  .payload-q{font-size:0.78rem;color:var(--fg2);margin-top:6px;line-height:1.5;}
  /* Question and answer, labelled. The block used to show only the question. */
  .pl-h{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--fg4);
        margin-top:10px;}
  .pl-body{font-size:0.76rem;color:var(--fg2);margin-top:4px;line-height:1.55;
           white-space:pre-wrap;overflow-wrap:anywhere;}
  /* Clamped, with the clamp released by the disclosure below it. Never a hard
     cut: a shortened document that does not say it is short is worse than a
     long one. */
  .pl-body.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;
                 overflow:hidden;}
  .pl-more{font-size:0.66rem;color:var(--fg4);cursor:pointer;margin-top:3px;
           background:none;border:none;padding:0;font-family:inherit;}
  .pl-more:hover{color:var(--aqua);}
  .pl-cut{font-size:0.64rem;color:var(--yellow);margin-top:3px;}

  /* ── The verdict. Answer first: passed, held, refused — then the reasoning.
     A gate is what stops a bad artifact from becoming training data, so the
     last line of the verdict is always whether this one was fit to learn from. */
  .verdict{border-left:3px solid var(--fg3);background:var(--bg1);padding:12px 14px;margin-bottom:20px;}
  .verdict.clean{border-left-color:var(--green);}
  .verdict.dirty{border-left-color:var(--red,#fb4934);}
  .verdict.unknown{border-left-color:var(--purple,#d3869b);}
  .vline{font-size:0.92rem;color:var(--fg2);line-height:1.45;}
  .vnums{display:flex;gap:18px;flex-wrap:wrap;margin-top:9px;}
  .vnum b{font-size:0.98rem;color:var(--fg2);font-weight:normal;}
  .vnum span{font-size:0.62rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--fg4);
             display:block;margin-top:1px;}
  .vnum.hot b{color:var(--red,#fb4934);}
  .vnum.warm b{color:var(--yellow);}
  .vceil{font-size:0.74rem;color:var(--fg3);margin-top:10px;padding-top:9px;
         border-top:1px solid var(--bg2);line-height:1.5;}
  .vceil b{color:var(--yellow);}
  .vfeed{font-size:0.76rem;margin-top:8px;line-height:1.5;}
  .vfeed.bad{color:var(--red,#fb4934);}
  .vfeed.ok{color:var(--fg3);}

  /* ── Labelled rows with a right-hand verdict ──────────────────────
     Named for the verification ladder, which used to render here and no longer
     does — three of its five rungs were platform-wide rather than about this
     artifact, and the other two duplicated the questions strip above. The loops
     list reuses the grammar: a label, a body, and a token on the right. */
  .rung{display:flex;gap:11px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--bg2);}
  .rung-b{flex:1;min-width:0;}
  .rung-q{font-size:0.78rem;color:var(--fg2);}
  .rung-pw{font-size:0.68rem;color:var(--fg4);margin-top:2px;line-height:1.45;}
  .rung-pw b{color:var(--fg3);}
  .rung-v{width:126px;flex-shrink:0;text-align:right;font-size:0.66rem;
          text-transform:uppercase;letter-spacing:0.05em;}
  .v-silent{color:var(--red,#fb4934);}
  .v-inert{color:var(--purple,#d3869b);}
  .v-elsewhere{color:var(--fg4);}

  /* Preconditions are not verification. They check the sender and the
     envelope, never the contents, so they get a quiet strip of their own
     rather than a place on the ladder. */
  .pre{display:flex;gap:14px;flex-wrap:wrap;font-size:0.68rem;color:var(--fg4);
       border:1px dashed var(--bg3);padding:8px 11px;}
  .pre b{color:var(--fg3);font-weight:normal;}

  .block{margin-bottom:24px;}
  .block h2{font-size:0.72rem;color:var(--fg2);margin:0 0 8px;text-transform:uppercase;
            letter-spacing:0.07em;padding-bottom:4px;border-bottom:1px solid var(--bg2);}
  .note{font-size:0.71rem;color:var(--fg4);font-style:italic;line-height:1.5;margin:-2px 0 12px;}

  /* Substrate — an agent-level state, deliberately not styled like a rung
     outcome. `retrofit` is not a fault and not a pass: it is outside. */
  .sub{border:1px dashed var(--bg3);padding:10px 13px;margin-bottom:18px;}
  .sub h3{font-size:0.78rem;margin:0 0 4px;}
  .sub.retrofit{border-color:var(--purple,#d3869b);}
  .sub.retrofit h3{color:var(--purple,#d3869b);}
  .sub.prune{opacity:0.6;}
  .sub.prune h3{color:var(--fg4);}
  .sub.legible{border-style:solid;border-color:var(--green);}
  .sub.legible h3{color:var(--green);}

  .why{font-size:0.71rem;color:var(--fg4);line-height:1.5;padding:5px 0 5px 9px;
       border-left:1px solid var(--bg3);margin-bottom:5px;}
  .why b{color:var(--fg3);}
  .why.metric{border-left-color:var(--yellow);}
  .passed-through{border-left:3px solid var(--red,#fb4934);background:rgba(251,73,52,0.07);
                  padding:9px 12px;font-size:0.75rem;color:var(--fg3);line-height:1.5;margin-top:10px;}
  .passed-through b{color:var(--red,#fb4934);}

  /* ── Fields ── */
  .fgroup{margin-bottom:12px;}
  .fgroup-h{font-size:0.68rem;color:var(--fg4);margin-bottom:4px;}
  .field{display:flex;gap:9px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--bg2);}
  .pips{width:26px;flex-shrink:0;letter-spacing:1px;font-size:0.7rem;}
  .s2{color:var(--green);} .s1{color:var(--yellow);} .s0{color:var(--red,#fb4934);}
  .fbody{flex:1;min-width:0;}
  .fname{font-size:0.74rem;color:var(--fg2);}
  .fval{font-size:0.72rem;color:var(--fg3);margin-top:2px;word-break:break-word;
        max-height:3.2em;overflow:hidden;}
  .fval.null{color:var(--fg4);font-style:italic;}
  /* A structured claim, shown as the JSON it is. `[object Object]` used to sit
     here and discard the contents of the page's most important section. */
  .fval.json{color:var(--fg3);white-space:pre-wrap;max-height:6.5em;overflow:hidden;
             border-left:1px solid var(--bg3);padding-left:7px;}
  .fgrade{font-size:0.64rem;color:var(--fg4);margin-top:2px;}
  /* ── The claim's track ───────────────────────────────────────────
     One claim, read left to right: what was said, which checkpoint looked at
     it, what it decided, and where the claim went next. The stacked version
     read as a list of unrelated attributes and hid that this is a journey. */
  .track{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:0.7rem;}
  .t-sep{color:var(--bg3);flex-shrink:0;}
  .t-gate{color:var(--fg4);font-size:0.62rem;text-transform:uppercase;letter-spacing:0.05em;}
  .t-grade{font-size:0.64rem;}
  .t-grade.s2{color:var(--green);} .t-grade.s1{color:var(--yellow);}
  .t-grade.s0{color:var(--red,#fb4934);}
  .t-done{color:var(--green);font-size:0.64rem;}
  .t-tool{color:var(--aqua);font-size:0.64rem;}
  /* The one that needs a human is the one that must look like work. */
  .t-person{color:var(--purple,#d3869b);font-size:0.64rem;}
  .settle{font-size:0.65rem;margin-top:3px;}
  .settle.tool{color:var(--aqua);}
  .settle.human{color:var(--purple,#d3869b);}

  .floor{border:1px solid var(--bg2);background:var(--bg1);padding:9px 12px;font-size:0.75rem;
         color:var(--fg3);line-height:1.5;}
  .floor b{color:var(--yellow);}

  /* ── Owner affordances: three registers, not three labels ── */
  .task{border-left:3px solid var(--aqua);background:rgba(69,133,136,0.08);padding:10px 13px;}
  .task h3{font-size:0.78rem;color:var(--aqua);margin:0 0 4px;}
  .backlog{border-left:3px solid var(--bg3);background:var(--bg1);padding:10px 13px;}
  .backlog h3{font-size:0.78rem;color:var(--fg4);margin:0 0 4px;}
  .transient{padding:8px 0;font-size:0.72rem;color:var(--fg4);font-style:italic;}
  .owner-body{font-size:0.74rem;color:var(--fg3);line-height:1.55;}
  .owner-next{font-size:0.73rem;margin-top:7px;}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
  .chip{font-size:0.64rem;padding:1px 6px;border:1px solid var(--bg3);color:var(--fg4);}
  .chip.have{border-color:var(--green);color:var(--green);}
  .chip.miss{border-style:dashed;}

  .caveat{border:1px solid var(--bg2);background:var(--bg1);padding:8px 11px;margin-bottom:7px;
          font-size:0.72rem;color:var(--fg3);line-height:1.5;}
  .caveat .ck{color:var(--green);}
  .caveat .dns{color:var(--fg3);margin-top:4px;}
  .caveat .dns b{color:var(--yellow);}
  /* ── A call for a person, made actionable where it is read ──────────────
     These were prose describing work to be done elsewhere, while the endpoint
     that does it sat live and unused. */
  .acts{display:flex;gap:6px;align-items:center;margin-top:7px;flex-wrap:wrap;}
  .cite{flex:1;min-width:150px;background:var(--bg0);border:1px solid var(--bg3);
        color:var(--fg2);font-family:inherit;font-size:0.68rem;padding:3px 7px;}
  .act{font-size:0.66rem;font-family:inherit;padding:3px 10px;cursor:pointer;
       background:transparent;border:1px solid var(--aqua);color:var(--aqua);}
  .act:hover:not(:disabled){background:var(--aqua);color:var(--bg0-hard);}
  .act:disabled{opacity:0.4;cursor:default;}
  .act.act-no{border-color:var(--red,#fb4934);color:var(--red,#fb4934);}
  .act.act-no:hover:not(:disabled){background:var(--red,#fb4934);color:var(--bg0-hard);}
  /* ── The five questions ─────────────────────────────────────────
     As a strip: five cells, one line, taken in at a glance. The stacked prose
     version is still here and is what the expander below the strip renders. */
  .q5strip{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;
           background:var(--bg2);border:1px solid var(--bg2);margin-bottom:9px;}
  .q5c{background:var(--bg0);padding:6px 8px 7px;border-top:2px solid var(--bg3);}
  .q5c-l{font-size:0.63rem;color:var(--fg4);line-height:1.3;}
  .q5c-n{display:inline-block;min-width:12px;color:var(--bg4,#7c6f64);}
  .q5c-v{font-size:0.8rem;color:var(--fg2);margin:3px 0 4px;line-height:1.25;}
  .q5c-g{display:flex;gap:4px;flex-wrap:wrap;}
  .q5c.t-ok{border-top-color:var(--green);}
  .q5c.t-warn{border-top-color:var(--yellow);}
  .q5c.t-warn .q5c-v{color:var(--yellow);}
  .q5c.t-bad{border-top-color:var(--red,#fb4934);}
  .q5c.t-bad .q5c-v{color:var(--red,#fb4934);}
  .q5c.t-na{border-top-color:var(--bg3);}
  .q5c.t-na .q5c-v{color:var(--fg4);}
  /* The finding stays in the open. A `no gate` behind a fold is a `no gate`
     nobody reads. */
  .q5-nogate{margin:0 0 4px;}

  /* ── Two standards, named ──────────────────────────────────────

     Five questions in one strip with one colour ramp made a designer-grade
     disappointment read as a caller-grade defect. Legality is a gate and
     ambition is a gradient, and the platform had vocabulary for only the
     first.

     Row A can be green today and on most pulses is. Row B green is an
     aspiration, and divergence there is information rather than failure — so
     the two rows are separated by a labelled band rather than a blank line,
     because the whole point is that a reader knows which standard they are
     reading. */
  .std{margin-bottom:2px;}
  .std-h{display:flex;align-items:baseline;gap:8px;padding:2px 0 4px;}
  .std-n{font-size:0.72rem;color:var(--fg2);}
  .std-w{font-size:0.66rem;color:var(--fg4);}
  .std-a .std-n{color:var(--aqua);}
  .std-b .std-n{color:var(--yellow);}
  .std3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--bg2);}
  @media (max-width:880px){ .std3{grid-template-columns:repeat(2,1fr);} }
  /* The caption under row B. Computed from the finding counts, not written —
     so it cannot claim a shortfall the fields do not show. */
  .std-cap{font-size:0.72rem;color:var(--fg3);line-height:1.55;margin:6px 0 12px;
           padding-left:10px;border-left:2px solid var(--yellow);max-width:92ch;}
  .std-cap b{color:var(--fg2);}
  .std-cap .amb{color:var(--yellow);}
  /* The description. Full width, and deliberately toneless: it is where the
     numbers came from, not a verdict on them. `weakSourced > 0 ? "bad"` was a
     verdict smuggled into a description, and it has moved to row 5, which can
     attribute it. */
  .dist{background:var(--bg0);padding:7px 10px;border-top:2px solid var(--bg3);
        display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .dist-l{font-size:0.63rem;color:var(--fg4);}
  .dist-v{font-size:0.8rem;color:var(--fg2);}
  .dist-w{font-size:0.66rem;color:var(--fg4);line-height:1.45;}

  /* ── The run state, served ─────────────────────────────────────

     `field_state::Observed`, coloured by `Finding::tone`. Three tones and only
     one is red: red is reserved for faults. A shortfall is amber and a
     capability gap is neutral, because neither is anybody's defect and drawing
     them in the fault colour is what made eleven omissions read as eleven
     rejections. */
  .obs{font-size:0.58rem;letter-spacing:0.04em;padding:0 4px;border:1px solid var(--bg3);
       color:var(--fg4);white-space:nowrap;}
  .obs.f-red{border-color:var(--red,#fb4934);color:var(--red,#fb4934);}
  .obs.f-amber{border-color:var(--yellow);color:var(--yellow);}
  .obs.f-neutral{border-color:var(--bg3);color:var(--fg4);}
  /* The legend for it, out in the open. A token whose gloss is folded has no
     gloss — which is house rule 2 honoured in the letter and broken in
     effect. */
  .obs-leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:0.66rem;color:var(--fg4);
           line-height:1.5;margin:6px 0 10px;align-items:baseline;}
  .obs-leg .lgi{display:flex;gap:5px;align-items:baseline;max-width:46ch;}
  .obs-leg .leg-k{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.07em;
                  color:var(--bg4,#7c6f64);min-width:74px;}

  /* The contract clock, beside the run clock. **No tone at all.**

     A `pending` field is a standing request for an integration and the opposite
     of a defect — `error` is the only contract state that is one, and it is the
     only one marked. Giving this axis a colour ramp is how an agent's ambition
     came to be reported as its failure. */
  .dec{font-size:0.58rem;letter-spacing:0.04em;padding:0 4px;color:var(--fg4);
       border:1px dashed var(--bg3);white-space:nowrap;}
  .dec.d-defect{border-style:solid;border-color:var(--red,#fb4934);
                color:var(--red,#fb4934);}
  /* The verification log's word, which is a different question again from
     either clock: has anybody judged this claim? */
  .vd{font-size:0.58rem;letter-spacing:0.04em;padding:0 4px;color:var(--fg4);
      white-space:nowrap;}
  .a-c{display:flex;gap:3px;justify-content:flex-end;flex-wrap:wrap;align-items:baseline;}
  /* What an absent row means to something consuming this document. One line,
     above the rows, because every absence was being read as a failure. */
  .consumed{margin:0 0 8px;font-style:normal;}

  /* ── The chain, as a picture ───────────────────────────────────
     Four cells: who called it, this pulse, who it called, where it landed. It
     was three rows of prose below the loops; it is the half that says whether
     the artifact was consumed at all. */
  .flowstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
             background:var(--bg2);border:1px solid var(--bg2);margin-bottom:4px;}
  .fc{background:var(--bg0);padding:6px 9px 8px;border-top:2px solid var(--bg3);}
  .fc-l{font-size:0.63rem;color:var(--fg4);}
  .fc-g{display:inline-block;min-width:15px;color:var(--bg4,#7c6f64);}
  .fc-v{font-size:0.8rem;color:var(--fg2);margin:3px 0 3px;overflow-wrap:anywhere;}
  .fc-a{font-size:0.63rem;color:var(--fg4);line-height:1.45;overflow-wrap:anywhere;}
  .fc-a a{color:var(--aqua);}
  .fc-bad{color:var(--red,#fb4934);}
  .fc.t-ok{border-top-color:var(--green);}
  .fc.t-bad{border-top-color:var(--red,#fb4934);}
  .fc.t-bad .fc-v{color:var(--red,#fb4934);}
  .fc.t-inert{border-top-color:var(--yellow);}
  .fc.t-inert .fc-v{color:var(--yellow);}
  .fc.t-na .fc-v{color:var(--fg4);}
  /* You are here. */
  .fc.t-here{border-top-color:var(--aqua);}
  .fc.t-here .fc-v{color:var(--aqua);}
  @media (max-width:880px){ .flowstrip{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:880px){ .q5strip{grid-template-columns:repeat(2,1fr);} }

  /* The expert views: the ladder, the loops, and the long answers. Below the
     work, collapsed, and each summary states its own headline so that closing
     one hides detail and never a finding. */
  .expert{margin-top:10px;}
  .expert > summary{font-size:0.66rem;color:var(--fg4);cursor:pointer;
                    padding:4px 0;list-style:none;}
  .expert > summary::-webkit-details-marker{display:none;}
  .expert > summary::before{content:"▸ ";color:var(--bg4,#7c6f64);}
  .expert[open] > summary::before{content:"▾ ";}
  .expert > summary:hover{color:var(--fg2);}
  .expert > summary b{color:var(--fg3);font-weight:normal;}
  .expert .block{margin-bottom:8px;}

  .q5{display:grid;grid-template-columns:230px 1fr;gap:14px;padding:9px 0 9px 11px;
      border-left:2px solid var(--bg3);border-bottom:1px solid var(--bg2);}
  .q5-q{font-size:0.8rem;color:var(--fg2);}
  .q5-a{font-size:0.78rem;color:var(--fg3);line-height:1.5;}
  .q5-a b{color:var(--fg2);}
  .q5.t-ok{border-left-color:var(--green);}
  .q5.t-warn{border-left-color:var(--yellow);}
  .q5.t-bad{border-left-color:var(--red,#fb4934);}
  .q5.t-bad .q5-a b{color:var(--red,#fb4934);}
  .q5.t-na{border-left-color:var(--bg3);}
  .q5.t-na .q5-a{color:var(--fg4);}
  /* Which checkpoint answers this question, and whether it had teeth. Tokens,
     never a sentence — the sentence is the answer beside it. */
  .q5-g{grid-column:2;display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;}
  .gate{font-size:0.62rem;border:1px solid var(--bg3);padding:1px 6px;color:var(--fg4);
        white-space:nowrap;}
  .gate b{color:var(--fg3);font-weight:600;}
  .gate.g-refuse b{color:var(--aqua);}
  .gate.g-refused{border-color:var(--red,#fb4934);color:var(--red,#fb4934);}
  .gate.g-refused b{color:var(--red,#fb4934);}
  /* Absent must look different from bad: a dashed edge is nothing-here, a red
     edge is something-here-and-wrong. The one question with no gate at all is
     the finding, so it gets the shape that reads as a hole. */
  .gate.g-none{border-style:dashed;border-color:var(--yellow);color:var(--yellow);}
  .gate.g-off{border-style:dashed;}
  /* In the strip the chip has no inner <b> to colour, so teeth are the border:
     an outlined chip can refuse, a plain one only records. Same distinction
     `gates` spells out in words where there is room for words. */
  .q5c-g .gate.g-refuse{border-color:var(--aqua);color:var(--aqua);}

  /* ── A claim, and what a person can do about it ─────────────────────── */
  .claim{display:grid;grid-template-columns:26px 210px 1fr 130px;gap:10px;
         align-items:baseline;padding:6px 0;border-top:1px solid var(--bg2);}
  .c-name{font-size:0.74rem;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;}
  .c-val{font-size:0.71rem;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;
         white-space:nowrap;}
  .c-val.null{color:var(--fg4);font-style:italic;}
  .c-dest{font-size:0.64rem;text-align:right;}
  .fgroup-legend{font-size:0.7rem;color:var(--fg4);line-height:1.5;margin:2px 0 6px;
                 padding-left:9px;border-left:1px solid var(--bg3);}
  /* The offer, stated as the gain rather than as the platform's verb. */
  .offer{grid-column:2 / -1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
         margin:3px 0 2px;}
  .offer .why{font-size:0.66rem;color:var(--fg4);}
  /* A structured value, read as data rather than as a string of JSON. */
  .claim > .doc{grid-column:2 / -1;}
  .doc{flex-basis:100%;margin:1px 0 3px;}
  .doc > summary{font-size:0.66rem;color:var(--fg4);cursor:pointer;list-style:none;
                 display:inline-block;}
  .doc > summary::-webkit-details-marker{display:none;}
  .doc > summary::before{content:"▸ ";}
  .doc[open] > summary::before{content:"▾ ";}
  .doc > summary:hover{color:var(--aqua);}
  .kv{display:grid;grid-template-columns:minmax(90px,190px) 1fr;gap:1px 10px;
      margin:4px 0 2px;padding-left:9px;border-left:1px solid var(--bg3);}
  .kv-k{font-size:0.68rem;color:var(--fg4);overflow-wrap:anywhere;}
  .kv-v{font-size:0.7rem;color:var(--fg2);overflow-wrap:anywhere;white-space:pre-wrap;}
  .kv-v.null{color:var(--fg4);font-style:italic;}
  .kv-v.nest{color:var(--fg3);}
  /* A nested block spans both columns and indents, so the leaves line up under
     the key they belong to rather than restarting the page's left edge. */
  .kv-sub{grid-column:1 / -1;}
  .kv-sub > .kv{margin:1px 0 5px;}
  /* ── The answer, annotated ───────────────────────────────────────────
     ONE grid, always four cells, indentation instead of nesting.

     It was a tree of grids, each `.a-sub` spanning columns 2..4 of its parent
     and starting a new grid inside that. Two things went wrong and the second
     is the one that mattered. Every level lost the width of a column, so by the
     third the key column had nothing left. And a row with no grade emitted no
     pips element at all — three children in a four-column grid — so
     auto-placement dropped the key into the 26px pips track and every
     uncontracted key wrapped one character per line.

     A missing cell is the bug that keeps coming back in grid layout, so the
     pips cell is now always emitted and the flattening removes the nesting that
     made the narrowing possible. */
  .lens{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px;}
  .lens button{font-size:0.64rem;font-family:inherit;background:none;cursor:pointer;
               border:1px solid var(--bg3);color:var(--fg4);padding:2px 9px;}
  .lens button:hover{color:var(--fg2);}
  .lens button.on{border-color:var(--aqua);color:var(--aqua);}
  .lens button:disabled{opacity:0.3;cursor:default;}
  /* value · condition · act, positionally fixed. The two right-hand tracks are
     fixed-width on purpose: a reader scans that edge, and a column that moves
     with its contents cannot be scanned. */
  .arow{display:grid;
        grid-template-columns:26px minmax(150px,28%) 1fr 118px 132px;gap:10px;
        align-items:baseline;padding:3px 0;border-top:1px solid var(--bg2);}
  .a-p{font-size:0.7rem;}
  .a-k{font-size:0.72rem;color:var(--fg2);overflow-wrap:anywhere;}
  /* Depth by indent, since the path is flat now. The dotted path is in the
     title, so a reader who loses their place can hover rather than count. */
  .a-k.d1{padding-left:12px;}
  .a-k.d2{padding-left:24px;}
  .a-k.d3{padding-left:36px;}
  .a-k .dim{color:var(--fg4);}
  .a-v{font-size:0.71rem;color:var(--fg3);overflow-wrap:anywhere;}
  .a-v.null{color:var(--fg4);font-style:italic;}
  .a-v.nest{color:var(--fg4);}
  /* The state the claim is in. A token, never a sentence — the sentence for a
     whole group of rows in this state is in the legend, said once. */
  .a-c{font-size:0.62rem;text-align:right;}
  /* The act. Empty is `—`, dim, because nothing-to-do is an answer and has to
     look different from a button that failed to draw. */
  .a-a{font-size:0.62rem;text-align:right;}
  .a-none{color:var(--bg4,#7c6f64);}
  .a-body{grid-column:2 / -1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
          margin:2px 0 4px;}
  .a-body .why{font-size:0.66rem;color:var(--fg4);}
  /* One row-specific number, as a chip. Not a sentence: the sentence for every
     row in this state is in the legend. */
  .fact{font-size:0.62rem;border:1px solid var(--bg3);padding:1px 6px;color:var(--fg4);}
  /* A claim's own record: verdict, who, citation, how many came before. Facts,
     per row, which is why it is not `.why`. */
  .cstate{font-size:0.66rem;color:var(--fg4);}
  .cstate b{color:var(--fg3);font-weight:normal;}
  /* The legend, keyed by the token the rows print. Count, token, reason — in
     the count/name/prose order the rows use, so the eye travels the same way
     down both. */
  .lg{display:grid;grid-template-columns:26px 118px 1fr;gap:10px;
      align-items:baseline;padding:3px 0;}
  .lg-n{font-size:0.72rem;color:var(--fg2);text-align:right;}
  .lg-t{font-size:0.62rem;color:var(--fg3);}
  .lg-w{font-size:0.66rem;color:var(--fg4);line-height:1.5;}
  .lg-w b{color:var(--fg3);font-weight:normal;}
  /* The column header, in the row's own grid. Not a caption above the block:
     the names sit in the tracks they name. */
  .arow.ahead{border-top:none;border-bottom:1px solid var(--bg3);padding-bottom:4px;
              font-size:0.58rem;letter-spacing:0.09em;text-transform:uppercase;}
  .arow.ahead span{color:var(--bg4,#7c6f64);font-size:0.58rem;}
  /* A block header, not a value. Its own row so the eye can skip a subtree. */
  .arow.r-block{border-top-color:var(--bg3);}
  .arow.r-block .a-k{color:var(--fg3);font-weight:600;}
  /* Yellow only where something is wrong. `r-asdeclared` is an absence the
     contract requires, and colouring it like a fault is what made a compliant
     agent look like a failing one on 31 of the platform's contracted fields. */
  .arow.r-empty > .a-c{color:var(--yellow);}
  .arow.r-asdeclared > .a-c{color:var(--fg4);}
  /* Dim where nobody is at fault, yellow only where somebody is. */
  .arow.r-nodata > .a-c{color:var(--fg4);}
  .arow.r-unasked > .a-c{color:var(--yellow);}

  .a-owner{grid-column:2 / -1;font-size:0.64rem;color:var(--fg4);
           border-left:2px solid var(--yellow);padding-left:7px;margin:2px 0 4px;}
  /* The tool a contract names, as a control rather than a label. */
  .t-run{font-size:0.62rem;font-family:inherit;background:none;cursor:pointer;
         border:1px solid var(--aqua);color:var(--aqua);padding:1px 7px;}
  .t-run:hover:not(:disabled){background:var(--aqua);color:var(--bg0-hard);}
  .t-run:disabled{opacity:0.4;cursor:default;}
  .probe{grid-column:2 / -1;margin:3px 0 5px;}
  .probe input{font-family:inherit;font-size:0.66rem;background:var(--bg0-hard);
               border:1px solid var(--bg3);color:var(--fg2);padding:3px 6px;width:100%;}
  /* The query and the control that runs it, in one place. The run button used to
     be only in the act column, three lines up and across the row — you edited a
     box and then had to find the thing that fired it. */
  .probe-run{display:flex;gap:6px;align-items:stretch;}
  .probe-run input{flex:1;}
  .probe-run .t-run{white-space:nowrap;padding:2px 10px;}
  .probe .why{font-size:0.64rem;color:var(--fg4);display:block;margin-bottom:3px;}
  .replay{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 5px;}
  .replay button{font-size:0.62rem;font-family:inherit;background:none;cursor:pointer;
                 border:1px solid var(--bg3);color:var(--fg3);padding:1px 7px;}
  .replay button:hover{border-color:var(--aqua);color:var(--aqua);}
  .replay button.hit{border-color:var(--yellow);color:var(--yellow);}
  .probe-out{font-size:0.66rem;color:var(--fg3);white-space:pre-wrap;
             overflow-wrap:anywhere;max-height:16em;overflow:auto;
             border-left:2px solid var(--bg3);padding-left:7px;margin-top:4px;}
  /* The answer to "is the field in there?", outside the scroll box.
     Inside it, a 16KB payload pushes the one useful line out of view — which is
     the complaint this whole block exists to answer. */
  .probe-verdict{font-size:0.66rem;color:var(--fg2);margin-top:5px;
                 border-left:2px solid var(--bg3);padding-left:7px;}
  .probe-verdict .v-hit{color:var(--green,#b8bb26);}
  .probe-verdict .v-miss{color:var(--fg4);}
  .probe-verdict .v-warn{color:var(--yellow);}
  .probe-verdict .v-note{color:var(--fg4);display:block;margin-top:3px;}
  .probe-verdict .v-where{display:block;margin-top:2px;color:var(--fg3);}
  .probe-verdict code{color:var(--aqua);font-family:inherit;}
  /* The act. Appears only once a tool run has returned something, because the
     evidence is what separates this from an opinion about an agent. */
  .wrong{margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .wrong button{font-size:0.64rem;font-family:inherit;background:none;cursor:pointer;
                border:1px solid var(--red,#fb4934);color:var(--red,#fb4934);padding:2px 9px;}
  .wrong button:hover:not(:disabled){background:var(--red,#fb4934);color:var(--bg0-hard);}
  .wrong button:disabled{opacity:0.4;cursor:default;}
  .wrong .why{font-size:0.64rem;color:var(--fg4);}
  .wrong-out{font-size:0.66rem;color:var(--fg3);margin-top:4px;}
  .probe-out.bad{border-left-color:var(--red,#fb4934);color:var(--red,#fb4934);}
  .cite-link{font-size:0.66rem;color:var(--aqua);}
  .empty{padding:16px 8px;font-size:0.76rem;color:var(--fg4);}
  .absent{color:var(--fg4);font-style:italic;}
  </style>
</head>
<body>
  <div id="nav-root"></div>
  <div class="wrap"><div id="content"><div class="empty">Loading…</div></div></div>

  <script src="/static/js/widgets/nav.js"></script>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/widgets/xaman-ek.js"></script>
  <script>
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const EID = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
  // Served, not hardcoded. Copying a declaration is how two lists drift.
  let SETTLEABLE = null;
  // Who called this, who it called, where it landed. Read rather than asserted.
  let LINEAGE = null;
  // `fields[]` carries no assertion id, so the settle action is joined to a
  // claim by its path through the verification log.
  let ASSERTION_BY_PATH = {};
  // The verification log, folded to one entry per assertion: its state now,
  // how many verdicts came before, and the field it settles. Built in `boot`,
  // where the reason it is a fold rather than a list is written down.
  let CLAIMS = {};
  // Verdict names shortened for the `what happens next` column, which is 130px
  // wide. The full verdict is never hidden - it is on the row underneath, and
  // `settleForm` puts the raw value on each button's `title`.
  const SHORT_VERDICT = {
    human_sourced: "sourced",
    human_endorsed: "endorsed",
    rejected: "rejected",
    tool_verified: "tool-checked",
  };
  const READINGS = ["idle","fault","unknown"];
  const reading = r => READINGS.includes(r) ? r : "unknown";

  // strength, not grade. `tool_no_match` sorts above `unavailable_no_tool_source`
  // and both are strength 0 — different words for the same amount of reliance.
  const pips = s => {
    const n = Math.max(0, Math.min(2, s ?? 0));
    return `<span class="pips s${n}">${"▰".repeat(n)}${"▱".repeat(2-n)}</span>`;
  };
  // A claimed value is whatever the agent actually said, and that includes
  // objects and arrays. `String(obj)` renders `[object Object]`, which threw away
  // the contents of the single most important section on the page - the one that
  // exists precisely because values are never stripped. A structured claim is
  // shown as its JSON, because that IS what was claimed.
  // What the value IS, in a cell. The value itself is one row down, in `kv`.
  //
  // This used to put 300 characters of JSON in a `nowrap` cell, so the most
  // informative claim on the reference trace read
  // `{"arsenal_total":null,"man_city_total":null,"note":"Market value data
  // requires Tr…` — the note is the entire finding and it was the part cut off.
  // A table cell holds a value or a token, never a sentence.
  //
  // The null count is the other half, and nothing else on the page says it:
  // grounding checks provenance, not presence, so a block can grade
  // `tool_verified` with most of its values missing and read as sourced.
  function summarise(v) {
    if (v === null || v === undefined) return { cls: "null", text: "null" };
    if (Array.isArray(v)) return { cls: "json", text: `${v.length} item(s)` };
    if (typeof v === "object") {
      const ks = Object.keys(v);
      const nulls = ks.filter(k => v[k] === null || v[k] === undefined).length;
      if (!ks.length) return { cls: "null", text: "empty object" };
      return {
        cls: nulls ? "null" : "json",
        text: `${ks.length} field(s)${nulls ? ` · <b>${nulls}</b> null` : ""}`,
      };
    }
    if (typeof v === "string") {
      if (v.trim() === "") return { cls: "null", text: "empty string" };
      return { cls: "", text: esc(v.length > 90 ? v.slice(0, 90) + "\u2026" : v) };
    }
    return { cls: "", text: esc(String(v)) };
  }

  // The value, field by field, down to the leaves.
  //
  // One level was not enough and the reference document proves it: every one of
  // `football_analyst`'s eleven top-level keys is an object, so a depth-1 grid
  // is eleven rows of JSON preview — the wall again, with gutters. The leaves
  // are where the contracted fields live (`advanced_metrics.ppda`,
  // `squad_value.arsenal_total`) and where the nulls are.
  //
  // Nulls are styled as absence rather than printed as a word among values. A
  // column of dim italics is the fastest way to see that a block graded
  // `tool_verified` is mostly holes — grounding checks provenance, not
  // presence, so nothing else on the page says it.
  //
  // Two levels, then a preview. This is a decision aid, not an inspector; the
  // bytes as the agent wrote them are one disclosure away and are the record.
  const KV_DEPTH = 2;
  function kv(v, depth) {
    depth = depth || 0;
    if (v === null || typeof v !== "object") return "";
    const entries = Array.isArray(v)
      ? v.map((x, i) => [String(i), x])
      : Object.entries(v);
    if (!entries.length) return "";
    return `<div class="kv">${entries.map(([k, x]) => {
      const key = `<span class="kv-k">${esc(k)}</span>`;
      if (x !== null && typeof x === "object" && depth < KV_DEPTH) {
        const inner = kv(x, depth + 1);
        if (inner) {
          return `${key}<span class="kv-v nest">${summarise(x).text}</span>
                  <div class="kv-sub">${inner}</div>`;
        }
      }
      let cls = "", text;
      if (x === null || x === undefined) { cls = "null"; text = "null"; }
      else if (typeof x === "object") {
        cls = "nest";
        let j; try { j = JSON.stringify(x); } catch { j = "(unserialisable)"; }
        const head = Array.isArray(x) ? `[${x.length}] ` : "";
        text = esc(head + (j.length > 240 ? j.slice(0, 240) + "\u2026" : j));
      }
      else if (x === "") { cls = "null"; text = "empty string"; }
      else text = esc(String(x));
      return `${key}<span class="kv-v ${cls}">${text}</span>`;
    }).join("")}</div>`;
  }

  // Expandable only when there is something to expand into.
  function docBlock(v, label) {
    const body = kv(v);
    return body ? `<details class="doc"><summary>${esc(label)}</summary>${body}</details>` : "";
  }

  const STRENGTH_WORD = {
    2: "reproducible — a tool, transform or citation can produce these again",
    1: "judgement — legitimate, and not a retrieval",
    0: "nothing to rely on yet",
  };

  const PRECONDITION = {
    credit:        "can the caller pay",
    rate_limit:    "is the caller inside the window",
    attachment:    "is a payload attached, and of the right kind",
    output_schema: "does the output match its declared shape",
  };


  // What the screen is actually for: a gate is what stops a bad artifact from
  // becoming training data. Loop 1 is episodes -> consolidated -> rules, and
  // `response_text` is persisted un-stripped, so a rung that inspects the
  // contents but cannot refuse does not protect the loop from anything.
  function readArtifact(d) {
    const cps = d.checkpoints || [];
    const by = {};
    cps.forEach(b => { by[b.rung] = b; });

    const refused = cps.filter(b => b.decided && b.decided.decision === "refused");
    const approved = cps.filter(b => b.decided && b.decided.decision === "approved");
    // Assertions still awaiting a verdict — one entry per claim, from the fold,
    // not one per row of the log.
    //
    // This filtered `routed[]` directly, which is the whole append-only history:
    // a claim queued at 23:21 and endorsed twice at 23:32 and 23:33 kept its
    // `pending_human_check` row forever, so the artifact reported claims
    // "awaiting a verdict" that a person had already settled — and the number
    // could never go down, because settling ADDS a row. Two surfaces read this:
    // the reading's `held for review` count and the loops block.
    const held = Object.keys(CLAIMS).filter(id =>
      String(CLAIMS[id].verdict || "").startsWith("pending_"));
    // Kept as its own count, because zero held has two causes and they are
    // opposites: nothing was ever queued, or everything queued was settled. The
    // loops block showed neither, so the run where curation actually closed
    // looked identical to one where it never started.
    const settled = Object.keys(CLAIMS).filter(id =>
      CLAIMS[id].verdict && !String(CLAIMS[id].verdict).startsWith("pending_"));

    const g = by.grounding;
    const rc = g && g.recomputed;
    const graded = rc ? (rc.fields || 0) : 0;
    const violations = rc ? (rc.violations || 0) : 0;

    // The ceiling: the deepest rung that both looked at the contents AND could
    // have acted on what it found. `enforcement === "control"` is the only
    // thing that can refuse; a metric records and the artifact travels on.
    const couldRefuse = cps.filter(b => b.enforcement === "control");
    const inspectedContents = g ? !!rc : false;
    const contentsGuarded = !!(g && g.enforcement === "control");
    // A third state, and the platform only gained the word for it once the
    // route gained the behaviour. `amend` cannot refuse the run — a field's
    // grounding is unknowable until the model has written it — but the
    // ungrounded value does not reach the caller: the body carries the enforced
    // document and `grounding.stripped` names what was removed.
    //
    // Rendering that as `records only` was true of the code and false of the
    // consequence, and it is why question five was red on every artifact this
    // platform has ever produced.
    const contentsAmended = !!(g && g.enforcement === "amend");

    return { by, refused, approved, held, settled, graded, violations,
             couldRefuse, inspectedContents, contentsGuarded, contentsAmended,
             grounding: g };
  }

  function verdict(d) {
    const a = readArtifact(d);

    // Answer the question first, in one sentence.
    let line, tone;
    if (a.refused.length) {
      line = "This artifact was refused."; tone = "dirty";
    } else if (a.violations > 0 && a.contentsAmended) {
      // `stripped`, not `unsourced`, and the word matters more than it looks.
      //
      // `unsourced` is a DECLARED KIND on the specimen page — no tool exists
      // yet, the field must be null, a standing request rather than a defect —
      // and this sentence used it to mean a violation. One word, two opposite
      // meanings, on two panels a reader sees together. `field_state` makes the
      // collision a build failure; this is the sentence that caused it.
      line = `This artifact was repaired before it left: ${a.violations} \
              claim(s) were <b>stripped</b> and the rest was delivered.`;
      tone = "clean";
    } else if (a.violations > 0 && !a.contentsGuarded) {
      line = "Nothing stopped this artifact, and it carries claims the contract forbids.";
      tone = "dirty";
    } else if (a.graded > 0 && a.violations === 0) {
      line = "Nothing stopped this artifact, and every claim under contract was sourced.";
      tone = "clean";
    } else {
      line = "Nothing stopped this artifact, and nothing examined what it says.";
      tone = "unknown";
    }

    const nums = [
      ["", a.approved.length, "passed"],
      [a.held.length ? "warm" : "", a.held.length, "held for review"],
      [a.refused.length ? "hot" : "", a.refused.length, "refused"],
      [a.violations ? "hot" : "", a.violations, "stripped"],
      ["", a.graded, "claims graded"],
    ].map(([cls, v, label]) =>
      `<div class="vnum ${cls}"><b>${v}</b><span>${label}</span></div>`).join("");

    // The ceiling, in the enforcement vocabulary rather than in three
    // hand-written variants of it.
    //
    // This spelled out `amend`, `metric` and "nothing looked" in prose, which is
    // a fourth place the four declared enforcement modes were collapsed by hand
    // — and the mode it could not name is `report`, where the verdict does reach
    // the caller. `ENFORCE` is the one map; `why_not_control` is the platform's
    // own sentence and is carried rather than paraphrased.
    //
    // The detail that used to live here — how many claims were graded, and what
    // the mode means for the artifact — is row 6 of "As designed" below, beside
    // the other five answers rather than two scrolls from them.
    const enf = a.grounding && a.grounding.enforcement;
    const ee = enf ? enforceOf(enf) : null;
    const ceiling = ee
      ? `<b>A checkpoint read the contents and ${esc(ee.full)}.</b>${
          a.grounding.why_not_control
            ? ` It cannot refuse the run: <i>${esc(a.grounding.why_not_control)}</i>`
            : ""}`
      : `Deepest checkpoint that could have refused: <b>the envelope only</b>.
         Nothing opened the payload, so no verdict here concerns what it says.`;

    // The point of the gate, stated: was this fit to learn from?
    const feed = a.violations > 0 && !a.contentsGuarded
      ? `<div class="vfeed bad">⚠ This artifact entered <b>Loop 1</b> as training data with
         ${a.violations} claim(s) the contract forbids still in it. The platform computed a
         cleaned copy and discarded it; <code>response_text</code> is persisted with the
         claims intact, and consolidation reads that.
         <b>This is how a loop gets corrupted.</b></div>`
      : a.graded > 0
        ? `<div class="vfeed ok">Fit to learn from, for the ${a.graded} field(s) under
           contract. Everything else in the document is unexamined.</div>`
        : `<div class="vfeed ok">It entered <b>Loop 1</b> unexamined — not refused, and not
           checked. Whether that is safe is not something this platform currently knows.</div>`;

    return `<div class="verdict ${tone}">
      <div class="vline">${line}</div>
      <div class="vnums">${nums}</div>
      <div class="vceil">${ceiling}</div>
      ${feed}
    </div>`;
  }

  // What the agent was asked for, and what it owes.
  //
  // **Served, not recomputed.** This walked the field values in JavaScript:
  // excused `unsourced` and `derived`, counted the rest. That was a second
  // implementation of `completeness::assess`, and the weaker one — it cannot see
  // the run record, so it could not tell a tool that was ASKED and had nothing
  // from one that was never called. Both are empty fields; only the second is
  // the agent's.
  //
  // On the stag beetle that was the whole finding: four null genome fields with
  // `ncbi_genome_search` called and 229 bytes back — a capability gap and
  // nobody's fault — counted in red against the agent. The page contradicted its
  // own rows because this function could not see what the rows could.
  //
  // Falls back to zeroes rather than to the old walk: an older episode served
  // without the block should say "nothing examined", which is true, instead of
  // reviving a rule the platform has stopped using.
  function emptiness(d) {
    const c = (d && d.completeness) || {};
    return {
      // `owed` is the count that is somebody's fault; `no_data` is the world's
      // and is reported beside it rather than folded in.
      total: c.asked_for || 0,
      empty: (c.owed || []).length,
      no_data: (c.no_data || []).length,
      excused: c.excused || 0,
      owed: c.owed || [],
    };
  }

  // `records only` collapsed FOUR declared states into two, and the reason it
  // could not distinguish them was already on the wire.
  //
  // `command_registry::Enforcement` declares `Control` (refuses the run),
  // `Amend` (alters the artifact before it leaves), `Report` (the verdict
  // reaches the caller, unacted) and `Metric` (computed and thrown away).
  // `artifact_trace` serves all four as distinct words. This page tested
  // `=== "control"` and printed `records only` for the other three — so `amend`,
  // the mode that actually removes the bad part, read as impotent, and `report`
  // (you were told) was indistinguishable from `metric` (discarded).
  //
  // Consequence, not bookkeeping: what does this mean for the artifact?
  //
  // And only `metric` is a dangling thread, so only `metric` carries a tone.
  // `why_not_control` is MANDATORY on every non-control application —
  // `a_gate_that_cannot_refuse_explains_itself` panics without it, on the
  // grounds that "a gate demoted to a metric is a decision somebody made, and
  // the reason is what tells a later reader whether it was deliberate or
  // drift." The page received that sentence and threw it away, then printed a
  // word that sounded like the platform shrugging.
  const ENFORCE = {
    control: { chip: "can stop it",          tone: "",     full: "refuses the run" },
    amend:   { chip: "removes the bad part", tone: "",     full: "strips what the contract cannot support, before the response leaves" },
    report:  { chip: "tells the caller",     tone: "",     full: "returns the verdict to the caller and alters nothing" },
    metric:  { chip: "counted, not acted",   tone: "warn", full: "computes the verdict and discards it" },
  };
  // An enforcement word this page has not met renders as the discarded case
  // rather than the acting one. A new mode defaulting to "can stop it" would
  // overstate the platform's safety properties, and that is the one direction
  // of error that matters here.
  const enforceOf = w => ENFORCE[w] || ENFORCE.metric;

  // Which checkpoint answers a question, and what it can do about the answer.
  //
  // Three kinds of nothing, and they are not the same:
  //   * `no gate`           — nothing in the system asks this.
  //   * `not on this route` — the gate exists and this route does not declare it.
  //   * `not recorded`      — it is declared, it ran, and no ledger row survives.
  function gates(a, ids) {
    if (ids === null) {
      return `<span class="gate">every checkpoint together</span>`;
    }
    if (!ids.length) {
      return `<span class="gate g-none">no gate</span>`;
    }
    return ids.map(id => {
      const b = a.by[id];
      if (!b) return `<span class="gate g-off"><b>${esc(id)}</b> · not on this route</span>`;
      const e = enforceOf(b.enforcement);
      const verdict = b.decided ? b.decided.decision : "not recorded";
      const cls = verdict === "refused" ? "g-refused"
                : b.enforcement === "control" ? "g-refuse" : "";
      return `<span class="gate ${cls}"><b>${esc(id)}</b> · ${esc(verdict)} · ${
        esc(e.chip)}</span>${b.why_not_control
          ? `<div class="caveat">Why it cannot refuse: ${esc(b.why_not_control)}</div>`
          : ""}`;
    }).join("");
  }

  // The same three kinds of nothing, at glance width.
  //
  // `gates` writes `grounding · refused · removes the bad part`, which is right
  // where there is a line to put it and unreadable in a third of a strip. Here
  // the name carries the state and the full form is one disclosure away rather
  // than reworded.
  function gateNames(a, ids) {
    if (ids === null) return `<span class="gate">every checkpoint</span>`;
    if (!ids.length) return `<span class="gate g-none">no gate</span>`;
    return ids.map(id => {
      const b = a.by[id];
      if (!b) {
        return `<span class="gate g-off" title="the gate exists and this route does not \
declare it">${esc(id)}</span>`;
      }
      const e = enforceOf(b.enforcement);
      const verdict = b.decided ? b.decided.decision : "not recorded";
      const cls = verdict === "refused" ? "g-refused"
                : b.enforcement === "control" ? "g-refuse" : "";
      return `<span class="gate ${cls}" title="${esc(id)} · ${esc(verdict)} · ${
        esc(e.chip)}${b.why_not_control ? ` — ${esc(b.why_not_control)}` : ""}">${
        esc(id)}</span>`;
    }).join("");
  }

  // ── Two standards, named ────────────────────────────────────────────────
  //
  // Five questions, one strip, one colour ramp. A user read it and reported
  // "in practical terms this feels like a bunch of rejection" about an artifact
  // that was deliverable — and they were right about the page and wrong about
  // the artifact, which means the page was wrong.
  //
  // The strip rendered four different kinds of finding in one red: a
  // fabrication (a fault), commissioned work not delivered (a shortfall
  // against the agent's own ambition), a capability gap in the world, and a
  // ceiling that is not a finding at all. The one event that should alarm a
  // reader was therefore the SMALLEST number on the page, drowned by two
  // larger numbers that both mean "the agent did not do everything it hoped".
  //
  // The reader has two questions and the page answered one:
  //
  //   Legality  does it compile, is the artifact deliverable?   a GATE
  //   Ambition  is the agent doing what its designer hoped?     a GRADIENT
  //
  // Interleaved under one ramp, a designer-grade disappointment reads as a
  // caller-grade defect. So they split. The distance between the two rows is
  // the designer's worklist.
  //
  // The specimen page had already solved this and the trace lacked the frame
  // rather than the facts: "Green means zero ERRORS. The pending fields are
  // declared gaps with no source yet — pruning them to reach green would delete
  // the ambition the contract exists to record."
  function questions(d) {
    const a = readArtifact(d);
    const fs = d.fields || [];
    const e = emptiness(d);
    const byStrength = s => fs.filter(f => (f.strength ?? 0) === s).length;

    // Findings, counted from the SERVED per-field verdict.
    //
    // `field_state::Finding` is the one producer. The caption under row B is
    // derived from these counts rather than written, because a caption claiming
    // a shortfall the rows do not show is the failure mode of a hand-written
    // summary — and this page has shipped that twice.
    const findings = {};
    fs.forEach(f => { findings[f.finding] = (findings[f.finding] || 0) + 1; });

    // The worst finding in a subset, by the rank the server serves.
    //
    // Ordering the platform's tone vocabulary on the client would be a second
    // verdict; `finding_rank` exists so this is a max over served numbers.
    // `-1` means the subset is empty, which is not a verdict about anything.
    const worstOf = pred => fs.filter(pred)
      .reduce((m, f) => Math.max(m, f.finding_rank ?? 0), -1);
    const toneOf = rank =>
      rank < 0 ? "na" : rank === 0 ? "ok" : rank === 1 ? "warn" : "bad";

    const ran = a.by.credit || a.by.rate_limit;
    const got = a.by.attachment || a.by.input_binding;

    const owedPaths = new Set((e.owed || []).map(g => g.path));
    // Row 5's subject, and it is where `weakSourced` went.
    //
    // It used to be a TONE on the distribution cell: `weakSourced > 0 ? "bad"`.
    // That is a verdict smuggled into a description — the distribution says
    // where the numbers came from and cannot attribute anything — so the
    // verdict moved to a row that can, and the description lost its colour.
    const neverCalled = new Set(
      (((d.completeness || {}).owed) || [])
        .filter(g => g.why === "tool_never_called").map(g => g.path));
    const unreachable = fs.filter(f =>
      neverCalled.has(f.name) || (f.settleable_by && !f.tool_runnable));
    const unreachableNames = new Set(unreachable.map(f => f.name));

    // ── Row A · fit to send. The caller's standard, and it can be green. ──
    const rowA = [
      { short: "allowed to run",
        tok: ran ? "yes" : "no check",
        ans: ran ? "Yes — it had the budget and was inside its limits."
                 : "No check on this route.",
        tone: ran ? "ok" : "na",
        q: "Was it allowed to run?",
        g: ["credit", "rate_limit"] },

      { short: "got its inputs",
        tok: got ? "yes" : "no check",
        ans: got ? "Yes — the request carried what the agent expects."
                 : "No check on this route.",
        tone: got ? "ok" : "na",
        q: "Did it get what it needed?",
        g: ["attachment", "input_binding"] },

      // The one row on this page that earns red, and the reason the split
      // works: it is the only question here whose bad answer means the model
      // asserted something it could not have known.
      { short: "clean of unsourced claims",
        tok: a.graded === 0 ? "nothing examined"
           : a.violations === 0 ? "clean"
           : `${a.violations} stripped`,
        ans: a.graded === 0
          ? "Nothing it returned was examined, so nothing here is claimed."
          : a.violations === 0
            ? `Yes — all ${a.graded} claim(s) under contract could have come from a
               source the agent has.`
            : `<b>No — ${a.violations} value(s) the contract forbids were asserted.</b>
               They were <b>stripped</b> before the response left, so the caller did
               not receive them. This is the one finding on this page that is a
               fault rather than a shortfall.`,
        tone: a.graded === 0 ? "na" : a.violations === 0 ? "ok" : "bad",
        q: "Did it assert anything it could not have known?",
        g: ["grounding"] },
    ];

    // ── Row B · as designed. The designer's standard, a gradient. ──
    const rowB = [
      // The tone comes from the worst `Finding` among the fields it is about.
      // It used to read `e.empty === 0 ? "ok" : "bad"`, which painted a
      // shortfall in the fault colour — carefully separating `owed`, `no_data`
      // and `excused` in the prose one line above, and then throwing the
      // distinction away in the colour.
      { short: "did the work",
        tok: e.total === 0
          ? "nothing examined"
          : e.empty === 0
            ? `all ${e.total - e.no_data} filled`
            : `${e.empty} of ${e.total} owed`,
        ans: e.total === 0
          ? "Nothing it returned was examined."
          : (e.empty === 0
              ? `Yes — every value it was asked for and could get came back filled in.`
              : `<b>${e.empty} of ${e.total} value(s) the agent owed came back
                 empty.</b> ` + e.owed.map(g =>
                   `<code>${esc(g.path)}</code> (${esc(
                     g.why === "tool_never_called"
                       ? "the contract names a tool and the record shows it was \
                          never called"
                       : "commissioned work, and none came back")})`).join(", ") + ".")
            + (e.no_data
                ? ` ${e.no_data} more are empty because the named tool was asked and
                   had nothing — a capability gap, and nobody's fault.`
                : "")
            + (e.excused
                ? ` A further ${e.excused} are absent because the contract requires
                   it — no tool exists for them, or the platform fills them — and
                   those are not this agent's to answer.`
                : ""),
        tone: e.total === 0 ? "na"
            : e.empty === 0 ? "ok"
            : toneOf(worstOf(f => owedPaths.has(f.name))),
        q: "Did it actually do the work it was commissioned for?",
        g: ["completeness"] },

      { short: "sources reachable",
        tok: fs.length === 0 ? "nothing checked"
           : unreachable.length === 0 ? "all reachable"
           : `${unreachable.length} out of reach`,
        ans: fs.length === 0
          ? "Nothing was checked, so there is nothing to say."
          : unreachable.length === 0
            ? `Every field naming a tool names one the platform can run, and the
               record shows each was called.`
            : `<b>${unreachable.length} field(s) name a source this run did not
               reach</b> — either the tool was never called, or it is one this
               platform cannot dispatch from here. ` + unreachable.slice(0, 6).map(f =>
                 `<code>${esc(f.name)}</code>`).join(", ")
               + (unreachable.length > 6 ? ` and ${unreachable.length - 6} more` : "")
               + `. A declared source that is never reached is the agent's
                  ambition outrunning its wiring, not a claim it got wrong.`,
        tone: fs.length === 0 ? "na"
            : unreachable.length === 0 ? "ok"
            : toneOf(worstOf(f => unreachableNames.has(f.name))),
        q: "Could it reach the sources it declares?",
        g: ["grounding"] },

      // §4.4: consequence, not bookkeeping — and only the discarded case
      // carries a tone. `records only` made the platform sound impotent about
      // `amend`, which is the one mode that actually removes the bad part, and
      // hid `report` (you were told) behind the same word as `metric`
      // (thrown away).
      (() => {
        const enf = a.grounding && a.grounding.enforcement;
        const ee = enf ? enforceOf(enf) : null;
        return { short: "checks that can act",
          tok: ee ? ee.chip : "nothing looked",
          ans: ee
            ? `A checkpoint read the contents and <b>${esc(ee.full)}</b>.`
              + (a.grounding.why_not_control
                  ? ` It cannot refuse the run, and the platform's own reason is:
                      <i>${esc(a.grounding.why_not_control)}</i>`
                  : "")
              + (enf === "metric"
                  ? ` <b>This one is a dangling thread</b> — the verdict is computed
                      and discarded, and promoting it to a control is the fix.`
                  : "")
            : "<b>Nothing opened the answer to look inside it</b>, so no verdict here concerns what it says.",
          // A ceiling is not a finding. Red is reserved for faults, and the
          // deepest thing wrong here is that somebody left a thread dangling.
          tone: !ee ? "warn" : (ee.tone || "ok"),
          q: "Could anything have acted on what it found?",
          g: ["grounding"] };
      })(),
    ];

    const cell = (r, i, n) => `<div class="q5c t-${r.tone}" title="${esc(r.q)}">
      <div class="q5c-l"><span class="q5c-n">${n}</span>${esc(r.short)}</div>
      <div class="q5c-v">${r.tok}</div>
      <div class="q5c-g">${gateNames(a, r.g)}</div>
    </div>`;

    // The caption under row B, DERIVED from the finding counts.
    //
    // The specimen page's sentence, ported. It is the frame the trace was
    // missing: what is missing is missing, and pruning the contract to make it
    // disappear would delete the ambition the contract exists to record.
    const sh = findings.shortfall || 0;
    const cg = findings.capability_gap || 0;
    const co = findings.compliance || 0;
    const fa = findings.fault || 0;
    let caption = "";
    if (fs.length) {
      // **A stripped field does not make an artifact undeliverable**, and
      // getting this backwards was the first version of this caption.
      //
      // `Decision::Refused` on the grounding rung is the ledger's word for
      // "this gate acted". Nothing was declined: the value was nulled and the
      // answer was delivered whole. That is what `amend` means, and it is why
      // the fault belongs in row A as red while the caption still says
      // deliverable — two true things about one event, which the old page could
      // not say at once because it had one word for both.
      //
      // The one case that is NOT deliverable is a violation that reached the
      // caller: graded, found, and nothing on the route able to remove it.
      const repaired = a.contentsAmended || a.contentsGuarded;
      const head = fa && !repaired
        ? `<b>Not fit to send.</b> ${fa} value(s) the contract forbids were asserted and
           nothing on this route could remove them, so the caller received them.`
        : fa
          ? `<b>Deliverable, and repaired.</b> ${fa} value(s) the contract forbids were
             asserted and <b>stripped</b> before the answer left — so the caller did not
             receive them, and the assertion is still the agent's to answer for.`
          : (sh || cg)
            ? `<b>Deliverable, below standard.</b> No claim the contract forbids left this
               answer.`
            : `<b>Deliverable, and as designed.</b> No claim the contract forbids left this
               answer, and nothing the agent owed is missing.`;
      const parts = [];
      if (sh) parts.push(`<span class="amb">${sh} value(s) the agent owed</span>`);
      if (cg) parts.push(`${cg} the world could not supply`);
      if (co) parts.push(`${co} the contract requires be empty`);
      caption = `<div class="std-cap">${head}${
        parts.length ? ` What is missing is missing: ${parts.join(", ")}.` : ""}${
        (sh || cg)
          ? ` Pruning the contract to reach green would delete the ambition it
              exists to record.`
          : ""}</div>`;
    }

    // Said once, under the rows, and only when it is true.
    //
    // DERIVED, not asserted: it finds its own subject rather than naming a
    // question by number, so it cannot go on blaming a question that has since
    // gained a gate.
    const all = rowA.concat(rowB);
    const gateless = all.findIndex(r => Array.isArray(r.g) && !r.g.length);
    const noGate = gateless >= 0
      ? `<div class="note q5-nogate"><b>${esc(all[gateless].short)} has no gate.</b>
           Nothing in the platform stands behind this answer: it is computed here,
           from the values. Every other answer on this page names the checkpoint
           that decides it.</div>`
      : "";

    return `<div class="block q5block">
      <h2>Can you trust this?</h2>

      <div class="std std-a">
        <div class="std-h">
          <span class="std-n">Fit to send</span>
          <span class="std-w">the caller's standard \u2014 and what the badge at the top
            of this page summarises. This can be green, and on most pulses is.</span>
        </div>
        <div class="std3">${rowA.map((r, i) => cell(r, i, i + 1)).join("")}</div>
      </div>

      <div class="std std-b">
        <div class="std-h">
          <span class="std-n">As designed</span>
          <span class="std-w">the designer's standard. Green here is an aspiration and
            divergence is information, not failure \u2014 the distance between these two
            rows is the worklist.</span>
        </div>
        <div class="std3">${rowB.map((r, i) => cell(r, i, i + 4)).join("")}</div>
      </div>
      ${caption}

      <div class="dist">
        <span class="dist-l">where the numbers came from</span>
        <span class="dist-v">${fs.length === 0
          ? "nothing checked"
          : [2, 1, 0].filter(s => byStrength(s))
              .map(s => `${byStrength(s)}${pips(s)}`).join(" ")}</span>
        <span class="dist-w">${fs.length === 0
          ? "Nothing was checked, so there is nothing to say."
          : `${byStrength(2)} from a tool or citation, ${byStrength(1)} from the
             model's own judgement, ${byStrength(0)} from nothing that could be
             checked. A description, not a verdict \u2014 strength 0 is correct for a
             field the contract says nothing can source.`}</span>
      </div>
      ${noGate}

      <details class="expert"><summary>the six questions, answered in full</summary>
        ${all.map((r, i) => `<div class="q5 t-${r.tone}">
          <div class="q5-q">${i + 1}. ${esc(r.q)}</div>
          <div class="q5-a">${r.ans}</div>
          <div class="q5-g">${gates(a, r.g)}</div>
        </div>`).join("")}
      </details>
    </div>`;
  }

  // ── The answer, annotated ────────────────────────────────────────────
  //
  // One document, one place. This was two blocks — "The payload", which held the
  // whole answer with no checks and no actions, and "What it claimed", which
  // held the checks and the actions for 13 of 47 values, regrouped by strength
  // so the document's own shape was destroyed. Each was half a screen, and a
  // reader had to do the join: find a field in one, find it again in the other,
  // and reconstruct which of the two views was talking about what.
  //
  // That is the third instance of one-object-two-renderings on this page, after
  // the two settle UIs and the flat verification log. The rule that fixes it is
  // already written down in `handlers/pages.rs`, about the bestiary: **a lens
  // changes columns and sort, not the page.**
  //
  // So: the document, in the agent's own order, every value annotated in place,
  // and strength is a filter rather than a grouping.
  //
  // The order matters and was being lost. `serde_json` without `preserve_order`
  // is a BTreeMap, so the answer was alphabetised the moment it crossed the API:
  // the agent wrote `league_context, squad_value, …, assessment` — context, then
  // evidence, then conclusion — and the page showed `advanced_metrics,
  // assessment, …`. The raw text at the bottom was in the agent's order and the
  // rendered document was not, so the two literally could not be read against
  // each other.

  // Contracted fields by dotted path, and the lens.
  let FIELD_BY_PATH = {};
  // The run-state legend, served by the platform and keyed by the token the
  // rows print. Not written here: a hand-written legend beside served tokens is
  // precisely how two vocabularies coexisted in this codebase, and how a
  // paragraph about "returned nothing" came to sit over rows reading
  // `never asked`.
  let STATE_GLOSS = {};
  // The other clock's legend. `Declared` carries no tone: a `pending` field is a
  // standing request for an integration and the opposite of a defect, and
  // `error` is the only contract state that is one.
  let DECLARED_GLOSS = {};
  // Token → severity rank, from the served run-state glossary, so the legend can
  // put the worst first without ordering the platform's vocabulary itself.
  let RANK_OF = {};

  // What the header badge is a summary OF, per reading token.
  //
  // Every one of these is a statement about "fit to send" and none of them says
  // anything about "as designed", which is the whole reason the badge needed a
  // label rather than a demotion.
  const BADGE_IS = {
    violations: "the contract found a value the model could not have known. This is " +
      "row 3 of `fit to send` and says nothing about whether the agent did what " +
      "its designer hoped — read `as designed` for that.",
    checked_clean: "the fields under contract were graded and none violated it. " +
      "Narrow: a field contract covers the fields somebody wrote an entry for, and " +
      "everything else in the document is unexamined.",
    nothing_checked: "this agent declares no field contract, so no rung could grade " +
      "anything. Not a pass and not a failure — it is the declaration gap, and " +
      "`/declarations` holds the worklist.",
  };

  let LENS = "checked";
  // The last trace drawn, so switching a lens redraws from data rather than
  // re-fetching. A lens is a view, and re-reading the platform to change a view
  // would make the platform's load a function of how the reader browses.
  let LAST_TRACE = null;
  // Every tool call the agent made during this run, retained on the episode.
  //
  // The reason the probe form no longer asks anyone to invent a query: the
  // record already holds the ones that happened.
  let TOOL_CALLS = [];

  // Pips only where a grade exists — but the CELL always exists.
  //
  // `pips` floors a missing strength to 0, which draws ▱▱: the same glyphs as
  // `tool_no_match`. So an uncontracted value would claim to have been graded and
  // found worthless when nothing examined it, and that is 106 of the 116 values
  // in the reference document — almost the whole answer mislabelled.
  //
  // Returns the empty string and not an empty element, because the element is
  // the caller's job: a row that drops a cell has its key auto-placed into the
  // 26px pips track, and every key then wraps one character per line. That
  // happened, on exactly the rows this function returns "" for.
  const gradePips = dotted =>
    FIELD_BY_PATH[dotted] ? pips(FIELD_BY_PATH[dotted].strength) : "";

  // Every state a value can be in, and who owns it.
  //
  // Separated by the ACTION each implies, not by how it arises:
  //
  //   settled        nothing to do
  //   actionable     you can settle it here, now
  //   recorded       somebody already did — follow the citation
  //   not produced   the agent returned nothing; fix the agent or its integration
  //   blocked        checkable in principle, nothing has queued it
  //   (uncontracted) nothing examined it — and it says NOTHING, see below
  //
  // The uncontracted case is silent on purpose. It was labelled `not under
  // contract` on every row, and that is 106 of the 116 values in the reference
  // document — a sentence repeated a hundred times, which is the rule this page
  // exists to hold: explain once, then show data. The count is stated once, in
  // the lens strip, where it is also the control that shows them.
  // Was the tool ever actually asked for this field?
  //
  // The question the grade cannot answer. `tool_no_match` reads as "the tool
  // answered and had nothing", and `grounding_trust` is explicit that it is a
  // PROXY — line 3172: "Content present ~ tool returned data". It is inferred
  // from the field being empty, so it cannot distinguish a tool that had nothing
  // from a tool nobody called.
  //
  // `tool_calls` can. Measured on the two reference runs:
  //
  //   genome_profiler   called `ncbi_genome_search`, got nothing for a beetle
  //                     with no sequenced genome, nulled the fields. Correct.
  //   football_analyst  graded `advanced_metrics` `tool_no_match`, and xG lives
  //                     in `fixtures/statistics.expected_goals`, and it called
  //                     standings, teams/statistics, players, injuries and
  //                     players/topscorers. It never asked.
  //
  // Same grade, opposite findings. The contract file predicted exactly this and
  // could not test it: "trusting an agent's self-report about its own tool's
  // capabilities is the identical error to trusting its self-report about a
  // genome size."
  // The row's state cell: **two served clocks, and no decision here.**
  //
  //   declared   what the contract says this field can be trusted about
  //   observed   what happened to it on this pulse
  //
  // Deliberately disjoint vocabularies — `field_state`'s
  // `the_two_vocabularies_share_no_token` is a build failure if they ever
  // collide — so a reader who learns a word learns one thing. That guarantee is
  // the whole reason both can sit in one cell.
  //
  // The colour is `finding_tone`, decided in `field_state::Finding::tone` and
  // nowhere else. **Red is reserved for faults.** The contract clock carries no
  // tone at all: a `pending` field is a standing request for an integration and
  // the opposite of a defect, and `error` is the only contract state that is
  // one, so it is the only one marked.
  function fieldState(f) {
    const obs = STATE_GLOSS[f.observed] || {};
    const dec = DECLARED_GLOSS[f.declared] || {};
    const word = t => esc(String(t || "").replace(/_/g, " "));
    return {
      cls: "t-state",
      html: `<span class="obs f-${esc(f.finding_tone || "neutral")}"
                   title="${esc(obs.why || f.observed || "")}">${word(f.observed)}</span>`
        + (f.declared
            ? `<span class="dec${dec.is_defect ? " d-defect" : ""}"
                     title="${esc(dec.why || f.declared)}">${word(f.declared)}</span>`
            : ""),
    };
  }

  // The act cell: what the platform offers on this row, and nothing else.
  //
  // One column used to hold a condition on some rows and a control on others —
  // `never asked` and `call_football_api ▸` in the same place, meaning different
  // kinds of thing — and on the absent rows, which are the ones with something to
  // press, the button was a line further down inside the prose. A reader
  // scanning the right-hand edge could not tell what was pressable without
  // reading every row.
  //
  // So: `value · condition · act`, in that order, in those places, always. An
  // em dash means the platform offers nothing here — which is a real answer and
  // has to look different from a row that simply forgot to draw its button.
  const none = () =>
    `<span class="a-none" title="nothing on this row is the platform's to offer">\u2014</span>`;

  function actCell(dotted, f, person) {
    if (f.settleable_by) return toolControl(dotted, f);
    if (person) return `<span class="t-person">needs a person</span>`;
    return none();
  }

  // What this row says about the field, and what you can do about it.
  //
  // **The field-state derivation is gone from here.** It was five branches over
  // `produced`, `absence_expected`, `kind`, `settleable` and a scan of the tool
  // calls, producing nine words of its own: `no tool exists`, `no tool for
  // this`, `platform-computed`, `prose`, `a judgement`, `asked, empty`,
  // `no data there`, `never asked`, `tool unused`, `agent wrote nothing`.
  //
  // Every one of them was already a state the platform owns:
  //
  //   `platform-computed` `prose` `a judgement` `no tool exists`
  //       → `field_state::Declared`, which the specimen page has read from
  //         `field_state` all along. This page spelled its own, which is how one
  //         word came to mean a declared kind on one panel and a violation on
  //         the next.
  //
  //   `asked, empty` `no data there` `never asked` `tool unused`
  //   `agent wrote nothing`
  //       → `field_state::Observed`, plus a byte count that is a FACT and not a
  //         verdict.
  //
  // And the copy was the weaker one. `askedFor` looked for any call to
  // `f.settleable_by`, so it was per TOOL where the platform's answer is per
  // FIELD: a run that called `call_football_api` for `injuries` and never for
  // `match_statistics.xg` reported both as asked. That disagreement became
  // visible the moment the served token was rendered beside it — one row read
  // `owed` next to `asked, empty` — and it had been there, unseen, for as long
  // as both existed.
  //
  // What stays is what only the client knows: the state of the **verification
  // log**. `CLAIMS` is a fold over the append-only `routed[]` and it changes
  // when a reader settles something, so those branches are live state rather
  // than a property of the pulse.
  function annotate(dotted) {
    const f = FIELD_BY_PATH[dotted];
    if (!f) return { cls: "", condition: null, act: "", body: "" };

    const aid = ASSERTION_BY_PATH[dotted];
    const st = aid ? CLAIMS[aid] : null;
    const open = !!st && String(st.verdict || "").startsWith("pending_");

    // ── the verification log, which is this page's to know ──
    //
    // Ordered first because a settled claim is an answer, and the field's run
    // state is the question it answers. A row that has been judged should say
    // so; the two clocks are still on it, in the state column.
    if (open) {
      return {
        cls: "r-actionable",
        condition: fieldState(f),
        verdict: { text: "awaiting a verdict", cls: "t-person" },
        act: actCell(dotted, f, true),
        body: `<div class="a-body" data-assertion="${esc(aid)}">
                 ${claimState(st)}${settleForm(aid)}<span class="settle-out"></span>
               </div>`,
      };
    }
    if (st) {
      return {
        cls: "r-done",
        condition: fieldState(f),
        verdict: { text: SHORT_VERDICT[st.verdict] || "settled", cls: "t-done" },
        // Settled is an answer, not a question. Offering the tool again here is
        // how nine rows end up wearing the same button and none of them mean it.
        act: none(),
        body: `<div class="a-body">${claimState(st)}</div>`,
      };
    }

    // ── no verdict on file: the row is the field's two clocks ──
    //
    // `cls` still drives the lens filters and the row's left edge, and it is
    // now read from the SERVED severity rather than re-derived. `r-empty` is
    // what the `returned nothing` lens selects on, so it tracks the states that
    // mean the value is absent.
    const TONE_ROW = { red: "r-violation", amber: "r-empty", neutral: "r-done" };
    const cls = f.observed === "filled"
      ? "r-done"
      : (TONE_ROW[f.finding_tone] || "r-done");

    return {
      cls,
      condition: fieldState(f),
      // Nothing has judged this claim, which is not the same as nothing being
      // wrong with it. Said in the act column, where the offer lives.
      verdict: f.settleable && f.observed === "filled"
        ? { text: "nothing queued it", cls: "t-person" }
        : null,
      act: actCell(dotted, f, f.settleable && f.observed === "filled"),
      // The one thing that differs between two rows in the same state: how much
      // the tool returned. A fact, as a chip. `genome_profiler`'s NCBI call
      // returned 210 bytes for a beetle with no sequenced genome and
      // `football_analyst`'s `injuries` call returned 16,036 — both "asked, and
      // still empty", and the number is the whole difference between a
      // capability gap and a discarded result.
      body: f.evidence_bytes !== null && f.evidence_bytes !== undefined
        ? `<div class="a-body"><span class="fact">${
            f.evidence_bytes ? `${f.evidence_bytes.toLocaleString()} B back`
                             : "nothing back"}</span></div>`
        : "",
    };
  }

  // The tool a contract names, as a control.
  //
  // `call_football_api` was printed beside a row and did nothing. The name IS the
