  // thing that would close the gap, and the platform can run it, so the name is
  // the button.
  //
  // `tool_runnable` is served per field. Five of the sixteen tools named across
  // the contracts need a workspace, a memory store or credentials of their own,
  // and offering a button the endpoint then refuses is worse than offering none:
  // the refusal arrives after the click, by which time the reader has concluded
  // the platform could do it.
  function toolControl(dotted, f) {
    if (!f.tool_runnable) {
      return `<span class="t-tool" title="named by the contract, and not runnable from a read-only surface">${esc(f.settleable_by)}</span>`;
    }
    return `<button class="t-run" data-probe="${esc(dotted)}" title="run ${
      esc(f.settleable_by)} and read what it returns">${esc(f.settleable_by)} \u25b8</button>`;
  }

  // The endpoint this field's contract names, or "".
  //
  // Parsed server-side and served as `probe_endpoint`. It was parsed here, from
  // the hint, and that is a second implementation of the same prose grammar:
  //
  //   standings (rank, points, form, home/away splits)   container + key names
  //   fixtures/headtohead                                endpoint only
  //   fixtures/statistics.expected_goals                 endpoint + one leaf
  //   assembly_name                                      a key, and no endpoint
  //
  // The probe endpoint now checks the query it receives against the same value,
  // so a client that parsed it differently would have the platform reporting the
  // reader's own prefill as the wrong endpoint.
  function hintEndpoint(f) {
    return String((f || {}).probe_endpoint || "");
  }

  // The parameters every call with this tool shared — this run's subject.
  //
  // Not a guess. `league: 39` and `season: 2024` appear on all seven of
  // `football_analyst`'s calls, and `team` varies between them; the intersection
  // is therefore what the run was ABOUT, and what varies is what each call was
  // for. That is the half the contract cannot carry and the record can.
  //
  // Anything endpoint-specific — a `fixture` id for statistics, an `h2h` pair —
  // is still the caller's, and the tool's own error says which when it is
  // missing, which is a better teacher than a guess.
  function sharedParams(tool) {
    const calls = TOOL_CALLS.filter(c => c.tool === tool && (c.input || {}).params);
    if (!calls.length) return {};
    const first = calls[0].input.params;
    const out = {};
    for (const k of Object.keys(first)) {
      const v = JSON.stringify(first[k]);
      if (calls.every(c => JSON.stringify((c.input.params || {})[k]) === v)) out[k] = first[k];
    }
    return out;
  }

  // The query the platform cannot supply.
  //
  // The contract names the tool and, in `response_field`, sometimes an endpoint
  // and sometimes a sentence — `fixtures/headtohead` next to
  // `standings (rank, points, form, home/away splits)`. Neither carries the
  // league, the season or the team, because those come from what the episode was
  // ABOUT rather than from the contract. So the caller fills them in, and the
  // form says that is why rather than presenting an empty box.
  function probeForm(dotted, f) {
    const hint = f.response_hint || "";
    // The calls this agent actually made with this tool, offered for replay.
    //
    // Writing `{"endpoint":"","params":{}}` by hand asks a reader to know
    // API-Football's schema AND the league, season and team ids for this run.
    // They are in the record: the agent made eight calls on the reference
    // episode and one of them is `injuries`, which is a contracted field that
    // came back null. Replaying a call that happened is retrieval, not a guess.
    //
    // A call whose endpoint matches this field's hint is marked, because that is
    // the one worth pressing — and when it exists it is also the finding: the
    // tool WAS asked, and the field is still empty.
    const mine = TOOL_CALLS.filter(c => c.tool === f.settleable_by && c.replayable);
    const ep = hintEndpoint(f);
    const isHit = c => ep && String((c.input || {}).endpoint || "") === ep;
    // Labelled as OTHER calls, because they are. Running `teams/statistics` to
    // answer a question about `fixtures` is what the unlabelled version invited,
    // and it produced two identical answers for two different fields.
    const replay = mine.length
      ? `<div class="replay"><span class="why">other calls this run made:</span>${mine.map((c, i) =>
          `<button data-replay="${i}" class="${isHit(c) ? "hit" : ""}"
             title="${esc(JSON.stringify(c.input))}">${
             esc(String((c.input || {}).endpoint || c.tool))}${
             c.output_chars ? ` \u00b7 ${c.output_chars.toLocaleString()} B back` : " \u00b7 nothing back"
           }</button>`).join("")}</div>`
      : "";
    const hit = mine.find(isHit);
    // The call for THIS field: the endpoint from the contract, the subject from
    // the record. Never an arbitrary call the agent happened to make, which is
    // what a replay chip is and what the empty fallback pushed a reader toward.
    // No endpoint in the contract means the tool takes none — `assembly_name`,
    // `best_bid / …`. An empty `endpoint` key prefilled into such a tool is a
    // guess about its input shape, so the box starts empty instead.
    const proposed = ep
      ? { endpoint: ep, params: sharedParams(f.settleable_by) }
      : {};
    const prefill = JSON.stringify(hit ? hit.input : proposed);

    return `<div class="probe" data-probe-form="${esc(dotted)}"
                 data-settleable="${ASSERTION_BY_PATH[dotted] ? "1" : "0"}">
      <span class="why">${
        hit
          ? `<b>The agent already asked this.</b> <b>${esc(ep)}</b> returned ${
              hit.output_chars ? `${hit.output_chars.toLocaleString()} bytes` : "nothing"
            } and this field is still empty, so the gap is not a missing integration.`
          : ep
            ? `Loaded <b>${esc(ep)}</b>${
               Object.keys(sharedParams(f.settleable_by)).length
                 ? ` with the ${esc(Object.keys(sharedParams(f.settleable_by)).join(" and "))}
                     this run used`
                 : ""}. Add anything else it needs \u2014 the tool's own error names it.`
            : `The contract names the tool and not its arguments${
                hint ? `, and says the answer is in <b>${esc(hint)}</b>` : ""}. The query is
                yours to write.`
      } Nothing is recorded.</span>
      ${replay}
      <div class="probe-run">
        <input class="probe-in" value="${esc(prefill)}"
               title="edit the query, then press run \u2014 or hit Enter"/>
        <button class="t-run" data-probe="${esc(dotted)}"
                title="run ${esc(f.settleable_by)} with this query">run \u25b8</button>
      </div>
      <div class="probe-verdict"></div>
      <div class="probe-out"></div>
    </div>`;
  }

  // The document as a flat list of rows, in the agent's order, deepest last.
  //
  // Flat rather than a tree of grids. Depth is an indent and the full dotted
  // path is on the row's `title`, which is also what a reader needs to reconcile
  // a row against the raw answer below — `advanced_metrics.xg` locates itself,
  // `xg` does not.
  //
  // A contracted path the document does not contain is the most actionable row
  // on the page and is invisible to a walk of the document alone — five of them
  // here (`fixtures`, `head_to_head`, `injuries`, `match_statistics`,
  // `summary`). They are emitted at the level they should have occupied, because
  // a hole is only legible in the shape it is missing from.
  function flattenDoc(doc, prefix, depth, out) {
    const entries = doc === null || typeof doc !== "object"
      ? []
      : Array.isArray(doc)
        ? doc.map((x, i) => [String(i), x])
        : Object.entries(doc);
    const present = new Set(entries.map(([k]) => k));

    // A contracted path whose FIRST missing segment is at this level.
    //
    // The first version required the whole remainder to be a direct child, so a
    // contract on `phylogeny.superorder` was emitted only if `phylogeny` itself
    // existed in the document. When the agent omits the parent, the child is
    // contracted, absent, and invisible — which is the most actionable row on
    // the page disappearing precisely because more of it is missing.
    //
    // Emitted under its remaining path, so the row still says where it belongs.
    const missing = Object.keys(FIELD_BY_PATH)
      .filter(p => {
        const at = prefix ? (p.startsWith(prefix + ".") ? p.slice(prefix.length + 1) : null) : p;
        return at && !present.has(at.split(".")[0]);
      })
      .map(p => [prefix ? p.slice(prefix.length + 1) : p, undefined]);

    for (const [k, x] of [...entries, ...missing]) {
      const dotted = prefix ? `${prefix}.${k}` : k;
      const a = annotate(dotted);
      const isBlock = x !== null && typeof x === "object";
      out.push({
        dotted, key: k, depth, a, isBlock,
        contracted: !!FIELD_BY_PATH[dotted],
        v: x === undefined
          ? { cls: "null", text: "absent from the document" }
          : summarise(x),
      });
      if (isBlock && depth < 3) flattenDoc(x, dotted, depth + 1, out);
    }
  }

  // Five cells, always, in one order: <b>value · condition · act</b>.
  //
  // A row that omits one gets its key auto-placed into the 26px pips track, and
  // every key then wraps one character per line. And the order is the grammar:
  // whatever the row's state, the value is in the third column, the state it is
  // in is in the fourth, and the thing you can press is in the fifth. Learn one
  // row and you can read a hundred without reading them.
  //
  // `whole` says whether the reader can see the tree. In `everything` a row sits
  // under its parent, so the leaf's own name and an indent locate it. In any
  // filtered lens the parent is usually absent — `advanced_metrics.xg` appears
  // and `advanced_metrics` does not, because nothing examined the block — and an
  // indented `xg` under nothing at all is unreadable. So a filtered row carries
  // its full path and no indent.
  function arow(r, whole) {
    const label = whole
      ? esc(r.key)
      : r.dotted.includes(".")
        ? `<span class="dim">${esc(r.dotted.slice(0, r.dotted.lastIndexOf(".") + 1))}</span>${
            esc(r.dotted.slice(r.dotted.lastIndexOf(".") + 1))}`
        : esc(r.key);
    return `<div class="arow ${r.a.cls}${r.isBlock ? " r-block" : ""}"
                 title="${esc(r.dotted)}">
      <span class="a-p">${gradePips(r.dotted)}</span>
      <span class="a-k${whole ? ` d${Math.min(3, r.depth)}` : ""}">${label}</span>
      <span class="a-v ${r.v.cls}">${r.v.text}</span>
      <span class="a-c">${r.a.condition ? r.a.condition.html : ""}${
        r.a.verdict ? `<span class="vd ${esc(r.a.verdict.cls)}">${
          esc(r.a.verdict.text)}</span>` : ""}</span>
      <span class="a-a">${r.a.act}</span>
      ${r.a.body}
    </div>`;
  }

  // The lens, and the default is the point.
  //
  // `everything` is 116 rows of which 106 are unexamined, and that was the
  // default — a wall in which the ten rows that carry a grade are invisible. The
  // default is now the contracted set: exactly the fields something checked,
  // in the document's own order, with their verdicts and actions. Everything
  // else is one click away and says how much of it there is.
  const LENSES = [
    ["checked", "checked", r => r.contracted],
    ["actionable", "you can act", r => r.a.cls === "r-actionable"],
    ["empty", "returned nothing", r => r.a.cls === "r-empty"],
    ["unsourced", "not reproducible", r => r.contracted
      && (FIELD_BY_PATH[r.dotted].strength ?? 0) < 2],
    ["unexamined", "nothing examined", r => !r.contracted],
    ["all", "everything", () => true],
  ];

  // **One legend, both clocks, every sentence served.**
  //
  // Said once for the group and keyed by the tokens the rows print. Every state
  // on this surface carries a reason, and the reason is a property of the STATE
  // rather than of the row: eleven rows in one state have eleven identical
  // explanations, and printed per row that is a wall. It shipped as one twice —
  // first as `not under contract` on 125 rows, then as a two-line paragraph
  // on 11.
  //
  // This replaces a hand-written `CONDITION_WHY` map of ten entries. That map
  // was the mirror of the derivation in `annotate`, so retiring one without the
  // other would have left a legend describing states no row could print. Both
  // glossaries now come off the payload — `field_states` and `declared_states`
  // — which means:
  //
  //   * a legend entry that matches no row cannot be written here, and
  //   * a row whose state has no entry is a hole in the SERVED vocabulary,
  //     which `every_finding_is_reachable_from_some_observed_state` fails on.
  //
  // The one thing a gloss cannot say is which tool would close a group, and
  // that is kept: "5 of these would be closed by `call_football_api`" is a
  // decision, where the same sentence eleven times is a paragraph to skip.
  //
  // Runnable tools only. A tool this page cannot run is not a remedy it can
  // offer, and naming it here as one is what the act column was rebuilt to
  // stop: the name of a fix nobody can press.
  function stateLegend(shown) {
    const group = (key, gloss) => {
      const counts = {}, tools = {};
      shown.forEach(r => {
        const f = FIELD_BY_PATH[r.dotted];
        if (!f || !f[key]) return;
        counts[f[key]] = (counts[f[key]] || 0) + 1;
        if (f.settleable_by && f.tool_runnable) {
          (tools[f[key]] ||= new Set()).add(f.settleable_by);
        }
      });
      // Worst first, by the served rank. A fault below four states that are
      // nobody's fault is a fault a reader meets last.
      return Object.keys(counts).sort((x, y) =>
        (RANK_OF[y] ?? 0) - (RANK_OF[x] ?? 0)).map(t => {
        const g = gloss[t] || {};
        const tone = g.finding_tone || (g.is_defect ? "red" : "");
        // A remedy is only offered where the state is one a tool could close.
        // On a judgement, on prose, or on a compliant absence there is nothing
        // to retrieve, and printing a tool there offers a fix for a state that
        // is not broken.
        const closable = key === "observed"
          && (t === "owed" || t === "tool_empty");
        const ts = tools[t];
        return `<span class="lgi">
          <span class="${key === "observed" ? `obs f-${esc(tone || "neutral")}`
                                            : `dec${g.is_defect ? " d-defect" : ""}`}"
            >${esc(t.replace(/_/g, " "))}</span>
          <span>${counts[t]} \u00b7 ${esc(g.why || "")}${
            g.whose && g.whose !== "nobody's" ? ` <b>${esc(g.whose)}</b>` : ""}${
            closable && ts && ts.size
              ? ` <b>${[...ts].map(esc).join(", ")}</b> would close ${
                  counts[t] === 1 ? "it" : `${counts[t]} of them`}.`
              : ""}</span>
        </span>`;
      }).join("");
    };

    const run = group("observed", STATE_GLOSS);
    const dec = group("declared", DECLARED_GLOSS);
    if (!run && !dec) return "";
    return `<div class="obs-leg">
        <span class="leg-k">this run</span>${run}
      </div>`
      + (dec ? `<div class="obs-leg">
        <span class="leg-k">the contract</span>${dec}
      </div>` : "");
  }

  // Nothing to do is a finding, and it has to be said.
  //
  // Both claims on the reference artifact are settled — one endorsed, one cited —
  // so there are no controls on the page, correctly. But a screen with no
  // controls and no sentence reads as a screen whose controls are missing, which
  // is what it was reported as. An empty worklist and a broken one look
  // identical unless one of them says so.
  function worklist(rows) {
    const open = rows.filter(r => r.a.cls === "r-actionable");
    if (open.length) {
      return `<div class="vfeed ok"><b>${open.length}</b> claim(s) here are waiting for a
        verdict, and the controls are on those rows.</div>`;
    }
    // Settled CLAIMS, from the fold — not rows that happen to need nothing.
    //
    // This counted `r-done` rows, which includes `no tool for this`,
    // `platform-computed` and every field grounding graded reproducible. On an
    // artifact where nothing was ever queued it therefore reported "2 claim(s)
    // have been settled", which is a false statement about the verification log
    // on the screen whose whole job is to be trusted about that log.
    const done = Object.keys(CLAIMS).filter(id =>
      CLAIMS[id].verdict && !String(CLAIMS[id].verdict).startsWith("pending_")).length;
    return `<div class="vfeed ok"><b>Nothing here is waiting for you.</b>${
      done ? ` ${done} claim(s) have been settled` : " No claim was ever queued"} — the
      remaining rows are nobody's review work.</div>`;
  }

  function answer(d) {
    const r = d.response || {};
    const q = d.input && d.input.query ? String(d.input.query) : "";
    const ty = (d.output_contract_type || d.payload_type
                || (d.hashes && d.hashes.output_grounded ? "structured document (JSON)" : null));

    // The bytes stay reachable. Rendering only the extraction is a digest, and
    // the reason `response_text` is retained at all is that a digest is not a
    // record — the reference answer opens with two sentences of prose before its
    // fenced JSON, and extraction drops them.
    const raw = r.text
      ? `<details class="doc"><summary>the answer as the agent wrote it${
           r.chars ? `, ${r.chars.toLocaleString()} characters` : ""}</summary>
           <div class="pl-body">${esc(r.text)}</div></details>`
      : "";

    // What an absent row means downstream. Said once, above the rows.
    //
    // The page reads as a verdict on whether the agent worked, and it is not
    // one: an app consuming this document uses the fields that are in it. "The
    // agent didn't bring everything back" and "the payload isn't usable" are
    // different statements, and every absence on this screen was being read as
    // the second.
    //
    // Two facts, both the platform's: an absent field arrives as a null, and a
    // value the contract forbade was already removed before the document
    // travelled. What these rows add is how far each value that IS here can be
    // relied on — which is the question a consumer cannot answer for itself.
    const consumed = `<div class="note consumed"><b>Absent is not undelivered.</b>
      A consumer reads the fields that are here and receives the rest as null; a value
      the contract forbade was nulled before this document travelled. These rows say how
      far each value can be relied on, not whether the artifact was usable.</div>`;

    let body = "", lens = "";
    if (r.document) {
      const rows = [];
      flattenDoc(r.document, "", 0, rows);
      const counts = {};
      LENSES.forEach(([id, , m]) => { counts[id] = rows.filter(m).length; });
      if (!LENSES.some(([id]) => id === LENS)) LENS = "checked";
      lens = `<div class="lens">${LENSES.map(([id, label]) =>
        `<button data-lens="${id}"${LENS === id ? ' class="on"' : ""}${
          counts[id] ? "" : " disabled"}>${esc(label)} · ${counts[id]}</button>`).join("")}</div>`;
      const match = LENSES.find(([id]) => id === LENS)[2];
      const shown = rows.filter(match);
      const whole = LENS === "all";
      // The column header IS the grammar, declared in the grammar's own shape.
      //
      // It was a four-line paragraph above the block saying what the pips meant
      // and where to hover — prose explaining a layout, which is what a layout
      // that needs explaining looks like. Five words in five cells say it, in
      // the places the words describe, and a reader who reads it once has read
      // every row.
      const header = `<div class="arow ahead">
        <span class="a-p" title="two clocks: grounding's grade for this field from the
              contract, and what happened to it on this pulse">rely · this run</span>
        <span class="a-k">field</span>
        <span class="a-v">value</span>
        <span class="a-c">state</span>
        <span class="a-a">act</span>
      </div>`;
      body = shown.length
        ? worklist(rows) + stateLegend(shown) + header
          + shown.map(x => arow(x, whole)).join("")
        : `<div class="empty">Nothing in this lens.</div>`;
    } else if (r.text) {
      body = `<div class="pl-body clamp" data-clamp>${esc(r.text)}</div>
              <button class="pl-more" data-more>show all${
                r.chars ? ` ${r.chars.toLocaleString()} characters` : ""}</button>`;
    } else {
      body = `<div class="pl-body absent">This episode retained no answer. Nothing on this
                page can be checked against what the agent said, because it was not kept.</div>`;
    }

    return `<div class="block">
      <h2>The answer</h2>
      <div class="note">Verbatim, in the order the agent wrote it. Hover a row for its full
        path. ${esc(ty || "Type not declared — treated as opaque text.")}</div>
      ${q ? `<div class="pl-h">Asked</div>
             <div class="pl-body clamp" data-clamp>${esc(q)}</div>
             ${q.length > 400
               ? `<button class="pl-more" data-more>show the whole question</button>` : ""}`
          : ""}
      <div class="pl-h">Answered</div>
      ${lens}
      ${consumed}
      ${body}
      ${r.truncated
        ? `<div class="pl-cut">The platform is showing the first ${
             (r.text || "").length.toLocaleString()} of ${
             (r.chars || 0).toLocaleString()} characters. The rest is retained and is not
             here — read the full record before settling a claim that depends on it.</div>`
        : ""}
      ${raw}
      <div class="floor">
        <b>Weakest link:</b> ${esc(d.floor || "—")} ${pips(d.floor_strength)}.
        A conclusion is only as good as the weakest thing it rests on, so this
        document as a whole relies on no more than that.
      </div>
    </div>`;
  }

  // Releasing a clamp and switching a lens are the only two interactions here,
  // so both are one listener on the container rather than a handler per element:
  // `render` replaces the container's contents, and per-element handlers wired at
  // render time are how a second render leaves half the page dead.
  // Run the contract's tool for one field and show what came back.
  //
  // The form opens on the first press and runs on the second. This spends an API
  // quota against somebody's key, and a control that fires on first contact is
  // the wrong shape for that.
  // Every payload this page has run, by digest of the whole body.
  //
  // `match_statistics` and `advanced_metrics.xg` are both contracted to
  // `fixtures/statistics`, so probing both returns the identical response. That
  // is correct and it reads as a bug — "it was the same payload for different
  // fields" — because nothing on the page said so. One call carries both; what
  // separates them is the key. Held here because only the client knows what it
  // has already run.
  const PROBE_DIGESTS = new Map();

  // Is this field in the response, and where?
  //
  // The complaint this answers: a 16KB payload that may or may not contain the
  // field. The search itself is server-side, over the whole body before the
  // display truncation — a NOT FOUND produced by a display limit would be a
  // false negative on a trust surface.
  //
  // A name at a path is a fact. "The agent could have had this" is the inference
  // a person draws from it, and the button for that is separate and below.
  function probeVerdict(p, dotted, settleable) {
    if (!p.ok) {
      return `<b class="v-warn">The tool refused.</b> The error is below, and it is
        usually the useful part \u2014 a missing parameter, a refused endpoint, a rate
        limit. Nothing was searched, because there is nothing to search yet.`;
    }
    const parts = [];
    const chars = (p.chars || 0).toLocaleString();

    // The wrong call, first: it invalidates everything after it.
    if (p.endpoint_matches === false) {
      parts.push(`<b class="v-warn">Not this field's endpoint.</b> You ran
        <code>${esc(p.endpoint_called)}</code>; the contract names
        <code>${esc(p.endpoint_expected)}</code>. Load that one and press run again.`);
    }

    const seen = PROBE_DIGESTS.get(p.digest) || [];
    const others = seen.filter(d => d !== dotted);
    if (!seen.includes(dotted)) { seen.push(dotted); PROBE_DIGESTS.set(p.digest, seen); }
    if (others.length) {
      parts.push(`<span class="v-note">Byte-identical to the response already run for ${
        others.map(o => `<code>${esc(o)}</code>`).join(", ")}. One call carries both
        fields \u2014 what tells them apart is the key, not the call.</span>`);
    }

    if (!p.searched.length) {
      parts.push(`<span class="v-note">The contract names an endpoint and no key inside
        it, so there is nothing to look for \u2014 read the ${chars} characters below
        and decide.</span>`);
    } else if (!p.parsed) {
      parts.push(`<b class="v-warn">The response is not JSON</b>, so nothing was
        searched. That is unknown, not absent.`);
    } else if (p.found.length) {
      // `found` is capped; `found_total` is how many places there are. A capped
      // list of evidence presented as the whole list is the same fault as a
      // silently truncated response.
      const more = (p.found_total || p.found.length) - p.found.length;
      parts.push(`<b class="v-hit">FOUND: ${
        esc([...new Set(p.found.map(f => f.key))].join(", "))}</b> \u2014 searched all
        ${chars} characters, in ${(p.found_total || p.found.length).toLocaleString()}
        place${(p.found_total || p.found.length) === 1 ? "" : "s"}${
          more > 0 ? `, first ${p.found.length} shown` : ""}:` + p.found.map(f =>
        `<span class="v-where">\u00b7 <code>${esc(f.at)}</code>${
          f.site === "value" ? " (the name is a value here, not a key)" : ""
        } \u2014 ${esc(f.sample)}</span>`).join("")
        // A partial answer must not read as a whole one: the contract lists five
        // names for `match_statistics` and finding one of them is one of five.
        + (p.missing.length
          ? `<span class="v-note">Not in this response: ${esc(p.missing.join(", "))}
             \u2014 also named by this field's contract.</span>`
          : ""));
    } else {
      // The reason a miss might mean nothing, and it is a different reason when
      // the call was the wrong one. Saying "either the query is wrong or the
      // source does not carry it" under a banner that already says the query is
      // wrong is the page arguing with itself.
      parts.push(`<b class="v-miss">NOT FOUND</b>: ${esc(p.searched.join(", "))} \u2014 ${
        p.searched.length === 1 ? "it does not appear" : "none of them appear"
        } anywhere in these ${chars} characters, as a key or as a value. ${
        p.endpoint_matches === false
          ? "Expected, for a different endpoint's answer \u2014 it says nothing about this field."
          : "Either the query is wrong, or the source does not carry it."}`);
    }

    if (p.not_searched.length) {
      parts.push(`<span class="v-note">Not searched: ${esc(p.not_searched.join(", "))}
        \u2014 prose in the contract, not key names.</span>`);
    }

    // What to do with it. An answer to the wrong question must not be offered as
    // a citation, whatever it contains.
    parts.push(`<span class="v-note">This decides nothing. ${
      p.endpoint_matches === false
        ? "And nothing here settles this row."
        : settleable
          ? "If it answers the claim, settle it above and cite this call."
          : "There is no claim on this row to settle \u2014 the field is empty, so what this \
tells you is whether the agent COULD have filled it."}</span>`);
    return parts.join(" ");
  }

  async function runProbe(btn) {
    const dotted = btn.dataset.probe;
    const row = btn.closest(".arow");
    const form = row && row.querySelector("[data-probe-form]");
    if (!form) {
      // Into the ROW, not after the button.
      //
      // `.probe` is `grid-column: 2 / -1`, and that only applies to a direct
      // child of the grid. Inserted after the button it becomes a child of the
      // act cell instead — 132px wide — and the whole form, the replay chips, the
      // query box and a 16KB response render in a column one word wide, down the
      // right-hand edge of an otherwise empty row. That is what moving the button
      // out of the body and into its own cell did, and the button is in the right
      // place: the insertion was in the wrong one.
      row.insertAdjacentHTML("beforeend", probeForm(dotted, FIELD_BY_PATH[dotted]));
      return;
    }
    const out = form.querySelector(".probe-out");
    let input;
    try {
      input = JSON.parse(form.querySelector(".probe-in").value || "{}");
    } catch (err) {
      out.className = "probe-out bad";
      out.textContent = "That is not valid JSON: " + err.message;
      return;
    }
    const verdict = form.querySelector(".probe-verdict");
    btn.disabled = true;
    out.className = "probe-out";
    out.textContent = "running\u2026";
    if (verdict) verdict.innerHTML = "";
    // Hoisted so the catch can tell a network failure from a bug in this file.
    let text = null;
    try {
      const r = await fetch(`/api/episodes/${encodeURIComponent(EID)}/probe`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: dotted, input }),
      });
      text = await r.text();
      if (!r.ok) {
        out.className = "probe-out bad";
        out.textContent = text;
      } else {
        const p = JSON.parse(text);
        // `ok` means the tool answered. It does not mean the field is settled,
        // and the payload says so too — a surface rendering a successful call as
        // a verdict would make exactly the claim the endpoint refuses to make.
        out.className = p.ok ? "probe-out" : "probe-out bad";
        // The act, offered only now.
        //
        // A "the agent is wrong" button that is always available is an opinion
        // button. This one appears when a tool run has actually returned
        // something, because the response IS the evidence and the endpoint
        // refuses the call without it.
        if (p.ok && p.response && p.response.trim()) {
          const act = form.querySelector(".wrong") || (() => {
            const d = document.createElement("div");
            d.className = "wrong";
            form.appendChild(d);
            return d;
          })();
          act.innerHTML = `<button data-wrong="${esc(dotted)}">the agent should have had this</button>
            <span class="why">files a reviewable finding with this response attached \u2014
              it does not change the agent</span>
            <span class="wrong-out"></span>`;
        }
        // The answer, above the payload and outside its scroll box.
        if (verdict) {
          verdict.innerHTML =
            probeVerdict(p, dotted, form.dataset.settleable === "1");
        }
        out.textContent =
          (p.ok ? "" : "the tool refused: ") + p.response
          + (p.truncated
              ? `\n\u2026 showing the first ${p.response.length.toLocaleString()} of ${
                  p.chars.toLocaleString()} characters. The search above ran over all of them.`
              : "");
      }
    } catch (err) {
      out.className = "probe-out bad";
      // A fetch that never returned is the network. Anything thrown after `text`
      // exists came from this file, and "could not reach the platform" said of a
      // ReferenceError is how `h is not defined` spent a deploy looking like an
      // outage.
      out.textContent = text === null
        ? "Could not reach the platform: " + err.message
        : "The platform answered and this page failed to render it: " + err.message;
    }
    btn.disabled = false;
  }

  // File the finding, with the tool's answer as the evidence.
  //
  // The end of the trail this screen exists for: the grade said the tool had
  // nothing, the record showed it was never asked, a run showed the data is
  // there. That is a fact, and Loop 2 is where a fact about an agent becomes a
  // correction the agent retrieves.
  //
  // It stops at the queue on purpose. Intervening runs the coherence gate,
  // requires a second reviewer for agent-wide scope, and writes an immutable
  // audit trail; a button that skipped all three would be the fastest way to
  // teach an agent something wrong.
  async function fileContradiction(btn) {
    const dotted = btn.dataset.wrong;
    const form = btn.closest("[data-probe-form]");
    const out = form.querySelector(".wrong-out");
    const evidence = (form.querySelector(".probe-out") || {}).textContent || "";
    btn.disabled = true;
    out.textContent = "filing\u2026";
    try {
      const r = await fetch(`/api/episodes/${encodeURIComponent(EID)}/contradict`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: dotted, evidence }),
      });
      const text = await r.text();
      if (!r.ok) {
        out.textContent = text;
        btn.disabled = false;
        return;
      }
      const p = JSON.parse(text);
      out.innerHTML = `Filed. <a href="/observatory/hitl">Review it \u2192</a> \u2014 ${
        esc(p.what_happens_next || "")}`;
    } catch (err) {
      out.textContent = "Could not reach the platform: " + err.message;
      btn.disabled = false;
    }
  }

  function wireClamps() {
    const root = document.getElementById("content");
    if (!root) return;
    // Enter runs the query you are looking at.
    //
    // The reported fault: you edit the query, and the control that runs it is
    // back up in the act column, out of context and not obviously connected to
    // the box you just typed in. There is a run button beside the box now, and
    // the key everyone presses in a text field works too. One delegated
    // listener, because `render` replaces the container and handlers wired per
    // element die with it.
    root.addEventListener("keydown", e => {
      if (e.key !== "Enter") return;
      const box = e.target.closest && e.target.closest(".probe-in");
      if (!box) return;
      e.preventDefault();
      const form = box.closest("[data-probe-form]");
      const run = form && form.querySelector("[data-probe]");
      if (run) runProbe(run);
    });
    root.addEventListener("click", e => {
      const wrongBtn = e.target.closest("[data-wrong]");
      if (wrongBtn) { fileContradiction(wrongBtn); return; }
      const replayBtn = e.target.closest("[data-replay]");
      if (replayBtn) {
        const form = replayBtn.closest("[data-probe-form]");
        const f = FIELD_BY_PATH[form.dataset.probeForm];
        const mine = TOOL_CALLS.filter(c => c.tool === f.settleable_by && c.replayable);
        const c = mine[Number(replayBtn.dataset.replay)];
        if (c) form.querySelector(".probe-in").value = JSON.stringify(c.input);
        return;
      }
      const probeBtn = e.target.closest("[data-probe]");
      if (probeBtn) { runProbe(probeBtn); return; }
      const lensBtn = e.target.closest("[data-lens]");
      if (lensBtn) {
        LENS = lensBtn.dataset.lens;
        render(LAST_TRACE);
        wireSettle();
        return;
      }
      const btn = e.target.closest("[data-more]");
      if (!btn) return;
      let body = btn.previousElementSibling;
      while (body && !body.hasAttribute("data-clamp")) body = body.previousElementSibling;
      if (!body) return;
      const open = body.classList.toggle("clamp");
      btn.textContent = open ? "show all" : "show less";
    });
  }
  // The verification ladder used to render here, five rungs, directly under
  // the five questions. It is gone, and the reason is that three of its rungs
  // were never about this artifact.
  //
  // `LADDER` marked them itself: presence, liveness and truth are
  // `scope: "platform"`, and the page printed them as "standing clock —
  // answered platform-wide, not for this artifact". Three rows saying "not
  // here". The remaining two, grounding and binding, are the same two the
  // questions strip already answers, and the ceiling the ladder computed is
  // already stated in question five.
  //
  // So a reader met two five-row panels about trust, adjacent, in different
  // vocabularies, labelling the same gate "refused · records only" in one and
  // "RECORDS ONLY · CEILING" in the other. Nothing contradicted; it read as
  // though everything did.
  //
  // The ladder itself is not lost and was never really here: `src/ladder.rs`
  // is its artifact — the paper's five rungs mapped to the modules that answer
  // them, declared with tests, written precisely because no artifact stated
  // that mapping. A page rendering of a platform-wide taxonomy belongs on a
  // platform surface (`/gates`), not on one pulse.


  // Branch on this before drawing anything. `substrate` is about the AGENT —
  // is it declared onto the platform at all — and the checkpoints are about this
  // artifact. Mixing them put an agent-level backlog inside a per-artifact
  // diagram and made a legacy agent look like a degraded route. It is not one:
  // it is outside the substrate, with a named owner and a worklist.
  function substrateBlock(d) {
    const s = d.substrate;
    if (!s) return "";
    const disp = s.disposition;
    if (disp === "prune") {
      return `<div class="sub prune"><h3>Test fixture — scheduled for deletion</h3>
        <div class="owner-body">${esc(s.because || "")}
        Nothing below is a finding about the platform and this agent is not a
        retrofit target. It is counted here only because you opened it directly.</div>
      </div>`;
    }
    if (disp === "retrofit") {
      return `<div class="sub retrofit"><h3>Not yet on the substrate</h3>
        <div class="owner-body">${esc(s.because || "")}
        This is a real agent that predates the contracts. Its grounding rung reads
        <b>undetermined</b> for that reason and no other. <b>Not a platform fault, and
        not a pass</b> — authoring work, owned by the agent's author.
        <a href="/declarations">The worklist →</a></div>
      </div>`;
    }
    if (disp === "legible") {
      return `<div class="sub legible"><h3>On the substrate</h3>
        <div class="owner-body">${esc(s.because
          || "Every rung on the declaration ladder is present, so the trace can say \
something specific about each checkpoint.")}</div></div>`;
    }
    // Unrecognised disposition is indeterminate, never healthy.
    // Absent reads differently from unrecognised: `<b>undefined</b>` is this page
    // failing to say which of the two it met.
    return `<div class="sub"><h3 style="color:var(--purple,#d3869b)">Substrate state ${
      disp === undefined || disp === null ? "absent" : "unrecognised"}</h3>
      <div class="owner-body">${disp === undefined || disp === null
        ? "The trace names no substrate disposition at all"
        : `The trace reports <b>${esc(String(disp))}</b>`}, which this
      screen does not know how to read. Treated as indeterminate rather than assumed
      healthy.</div></div>`;
  }

  // Three values, three registers. Getting this wrong does not produce a wrong
  // number — it produces a wrong backlog.
  function ownerBlock(d) {
    // `legibility` and `declared` moved inside `substrate`; reading them loose
    // is what let a fixture land on somebody's worklist.
    const lg = (d.substrate || {}).legibility || {}, si = d.silence || {};
    const chips = (arr, cls) => (arr || []).map(x =>
      `<span class="chip ${cls}">${esc(x)}</span>`).join("");

    const declared = `<div class="chips">${chips(lg.present, "have")}${chips(lg.missing, "miss")}</div>`;

    if (d.owner === "agent_author") {
      return `<div class="block"><h2>Why the checkpoints are quiet</h2>
        <div class="task">
          <h3>This is the agent author's to declare</h3>
          <div class="owner-body">
            ${esc(d.detail || "")}
            Nothing here failed. No rung could produce a verdict because the agent
            has not declared what its output should look like, so there was nothing
            to check against.
          </div>
          ${declared}
          ${si.rung ? `<div class="owner-next">Cheapest next step:
            <b>declare ${esc(si.rung)}</b> — the ladder is ordered by what it costs
            an author, so this is the least expensive useful move.
            <a href="/declarations">See the full worklist →</a></div>` : ""}
        </div></div>`;
    }
    if (d.owner === "platform") {
      return `<div class="block"><h2>Whose job this is</h2>
        <div class="backlog"><h3>Platform backlog — not yours</h3>
          <div class="owner-body">${esc(d.detail || "")}</div>
          ${declared}
        </div></div>`;
    }
    return `<div class="block"><h2>Whose job this is</h2>
      <div class="transient">Nobody's. ${esc(d.detail || "Nothing to do here.")}</div></div>`;
  }

  // A verdict whose claim could not be placed.
  //
  // "Routed for verification" used to be a second list of these, rendered
  // alongside the claim grid that already holds the same rows — the same object
  // in two renderings, on one screen, with two vocabularies for one act. It is
  // folded into the grid now, and what is left over is this: a verdict naming an
  // assertion whose field path the log does not carry.
  //
  // Named rather than dropped. A verdict that cannot be attached is not nothing,
  // and inner-joining it away would leave the reassuring reading as the only
  // available one. The reason is stated as the platform's, because it is: the
  // settle endpoint writes an `evidence` blob without the `path` the queue row
  // had.
  function unattached(d) {
    const orphans = Object.keys(CLAIMS).filter(id => !CLAIMS[id].path);
    if (!orphans.length) return "";
    return `<div class="block"><h2>Verdicts with no claim to attach to</h2>
      <div class="note"><b>${orphans.length}</b> verdict(s) name an assertion whose field
        path this log does not record, so they cannot be shown against the claim they
        settled. That is a gap in what <code>assertion_verifications.evidence</code>
        carries at settle time, not a gap in the verdict.</div>
      ${orphans.map(id => {
        const c = CLAIMS[id];
        return `<div class="caveat"><div class="dns"><b>${esc(c.verdict || "—")}</b>
          · ${esc(c.actor_kind || "unattributed")} · assertion <code>${esc(id)}</code>${
          c.earlier ? ` · ${c.earlier} earlier verdict(s)` : ""}</div></div>`;
      }).join("")}</div>`;
  }

  // What the log says about this claim right now.
  //
  // `earlier` is a count, not a list. The earlier rows matter — a
  // rejected-then-reverified claim must not read as `verified`, which is why
  // the table is append-only — but they are the expert's question, and putting
  // every row inline is what made the old block 60% rows that named nothing.
  //
  // The actor is described by KIND and not by id. Three rows on this page read
  // `human_endorsed · human · 2e644008-f5c7-…`, which is a UUID where a reader
  // needed a person, and told them nothing they could act on.
  function claimState(st) {
    if (!st || !st.verdict) return "";
    const who = st.actor_kind === "human" ? "a person"
      : st.actor_kind === "tool" ? "a tool"
      : st.actor_kind === "platform" ? "the platform"
      : "unattributed";
    // Followable, not printed.
    //
    // `human_sourced` scores as high as a tool check for one stated reason —
    // *because someone else can follow the citation to the same source*. It was
    // rendered as plain text, so the surface displaying the score did not
    // fulfil the score's own justification. `rel=noopener` and `noreferrer`
    // because the target is a URL a stranger typed into a form.
    const url = /^https?:\/\//i.test(String(st.citation || ""));
    const cite = st.citation
      ? url
        ? ` · <a class="cite-link" href="${esc(st.citation)}" target="_blank"
             rel="noopener noreferrer">follow the citation ↗</a>`
        : ` · cited <b>${esc(st.citation)}</b>`
      : "";
    const earlier = st.earlier
      ? ` · ${st.earlier} earlier verdict(s)` : "";
    // `cstate`, not `why`. This is the row's own record — verdict, who, citation,
    // how many verdicts came before — and every value in it differs per row.
    // `why` means the shared reason for a state, which is said once in the
    // legend; wearing that class made a line of facts look like the wall the
    // legend exists to prevent, and made it impossible to check for one.
    return `<span class="cstate"><b>${esc(st.verdict)}</b> · ${who}${cite}${earlier}</span>`;
  }

  function settleForm(id) {
    if (!id) return `<div class="dns">No assertion id, so this cannot be settled from here.</div>`;
    const verdicts = SETTLEABLE || [];
    if (!verdicts.length) {
      return `<div class="dns">The settleable verdicts could not be read from
        <code>/api/verification-queue</code>, so no button is offered rather than a
        guessed one.</div>`;
    }
    // `human_sourced` is the only verdict Postgres requires a citation for, and
    // the citation is what earns it the same score as a tool check: someone else
    // can follow it to the same source.
    const label = { human_sourced: "Sourced", human_endorsed: "Endorse", rejected: "Reject" };
    const buttons = verdicts.map(v =>
      `<button class="act ${v === "rejected" ? "act-no" : ""}" data-verdict="${esc(v)}"
        title="${esc(v)}">${esc(label[v] || v)}</button>`).join("");
    return `<div class="acts">
      <input class="cite" placeholder="source (required to mark Sourced)"/>
      ${buttons}
    </div>`;
  }

  // Where this pulse sits in a chain, as four cells you can read at a glance.
  //
  // This was three stacked prose rows under a heading, two folds down, below the
  // loops — and it is the more important half. A pulse nobody consumed fed
  // nothing; a pulse a teammate picked up is the whole point of a composition.
  // The loops are a timescale claim about learning; this is what actually
  // happened to the artifact. So it comes first, and it gets glyphs, because the
  // shape of a chain is the one thing on this page that is genuinely a picture:
  //
  //   ◀ who called it     ● this pulse     ▶ who it called     ⇥ where it landed
  //
  // Absent must look different from bad, so three kinds of nothing keep three
  // renderings: `nobody` is an answer (it ran directly, it delegated to no one),
  // `broken chain` is a finding (it WAS delegated and the caller was never
  // recorded), and `unread` means the lineage query did not answer at all.
  function flowStrip(d) {
    const par = LINEAGE && LINEAGE.parent;
    const kids = (LINEAGE && LINEAGE.children) || [];
    const sent = (LINEAGE && LINEAGE.delivered) || [];

    const up = !LINEAGE
      ? { tone: "na", v: "unread", a: "the lineage read did not answer" }
      : par && par.state === "resolved"
        ? { tone: "ok", v: esc(par.agent || "another agent"),
            a: `<a href="/trace/${encodeURIComponent(par.episode_id)}">trace the caller \u2192</a>` }
        : par && par.state === "dangling"
          ? { tone: "bad", v: "broken chain",
              a: "it was delegated and the caller was never recorded" }
          : { tone: "na", v: "nobody", a: "called directly, not as a sub-task" };

    const down = !LINEAGE
      ? { tone: "na", v: "unread", a: "the lineage read did not answer" }
      : kids.length
        ? { tone: "ok", v: `${kids.length} agent${kids.length === 1 ? "" : "s"}`,
            a: kids.map(k => `<a href="/trace/${encodeURIComponent(k.episode_id)}">${
                 esc(k.agent)}${k.status && k.status !== "success"
                   ? ` <span class="fc-bad">${esc(k.status)}</span>` : ""} \u2192</a>`).join(" ") }
        : { tone: "na", v: "nobody", a: "it did the work itself" };

    const land = !LINEAGE
      ? { tone: "na", v: "unread", a: "the lineage read did not answer" }
      : sent.length
        ? { tone: "ok", v: `${sent.length} workspace${sent.length === 1 ? "" : "s"}`,
            a: sent.map(s => (s.workspace_id
                 ? `<a href="/flow/${encodeURIComponent(s.workspace_id)}">${
                     esc(s.workspace || "a workspace")} \u2192 see the flow</a>`
                 : esc(s.workspace || "a workspace"))).join(" ") }
        : { tone: "inert", v: "no link",
            a: "no workspace message carries this pulse \u2014 for a run that predates the join, the link was never written" };

    const cells = [
      ["\u25c0", "hired by", up],
      ["\u25cf", "this pulse", { tone: "here", v: esc(d.agent.name),
        a: `<a href="/specimen/${encodeURIComponent(d.agent.name)}">the agent \u2192</a>` }],
      ["\u25b6", "it hired", down],
      ["\u21e5", "delivered to", land],
    ];

    return `<div class="flowstrip">${cells.map(([g, label, c]) => `<div class="fc t-${c.tone}">
      <div class="fc-l"><span class="fc-g">${g}</span>${esc(label)}</div>
      <div class="fc-v">${c.v}</div>
      <div class="fc-a">${c.a}</div>
    </div>`).join("")}</div>`;
  }

  // What happened to the artifact: who called, who was called, where it landed.
  function collaboration(d) {
    return `<div class="block">
      <h2>Where this pulse came from and went</h2>
      <div class="note">An artifact is a packet and a packet has a next hop. A pulse
        nothing consumed fed nothing \u2014 which is why this is not a detail.</div>
      ${flowStrip(d)}
    </div>`;
  }

  // The join between the two axes. An artifact is a packet (it crosses gates)
  // and a data point (it feeds loops) - the same object in two roles - and
  // neither screen used to say so.
  //
  // Only Loop 1 is asserted, because every persisted episode is Loop 1's first
  // stage. The others are claimed only when this artifact actually produced the
  // thing they consume: not every agent is ever calibrated against an external
  // outcome, and saying a loop does not apply is different from saying it is
  // broken.
  function loopsFed(d) {
    const a = readArtifact(d);
    const items = [];

    items.push(["Loop 1 · Individual learning", "hours",
      `Consolidation reads this episode and may turn it into a semantic rule the agent
       retrieves later.`,
      a.violations > 0 && !a.contentsGuarded ? "bad" : "ok"]);

    if (a.held.length || a.settled.length) {
      items.push(["Verification queue", "days",
        a.held.length
          ? `${a.held.length} claim(s) here are awaiting a verdict. Until one is recorded,
             “nobody checked” and “checked and fine” are the same state.`
          : `${a.settled.length} claim(s) were queued and settled \u2014 the loop having turned,
             not the loop having nothing to do.`,
        a.held.length ? "warm" : "ok"]);
    }
    if ((d.fields || []).some(f => (f.strength ?? 0) === 2)) {
      items.push(["Loop 5 · Calibration", "months+",
        `Reproducible values here can be scored against an outcome that resolves
         independently of what this agent said \u2014 a hard-verified signal, which needs no
         coherence gate.`, "ok"]);
    }

    return `<div class="block"><h2>What this artifact fed \u2014 the loops</h2>
      <div class="note">A gate decides whether an artifact is fit to enter a loop. This is
        where this one went.</div>
      ${items.map(([name, ts, body, tone]) => `<div class="rung">
        <div class="rung-b">
          <div class="rung-q">${esc(name)}</div>
          <div class="rung-pw">${body}</div>
        </div>
        <div class="rung-v"><span class="${
          tone === "bad" ? "v-silent" : tone === "warm" ? "v-inert" : "v-elsewhere"}">${esc(ts)}</span></div>
      </div>`).join("")}
      <div class="rung-pw" style="margin-top:8px">Loops not listed do not apply to this
        artifact. <a href="/loops">All loops, by timescale \u2192</a></div>
    </div>`;
  }

  function caveats(d) {
    const c = d.caveats || [];
    if (!c.length) return "";
    return `<div class="block"><h2>What this does and does not establish</h2>
      ${c.map(x => `<div class="caveat">
        <div class="ck">✓ ${esc(x.checked)}</div>
        <div class="dns"><b>Does not show:</b> ${esc(x.does_not_show)}</div>
      </div>`).join("")}</div>`;
  }

  function render(d) {
    LAST_TRACE = d;
    const rd = reading(d.reading);
    const m = d.model || {};
    // **The badge says what it is a summary of.** (Decision 3b.)
    //
    // `artifact_trace::reading()` returns `Fault` on `violations > 0` and
    // nothing else, so the badge has always been reporting the single
    // fabrication-shaped event on the page — which is row 3 of "Fit to send",
    // and nothing about whether the agent did what its designer hoped.
    //
    // Unlabelled, it read as a verdict on the artifact entire. It said `1`,
    // question 3 said `1`, they were different `1`s, and eleven omissions sat
    // beside them in the same colour family. Naming the row it summarises is
    // what makes it possible to keep it: a reader who sees `violations · fit to
    // send` knows the badge is silent about the other standard, and knows where
    // to look for it.
    //
    // Kept rather than dropped, on purpose, until the split has been read in
    // anger — a header with no verdict is its own kind of unreadable.
    const head = `<div class="head">
      <h1>Artifact trace</h1>
      <div class="sub">One episode, and the checkpoints it passed</div>
      <div class="meta">
        <span><a href="/specimen/${encodeURIComponent(d.agent.name)}">${esc(d.agent.name)}</a></span>
        <span>${esc(m.model_used || "model not recorded")}</span>
        <span>v${m.persona_version_at_write ?? 1}</span>
        <span>${esc((d.at || "").slice(0,19).replace("T"," "))}</span>
        <span class="badge r-${rd}" title="${esc(BADGE_IS[d.token] || "")}">${
          esc((d.token || "").replace(/_/g," "))}<span class="badge-of">fit to send</span></span>
        ${d.corpus_eligible ? "" : `<span class="absent">not corpus-eligible</span>`}
      </div>
      ${d.input && d.input.query ? `<div class="meta"><span class="absent">
        “${esc(String(d.input.query).slice(0,150))}”</span></div>` : ""}
    </div>`;

    // Deliberately not a "correction chain": `parent_episode_id` is stamped by
    // the delegation tools onto a child, so it names the agent that CALLED this
    // one. Labelling it as a correction was wrong and is now handled in feeds().
    const chain = "";

    // The expert views, folded.
    //
    // Everything below the work is true and none of it is what a reader came
    // for. Folded rather than deleted, and every summary states its own
    // headline from the data — so closing one hides detail and never a finding,
    // and the count in the summary is the reason to open it.
    const a = readArtifact(d);
    const expert = (summary, inner, open) => inner
      ? `<details class="expert"${open ? " open" : ""}><summary>${summary}</summary>${
           inner}</details>`
      : "";
    const loopsHead = a.held.length
      ? `What it fed — <b>${a.held.length} claim(s) awaiting a verdict</b>`
      : a.settled.length
        ? `What it fed — <b>${a.settled.length} settled</b>, so the loop turned`
        : `What it fed — <b>Loop 1 reads it; nothing is queued for review</b>`;
    const substrateHead = `Every checkpoint on this route — <b>${
      Object.keys(a.by).length} recorded, ${a.couldRefuse.length} able to refuse</b>`;

    // Answer, then whose job it is, then the expert views. The epistemics used
    // to come first and that is why the page could not be read; then the five
    // questions led and took half a screen doing it. The document the agent
    // wrote, annotated in place, IS the page — everything else contextualises it.
    // The chain is not a detail and the loops are not the headline.
    //
    // Both used to live in one folded block, loops first. But a pulse nobody
    // consumed fed nothing, and a pulse a teammate picked up is the whole point
    // of a composition — so where it came from and where it landed is on the
    // page, and the loops, which are a claim about learning over months, are
    // folded underneath it.
    document.getElementById("content").innerHTML =
      head + questions(d) + answer(d) + unattached(d) + ownerBlock(d)
      + collaboration(d)
      + expert(loopsHead, loopsFed(d), false)
      + expert(substrateHead, substrateBlock(d), false)
      + chain + caveats(d);
  }

  // The action, posted where it is read.
  //
  // Status codes are meaningful and the platform separated them on purpose: a
  // 400 is the reviewer's and fixable, so its body is shown verbatim; a 500 is
  // the platform's and must not read as the person's mistake.
  function wireSettle() {
    document.querySelectorAll("[data-assertion]").forEach(box => {
      const id = box.dataset.assertion;
      const out = box.querySelector(".settle-out");
      box.querySelectorAll(".act").forEach(btn => {
        btn.addEventListener("click", async () => {
          const verdict = btn.dataset.verdict;
          const cite = (box.querySelector(".cite") || {}).value || "";
          box.querySelectorAll(".act").forEach(b => (b.disabled = true));
          out.innerHTML = `<div class="dns">recording…</div>`;
          try {
            const r = await fetch(
              `/api/verification-queue/${encodeURIComponent(id)}/settle`,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  verdict,
                  source_citation: cite.trim() || null,
                }),
              });
            const text = await r.text();
            if (r.ok) {
              out.innerHTML = `<div class="dns" style="color:var(--green)">Recorded as
                <b>${esc(verdict)}</b>. The earlier pending row remains — the log is
                append-only, so this reads as queued <i>and then</i> settled.</div>`;
              const acts = box.querySelector(".acts");
              if (acts) acts.remove();
            } else if (r.status === 400) {
              // Their fault and fixable. The body is a specific sentence and is
              // safe to show as written.
              out.innerHTML = `<div class="dns" style="color:var(--yellow)">${esc(text)}</div>`;
              box.querySelectorAll(".act").forEach(b => (b.disabled = false));
            } else if (r.status === 404) {
              out.innerHTML = `<div class="dns">No queued claim for this assertion. A verdict
                can only settle something that was asked.</div>`;
            } else {
              out.innerHTML = `<div class="dns" style="color:var(--red,#fb4934)">This one is
                ours, not yours — the platform refused a verdict it declares as valid
                (${r.status}). Nothing you can fix from here.</div>`;
            }
          } catch (e) {
            out.innerHTML = `<div class="dns" style="color:var(--red,#fb4934)">Could not
              reach the platform: ${esc(e.message)}. Nothing was recorded.</div>`;
            box.querySelectorAll(".act").forEach(b => (b.disabled = false));
          }
        });
      });
    });
  }

  async function boot() {
    if (window.Nav) Nav.init({ current: "bestiary" });
    try {
      // The `/api/gates` retention heuristic that used to live here is gone:
      // the trace now serves `decided_absent.token` and there is no reason to
      // derive on the client what the platform declares.
      // The verdicts a reviewer may write, read from the platform rather than
      // held here. If it fails, no button is offered instead of a guessed one.
      const [res, q, lin] = await Promise.all([
        fetch(`/api/episodes/${encodeURIComponent(EID)}/trace`),
        fetch("/api/verification-queue")
          .then(r => (r.ok ? r.json() : null))
          .catch(() => null),
        fetch(`/api/episodes/${encodeURIComponent(EID)}/lineage`)
          .then(r => (r.ok ? r.json() : null))
          .catch(() => null),
      ]);
      SETTLEABLE = q && q.settleable_verdicts ? q.settleable_verdicts : null;
      LINEAGE = lin;
      if (res.status === 401) {
        document.getElementById("content").innerHTML =
          `<div class="empty">Sign in to read a trace.
           <a href="/auth/google">Google</a> · <a href="/auth/github">GitHub</a></div>`;
        return;
      }
      if (res.status === 404) {
        document.getElementById("content").innerHTML =
          `<div class="empty">No episode <b>${esc(EID)}</b>.</div>`;
        return;
      }
      if (!res.ok) throw new Error("HTTP " + res.status);
      const trace = await res.json();
      // Contracted fields by their dotted path, so the document can be annotated
      // where it is read. `fields[]` is the contract's view and the document is
      // the agent's; this index is the join, and it is the join the reader used
      // to have to do by eye across two blocks.
      TOOL_CALLS = trace.tool_calls || [];
      FIELD_BY_PATH = {};
      (trace.fields || []).forEach(f => { if (f.name) FIELD_BY_PATH[f.name] = f; });
      // The run-state legend, keyed by the token. An older trace served before
      // `field_state` reached this handler carries none, and the rows then
      // print no run state at all rather than one this page invented — which is
      // the honest degradation: the platform did not say, so the page does not
      // either.
      STATE_GLOSS = {};
      RANK_OF = {};
      (trace.field_states || []).forEach(g => {
        if (!g.token) return;
        STATE_GLOSS[g.token] = g;
        // Derived from the served tone rather than from a list here. Three
        // tones, one red, and the ordering follows the platform's.
        RANK_OF[g.token] = g.finding_tone === "red" ? 2
                         : g.finding_tone === "amber" ? 1 : 0;
      });
      DECLARED_GLOSS = {};
      (trace.declared_states || []).forEach(g => {
        if (!g.token) return;
        DECLARED_GLOSS[g.token] = g;
        // The one contract state that is a defect sorts with the faults; the
        // rest carry no severity at all, which is the point of the axis.
        RANK_OF[g.token] = g.is_defect ? 2 : 0;
      });
      // Current state is the LATEST row per assertion, DERIVED and not stored.
      // Migration 205 says so in the table comment — "so a
      // rejected-then-reverified assertion reads as exactly that instead of as
      // 'verified'" — and this client was ignoring it. `routed[]` is the whole
      // append-only log, `created_at DESC`, and the page rendered it flat: three
      // endorsements of one claim arrived as three rows, and a settle form was
      // still offered on the pending row underneath them. The header read "2 of
      // 5 still awaits a verdict" while one of the two had been settled three
      // times.
      //
      // The field path lives on the QUEUE-written row and not on the
      // settlement, so it is taken from whichever row in the assertion's
      // history carries one. That is why three rows read `claim ·
      // human_endorsed · <a uuid>` and named nothing: they were settlements
      // read in isolation from the row that knew what they settled.
      CLAIMS = {};
      (trace.routed || []).forEach(x => {
        const id = x.assertion_id;
        if (!id) return;
        const ev = x.evidence || {};
        const c = CLAIMS[id] || (CLAIMS[id] = { earlier: 0 });
        if (!c.verdict) {
          // DESC order, so the first row seen for an assertion is its state now.
          c.verdict = x.verdict;
          c.actor = x.actor;
          c.actor_kind = x.actor_kind;
          c.citation = x.citation;
          c.at = x.at;
        } else {
          c.earlier += 1;
        }
        if (ev.path && !c.path) c.path = ev.path;
        if (ev.claimed !== undefined && c.claimed === undefined) c.claimed = ev.claimed;
        if (ev.settleable_by && !c.settleable_by) c.settleable_by = ev.settleable_by;
      });
      ASSERTION_BY_PATH = {};
      Object.keys(CLAIMS).forEach(id => {
        const p = CLAIMS[id].path;
        if (p) ASSERTION_BY_PATH[p] = id;
      });
      render(trace);
      wireSettle();
      wireClamps();
    } catch (e) {
      document.getElementById("content").innerHTML =
        `<div class="empty">Could not read the trace: ${esc(e.message)}.
         No checkpoints are shown rather than an empty list — an artifact that
         passed no checkpoint and one we cannot read are different claims.</div>`;
    }
  }
  boot();
  </script>
</body>
</html>
