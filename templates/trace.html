<!doctype html>
<html lang="en" class="theme-hasui">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Trace — Agent Bestiary</title>
  <link rel="stylesheet" href="/static/css/variables.css"/>
  <link rel="stylesheet" href="/static/css/common.css"/>
  <link rel="stylesheet" href="/static/css/components.css"/>
  <style>
  body{font-family:"Berkeley Mono","JetBrains Mono",monospace;line-height:1.5;background:var(--bg0-hard);font-size:13px;margin:0;}
  a{color:var(--fg3);text-decoration:none;} a:hover{color:var(--yellow);}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px 60px;}

  .head{padding:18px 0 12px;border-bottom:1px solid var(--bg2);margin-bottom:18px;}
  .head h1{font-size:1rem;color:var(--yellow);margin:0 0 3px;}
  .head .sub{font-size:0.72rem;color:var(--fg4);}
  .head .meta{font-size:0.7rem;color:var(--fg4);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;}

  .badge{display:inline-block;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.06em;
         padding:1px 6px;border:1px solid;}
  .r-idle{color:var(--fg3);border-color:var(--bg3);}
  .r-fault{color:var(--red,#fb4934);border-color:var(--red,#fb4934);}
  .r-unknown{color:var(--purple,#d3869b);border-color:var(--purple,#d3869b);border-style:dashed;}

  /* ── The payload is the protagonist, not italic prose ───────────────────
     It is a typed token — it may be a document, an image, a video — and the
     question the whole screen answers is how deep anything looked into it. */
  .payload{border:1px solid var(--bg3);background:var(--bg1);padding:11px 13px;margin-bottom:14px;}
  .payload-t{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--fg4);}
  .payload-ty{font-size:0.72rem;color:var(--aqua);margin-top:2px;}
  .payload-q{font-size:0.78rem;color:var(--fg2);margin-top:6px;line-height:1.5;}

  /* ── The verdict. Answer first: passed, held, refused — then the reasoning.
     A gate is what stops a bad artifact from becoming training data, so the
     last line of the verdict is always whether this one was fit to learn from. */
  .verdict{border-left:3px solid var(--fg3);background:var(--bg1);padding:12px 14px;margin-bottom:20px;}
  .verdict.clean{border-left-color:var(--green);}
  .verdict.dirty{border-left-color:var(--red,#fb4934);}
  .verdict.unknown{border-left-color:var(--purple,#d3869b);}
  .vline{font-size:0.92rem;color:var(--fg2);line-height:1.45;}
  .vnums{display:flex;gap:18px;flex-wrap:wrap;margin-top:9px;}
  .vnum b{font-size:0.98rem;color:var(--fg2);font-weight:normal;}
  .vnum span{font-size:0.62rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--fg4);
             display:block;margin-top:1px;}
  .vnum.hot b{color:var(--red,#fb4934);}
  .vnum.warm b{color:var(--yellow);}
  .vceil{font-size:0.74rem;color:var(--fg3);margin-top:10px;padding-top:9px;
         border-top:1px solid var(--bg2);line-height:1.5;}
  .vceil b{color:var(--yellow);}
  .vfeed{font-size:0.76rem;margin-top:8px;line-height:1.5;}
  .vfeed.bad{color:var(--red,#fb4934);}
  .vfeed.ok{color:var(--fg3);}

  /* ── The verification ladder ────────────────────────────────────
     Five rungs, ordered by difficulty, always all five. "Each rung is
     invisible to the one below it", so a row of equal checkpoints would imply
     thoroughness by count — which is the defect the ladder exists to name. */
  .rung{display:flex;gap:11px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--bg2);}
  .rung-n{width:16px;flex-shrink:0;font-size:0.7rem;color:var(--fg4);text-align:right;}
  .rung-b{flex:1;min-width:0;}
  .rung-q{font-size:0.78rem;color:var(--fg2);}
  .rung-pw{font-size:0.68rem;color:var(--fg4);margin-top:2px;line-height:1.45;}
  .rung-pw b{color:var(--fg3);}
  .rung-v{width:126px;flex-shrink:0;text-align:right;font-size:0.66rem;
          text-transform:uppercase;letter-spacing:0.05em;}
  .v-ok{color:var(--green);}
  .v-silent{color:var(--red,#fb4934);}
  .v-inert{color:var(--purple,#d3869b);}
  .v-elsewhere{color:var(--fg4);}
  .rung.is-ceiling{background:rgba(250,189,47,0.07);margin:0 -12px;padding:9px 12px;}
  .ceilmark{font-size:0.62rem;color:var(--yellow);text-transform:uppercase;
            letter-spacing:0.06em;margin-top:3px;}

  /* Preconditions are not verification. They check the sender and the
     envelope, never the contents, so they get a quiet strip of their own
     rather than a place on the ladder. */
  .pre{display:flex;gap:14px;flex-wrap:wrap;font-size:0.68rem;color:var(--fg4);
       border:1px dashed var(--bg3);padding:8px 11px;}
  .pre b{color:var(--fg3);font-weight:normal;}

  .block{margin-bottom:24px;}
  .block h2{font-size:0.72rem;color:var(--fg2);margin:0 0 8px;text-transform:uppercase;
            letter-spacing:0.07em;padding-bottom:4px;border-bottom:1px solid var(--bg2);}
  .note{font-size:0.71rem;color:var(--fg4);font-style:italic;line-height:1.5;margin:-2px 0 12px;}

  /* ── The belt ─────────────────────────────────────────────────────────
     Always drawn, in every state. A belt that omits the checkpoints it
     cannot report on looks shorter and safer than it is. ── */
  .belt{position:relative;padding:26px 0 8px;overflow-x:auto;}
  .belt-line{position:absolute;top:44px;left:14px;right:14px;height:2px;background:var(--bg2);}
  .belt-token{position:absolute;top:39px;width:12px;height:12px;border-radius:50%;
              background:var(--fg2);border:2px solid var(--bg0-hard);z-index:3;}
  .cps{display:flex;justify-content:space-between;position:relative;z-index:2;min-width:520px;gap:6px;}
  .cp{flex:1;text-align:center;}
  .cp-ring{width:30px;height:30px;margin:0 auto;border-radius:50%;
           display:flex;align-items:center;justify-content:center;
           background:var(--bg0-hard);font-size:0.8rem;}
  /* control can refuse: solid ring. metric only records: dashed, open. */
  .cp.control  .cp-ring{border:2px solid var(--bg3);}
  .cp.metric   .cp-ring{border:2px dashed var(--bg3);}
  .cp.fired-clean .cp-ring{border-color:var(--green);color:var(--green);}
  .cp.fired-bad   .cp-ring{border-color:var(--red,#fb4934);color:var(--red,#fb4934);}
  .cp.unreported  .cp-ring{opacity:0.4;}
  /* What the ledger recorded for THIS artifact. `undetermined` is the majority
     reading of the grounding rung and gets a real third visual — folding it
     into either neighbour is how an absent check becomes a passing one. */
  .cp.d-approved .cp-ring{border-color:var(--green);color:var(--green);}
  .cp.d-refused  .cp-ring{border-color:var(--red,#fb4934);color:var(--red,#fb4934);}
  .cp.d-undetermined .cp-ring{border-color:var(--purple,#d3869b);
                              color:var(--purple,#d3869b);}
  .cp.d-unknown  .cp-ring{border-color:var(--purple,#d3869b);border-style:dashed;
                          color:var(--purple,#d3869b);}
  /* No ledger row. Three of the four reasons are design and read as calm; only
     `retained_but_absent` is a finding. */
  .cp.a-design  .cp-ring{opacity:0.32;}
  .cp.a-design  .cp-out {opacity:0.6;}
  .cp.a-finding .cp-ring{border-color:var(--purple,#d3869b);color:var(--purple,#d3869b);
                         border-style:dashed;}
  .cp.a-unknown .cp-ring{border-color:var(--purple,#d3869b);border-style:dashed;}
  /* The independent axis, on its own line so it cannot read as the decision. */
  .cp-recomp{font-size:0.56rem;color:var(--yellow);margin-top:1px;}

  /* Substrate — an agent-level state, deliberately not styled like a belt
     outcome. `retrofit` is not a fault and not a pass: it is outside. */
  .sub{border:1px dashed var(--bg3);padding:10px 13px;margin-bottom:18px;}
  .sub h3{font-size:0.78rem;margin:0 0 4px;}
  .sub.retrofit{border-color:var(--purple,#d3869b);}
  .sub.retrofit h3{color:var(--purple,#d3869b);}
  .sub.prune{opacity:0.6;}
  .sub.prune h3{color:var(--fg4);}
  .sub.legible{border-style:solid;border-color:var(--green);}
  .sub.legible h3{color:var(--green);}
  .cp-name{font-size:0.66rem;color:var(--fg3);margin-top:5px;}
  .cp.unreported .cp-name{color:var(--fg4);}
  .cp-enf{font-size:0.57rem;text-transform:uppercase;letter-spacing:0.05em;margin-top:1px;}
  .cp.control .cp-enf{color:var(--fg4);}
  .cp.metric  .cp-enf{color:var(--yellow);}
  .cp-out{font-size:0.58rem;color:var(--fg4);margin-top:1px;}

  .belt-why{margin-top:12px;}
  .why{font-size:0.71rem;color:var(--fg4);line-height:1.5;padding:5px 0 5px 9px;
       border-left:1px solid var(--bg3);margin-bottom:5px;}
  .why b{color:var(--fg3);}
  .why.metric{border-left-color:var(--yellow);}
  .passed-through{border-left:3px solid var(--red,#fb4934);background:rgba(251,73,52,0.07);
                  padding:9px 12px;font-size:0.75rem;color:var(--fg3);line-height:1.5;margin-top:10px;}
  .passed-through b{color:var(--red,#fb4934);}

  /* ── Fields ── */
  .fgroup{margin-bottom:12px;}
  .fgroup-h{font-size:0.68rem;color:var(--fg4);margin-bottom:4px;}
  .field{display:flex;gap:9px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--bg2);}
  .pips{width:26px;flex-shrink:0;letter-spacing:1px;font-size:0.7rem;}
  .s2{color:var(--green);} .s1{color:var(--yellow);} .s0{color:var(--red,#fb4934);}
  .fbody{flex:1;min-width:0;}
  .fname{font-size:0.74rem;color:var(--fg2);}
  .fval{font-size:0.72rem;color:var(--fg3);margin-top:2px;word-break:break-word;
        max-height:3.2em;overflow:hidden;}
  .fval.null{color:var(--fg4);font-style:italic;}
  .fgrade{font-size:0.64rem;color:var(--fg4);margin-top:2px;}
  .settle{font-size:0.65rem;margin-top:3px;}
  .settle.tool{color:var(--aqua);}
  .settle.human{color:var(--purple,#d3869b);}

  .floor{border:1px solid var(--bg2);background:var(--bg1);padding:9px 12px;font-size:0.75rem;
         color:var(--fg3);line-height:1.5;}
  .floor b{color:var(--yellow);}

  /* ── Owner affordances: three registers, not three labels ── */
  .task{border-left:3px solid var(--aqua);background:rgba(69,133,136,0.08);padding:10px 13px;}
  .task h3{font-size:0.78rem;color:var(--aqua);margin:0 0 4px;}
  .backlog{border-left:3px solid var(--bg3);background:var(--bg1);padding:10px 13px;}
  .backlog h3{font-size:0.78rem;color:var(--fg4);margin:0 0 4px;}
  .transient{padding:8px 0;font-size:0.72rem;color:var(--fg4);font-style:italic;}
  .owner-body{font-size:0.74rem;color:var(--fg3);line-height:1.55;}
  .owner-next{font-size:0.73rem;margin-top:7px;}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
  .chip{font-size:0.64rem;padding:1px 6px;border:1px solid var(--bg3);color:var(--fg4);}
  .chip.have{border-color:var(--green);color:var(--green);}
  .chip.miss{border-style:dashed;}

  .caveat{border:1px solid var(--bg2);background:var(--bg1);padding:8px 11px;margin-bottom:7px;
          font-size:0.72rem;color:var(--fg3);line-height:1.5;}
  .caveat .ck{color:var(--green);}
  .caveat .dns{color:var(--fg3);margin-top:4px;}
  .caveat .dns b{color:var(--yellow);}
  .empty{padding:16px 8px;font-size:0.76rem;color:var(--fg4);}
  .absent{color:var(--fg4);font-style:italic;}
  </style>
</head>
<body>
  <div id="nav-root"></div>
  <div class="wrap"><div id="content"><div class="empty">Loading…</div></div></div>

  <script src="/static/js/widgets/nav.js"></script>
  <script src="/static/js/theme.js"></script>
  <script>
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const EID = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
  const READINGS = ["idle","fault","unknown"];
  const reading = r => READINGS.includes(r) ? r : "unknown";

  // strength, not grade. `tool_no_match` sorts above `unavailable_no_tool_source`
  // and both are strength 0 — different words for the same amount of reliance.
  const pips = s => {
    const n = Math.max(0, Math.min(2, s ?? 0));
    return `<span class="pips s${n}">${"▰".repeat(n)}${"▱".repeat(2-n)}</span>`;
  };
  const STRENGTH_WORD = {
    2: "reproducible — a tool, a transform or a citation can produce it again",
    1: "a judgement. Legitimate, and not a retrieval",
    0: "nothing to rely on yet",
  };

  // The four reasons a rung has no ledger row. Exactly one is a finding; the
  // other three are design, and rendering them alike is what made `credit`
  // look like a permanent unpaid debt on every belt.
  //
  // An unrecognised token renders as `unknown`, never as healthy. A new token
  // falling through to a benign default is the specific way this surface has
  // lied before.
  const ABSENT = {
    fires_before_artifact: { cls: "a-design",  out: "before the artifact" },
    retention_counted:     { cls: "a-design",  out: "not retained" },
    predates_retention:    { cls: "a-design",  out: "predates the ledger" },
    retained_but_absent:   { cls: "a-finding", out: "no row" },
  };
  const absentOf = t => ABSENT[t] || { cls: "a-unknown", out: "unrecognised" };

  const DECIDED = {
    approved:     { cls: "d-approved",     glyph: "✓" },
    refused:      { cls: "d-refused",      glyph: "✕" },
    undetermined: { cls: "d-undetermined", glyph: "?" },
  };
  // `undetermined` is the majority reading of the grounding rung and is not an
  // edge case: the gate ran and could not decide. It gets its own visual.
  const decidedOf = v => DECIDED[v] || { cls: "d-unknown", glyph: "?" };

  // Which belt rungs are ladder rungs, and which are preconditions.
  //
  // `gate_trust::GATES` is a runtime inventory, not the model. It mixes two
  // ladder rungs with billing, flow control and envelope checks, and drawing
  // all of them as peers is what made this screen unreadable: `credit` answers
  // no verification question at all.
  const LADDER_GATE = { grounding: 4, input_binding: 5 };
  const PRECONDITION = {
    credit:        "can the caller pay",
    rate_limit:    "is the caller inside the window",
    attachment:    "is a payload attached, and of the right kind",
    output_schema: "does the output match its declared shape",
  };

  // The five rungs, from the verification ladder. `passes_while` is the failure
  // this rung cannot see - the same idea as `does_not_show`, but attached to the
  // rung where it was defined rather than reinvented per screen.
  const LADDER = [
    { n: 1, q: "Does the declared object exist?",
      pw: "it exists and is permanently empty", scope: "platform" },
    { n: 2, q: "Does the writer ever run?",
      pw: "rows accumulate and disagree with their source", scope: "platform" },
    { n: 3, q: "Does the stored value equal its source of truth?",
      pw: "the field is well-typed and invented", scope: "platform" },
    { n: 4, q: "Could this value have come from any tool the agent has?",
      pw: "the request never matched the interface", scope: "artifact" },
    { n: 5, q: "Does the invocation match the declared interface?",
      pw: null, scope: "artifact" },
  ];
  const RUNG_NAME = { 1: "Presence", 2: "Liveness", 3: "Truth",
                      4: "Grounding", 5: "Binding" };

  // What the screen is actually for: a gate is what stops a bad artifact from
  // becoming training data. Loop 1 is episodes -> consolidated -> rules, and
  // `response_text` is persisted un-stripped, so a rung that inspects the
  // contents but cannot refuse does not protect the loop from anything.
  function readArtifact(d) {
    const belt = d.belt || [];
    const by = {};
    belt.forEach(b => { by[b.rung] = b; });

    const refused = belt.filter(b => b.decided && b.decided.decision === "refused");
    const approved = belt.filter(b => b.decided && b.decided.decision === "approved");
    const held = (d.routed || []).filter(r =>
      String(r.verdict || "").startsWith("pending_"));

    const g = by.grounding;
    const rc = g && g.recomputed;
    const graded = rc ? (rc.fields || 0) : 0;
    const violations = rc ? (rc.violations || 0) : 0;

    // The ceiling: the deepest rung that both looked at the contents AND could
    // have acted on what it found. `enforcement === "control"` is the only
    // thing that can refuse; a metric records and the artifact travels on.
    const couldRefuse = belt.filter(b => b.enforcement === "control");
    const inspectedContents = g ? !!rc : false;
    const contentsGuarded = !!(g && g.enforcement === "control");

    return { by, refused, approved, held, graded, violations,
             couldRefuse, inspectedContents, contentsGuarded, grounding: g };
  }

  function verdict(d) {
    const a = readArtifact(d);

    // Answer the question first, in one sentence.
    let line, tone;
    if (a.refused.length) {
      line = "This artifact was refused."; tone = "dirty";
    } else if (a.violations > 0 && !a.contentsGuarded) {
      line = "Nothing stopped this artifact, and it carries unsourced claims.";
      tone = "dirty";
    } else if (a.graded > 0 && a.violations === 0) {
      line = "Nothing stopped this artifact, and every claim under contract was sourced.";
      tone = "clean";
    } else {
      line = "Nothing stopped this artifact, and nothing examined what it says.";
      tone = "unknown";
    }

    const nums = [
      ["", a.approved.length, "passed"],
      [a.held.length ? "warm" : "", a.held.length, "held for review"],
      [a.refused.length ? "hot" : "", a.refused.length, "refused"],
      [a.violations ? "hot" : "", a.violations, "unsourced claims"],
      ["", a.graded, "claims graded"],
    ].map(([cls, v, label]) =>
      `<div class="vnum ${cls}"><b>${v}</b><span>${label}</span></div>`).join("");

    // The ceiling is the honest limit on any claim about this artifact.
    const ceiling = a.contentsGuarded
      ? `<b>Contents were inspected by a checkpoint that could refuse.</b>`
      : a.inspectedContents
        ? `Deepest checkpoint that could have refused: <b>the envelope only</b>.
           <code>grounding</code> read the contents and graded ${a.graded} claim(s), but on this
           route it only records — so nothing it found could have stopped the response.`
        : `Deepest checkpoint that could have refused: <b>the envelope only</b>.
           Nothing opened the payload, so no verdict here concerns what it says.`;

    // The point of the gate, stated: was this fit to learn from?
    const feed = a.violations > 0 && !a.contentsGuarded
      ? `<div class="vfeed bad">⚠ This artifact entered <b>Loop 1</b> as training data with
         ${a.violations} unsourced claim(s) still in it. The platform computed a cleaned
         copy and discarded it; <code>response_text</code> is persisted un-stripped, and
         consolidation reads it. <b>This is how a loop gets corrupted.</b></div>`
      : a.graded > 0
        ? `<div class="vfeed ok">Fit to learn from, for the ${a.graded} field(s) under
           contract. Everything else in the document is unexamined.</div>`
        : `<div class="vfeed ok">It entered <b>Loop 1</b> unexamined — not refused, and not
           checked. Whether that is safe is not something this platform currently knows.</div>`;

    return `<div class="verdict ${tone}">
      <div class="vline">${line}</div>
      <div class="vnums">${nums}</div>
      <div class="vceil">${ceiling}</div>
      ${feed}
    </div>`;
  }

  function payload(d) {
    const m = d.model || {};
    const ty = (d.output_contract_type || d.payload_type
                || (d.hashes && d.hashes.output_grounded ? "structured document (JSON)" : null));
    return `<div class="payload">
      <div class="payload-t">The payload</div>
      <div class="payload-ty">${esc(ty || "type not declared — treated as opaque text")}</div>
      ${d.input && d.input.query
        ? `<div class="payload-q">${esc(String(d.input.query).slice(0, 300))}</div>` : ""}
    </div>`;
  }

  function ladder(d) {
    const a = readArtifact(d);
    const typed = (d.substrate || {}).disposition === "legible";

    let ceilingShown = false;
    const rows = LADDER.map(r => {
      let verdictCell, note = "", isCeiling = false;

      if (r.scope === "platform") {
        // Standing clock: presence, liveness and truth are not artifact-scoped.
        // Shown rather than hidden - a ladder missing its cheap rungs looks
        // shorter and safer than it is - and pointed at where they are answered.
        verdictCell = `<span class="v-elsewhere">standing clock</span>`;
        note = `Answered platform-wide, not for this artifact. <a href="/loops">See Ok / Silent / Inert →</a>`;
      } else {
        const gateId = Object.keys(LADDER_GATE).find(k => LADDER_GATE[k] === r.n);
        const b = a.by[gateId];
        if (!b) {
          verdictCell = `<span class="v-inert">not on this route</span>`;
          note = `<code>${esc(gateId)}</code> is not declared on the route this artifact travelled.`;
        } else if (b.enforcement !== "control") {
          verdictCell = `<span class="v-silent">records only</span>`;
          isCeiling = !ceilingShown;
          note = `<b>Cannot refuse on this route.</b> ${esc(b.why_not_control || "")}`;
        } else if (b.decided) {
          verdictCell = `<span class="v-ok">${esc(b.decided.decision)}</span>`;
        } else {
          verdictCell = `<span class="v-inert">no verdict</span>`;
          note = esc((b.decided_absent || {}).because || "");
        }
        if (r.n === 4 && b && b.recomputed) {
          note += ` <br/>Graded <b>${b.recomputed.fields}</b> claim(s), <b>${b.recomputed.violations}</b> unsourced.`;
        }
      }
      if (isCeiling) ceilingShown = true;

      return `<div class="rung ${isCeiling ? "is-ceiling" : ""}">
        <div class="rung-n">${r.n}</div>
        <div class="rung-b">
          <div class="rung-q"><b style="color:var(--fg3);font-weight:normal">${RUNG_NAME[r.n]}</b>
            — ${esc(r.q)}</div>
          ${note ? `<div class="rung-pw">${note}</div>` : ""}
          ${r.pw ? `<div class="rung-pw">Passes while: <b>${esc(r.pw)}</b></div>` : ""}
          ${isCeiling ? `<div class="ceilmark">← ceiling · nothing above this was enforced on this artifact</div>` : ""}
        </div>
        <div class="rung-v">${verdictCell}</div>
      </div>`;
    }).join("");

    const pre = (d.belt || []).filter(b => PRECONDITION[b.rung]).map(b =>
      `<span><b>${esc(b.rung)}</b> — ${esc(PRECONDITION[b.rung])}</span>`).join("");

    const route = d.belt_route && d.belt_route.recoverable === false
      ? `<div class="rung-pw" style="margin-top:8px;color:var(--yellow)">
           Route unverified: <code>episodes</code> records no route discriminator, so the wider
           of the two declared belts is shown. This may list checkpoints the artifact never passed.</div>`
      : "";

    return `<div class="block">
      <h2>The verification ladder</h2>
      <div class="note">Five questions, ordered by difficulty. A check answering an easier
        one will pass while a harder one fails, and each rung is invisible to the one below —
        so the ceiling, not the count, is what the platform actually knows.</div>
      ${rows}
      ${route}
      ${typed ? "" : `<div class="rung-pw" style="margin-top:8px">This agent is not fully
        typed, so rungs 4 and 5 have less to check against than they would otherwise.</div>`}
      <h2 style="margin-top:20px">Preconditions — not verification</h2>
      <div class="note">These check the caller and the envelope. None of them ever opens the
        payload, so none can say anything about what it claims.</div>
      <div class="pre">${pre || "<span>None declared on this route.</span>"}</div>
    </div>`;
  }

  function fields(d) {
    const fs = d.fields || [];
    if (!fs.length) return "";
    const groups = [2, 1, 0].map(s => {
      const g = fs.filter(f => (f.strength ?? 0) === s);
      if (!g.length) return "";
      return `<div class="fgroup">
        <div class="fgroup-h">${pips(s)} &nbsp;${g.length} field(s) — ${esc(STRENGTH_WORD[s])}</div>
        ${g.map(f => {
          const isNull = f.value === null || f.value === undefined;
          const settle = (f.strength ?? 0) < 2
            ? (f.settleable_by
                ? `<div class="settle tool">A tool could settle this: <b>${esc(f.settleable_by)}</b></div>`
                : `<div class="settle human">No data source could settle this — it needs a person,
                   and the gap is itself a request for the integration that would close it.</div>`)
            : "";
          return `<div class="field">
            ${pips(f.strength)}
            <div class="fbody">
              <div class="fname">${esc(f.name)}</div>
              <div class="fval ${isNull ? "null" : ""}">${isNull ? "null" : esc(String(f.value))}</div>
              <div class="fgrade">${esc(f.grade)}</div>
              ${settle}
            </div>
          </div>`;
        }).join("")}
      </div>`;
    }).join("");

    return `<div class="block">
      <h2>What it claimed</h2>
      <div class="note">
        The value is what the agent actually said, never stripped — it is the only
        evidence that could answer which model fabricates what. Read the pips
        (reliance), not the grade name: two different grades can mean the same
        amount of nothing.
      </div>
      ${groups}
      <div class="floor">
        <b>Weakest link:</b> ${esc(d.floor || "—")} ${pips(d.floor_strength)}.
        A conclusion is only as good as the weakest thing it rests on, so this
        document as a whole relies on no more than that.
      </div>
    </div>`;
  }

  // Branch on this before drawing anything. `substrate` is about the AGENT —
  // is it declared onto the platform at all — and the belt is about this
  // artifact. Mixing them put an agent-level backlog inside a per-artifact
  // diagram and made a legacy agent look like a degraded belt. It is not one:
  // it is outside the substrate, with a named owner and a worklist.
  function substrateBlock(d) {
    const s = d.substrate;
    if (!s) return "";
    const disp = s.disposition;
    if (disp === "prune") {
      return `<div class="sub prune"><h3>Test fixture — scheduled for deletion</h3>
        <div class="owner-body">${esc(s.because || "")}
        Nothing below is a finding about the platform and this agent is not a
        retrofit target. It is counted here only because you opened it directly.</div>
      </div>`;
    }
    if (disp === "retrofit") {
      return `<div class="sub retrofit"><h3>Not yet on the substrate</h3>
        <div class="owner-body">${esc(s.because || "")}
        This is a real agent that predates the contracts. Its grounding rung reads
        <b>undetermined</b> for that reason and no other. <b>Not a platform fault, and
        not a pass</b> — authoring work, owned by the agent's author.
        <a href="/declarations">The worklist →</a></div>
      </div>`;
    }
    if (disp === "legible") {
      return `<div class="sub legible"><h3>On the substrate</h3>
        <div class="owner-body">${esc(s.because
          || "Every rung on the declaration ladder is present, so the belt can say \
something specific about each checkpoint.")}</div></div>`;
    }
    // Unrecognised disposition is indeterminate, never healthy.
    return `<div class="sub"><h3 style="color:var(--purple,#d3869b)">Substrate state unrecognised</h3>
      <div class="owner-body">The trace reports <b>${esc(String(disp))}</b>, which this
      screen does not know how to read. Treated as indeterminate rather than assumed
      healthy.</div></div>`;
  }

  // Three values, three registers. Getting this wrong does not produce a wrong
  // number — it produces a wrong backlog.
  function ownerBlock(d) {
    // `legibility` and `declared` moved inside `substrate`; reading them loose
    // is what let a fixture land on somebody's worklist.
    const lg = (d.substrate || {}).legibility || {}, si = d.silence || {};
    const chips = (arr, cls) => (arr || []).map(x =>
      `<span class="chip ${cls}">${esc(x)}</span>`).join("");

    const declared = `<div class="chips">${chips(lg.present, "have")}${chips(lg.missing, "miss")}</div>`;

    if (d.owner === "agent_author") {
      return `<div class="block"><h2>Why the belt is quiet</h2>
        <div class="task">
          <h3>This is the agent author's to declare</h3>
          <div class="owner-body">
            ${esc(d.detail || "")}
            Nothing here failed. No rung could produce a verdict because the agent
            has not declared what its output should look like, so there was nothing
            to check against.
          </div>
          ${declared}
          ${si.rung ? `<div class="owner-next">Cheapest next step:
            <b>declare ${esc(si.rung)}</b> — the ladder is ordered by what it costs
            an author, so this is the least expensive useful move.
            <a href="/declarations">See the full worklist →</a></div>` : ""}
        </div></div>`;
    }
    if (d.owner === "platform") {
      return `<div class="block"><h2>Whose job this is</h2>
        <div class="backlog"><h3>Platform backlog — not yours</h3>
          <div class="owner-body">${esc(d.detail || "")}</div>
          ${declared}
        </div></div>`;
    }
    return `<div class="block"><h2>Whose job this is</h2>
      <div class="transient">Nobody's. ${esc(d.detail || "Nothing to do here.")}</div></div>`;
  }

  function routed(d) {
    const r = d.routed || [];
    if (!r.length) return "";
    return `<div class="block"><h2>Routed for verification</h2>
      <div class="note">Unverified is a work item, not a discard.</div>
      ${r.map(x => `<div class="caveat">
        <div><b>${esc(x.verdict)}</b> · ${esc(x.actor_kind)} · ${esc(x.actor || "")}</div>
        ${x.evidence ? `<div class="dns">${esc(JSON.stringify(x.evidence).slice(0,240))}</div>` : ""}
      </div>`).join("")}</div>`;
  }

  // The join between the two axes. An artifact is a packet (it crosses gates)
  // and a data point (it feeds loops) - the same object in two roles - and
  // neither screen used to say so.
  //
  // Only Loop 1 is asserted, because every persisted episode is Loop 1's first
  // stage. The others are claimed only when this artifact actually produced the
  // thing they consume: not every agent is ever calibrated against an external
  // outcome, and saying a loop does not apply is different from saying it is
  // broken.
  function feeds(d) {
    const a = readArtifact(d);
    const items = [];

    items.push(["Loop 1 · Individual learning", "hours",
      `This episode is Loop 1's first stage. Consolidation reads it and may turn it into a
       semantic rule the agent retrieves later.`,
      a.violations > 0 && !a.contentsGuarded ? "bad" : "ok"]);

    if (a.held.length) {
      items.push(["Verification queue", "days",
        `${a.held.length} claim(s) from this artifact are awaiting a verdict. Until one is
         recorded, “nobody checked” and “checked and fine” are the same state.`, "warm"]);
    }
    if ((d.fields || []).some(f => (f.strength ?? 0) === 2)) {
      items.push(["Loop 5 · Calibration", "months+",
        `Reproducible values here can be scored against an outcome that resolves independently
         of what this agent said — a hard-verified signal, which needs no coherence gate.`, "ok"]);
    }

    const loops = `${items.map(([name, ts, body, tone]) => `<div class="rung">
        <div class="rung-b">
          <div class="rung-q">${esc(name)}</div>
          <div class="rung-pw">${body}</div>
        </div>
        <div class="rung-v"><span class="${
          tone === "bad" ? "v-silent" : tone === "warm" ? "v-inert" : "v-elsewhere"}">${esc(ts)}</span></div>
      </div>`).join("")}
      <div class="rung-pw" style="margin-top:8px">Loops not listed do not apply to this
        artifact. <a href="/loops">All loops, by timescale →</a></div>`;

    // The other downstream, and the one the platform cannot currently answer:
    // which agent picked this up. An artifact that no one consumes fed nothing,
    // and an artifact consumed by a teammate is the whole point of a
    // composition - so silence here is the most expensive silence on the page.
    const up = d.parent_episode_id
      ? `<div class="rung"><div class="rung-b">
           <div class="rung-q">Delegated by another agent</div>
           <div class="rung-pw">This run was called as a sub-task.
             <a href="/trace/${esc(d.parent_episode_id)}">Trace the caller →</a></div>
         </div><div class="rung-v"><span class="v-ok">upstream</span></div></div>`
      : `<div class="rung"><div class="rung-b">
           <div class="rung-q">Delegated by another agent</div>
           <div class="rung-pw">No. This run was called directly, not as a sub-task of
             another agent.</div>
         </div><div class="rung-v"><span class="v-elsewhere">not delegated</span></div></div>`;

    const down = `<div class="rung"><div class="rung-b">
        <div class="rung-q">Picked up by another agent</div>
        <div class="rung-pw"><b>Not recorded — and this is a gap, not a no.</b>
          Agents collaborate through workspace messages and workspace outputs, and
          <b>neither carries an <code>episode_id</code></b>. So when this artifact was posted
          into a workspace and a teammate read it, nothing linked the read back to this run.
          The only traceable agent-to-agent edge is delegation, which covers
          <b>12 of 3,581</b> episodes.</div>
      </div><div class="rung-v"><span class="v-silent">unrecorded</span></div></div>`;

    return `<div class="block"><h2>What this artifact fed — the loops</h2>
      <div class="note">A gate decides whether an artifact is fit to enter a loop. This is
        where this one went.</div>
      ${loops}
      <h2 style="margin-top:20px">What this artifact fed — the collaboration</h2>
      <div class="note">The other half of the question: an artifact is a packet, and a packet
        has a next hop. This is the axis the platform cannot yet answer.</div>
      ${up}
      ${down}
    </div>`;
  }

  function caveats(d) {
    const c = d.caveats || [];
    if (!c.length) return "";
    return `<div class="block"><h2>What this does and does not establish</h2>
      ${c.map(x => `<div class="caveat">
        <div class="ck">✓ ${esc(x.checked)}</div>
        <div class="dns"><b>Does not show:</b> ${esc(x.does_not_show)}</div>
      </div>`).join("")}</div>`;
  }

  function render(d) {
    const rd = reading(d.reading);
    const m = d.model || {};
    const head = `<div class="head">
      <h1>Artifact trace</h1>
      <div class="sub">One episode, and the checkpoints it passed</div>
      <div class="meta">
        <span><a href="/specimen/${encodeURIComponent(d.agent.name)}">${esc(d.agent.name)}</a></span>
        <span>${esc(m.model_used || "model not recorded")}</span>
        <span>v${m.persona_version_at_write ?? 1}</span>
        <span>${esc((d.at || "").slice(0,19).replace("T"," "))}</span>
        <span class="badge r-${rd}">${esc((d.token || "").replace(/_/g," "))}</span>
        ${d.corpus_eligible ? "" : `<span class="absent">not corpus-eligible</span>`}
      </div>
      ${d.input && d.input.query ? `<div class="meta"><span class="absent">
        “${esc(String(d.input.query).slice(0,150))}”</span></div>` : ""}
    </div>`;

    // Deliberately not a "correction chain": `parent_episode_id` is stamped by
    // the delegation tools onto a child, so it names the agent that CALLED this
    // one. Labelling it as a correction was wrong and is now handled in feeds().
    const chain = "";

    // Answer, then reasoning, then work. The epistemics used to come first and
    // that is why the page could not be read.
    document.getElementById("content").innerHTML =
      head + payload(d) + verdict(d) + ladder(d) + fields(d) + routed(d)
      + feeds(d) + ownerBlock(d) + substrateBlock(d) + chain + caveats(d);
  }

  async function boot() {
    if (window.Nav) Nav.init({ current: "bestiary" });
    try {
      // The `/api/gates` retention heuristic that used to live here is gone:
      // the trace now serves `decided_absent.token` and there is no reason to
      // derive on the client what the platform declares.
      const res = await fetch(`/api/episodes/${encodeURIComponent(EID)}/trace`);
      if (res.status === 401) {
        document.getElementById("content").innerHTML =
          `<div class="empty">Sign in to read a trace.
           <a href="/auth/google">Google</a> · <a href="/auth/github">GitHub</a></div>`;
        return;
      }
      if (res.status === 404) {
        document.getElementById("content").innerHTML =
          `<div class="empty">No episode <b>${esc(EID)}</b>.</div>`;
        return;
      }
      if (!res.ok) throw new Error("HTTP " + res.status);
      render(await res.json());
    } catch (e) {
      document.getElementById("content").innerHTML =
        `<div class="empty">Could not read the trace: ${esc(e.message)}.
         No belt is shown rather than an empty one — an artifact that passed no
         checkpoint and one we cannot read are different claims.</div>`;
    }
  }
  boot();
  </script>
</body>
</html>
