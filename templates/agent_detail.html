<!doctype html>
<html lang="en" class="theme-hasui">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Specimen Details - Agent Bestiary</title>
    <link rel="stylesheet" href="/static/css/variables.css" />
    <link rel="stylesheet" href="/static/css/common.css" />
    <link rel="stylesheet" href="/static/css/components.css" />
    <style>
      body {
        padding: 20px;
        line-height: 1.5;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .specimen-header {
        display: flex;
        gap: 24px;
        margin-bottom: 24px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--bg2);
        align-items: flex-start;
      }

      .hire-button {
        margin-left: auto;
        padding: 10px 20px;
        background: var(--yellow);
        color: var(--bg0-hard);
        border: none;
        border-radius: 4px;
        font-size: 0.9em;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
      }

      .hire-button:hover {
        background: var(--orange);
        transform: translateY(-1px);
      }

      .hire-button:active {
        transform: translateY(0);
      }

      .specimen-avatar-large {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: var(--bg2);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 2px solid var(--bg3);
        flex-shrink: 0;
      }

      .specimen-avatar-large img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: sepia(10%) saturate(90%);
      }

      .specimen-avatar-large.loading {
        animation: pulse 2s ease-in-out infinite;
      }

      .specimen-avatar-large .placeholder {
        font-size: 4em;
        filter: grayscale(100%);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .specimen-header-info {
        flex: 1;
      }

      .specimen-title {
        font-size: 1.6em;
        font-weight: 400;
        color: var(--fg0);
        margin-bottom: 8px;
        text-transform: capitalize;
        letter-spacing: -0.01em;
      }

      .specimen-description {
        color: var(--fg3);
        font-size: 0.9em;
        margin-bottom: 12px;
        line-height: 1.5;
      }

      .badges {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .badge {
        padding: 3px 10px;
        background: transparent;
        color: var(--yellow);
        border-radius: 3px;
        font-size: 0.75em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 500;
      }

      .sections {
        display: grid;
        gap: 16px;
      }

      .section {
        background: var(--bg1);
        padding: 16px 20px;
        border-radius: 4px;
        border: 1px solid var(--bg2);
      }

      .section-title {
        font-size: 0.95em;
        font-weight: 400;
        color: var(--fg0);
        margin-bottom: 14px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 12px;
      }

      .field-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .field-label {
        color: var(--gray);
        font-size: 0.7em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 500;
      }

      .field-value {
        color: var(--fg1);
        font-size: 0.9em;
        word-break: break-word;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 16px;
      }

      .stat-card {
        text-align: center;
        padding: 12px;
        background: var(--bg0);
        border-radius: 4px;
        border: 1px solid var(--bg2);
      }

      .stat-value {
        font-size: 1.6em;
        font-weight: 400;
        color: var(--yellow);
        line-height: 1;
      }

      .stat-label {
        color: var(--gray);
        margin-top: 6px;
        font-size: 0.7em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 400;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tag {
        background: var(--bg2);
        color: var(--aqua);
        padding: 6px 12px;
        border: 1px solid var(--bg3);
        border-radius: 4px;
        font-size: 0.85em;
        font-weight: 500;
      }

      .valence-section {
        margin-top: 8px;
      }
      .valence-label {
        font-size: 0.7rem;
        color: var(--fg3);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 6px;
        margin-top: 12px;
      }
      .valence-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .valence-pill {
        display: inline-block;
        padding: 3px 10px;
        font-size: 0.78em;
        border-radius: 3px;
        font-weight: 500;
      }
      .valence-in {
        background: rgba(69, 133, 136, 0.15);
        color: var(--aqua);
        border: 1px solid rgba(69, 133, 136, 0.4);
      }
      .valence-out {
        background: rgba(152, 151, 26, 0.15);
        color: var(--green);
        border: 1px solid rgba(152, 151, 26, 0.4);
      }
      .workflow-diagram {
        margin-top: 16px;
        padding: 16px;
        background: var(--bg1);
        border: 1px solid var(--bg3);
        border-radius: 6px;
      }
      .workflow-diagram .mermaid svg {
        max-width: 100%;
      }

      .notice-box {
        background: var(--bg0);
        border-left: 3px solid var(--orange);
        padding: 16px;
        margin-top: 12px;
        color: var(--fg2);
        font-size: 0.9em;
        border-radius: 0 4px 4px 0;
      }

      .notice-box strong {
        color: var(--orange);
        display: block;
        margin-bottom: 8px;
      }

      .credential-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        background: var(--bg2);
        border: 1px solid var(--bg3);
        border-radius: 4px;
        margin-top: 8px;
        font-size: 0.9em;
      }

      .credential-key {
        font-family: "SF Mono", "Monaco", "Courier New", monospace;
        color: var(--fg1);
        font-size: 0.9em;
      }

      .status-ok {
        color: var(--green);
        font-weight: 600;
      }

      .status-missing {
        color: var(--red);
        font-weight: 600;
      }

      .view-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        background: transparent;
        color: var(--yellow);
        text-decoration: none;
        border: 1px solid var(--bg3);
        border-radius: 3px;
        font-size: 0.8em;
        font-weight: 400;
        transition: all 0.2s ease;
        margin-top: 10px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .view-link:hover {
        background: var(--bg2);
        border-color: var(--yellow);
      }

      .loading-spinner {
        text-align: center;
        color: var(--fg3);
        font-size: 1.2em;
        padding: 40px;
      }

      .error-message {
        background: var(--bg1);
        border: 1px solid var(--red);
        color: var(--red);
        padding: 30px;
        border-radius: 6px;
        text-align: center;
      }

      .empty-state {
        color: var(--gray);
        font-size: 0.9em;
        font-style: italic;
      }

      /* ─── Dual Cognition Canvas ─── */
      .cognition-panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 20px;
      }

      .cognition-card {
        background: var(--bg1);
        border: 1px solid var(--bg2);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
      }

      .cognition-label {
        position: absolute;
        top: 8px;
        left: 12px;
        font-size: 0.65em;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--fg3);
        z-index: 2;
        background: var(--bg1);
        padding: 2px 6px;
        border-radius: 2px;
      }

      .cognition-stat {
        position: absolute;
        bottom: 8px;
        right: 12px;
        font-size: 0.7em;
        color: var(--fg3);
        z-index: 2;
        font-variant-numeric: tabular-nums;
      }

      .cognition-canvas {
        width: 100%;
        height: 180px;
        display: block;
      }

      @media (max-width: 640px) {
        .cognition-panel {
          grid-template-columns: 1fr;
        }
      }

      /* ─── Dreaming Section ─── */
      .dream-bar {
        height: 6px;
        background: var(--bg2);
        border-radius: 3px;
        overflow: hidden;
        margin-top: 8px;
      }

      .dream-bar-fill {
        height: 100%;
        background: var(--purple);
        border-radius: 3px;
        transition: width 0.5s ease;
      }

      /* OP-1 Theme — page-specific overrides */
      .theme-op1 .specimen-avatar-large {
        border: 3px solid #1a1a1a;
        background: #5ac8fa;
      }

      .theme-op1 .specimen-avatar-large img {
        display: none;
      }

      .theme-op1 .specimen-avatar-large .placeholder {
        display: none;
      }

      .theme-op1 .specimen-card {
        border-radius: 0;
      }

      .theme-op1 .section {
        border-radius: 0;
      }

      .theme-op1 .stat-card {
        border-radius: 0;
      }

      .theme-op1 .tag {
        border-radius: 0;
        color: var(--blue);
      }

      .detail-header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      /* Owner Actions */
      .owner-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .owner-btn {
        background: transparent;
        border: 1px solid var(--bg3);
        color: var(--fg3);
        padding: 6px 14px;
        font-size: 0.8em;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.2s;
      }
      .owner-btn:hover {
        border-color: var(--yellow);
        color: var(--yellow);
      }
      .owner-btn.danger {
        border-color: var(--red);
        color: var(--red);
      }
      .owner-btn.danger:hover {
        background: var(--red);
        color: var(--bg0);
      }

      /* Execution History */
      .episodes-list {
        margin-top: 12px;
      }
      .episode-row {
        display: grid;
        grid-template-columns: 1fr auto minmax(0, 200px) auto auto;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--bg2);
        font-size: 0.85em;
        align-items: center;
      }
      .episode-query {
        color: var(--fg1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .episode-status {
        padding: 2px 8px;
        font-size: 0.75em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .episode-status.success {
        color: var(--green);
        border: 1px solid var(--green);
      }
      .episode-status.failure {
        color: var(--red);
        border: 1px solid var(--red);
      }
      .episode-status.partial {
        color: var(--yellow);
        border: 1px solid var(--yellow);
      }
      .episode-time {
        color: var(--gray);
        font-size: 0.8em;
      }
      .episode-cost {
        color: var(--fg3);
        font-size: 0.8em;
      }
      .episodes-pagination {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 12px;
      }

      /* Episode Detail Expansion */
      .episode-row.clickable {
        cursor: pointer;
        transition: background 0.15s;
      }
      .episode-row.clickable:hover {
        background: var(--bg1);
      }
      .episode-row.expanded {
        border-bottom: none;
      }
      .episode-detail {
        border-left: 3px solid var(--aqua);
        padding: 16px 16px 16px 20px;
        margin-bottom: 12px;
        background: var(--bg1);
        font-size: 0.85em;
        animation: detailSlide 0.2s ease-out;
      }
      @keyframes detailSlide {
        from {
          opacity: 0;
          max-height: 0;
        }
        to {
          opacity: 1;
          max-height: 2000px;
        }
      }
      .detail-timing {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
        font-size: 0.85em;
        color: var(--gray);
      }
      .timing-bar {
        flex: 1;
        height: 14px;
        display: flex;
        border-radius: 3px;
        overflow: hidden;
        background: var(--bg2);
      }
      .timing-bar .llm-seg {
        background: var(--yellow);
        height: 100%;
      }
      .timing-bar .tool-seg {
        background: var(--aqua);
        height: 100%;
      }
      .detail-section-title {
        color: var(--fg3);
        font-size: 0.75em;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin: 12px 0 8px 0;
      }
      .iteration-timeline {
        border-left: 2px solid var(--yellow);
        margin-left: 8px;
        padding-left: 16px;
      }
      .iteration-step {
        position: relative;
        margin-bottom: 10px;
      }
      .iteration-step::before {
        content: "";
        position: absolute;
        left: -21px;
        top: 6px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--yellow);
      }
      .iteration-step.tool-step::before {
        background: var(--aqua);
      }
      .iteration-step.final-step::before {
        background: var(--green);
      }
      .step-header {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--fg1);
      }
      .step-badge {
        font-size: 0.75em;
        padding: 1px 6px;
        border-radius: 3px;
      }
      .step-badge.llm {
        background: var(--yellow);
        color: var(--bg0);
      }
      .step-badge.tool {
        background: var(--aqua);
        color: var(--bg0);
      }
      .step-badge.duration {
        color: var(--gray);
      }
      .tool-detail-block {
        margin: 6px 0 0 0;
      }
      .tool-detail-block summary {
        color: var(--fg3);
        font-size: 0.85em;
        cursor: pointer;
      }
      .tool-detail-block pre {
        margin: 4px 0;
        padding: 8px;
        background: var(--bg0);
        border-radius: 3px;
        font-size: 0.8em;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--fg2);
        max-height: 200px;
        overflow-y: auto;
      }
      .evidence-card {
        background: var(--bg0);
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 6px;
        border-left: 2px solid var(--blue);
      }
      .evidence-card .ev-source {
        font-size: 0.75em;
        color: var(--gray);
      }
      .evidence-card .ev-summary {
        color: var(--fg1);
        margin: 4px 0;
      }
      .evidence-card .ev-findings {
        font-size: 0.85em;
        color: var(--fg3);
      }

      /* Delete Confirmation Modal */
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 1000;
        justify-content: center;
        align-items: center;
      }
      .modal-overlay.visible {
        display: flex;
      }
      .modal-box {
        background: var(--bg1);
        border: 1px solid var(--red);
        padding: 24px;
        max-width: 400px;
        width: 90%;
      }
      .modal-box h3 {
        color: var(--red);
        margin-bottom: 12px;
        font-size: 1em;
      }
      .modal-box p {
        color: var(--fg2);
        font-size: 0.9em;
        margin-bottom: 16px;
      }
      .modal-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      /* Topup */
      .topup-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
      }
      .topup-row input[type="number"] {
        width: 80px;
        background: var(--bg0);
        border: 1px solid var(--bg3);
        color: var(--fg1);
        padding: 6px 8px;
        font-family: inherit;
      }

      /* Tab navigation */
      .agent-tabs {
        display: flex;
        gap: 0;
        border-bottom: 1px solid var(--bg2);
        margin-bottom: 20px;
        margin-top: 16px;
      }
      .agent-tabs [data-tab] {
        background: transparent;
        border: none;
        border-bottom: 2px solid transparent;
        color: var(--fg3);
        padding: 10px 18px;
        font-size: 0.82em;
        font-family: inherit;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        transition: all 0.2s;
      }
      .agent-tabs [data-tab]:hover {
        color: var(--fg1);
      }
      .agent-tabs [data-tab].active {
        color: var(--yellow);
        border-bottom-color: var(--yellow);
      }
      .theme-op1 .agent-tabs [data-tab].active {
        border-bottom-color: var(--yellow);
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  </head>
  <body>
    <div class="container">
      <script src="/static/js/widgets/nav.js"></script>
      <script>
        Nav.init({ back: { label: "\u2190 Catalogue", href: "/catalogue" } });
      </script>

      <div id="agent-content">
        <div class="loading-spinner">Loading specimen details...</div>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="delete-modal">
      <div class="modal-box">
        <h3>Delete Agent</h3>
        <p>
          This action cannot be undone. The agent and all its episodes, rules,
          and ontology data will be permanently deleted.
        </p>
        <div class="modal-actions">
          <button
            class="owner-btn"
            onclick="
              document
                .getElementById('delete-modal')
                .classList.remove('visible')
            "
          >
            Cancel
          </button>
          <button class="owner-btn danger" onclick="confirmDelete()">
            Delete Permanently
          </button>
        </div>
      </div>
    </div>

    <script src="/static/js/widgets/tabs.js"></script>
    <script src="/static/js/widgets/tag-renderer.js"></script>
    <script src="/static/js/widgets/micro-chart.js"></script>
    <script src="/static/js/widgets/toast.js"></script>
    <script src="/static/js/widgets/modal.js"></script>
    <script src="/static/js/widgets/fork-modal.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
      // Store agent data globally for tab lazy-loading
      let _agentData = null;
      let _agentId = null;

      async function loadAgentDetail() {
        const pathParts = window.location.pathname.split("/");
        const agentId = pathParts[pathParts.length - 1];
        _agentId = agentId;

        try {
          const response = await fetch("/api/agents?limit=200");
          const data = await response.json();

          const agent = data.agents.find((a) => a.agent_id === agentId);

          if (!agent) {
            document.getElementById("agent-content").innerHTML = `
              <div class="error-message">
                Specimen not found in catalogue
              </div>
            `;
            return;
          }
          _agentData = agent;

          // Load cached avatar
          const avatarResponse = await fetch(`/api/agents/${agentId}/avatar`);
          let avatarUrl = null;
          if (avatarResponse.ok) {
            const avatarData = await avatarResponse.json();
            avatarUrl = `data:${avatarData.image.mime_type};base64,${avatarData.image.data}`;
          }

          const displayName =
            agent.display_alias && agent.display_alias !== ""
              ? agent.display_alias
              : agentId.replace(/_/g, " ");
          const skills = agent.capabilities?.skills || [];
          const mcpTools = agent.capabilities?.mcp_tools || [];
          const model = agent.model || agent.capabilities?.model || "N/A";
          const executor = agent.capabilities?.executor || "N/A";
          const provider = agent.llm_provider || agent.capabilities?.provider || "anthropic";
          const tags = agent.tags || agent.metadata?.tags || [];

          const totalExec =
            agent.execution_stats?.total_executions ||
            agent.usage?.total_executions ||
            0;
          const successExec =
            agent.execution_stats?.successful_executions ||
            agent.usage?.successful_executions ||
            0;
          const failedExec =
            agent.execution_stats?.failed_executions ||
            agent.usage?.failed_executions ||
            0;
          const accuracy = agent.performance?.accuracy_rate || 0;
          const confidence = agent.performance?.avg_confidence || 0;
          const cost =
            agent.execution_stats?.total_cost_usd ||
            agent.usage?.total_cost_usd ||
            0;
          const avgTime =
            agent.execution_stats?.avg_execution_time_ms ||
            agent.usage?.avg_execution_time_ms ||
            0;

          const ontology = agent.ontology_stats || {};
          const wallet = agent.wallet || null;
          const secrets = agent.secrets || null;

          // Deterministic color for initial dot
          const hues = [200, 140, 30, 340, 270, 50, 170, 10];
          const hue = hues[agentId.charCodeAt(0) % hues.length];
          const initial = displayName.charAt(0).toUpperCase();

          document.getElementById("agent-content").innerHTML = `
            <div class="specimen-header">
              <div class="specimen-avatar-large" id="avatar"
                   style="${avatarUrl ? "" : `background: hsl(${hue}, 45%, 35%); color: #fff; font-size: 2.8em; font-weight: 300;`}">
                ${avatarUrl ? `<img src="${avatarUrl}" alt="${agentId}">` : initial}
              </div>
              <div class="specimen-header-info">
                <div class="specimen-title">${displayName}</div>
                ${agent.display_alias && agent.display_alias !== "" ? `<div style="font-size:0.8em;color:var(--gray);font-family:'SF Mono',monospace;margin-bottom:6px">${agentId}</div>` : ""}
                <div class="specimen-description">${agent.description || agent.metadata?.description || "A mysterious agent"}</div>
                <div class="badges">
                  <span class="badge">${agent.tier || "curated"}</span>
                  <span class="badge">v${agent.version || "1.0.0"}</span>

          .pop();
        const section = document.getElementById("execution-activity-section");
        if (!section) return;

        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/metrics`,
          );
          if (!res.ok) return; // silently hide if no data
          const data = await res.json();

          const daily = data.daily || [];
          const tools = data.tool_usage || [];
          const avgIter = data.avg_loop_iterations;

          if (daily.length === 0 && tools.length === 0) return;
          section.style.display = "";

          // 30-day sparkline
          const sparkEl = document.getElementById("activity-sparkline");
          if (sparkEl && daily.length > 0) {
            const maxExec = Math.max(...daily.map((d) => d.executions || 0), 1);
            // Fill missing days in last 30 days
            const dayMap = {};
            daily.forEach((d) => {
              dayMap[d.date] = d;
            });
            const today = new Date();
            let barsHtml = "";
            for (let i = 29; i >= 0; i--) {
              const d = new Date(today);
              d.setDate(d.getDate() - i);
              const key = d.toISOString().split("T")[0];
              const day = dayMap[key] || { executions: 0, failures: 0 };
              const h = Math.max(((day.executions || 0) / maxExec) * 44, 2);
              const failH = day.failures
                ? Math.max((day.failures / maxExec) * 44, 1)
                : 0;
              const succH = h - failH;
              barsHtml += `<div style="display:flex;flex-direction:column;justify-content:flex-end;flex:1;height:48px" title="${key}: ${day.executions} exec, ${day.failures || 0} fail">
                ${failH > 0 ? `<div style="height:${failH}px;background:var(--red);border-radius:1px 1px 0 0"></div>` : ""}
                <div style="height:${succH}px;background:var(--green);border-radius:${failH > 0 ? "0" : "1px 1px"} 0 0"></div>
              </div>`;
            }
            sparkEl.innerHTML = barsHtml;
          }

          // Avg iterations badge
          if (avgIter != null) {
            const badge = document.getElementById("avg-iterations-badge");
            if (badge) badge.textContent = Number(avgIter).toFixed(1);
          }

          // Tool usage bars
          const toolEl = document.getElementById("tool-usage-bars");
          if (toolEl && tools.length > 0) {
            const maxCount = Math.max(...tools.map((t) => t.count || 0), 1);
            let toolHtml = "";
            tools.slice(0, 8).forEach((t) => {
              const pct = ((t.count / maxCount) * 100).toFixed(1);
              const avgDur = t.avg_duration_ms
                ? ` (avg ${Math.round(t.avg_duration_ms)}ms)`
                : "";
              toolHtml += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:0.85em">
                <span style="min-width:140px;color:var(--fg2);text-align:right">${t.tool_name}</span>
                <div style="flex:1;height:10px;background:var(--bg2);border-radius:2px;overflow:hidden">
                  <div style="width:${pct}%;height:100%;background:var(--aqua);border-radius:2px"></div>
                </div>
                <span style="color:var(--gray);font-size:0.85em;min-width:60px">${t.count}${avgDur}</span>
              </div>`;
            });
            toolEl.innerHTML = toolHtml;
          }
        } catch (e) {
          // silently fail — section stays hidden
        }
      }
    </script>

    <script>
      function initCognitionCanvases() {
        const kgCanvas = document.getElementById("canvas-kg");
        const embCanvas = document.getElementById("canvas-emb");
        if (!kgCanvas || !embCanvas) return;

        const agentId = window.location.pathname.split("/").pop();
        const isDark = () =>
          !document.documentElement.classList.contains("theme-op1");

        // ─── Color helpers ───
        function colors() {
          return isDark()
            ? {
                bg: "#3c3836",
                node: "#fabd2f",
                edge: "#504945",
                nodeAlt: "#83a598",
                nodeWarm: "#fe8019",
                nodePurple: "#d3869b",
                text: "#bdae93",
                particle: "#83a598",
                pRule: "#b8bb26",
                pEntity: "#fe8019",
                pComm: "#d3869b",
              }
            : {
                bg: "#f0f0eb",
                node: "#ff6b00",
                edge: "#e0e0db",
                nodeAlt: "#1e88e5",
                nodeWarm: "#ef6c00",
                nodePurple: "#8e24aa",
                text: "#6b6b6b",
                particle: "#1e88e5",
                pRule: "#43a047",
                pEntity: "#ef6c00",
                pComm: "#8e24aa",
              };
        }

        // ─── Knowledge Graph Canvas ───
        (function () {
          const canvas = kgCanvas;
          const ctx = canvas.getContext("2d");
          const dpr = window.devicePixelRatio || 1;

          function resize() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
          }
          resize();

          // Generate a plausible small graph
          const nodeCount = 12 + Math.floor(Math.random() * 8);
          const nodes = [];
          const edges = [];
          const w = () => canvas.getBoundingClientRect().width;
          const h = () => canvas.getBoundingClientRect().height;

          for (let i = 0; i < nodeCount; i++) {
            const type =
              i < 3 ? "hub" : Math.random() < 0.3 ? "rule" : "entity";
            nodes.push({
              x: 40 + Math.random() * (w() - 80),
              y: 30 + Math.random() * (h() - 60),
              vx: (Math.random() - 0.5) * 0.3,
              vy: (Math.random() - 0.5) * 0.3,
              r: type === "hub" ? 5 : type === "rule" ? 3.5 : 2.5,
              type,
              pulse: Math.random() * Math.PI * 2,
            });
          }

          // Build edges — hubs connect broadly, others sparsely
          for (let i = 0; i < nodeCount; i++) {
            const conns =
              nodes[i].type === "hub" ? 4 : 1 + Math.floor(Math.random() * 2);
            for (let c = 0; c < conns; c++) {
              const j = Math.floor(Math.random() * nodeCount);
              if (j !== i) edges.push([i, j]);
            }
          }

          let kgNodeCount = nodeCount;
          let kgEdgeCount = edges.length;

          // Try loading real ontology data for stat display
          fetch(`/api/agents/${agentId}/ontology`)
            .then((r) => (r.ok ? r.json() : null))
            .then((data) => {
              if (data && data.stats) {
                kgNodeCount = data.stats.entity_count || nodeCount;
                kgEdgeCount = data.stats.fact_count || edges.length;
              }
              const el = document.getElementById("kg-stat");
              if (el)
                el.textContent = `${kgNodeCount} entities / ${kgEdgeCount} facts`;
            })
            .catch(() => {});

          function tick() {
            const c = colors();
            const cw = w();
            const ch = h();
            ctx.clearRect(0, 0, cw, ch);

            // Simple force simulation
            for (let i = 0; i < nodes.length; i++) {
              const n = nodes[i];
              // Repulsion
              for (let j = i + 1; j < nodes.length; j++) {
                const m = nodes[j];
                let dx = n.x - m.x,
                  dy = n.y - m.y;
                let d2 = dx * dx + dy * dy;
                if (d2 < 1) d2 = 1;
                const f = 30 / d2;
                n.vx += dx * f;
                n.vy += dy * f;
                m.vx -= dx * f;
                m.vy -= dy * f;
              }
            }

            // Edge attraction
            for (const [i, j] of edges) {
              const a = nodes[i],
                b = nodes[j];
              const dx = b.x - a.x,
                dy = b.y - a.y;
              const d = Math.sqrt(dx * dx + dy * dy);
              const f = (d - 50) * 0.003;
              a.vx += dx * f;
              a.vy += dy * f;
              b.vx -= dx * f;
              b.vy -= dy * f;
            }

            // Center gravity + integration
            const cx = cw / 2,
              cy = ch / 2;
            for (const n of nodes) {
              n.vx += (cx - n.x) * 0.001;
              n.vy += (cy - n.y) * 0.001;
              n.vx *= 0.92;
              n.vy *= 0.92;
              n.x += n.vx;
              n.y += n.vy;
              n.x = Math.max(10, Math.min(cw - 10, n.x));
              n.y = Math.max(10, Math.min(ch - 10, n.y));
              n.pulse += 0.02;
            }

            // Draw edges
            ctx.strokeStyle = c.edge;
            ctx.lineWidth = 0.5;
            for (const [i, j] of edges) {
              ctx.beginPath();
              ctx.moveTo(nodes[i].x, nodes[i].y);
              ctx.lineTo(nodes[j].x, nodes[j].y);
              ctx.stroke();
            }

            // Draw nodes
            for (const n of nodes) {
              const pulseFactor = 1 + Math.sin(n.pulse) * 0.15;
              const r = n.r * pulseFactor;
              const fill =
                n.type === "hub"
                  ? c.node
                  : n.type === "rule"
                    ? c.nodeAlt
                    : c.nodeWarm;

              ctx.beginPath();
              ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
              ctx.fillStyle = fill;
              ctx.globalAlpha = 0.8;
              ctx.fill();

              // Glow
              ctx.beginPath();
              ctx.arc(n.x, n.y, r + 3, 0, Math.PI * 2);
              ctx.fillStyle = fill;
              ctx.globalAlpha = 0.08;
              ctx.fill();
              ctx.globalAlpha = 1;
            }

            requestAnimationFrame(tick);
          }
          tick();

          window.addEventListener("resize", resize);
        })();

        // ─── Embedding Space Canvas ───
        (function () {
          const canvas = embCanvas;
          const ctx = canvas.getContext("2d");
          const dpr = window.devicePixelRatio || 1;

          function resize() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
          }
          resize();

          const w = () => canvas.getBoundingClientRect().width;
          const h = () => canvas.getBoundingClientRect().height;

          // Generate particle cloud
          const particles = [];
          const count = 60 + Math.floor(Math.random() * 40);
          for (let i = 0; i < count; i++) {
            const type = Math.random();
            particles.push({
              // Spherical coordinates for 3D rotation
              theta: Math.random() * Math.PI * 2,
              phi: Math.acos(2 * Math.random() - 1),
              r: 0.3 + Math.random() * 0.6,
              size: 1 + Math.random() * 2.5,
              source:
                type < 0.5
                  ? "episode"
                  : type < 0.7
                    ? "rule"
                    : type < 0.9
                      ? "entity"
                      : "community",
            });
          }

          let angle = 0;
          let embPointCount = count;

          // Try loading real projection data for stat display
          fetch(`/api/agents/${agentId}/projections?dimensions=3`)
            .then((r) => (r.ok ? r.json() : null))
            .then((data) => {
              if (data && data.point_count) {
                embPointCount = data.point_count;
                const ev = data.explained_variance;
                const evStr = ev ? ` / ${(ev[0] * 100).toFixed(0)}% var` : "";
                const el = document.getElementById("emb-stat");
                if (el) el.textContent = `${embPointCount} vectors${evStr}`;
              }
            })
            .catch(() => {
              const el = document.getElementById("emb-stat");
              if (el) el.textContent = `${embPointCount} vectors`;
            });

          function tick() {
            const c = colors();
            const cw = w();
            const ch = h();
            ctx.clearRect(0, 0, cw, ch);
            angle += 0.004;

            const cx = cw / 2,
              cy = ch / 2;
            const scale = Math.min(cw, ch) * 0.35;

            // Sort by z for painter's algorithm
            const projected = particles
              .map((p) => {
                const x3 = p.r * Math.sin(p.phi) * Math.cos(p.theta + angle);
                const y3 = p.r * Math.sin(p.phi) * Math.sin(p.theta + angle);
                const z3 = p.r * Math.cos(p.phi);
                // Rotate around Y axis
                const rx =
                  x3 * Math.cos(angle * 0.3) - z3 * Math.sin(angle * 0.3);
                const rz =
                  x3 * Math.sin(angle * 0.3) + z3 * Math.cos(angle * 0.3);
                return {
                  x: cx + rx * scale,
                  y: cy + y3 * scale,
                  z: rz,
                  size: p.size,
                  source: p.source,
                };
              })
              .sort((a, b) => a.z - b.z);

            for (const p of projected) {
              const depth = (p.z + 1) / 2; // 0..1
              const alpha = 0.3 + depth * 0.6;
              const s = p.size * (0.6 + depth * 0.8);

              let fill;
              switch (p.source) {
                case "episode":
                  fill = c.particle;
                  break;
                case "rule":
                  fill = c.pRule;
                  break;
                case "entity":
                  fill = c.pEntity;
                  break;
                case "community":
                  fill = c.pComm;
                  break;
              }

              ctx.beginPath();
              ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
              ctx.fillStyle = fill;
              ctx.globalAlpha = alpha;
              ctx.fill();

              // Subtle glow for foreground particles
              if (depth > 0.7) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, s + 2, 0, Math.PI * 2);
                ctx.fillStyle = fill;
                ctx.globalAlpha = 0.06;
                ctx.fill();
              }
              ctx.globalAlpha = 1;
            }

            // Axis lines (subtle)
            ctx.strokeStyle = c.edge;
            ctx.lineWidth = 0.5;
            ctx.globalAlpha = 0.3;
            // X axis
            ctx.beginPath();
            ctx.moveTo(cx - scale * 0.8, cy);
            ctx.lineTo(cx + scale * 0.8, cy);
            ctx.stroke();
            // Y axis
            ctx.beginPath();
            ctx.moveTo(cx, cy - scale * 0.8);
            ctx.lineTo(cx, cy + scale * 0.8);
            ctx.stroke();
            ctx.globalAlpha = 1;

            requestAnimationFrame(tick);
          }
          tick();

          window.addEventListener("resize", resize);
        })();
      }
    </script>

    <script>
      function toggleExecutePanel() {
        const panel = document.getElementById("execute-panel");
        panel.style.display = panel.style.display === "none" ? "block" : "none";
        if (panel.style.display === "block")
          document.getElementById("exec-query").focus();

      async function generateNewAvatar(agentId) {
        const btn = event.target;
        btn.textContent = "Generating...";
        btn.disabled = true;
        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/avatar/generate`,
            {
              method: "POST",
            },
          );
          if (res.ok) {
            const data = await res.json();
            const avatarDiv = document.getElementById("avatar");
            if (avatarDiv && data.image) {
              avatarDiv.innerHTML = `<img src="data:${data.image.mime_type};base64,${data.image.data}" alt="${agentId}">`;
              avatarDiv.style.background = "";
              avatarDiv.style.color = "";
              avatarDiv.style.fontSize = "";
            }
            btn.parentElement.removeChild(btn);
          } else {
            const err = await res.text();
            btn.textContent = "Failed";
            setTimeout(() => {
              btn.textContent = "Generate Avatar (3 cr)";
              btn.disabled = false;
            }, 2000);
            alert(err);
          }
        } catch (e) {
          btn.textContent = "Generate Avatar (3 cr)";
          btn.disabled = false;
          alert("Network error: " + e.message);
        }
      }

      async function executeAgent() {
        const query = document.getElementById("exec-query").value.trim();
        if (!query) return;
        const resultEl = document.getElementById("exec-result");
        const btn = document.getElementById("exec-run-btn");
        btn.textContent = "Running...";
        btn.disabled = true;
        resultEl.innerHTML =
          '<div style="color:var(--gray);font-size:0.85rem">Executing...</div>';
        const agentId = window.location.pathname
          .split("/")
          .filter(Boolean)
          .pop();
        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/execute`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ query }),
            },
          );
          if (res.ok) {
            const data = await res.json();
            resultEl.innerHTML = renderExecutionResult(data);
          } else if (res.status === 401) {
            resultEl.innerHTML = `<div style="color:var(--yellow);font-size:0.85rem">Sign in to execute agents — <a href="/auth/google" style="color:var(--yellow);text-decoration:underline">Google</a> or <a href="/auth/github" style="color:var(--yellow);text-decoration:underline">GitHub</a></div>`;
          } else {
            const errText = await res.text().catch(() => "Unknown error");
            resultEl.innerHTML = `<div style="color:var(--red);font-size:0.85rem">Error: ${errText}</div>`;
          }
        } catch (e) {
          resultEl.innerHTML = `<div style="color:var(--red);font-size:0.85rem">Network error: ${e.message}</div>`;
        } finally {
          btn.textContent = "Run";
          btn.disabled = false;
        }
      }

      function renderExecutionResult(data) {
        const confidence = data.confidence ?? data.result?.confidence;
        const reasoning = data.reasoning || data.result?.reasoning || "";
        const evidence = data.evidence || data.result?.evidence || [];
        const answer =
          data.answer || data.result?.answer || data.result?.summary || "";

        let html = '<div style="font-size:0.85rem">';

        // Confidence bar
        if (confidence != null) {
          const pct = Math.round(confidence * 100);
          const barColor =
            pct >= 70
              ? "var(--green)"
              : pct >= 40
                ? "var(--yellow)"
                : "var(--red)";
          html += `<div style="margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px">
              <span style="color:var(--fg2)">Confidence</span>
              <span style="color:${barColor};font-weight:600">${pct}%</span>
            </div>
            <div style="background:var(--bg3);height:4px;border-radius:2px;overflow:hidden">
              <div style="background:${barColor};height:100%;width:${pct}%;transition:width 0.3s"></div>
            </div>
          </div>`;
        }

        // Answer / Summary
        if (answer) {
          html += `<div style="color:var(--fg1);margin-bottom:12px;line-height:1.5">${answer}</div>`;
        }

        // Key findings from evidence
        if (evidence.length > 0) {
          html +=
            '<div style="margin-bottom:12px"><div style="color:var(--aqua);font-size:0.8rem;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em">Key Findings</div><ul style="margin:0;padding-left:16px;color:var(--fg2)">';
          evidence.forEach((e) => {
            const text =
              typeof e === "string"
                ? e
                : e.description || e.text || e.finding || JSON.stringify(e);
            html += `<li style="margin-bottom:4px">${text}</li>`;
          });
          html += "</ul></div>";
        }

        // Reasoning (collapsible)
        if (reasoning) {
          html += `<details style="margin-top:8px">
            <summary style="color:var(--gray);font-size:0.8rem;cursor:pointer;user-select:none">Reasoning</summary>
            <div style="color:var(--fg3);margin-top:6px;padding:8px;background:var(--bg0);border-radius:4px;white-space:pre-wrap;font-size:0.82rem;line-height:1.5">${reasoning}</div>
          </details>`;
        }

        // Raw data fallback (collapsible)
        html += `<details style="margin-top:8px">
          <summary style="color:var(--gray);font-size:0.75rem;cursor:pointer;user-select:none">Raw Response</summary>
          <pre style="color:var(--fg3);margin-top:6px;padding:8px;background:var(--bg0);border-radius:4px;font-size:0.75rem;overflow-x:auto">${JSON.stringify(data, null, 2)}</pre>
        </details>`;

        html += "</div>";
        return html;
      }
    </script>

    <!-- Owner Actions Panel -->
    <script>
      (async function initOwnerPanel() {
        const agentId = window.location.pathname
          .split("/")
          .filter(Boolean)
          .pop();
        let currentUser = null;
        try {
          const res = await fetch("/api/auth/me");
          if (res.ok) currentUser = await res.json();
        } catch (e) {
          return;
        }
        if (!currentUser) return;

        // Wait for agent data to load, then check ownership
        const checkOwnership = setInterval(() => {
          const content = document.getElementById("agent-content");
          if (!content || content.querySelector(".loading-spinner")) return;
          clearInterval(checkOwnership);

          // Re-fetch agent to check owner_id
          fetch("/api/agents?limit=200")
            .then((r) => r.json())
            .then((data) => {
              const agent = data.agents.find((a) => a.agent_id === agentId);
              if (!agent) return;

              // Check if we need owner_id — it comes from the API
              const userId = currentUser.user_id;
              const isOwner = agent.owner_id === userId;
              if (isOwner) {
                renderOwnerPanel(agentId, agent);
              } else {
                // Show fork button for non-owners on published agents
                if (agent.status === "published") {
                  renderForkButton(agentId);
                }
                const hint = document.getElementById("execute-hint");
                if (hint) {
                  hint.style.display = "block";
                  const link = document.getElementById("hire-link");
                  if (link) link.href = "/dashboard";
                }
              }
            });
        }, 200);
      })();

          forkDiv,
          tabBar.nextSibling?.nextSibling,

        manageBtn.setAttribute("data-tab", "manage");
        manageBtn.textContent = "Manage";
        tabBar.appendChild(manageBtn);

        // --- Populate Eval tab ---
        const evalPanel = document.getElementById("eval-tab-panel");
        if (evalPanel) {
          evalPanel.innerHTML = `
            <div class="sections">
              <div class="section">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                  <div class="section-title" style="margin-bottom:0">Eval Suite</div>
                  <div style="display:flex;gap:6px">
                    <button class="owner-btn" style="border-color:var(--green);color:var(--green)"
                            onclick="runEval('${agentId}', false)">Run Eval</button>
                    <button class="owner-btn" style="border-color:var(--aqua);color:var(--aqua)"
                            onclick="runEval('${agentId}', true)">Run + Judge</button>
                    <button class="owner-btn" onclick="toggleAddTestCase()">+ Test Case</button>
                  </div>
                </div>
                <div style="font-size:0.85em;color:var(--fg3);margin-bottom:12px">
                  Test Cases: <strong id="eval-case-count">0</strong>
                </div>

                        onclick="deleteTestCase('${agentId}','${c.test_case_id}')">x</button>
              </div>
            `,
              )
              .join("");
          }
        } catch (e) {
          casesList.innerHTML =
            '<span style="color:var(--red)">Error: ' +
            escapeHtml(e.message) +
            "</span>";
        }

        // Load run history
        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/eval/runs`,
          );
          if (!res.ok) {
            runsList.innerHTML =
              '<span style="color:var(--red)">Failed to load</span>';
            return;
          }
          const data = await res.json();
          const runs = data.runs || [];

          if (runs.length === 0) {
            runsList.innerHTML =
              '<span style="color:var(--fg4)">No eval runs yet.</span>';
          } else {
            runsList.innerHTML = runs
              .map((r) => {
                const passRate =
                  r.total_cases > 0
                    ? ((r.passed / r.total_cases) * 100).toFixed(0)
                    : "?";
                const regFlag = r.regression_detected
                  ? '<span style="color:var(--red);font-weight:bold;margin-left:6px">REGRESSION</span>'
                  : "";
                const judgeStr =
                  r.avg_judge_score != null
                    ? ` | Judge: ${r.avg_judge_score.toFixed(1)}/5`
                    : "";
                const statusColor =
                  r.status === "completed"
                    ? "var(--green)"
                    : r.status === "running"
                      ? "var(--yellow)"
                      : "var(--red)";
                const durStr = r.duration_ms
                  ? ` | ${(r.duration_ms / 1000).toFixed(1)}s`
                  : "";
                // Phase 2 — registry aggregate + conflict flags
                let signalHtml = "";
                const conflicts = Array.isArray(r.conflict_flags) ? r.conflict_flags : [];
                if (r.aggregated_signal && r.aggregated_signal.per_dimension) {
                  const dims = r.aggregated_signal.per_dimension
                    .slice(0, 4)
                    .map((d) => {
                      const pct = Math.round(d.mean * 100);
                      const color =
                        d.mean >= 0.75
                          ? "var(--green)"
                          : d.mean >= 0.55
                            ? "var(--yellow)"
                            : "var(--red)";
                      const conf = d.conflict
                        ? '<span style="color:var(--yellow);margin-left:3px">⚠</span>'
                        : "";
                      return `<span style="margin-right:10px"><span style="color:var(--fg4)">${d.dimension}</span> <span style="color:${color}">${pct}%</span>${conf}</span>`;
                    })
                    .join("");
                  const blocked = r.prefilter_blocked
                    ? ' <span style="color:var(--red);font-size:0.75em">prefilter blocked</span>'
                    : "";
                  const conflictPill =
                    conflicts.length > 0
                      ? ` <span style="color:var(--yellow);font-weight:bold">⚠ ${conflicts.length} conflict${conflicts.length === 1 ? "" : "s"}</span>`
                      : "";
                  signalHtml = `
                  <div style="color:var(--fg3);font-size:0.8em;margin-top:3px">
                    ${dims}${conflictPill}${blocked}
                  </div>`;
                }
                const signalsToggle =
                  r.status === "completed"
                    ? `<span style="color:var(--aqua);cursor:pointer;font-size:0.8em;margin-left:6px" onclick="toggleRunSignals('${r.run_id}', '${agentId}')">▶ per-evaluator</span>`
                    : "";
                return `
                <div style="padding:6px 0;border-bottom:1px solid var(--bg2)">
                  <div style="display:flex;justify-content:space-between">
                    <span style="color:${statusColor};text-transform:uppercase;font-size:0.8em">${r.status}${r.judge_enabled ? " + judge" : ""}</span>
                    <span style="color:var(--fg4)">${new Date(r.started_at).toLocaleDateString()}</span>
                  </div>
                  <div style="color:var(--fg1)">
                    Pass: ${r.passed}/${r.total_cases} (${passRate}%)${judgeStr}${regFlag}${signalsToggle}
                  </div>${signalHtml}
                  <div style="color:var(--fg4);font-size:0.85em">
                    Cost: ${r.total_cost_credits} credits${durStr}
                  </div>
                  <div id="run-signals-${r.run_id}" style="display:none;margin-top:6px;padding:8px;background:var(--bg0);border-left:2px solid var(--aqua);font-size:0.82em"></div>
                </div>`;
              })
              .join("");
          }

          // --- Render eval charts ---
          renderEvalCharts(runs);
        } catch (e) {
          runsList.innerHTML =
            '<span style="color:var(--red)">Error: ' +
            escapeHtml(e.message) +
            "</span>";
        }
      }

      function renderEvalCharts(runs) {
        const chartsSection = document.getElementById("eval-charts-section");
        const sparkEl = document.getElementById("eval-regression-sparkline");
        const histEl = document.getElementById("eval-judge-histogram");
        if (!chartsSection || !sparkEl || !histEl) return;

        const completedRuns = runs
          .filter((r) => r.status === "completed")
          .reverse(); // oldest first
        if (completedRuns.length < 2) return;

        chartsSection.style.display = "";

        // Pass rate sparkline
        const passRates = completedRuns.map((r) =>
          r.total_cases > 0 ? (r.passed / r.total_cases) * 100 : 0,
        );
        const regressionDots = [];
        completedRuns.forEach((r, i) => {
          if (r.regression_detected) regressionDots.push(i);
        });
        sparkEl.innerHTML = MicroChart.sparkline(passRates, {
          width: 220,
          height: 44,
          color: "var(--green)",
          dotColor: "var(--red)",
          dots: regressionDots,
        });

        // Judge score histogram (from latest run with judge scores)
        const judgeRun = completedRuns
          .slice()
          .reverse()
          .find((r) => r.avg_judge_score != null && r.case_results);
        if (judgeRun && judgeRun.case_results) {
          const buckets = [0, 0, 0, 0, 0]; // scores 1-5
          const results = Array.isArray(judgeRun.case_results)
            ? judgeRun.case_results
            : [];
          results.forEach((cr) => {
            const score =
              cr.judge_score != null ? Math.round(cr.judge_score) : 0;
            if (score >= 1 && score <= 5) buckets[score - 1]++;
          });
          histEl.innerHTML = MicroChart.histogram(
            buckets.map((v, i) => ({ label: String(i + 1), value: v })),
            { width: 180, height: 56, color: "var(--purple)" },
          );
        } else {
          histEl.innerHTML =
            '<span style="font-size:0.8em;color:var(--fg4)">Run with judge to see scores</span>';
        }
      }

      // Toggle the per-evaluator breakdown panel under a run row.
      // Lazy-fetches signals on first open; cached on the element.
      window.toggleRunSignals = async function (runId, agentId) {
        const el = document.getElementById(`run-signals-${runId}`);
        if (!el) return;
        if (el.style.display !== "none") {
          el.style.display = "none";
          return;
        }
        el.style.display = "block";
        if (el.dataset.loaded === "1") return;
        el.innerHTML =
          '<span style="color:var(--fg4)">Loading signals…</span>';
        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/eval/runs/${encodeURIComponent(runId)}/signals`,
          );
          if (!res.ok) {
            el.innerHTML =
              '<span style="color:var(--red)">Failed to load: ' +
              res.status +
              "</span>";
            return;
          }
          const data = await res.json();
          const signals = data.signals || [];
          if (signals.length === 0) {
            el.innerHTML =
              '<span style="color:var(--fg4)">No per-evaluator signals stored for this run.</span>';
            el.dataset.loaded = "1";
            return;
          }
          // Group by evaluator name → dimensions table.
          const byEval = {};
          signals.forEach((s) => {
            if (!byEval[s.evaluator_name]) {
              byEval[s.evaluator_name] = {
                tier: s.evaluator_tier,
                version: s.evaluator_version,
                rows: [],
              };
            }
            byEval[s.evaluator_name].rows.push(s);
          });
          const blocks = Object.keys(byEval)
            .sort()
            .map((name) => {
              const grp = byEval[name];
              const rows = grp.rows
                .map((s) => {
                  const scorePct = Math.round((s.score || 0) * 100);
                  const color =
                    s.score >= 0.75
                      ? "var(--green)"
                      : s.score >= 0.55
                        ? "var(--yellow)"
                        : "var(--red)";
                  const conf =
                    s.confidence != null
                      ? `<span style="color:var(--fg4);margin-left:8px">conf ${(s.confidence * 100).toFixed(0)}%</span>`
                      : "";
                  const flagsStr =
                    s.flags && Object.keys(s.flags).length > 0
                      ? `<div style="color:var(--yellow);font-size:0.85em;margin-top:2px">flags: ${escapeHtml(JSON.stringify(s.flags))}</div>`
                      : "";
                  const rat = s.rationale
                    ? `<div style="color:var(--fg3);font-size:0.85em;margin-top:2px;font-style:italic">${escapeHtml(s.rationale.length > 200 ? s.rationale.slice(0, 200) + "…" : s.rationale)}</div>`
                    : "";
                  return `
                    <div style="padding:4px 0">
                      <span style="color:var(--fg4);width:140px;display:inline-block">${escapeHtml(s.dimension)}</span>
                      <span style="color:${color};font-weight:bold">${scorePct}%</span>${conf}
                      ${flagsStr}
                      ${rat}
                    </div>`;
                })
                .join("");
              const tierBadge = `<span style="color:var(--fg4);font-size:0.75em;text-transform:uppercase;letter-spacing:0.05em;margin-left:6px">${escapeHtml(grp.tier || "")} v${escapeHtml(grp.version || "")}</span>`;
              return `
                <div style="margin-bottom:10px">
                  <div style="color:var(--aqua);font-weight:bold">${escapeHtml(name)}${tierBadge}</div>
                  ${rows}
                </div>`;
            })
            .join("");
          el.innerHTML = `
            <div style="color:var(--fg3);font-size:0.8em;margin-bottom:6px">
              ${data.count} signal${data.count === 1 ? "" : "s"} from ${Object.keys(byEval).length} evaluator${Object.keys(byEval).length === 1 ? "" : "s"}
            </div>
            ${blocks}`;
          el.dataset.loaded = "1";
        } catch (e) {
          el.innerHTML =
            '<span style="color:var(--red)">Error: ' +
            escapeHtml(e.message) +
            "</span>";
        }
      };

      async function runEval(agentId, withJudge) {
        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/eval/run`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ judge: withJudge }),
            },
          );
          if (!res.ok) {
            const err = await res.text();
            alert("Failed: " + err);
            return;
          }
          const data = await res.json();
          Toast.show(
            `Eval run started: ${data.total_cases} test cases`,
            "success",
          );
          pollEvalRun(agentId, data.run_id);
        } catch (e) {
          alert("Error: " + e.message);
        }
      }

      function pollEvalRun(agentId, runId) {
        const interval = setInterval(async () => {
          try {
            const res = await fetch(
              `/api/agents/${encodeURIComponent(agentId)}/eval/runs`,
            );
            if (!res.ok) return;
            const data = await res.json();
            const run = (data.runs || []).find((r) => r.run_id === runId);
            if (run && run.status !== "running") {
              clearInterval(interval);
              loadEvalData(agentId);
              Toast.show(
                `Eval run complete: ${run.passed}/${run.total_cases} passed`,
                run.regression_detected ? "error" : "success",
              );
            }
          } catch {}
        }, 3000);
      }

      async function restoreVersion(agentId, versionNum) {
        if (
          !confirm(
            `Restore to version ${versionNum}? Current state will be saved as a new version first.`,
          )
        )
          return;
        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/versions/${versionNum}/restore`,
            { method: "POST" },
          );
          if (!res.ok) {
            const t = await res.text();
            alert("Restore failed: " + t);
            return;
          }
          alert(`Restored to version ${versionNum}. Reloading...`);
          location.reload();
        } catch (e) {
          alert("Error: " + e.message);
        }
      }

        btn.textContent = "Consolidating...";

        const tempIn = document.getElementById("sp-temperature");
        if (budgetWrap) budgetWrap.style.display = checked ? "" : "none";
        if (tempIn && checked) tempIn.value = "1";
      }

      function collectSamplingParams() {
        const provider = document.getElementById("intel-provider")?.value || "anthropic";
        const mp = {};
        const v = id => (document.getElementById(id)?.value || "").trim();
        const nf = s => s !== "" ? parseFloat(s) : undefined;
        const ni = s => s !== "" ? parseInt(s, 10) : undefined;

        const temp = nf(v("sp-temperature"));
        if (temp !== undefined) mp.temperature = temp;
        const maxTok = ni(v("sp-max-tokens"));
        if (maxTok !== undefined) mp.max_tokens = maxTok;
        const topP = nf(v("sp-top-p"));
        if (topP !== undefined) mp.top_p = topP;

        if (provider === "anthropic") {
          const topK = ni(v("sp-top-k"));
          if (topK !== undefined) mp.top_k = topK;
          const extThinking = !!document.getElementById("sp-extended-thinking")?.checked;
          if (extThinking) {
            mp.extended_thinking = true;
            mp.temperature = 1.0;
            const budget = ni(v("sp-thinking-budget"));
            if (budget !== undefined) mp.thinking_budget_tokens = budget;
          }
        } else {
          const freqP = nf(v("sp-frequency-penalty"));
          if (freqP !== undefined) mp.frequency_penalty = freqP;
          const presP = nf(v("sp-presence-penalty"));
          if (presP !== undefined) mp.presence_penalty = presP;
          const repP = nf(v("sp-repetition-penalty"));
          if (repP !== undefined) mp.repetition_penalty = repP;
          const seed = ni(v("sp-random-seed"));
          if (seed !== undefined) mp.random_seed = seed;
        }

        return mp;
      }

      function collectGatesFromDOM() {
        const rows = document.querySelectorAll("#gates-tbody tr[data-gate]");
        const result = {};
        rows.forEach(row => {
          const origKey = row.getAttribute("data-gate");
          const nameInput = row.querySelector(`[name="gate-cap-${origKey}"]`);
          const tierSel = row.querySelector(`[name="gate-tier-${origKey}"]`);
          const cap = (nameInput?.value || "").trim();
          const tier = tierSel?.value || "free";
          if (cap) result[cap] = tier;
        });
        return result;
      }

      function renderValidation() {
        const out = document.getElementById("intel-validation-output");
        if (!out) return;
        const ladder = collectLadderFromDOM();
        const gates = collectGatesFromDOM();
        const msgs = [];

        const tiers = new Set(ladder.map(r => r.tier));

        if (ladder.length === 0) {
          msgs.push({ ok: null, text: "No ladder rungs — creatures use the default model at all tiers." });
        } else {
          if (!tiers.has("free")) {
            msgs.push({ ok: false, text: "No free tier rung — free-tier creatures will use the default model." });
          }
          ladder.forEach(r => {
            if (!r.model) msgs.push({ ok: false, text: `${r.tier} rung (${r.provider}) has no model set.` });
            else if (r.eval_score == null) msgs.push({ ok: null, text: `${r.tier} / ${r.provider} / ${r.model} — no eval score recorded.` });
            else msgs.push({ ok: true, text: `${r.tier} / ${r.provider} / ${r.model} — eval ${r.eval_score.toFixed(2)}` + (r.benchmarked_at ? ` (${r.benchmarked_at})` : "") });
          });
        }

        Object.entries(gates).forEach(([cap, tier]) => {
          if (!tiers.has(tier) && ladder.length > 0) {
            msgs.push({ ok: false, text: `Gate "${cap}" requires "${tier}" but no ${tier} rung exists in the ladder.` });
          }
        });

        if (msgs.length === 0) {
          out.innerHTML = '<span style="color:var(--green)">✓ Configuration looks good.</span>';
          return;
        }
        out.innerHTML = msgs.map(m => {
          const icon = m.ok === true ? "✓" : m.ok === false ? "⚠" : "·";
          const color = m.ok === true ? "var(--green)" : m.ok === false ? "var(--yellow)" : "var(--fg3)";
          return `<div style="color:${color};margin-bottom:4px">${icon} ${m.text}</div>`;
        }).join("");
      }

      async function saveIntelligenceConfig(agentId) {
        const statusEl = document.getElementById("intel-save-status");
        statusEl.textContent = "Saving…";
        statusEl.style.color = "var(--fg3)";

        const provider = document.getElementById("intel-provider")?.value;
        const model = (document.getElementById("intel-model")?.value || "").trim();
        const minTier = document.getElementById("intel-min-tier")?.value;
        const ladder = collectLadderFromDOM();
        const gates = collectGatesFromDOM();

        // Sync state so validation reflects current DOM
        _intelLadder = ladder;
        _intelGates = gates;
        renderValidation();

        // Validate: no rung with empty model
        const invalid = ladder.find(r => !r.model);
        if (invalid) {
          statusEl.textContent = "Fix: every rung needs a model ID.";
          statusEl.style.color = "var(--red)";
          return;
        }

        try {
          const modelParams = collectSamplingParams();

          const res = await fetch(`/api/agents/${encodeURIComponent(agentId)}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              llm_provider: provider,
              model,
              min_tier: minTier,
              model_ladder: ladder,
              capability_gates: gates,
              model_params: modelParams,
            }),
          });
          if (res.ok) {
            statusEl.textContent = "Saved.";
            statusEl.style.color = "var(--green)";
            // Update global agent data so re-opens of the tab reflect current state
            if (_agentData) {
              _agentData.llm_provider = provider;
              _agentData.model = model;
              _agentData.min_tier = minTier;
              _agentData.model_ladder = ladder;
              _agentData.capability_gates = gates;
              _agentData.model_params = modelParams;
            }
            setTimeout(() => { statusEl.textContent = ""; }, 3000);
          } else {
            const msg = await res.text();
            statusEl.textContent = "Error: " + msg;
            statusEl.style.color = "var(--red)";
          }
        } catch (e) {
          statusEl.textContent = "Network error.";
          statusEl.style.color = "var(--red)";
        }
      }

        const valenceScore = parseFloat(document.getElementById("valence-score").value);
        const statusEl = document.getElementById("valence-status");

        if (!affect) {
          statusEl.textContent = "Primary affect is required.";
          statusEl.style.color = "var(--red)";
          return;
        }

        const valence = { primary_affect: affect, arousal, valence: valenceScore, personality_traits: traits };

        try {
          const res = await fetch(`/api/agents/${encodeURIComponent(agentId)}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ valence }),
          });
          if (res.ok) {
            statusEl.textContent = "Saved.";
            statusEl.style.color = "var(--green)";
            if (_agentData) _agentData.valence = valence;
            setTimeout(() => { statusEl.textContent = ""; }, 3000);

            statusEl.style.color = "var(--red)";

              (c) => !c.passed && c.severity === "Error",
