<!doctype html>
<html lang="en" class="theme-hasui">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Specimen Details - Agent Bestiary</title>
    <style>
      /* Gruvbox Dark Theme Colors */
      :root {
        --bg0-hard: #1d2021;
        --bg0: #282828;
        --bg1: #3c3836;
        --bg2: #504945;
        --bg3: #665c54;
        --fg0: #fbf1c7;
        --fg1: #ebdbb2;
        --fg2: #d5c4a1;
        --fg3: #bdae93;
        --red: #fb4934;
        --green: #b8bb26;
        --yellow: #fabd2f;
        --blue: #83a598;
        --purple: #d3869b;
        --aqua: #8ec07c;
        --orange: #fe8019;
        --gray: #928374;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
        background: var(--bg0-hard);
        color: var(--fg1);
        min-height: 100vh;
        padding: 20px;
        line-height: 1.5;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .back-button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--fg3);
        text-decoration: none;
        font-size: 0.85em;
        margin-bottom: 20px;
        padding: 6px 12px;
        background: transparent;
        border: 1px solid var(--bg2);
        border-radius: 4px;
        transition: all 0.2s ease;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .back-button:hover {
        background: var(--bg1);
        border-color: var(--yellow);
        color: var(--yellow);
      }

      .specimen-header {
        display: flex;
        gap: 24px;
        margin-bottom: 24px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--bg2);
        align-items: flex-start;
      }

      .hire-button {
        margin-left: auto;
        padding: 10px 20px;
        background: var(--yellow);
        color: var(--bg0-hard);
        border: none;
        border-radius: 4px;
        font-size: 0.9em;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
      }

      .hire-button:hover {
        background: var(--orange);
        transform: translateY(-1px);
      }

      .hire-button:active {
        transform: translateY(0);
      }

      .specimen-avatar-large {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: var(--bg2);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 2px solid var(--bg3);
        flex-shrink: 0;
      }

      .specimen-avatar-large img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: sepia(10%) saturate(90%);
      }

      .specimen-avatar-large.loading {
        animation: pulse 2s ease-in-out infinite;
      }

      .specimen-avatar-large .placeholder {
        font-size: 4em;
        filter: grayscale(100%);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .specimen-header-info {
        flex: 1;
      }

      .specimen-title {
        font-size: 1.6em;
        font-weight: 400;
        color: var(--fg0);
        margin-bottom: 8px;
        text-transform: capitalize;
        letter-spacing: -0.01em;
      }

      .specimen-description {
        color: var(--fg3);
        font-size: 0.9em;
        margin-bottom: 12px;
        line-height: 1.5;
      }

      .badges {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .badge {
        display: inline-block;
        padding: 3px 10px;
        background: transparent;
        color: var(--yellow);
        border: 1px solid var(--bg3);
        border-radius: 3px;
        font-size: 0.75em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 500;
      }

      .sections {
        display: grid;
        gap: 16px;
      }

      .section {
        background: var(--bg1);
        padding: 16px 20px;
        border-radius: 4px;
        border: 1px solid var(--bg2);
      }

      .section-title {
        font-size: 0.95em;
        font-weight: 400;
        color: var(--fg0);
        margin-bottom: 14px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 12px;
      }

      .field-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .field-label {
        color: var(--gray);
        font-size: 0.7em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 500;
      }

      .field-value {
        color: var(--fg1);
        font-size: 0.9em;
        word-break: break-word;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 16px;
      }

      .stat-card {
        text-align: center;
        padding: 12px;
        background: var(--bg0);
        border-radius: 4px;
        border: 1px solid var(--bg2);
      }

      .stat-value {
        font-size: 1.6em;
        font-weight: 400;
        color: var(--yellow);
        line-height: 1;
      }

      .stat-label {
        color: var(--gray);
        margin-top: 6px;
        font-size: 0.7em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 400;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tag {
        background: var(--bg2);
        color: var(--aqua);
        padding: 6px 12px;
        border: 1px solid var(--bg3);
        border-radius: 4px;
        font-size: 0.85em;
        font-weight: 500;
      }

      .notice-box {
        background: var(--bg0);
        border-left: 3px solid var(--orange);
        padding: 16px;
        margin-top: 12px;
        color: var(--fg2);
        font-size: 0.9em;
        border-radius: 0 4px 4px 0;
      }

      .notice-box strong {
        color: var(--orange);
        display: block;
        margin-bottom: 8px;
      }

      .credential-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        background: var(--bg2);
        border: 1px solid var(--bg3);
        border-radius: 4px;
        margin-top: 8px;
        font-size: 0.9em;
      }

      .credential-key {
        font-family: "SF Mono", "Monaco", "Courier New", monospace;
        color: var(--fg1);
        font-size: 0.9em;
      }

      .status-ok {
        color: var(--green);
        font-weight: 600;
      }

      .status-missing {
        color: var(--red);
        font-weight: 600;
      }

      .view-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        background: transparent;
        color: var(--yellow);
        text-decoration: none;
        border: 1px solid var(--bg3);
        border-radius: 3px;
        font-size: 0.8em;
        font-weight: 400;
        transition: all 0.2s ease;
        margin-top: 10px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .view-link:hover {
        background: var(--bg2);
        border-color: var(--yellow);
      }

      .loading-spinner {
        text-align: center;
        color: var(--fg3);
        font-size: 1.2em;
        padding: 40px;
      }

      .error-message {
        background: var(--bg1);
        border: 1px solid var(--red);
        color: var(--red);
        padding: 30px;
        border-radius: 6px;
        text-align: center;
      }

      .empty-state {
        color: var(--gray);
        font-size: 0.9em;
        font-style: italic;
      }

      /* ─── Dual Cognition Canvas ─── */
      .cognition-panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 20px;
      }

      .cognition-card {
        background: var(--bg1);
        border: 1px solid var(--bg2);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
      }

      .cognition-label {
        position: absolute;
        top: 8px;
        left: 12px;
        font-size: 0.65em;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--fg3);
        z-index: 2;
        background: var(--bg1);
        padding: 2px 6px;
        border-radius: 2px;
      }

      .cognition-stat {
        position: absolute;
        bottom: 8px;
        right: 12px;
        font-size: 0.7em;
        color: var(--fg3);
        z-index: 2;
        font-variant-numeric: tabular-nums;
      }

      .cognition-canvas {
        width: 100%;
        height: 180px;
        display: block;
      }

      @media (max-width: 640px) {
        .cognition-panel {
          grid-template-columns: 1fr;
        }
      }

      /* ─── Dreaming Section ─── */
      .dream-bar {
        height: 6px;
        background: var(--bg2);
        border-radius: 3px;
        overflow: hidden;
        margin-top: 8px;
      }

      .dream-bar-fill {
        height: 100%;
        background: var(--purple);
        border-radius: 3px;
        transition: width 0.5s ease;
      }

      /* OP-1 Theme */
      .theme-op1 {
        --bg0-hard: #f5f5f0;
        --bg0: #ffffff;
        --bg1: #f0f0eb;
        --bg2: #e0e0db;
        --bg3: #c8c8c3;
        --fg0: #1a1a1a;
        --fg1: #2d2d2d;
        --fg2: #4a4a4a;
        --fg3: #6b6b6b;
        --yellow: #ff6b00;
        --green: #00c853;
        --red: #ff1744;
        --blue: #5ac8fa;
        --purple: #af52de;
        --aqua: #00b8d4;
        --orange: #ff9500;
        --gray: #9e9e9e;
      }

      .theme-op1 .specimen-avatar-large {
        border: 3px solid #1a1a1a;
        background: #5ac8fa;
      }

      .theme-op1 .specimen-avatar-large img {
        display: none;
      }

      .theme-op1 .specimen-avatar-large .placeholder {
        display: none;
      }

      .theme-op1 .specimen-card {
        border-radius: 0;
      }

      .theme-op1 .section {
        border-radius: 0;
      }

      .theme-op1 .badge {
        border-radius: 20px;
      }

      .theme-op1 .stat-card {
        border-radius: 0;
      }

      .theme-op1 .tag {
        border-radius: 0;
        color: var(--blue);
      }

      /* Theme Toggle */
      .theme-toggle-btn {
        background: transparent;
        border: 1px solid var(--bg3);
        padding: 6px 14px;
        cursor: pointer;
        font-size: 0.85em;
        color: var(--fg3);
        transition: all 0.2s ease;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        border-radius: 4px;
      }

      .theme-toggle-btn:hover {
        border-color: var(--yellow);
        color: var(--yellow);
      }

      /* Auth UI */
      .auth-area {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .auth-btn {
        background: transparent;
        border: 1px solid var(--bg3);
        padding: 4px 12px;
        cursor: pointer;
        font-size: 0.85rem;
        color: var(--fg3);
        transition: all 0.2s ease;
        text-decoration: none;
      }
      .auth-btn:hover {
        border-color: var(--green);
        color: var(--green);
      }
      .auth-user {
        font-size: 0.85rem;
        color: var(--fg2);
      }
      .auth-logout {
        background: transparent;
        border: none;
        color: var(--fg3);
        cursor: pointer;
        font-size: 0.8rem;
        padding: 2px 6px;
      }
      .auth-logout:hover {
        color: var(--red);
      }

      .detail-header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="detail-header-bar">
        <a href="/" class="back-button">
          <span>←</span>
          <span>Back to Catalogue</span>
        </a>
        <div style="display: flex; align-items: center; gap: 8px">
          <div id="user-area" class="auth-area"></div>
          <button
            id="theme-toggle"
            class="theme-toggle-btn"
            title="Toggle Theme (Ctrl+T)"
          >
            OP-1
          </button>
        </div>
      </div>

      <div id="agent-content">
        <div class="loading-spinner">Loading specimen details...</div>
      </div>
    </div>

    <script>
      async function loadAgentDetail() {
        const pathParts = window.location.pathname.split("/");
        const agentId = pathParts[pathParts.length - 1];

        try {
          const response = await fetch("/api/agents");
          const data = await response.json();

          const agent = data.agents.find((a) => a.agent_id === agentId);

          if (!agent) {
            document.getElementById("agent-content").innerHTML = `
              <div class="error-message">
                Specimen not found in catalogue
              </div>
            `;
            return;
          }

          // Load avatar
          const avatarResponse = await fetch(`/api/agents/${agentId}/avatar`);
          let avatarUrl = null;
          if (avatarResponse.ok) {
            const avatarData = await avatarResponse.json();
            avatarUrl = `data:${avatarData.image.mime_type};base64,${avatarData.image.data}`;
          }

          const skills = agent.capabilities?.skills || [];
          const mcpTools = agent.capabilities?.mcp_tools || [];
          const model = agent.capabilities?.model || "N/A";
          const executor = agent.capabilities?.executor || "N/A";
          const temperature = agent.capabilities?.temperature || "N/A";

          const totalExec = agent.usage?.total_executions || 0;
          const successExec = agent.usage?.successful_executions || 0;
          const failedExec = agent.usage?.failed_executions || 0;
          const accuracy = agent.performance?.accuracy_rate || 0;
          const confidence = agent.performance?.avg_confidence || 0;
          const cost = agent.usage?.total_cost_usd || 0;
          const avgTime = agent.usage?.avg_execution_time_ms || 0;

          const ontology = agent.ontology_stats || {};
          const wallet = agent.wallet || null;
          const secrets = agent.secrets || null;

          document.getElementById("agent-content").innerHTML = `
            <div class="specimen-header">
              <div class="specimen-avatar-large ${!avatarUrl ? "loading" : ""}" id="avatar">
                ${avatarUrl ? `<img src="${avatarUrl}" alt="${agentId}">` : '<span class="placeholder">◈</span>'}
              </div>
              <div class="specimen-header-info">
                <div class="specimen-title">${agentId.replace(/_/g, " ")}</div>
                <div class="specimen-description">${agent.metadata?.description || "A mysterious agent"}</div>
                <div class="badges">
                  <span class="badge">${agent.tier || "curated"}</span>
                  <span class="badge">v${agent.version || "1.0.0"}</span>
                  ${agent.metadata?.author ? `<span class="badge">${agent.metadata.author}</span>` : ""}
                </div>
              </div>
              <button class="hire-button" id="execute-btn" onclick="toggleExecutePanel()">
                Execute Agent
              </button>
            </div>

            <!-- Inline Execute Panel (hidden by default) -->
            <div id="execute-panel" style="display:none;background:var(--bg1);border:1px solid var(--bg3);padding:16px;margin-bottom:16px">
              <div style="font-size:0.85rem;color:var(--yellow);margin-bottom:8px">Execute Agent</div>
              <input type="text" id="exec-query" placeholder="Enter your query..."
                style="width:100%;background:var(--bg0);border:1px solid var(--bg3);color:var(--fg0);padding:8px 12px;font-family:inherit;margin-bottom:8px" />
              <button onclick="executeAgent()"
                style="background:transparent;border:1px solid var(--yellow);color:var(--yellow);padding:6px 16px;cursor:pointer;font-family:inherit">
                Run
              </button>
              <div id="exec-result" style="margin-top:12px;font-size:0.85rem;color:var(--fg2);white-space:pre-wrap"></div>
            </div>

            <div class="cognition-panel">
              <div class="cognition-card">
                <span class="cognition-label">Cognition / Knowledge Graph</span>
                <span class="cognition-stat" id="kg-stat"></span>
                <canvas class="cognition-canvas" id="canvas-kg"></canvas>
              </div>
              <div class="cognition-card">
                <span class="cognition-label">Embedding Space</span>
                <span class="cognition-stat" id="emb-stat"></span>
                <canvas class="cognition-canvas" id="canvas-emb"></canvas>
              </div>
            </div>

            <div class="sections">
              <div class="section">
                <div class="section-title">Performance Statistics</div>
                <div class="stats-grid">
                  <div class="stat-card">
                    <div class="stat-value">${totalExec}</div>
                    <div class="stat-label">Total</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-value">${successExec}</div>
                    <div class="stat-label">Success</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-value">${failedExec}</div>
                    <div class="stat-label">Failed</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-value">${(accuracy * 100).toFixed(1)}%</div>
                    <div class="stat-label">Accuracy</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-value">${confidence.toFixed(2)}</div>
                    <div class="stat-label">Confidence</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-value">${avgTime}</div>
                    <div class="stat-label">Avg Time (ms)</div>
                  </div>
                </div>
              </div>

              <div class="section">
                <div class="section-title">Configuration</div>
                <div class="field-grid">
                  <div class="field-item">
                    <div class="field-label">Executor</div>
                    <div class="field-value">${executor}</div>
                  </div>
                  <div class="field-item">
                    <div class="field-label">Model</div>
                    <div class="field-value">${model}</div>
                  </div>
                  <div class="field-item">
                    <div class="field-label">Temperature</div>
                    <div class="field-value">${temperature}</div>
                  </div>
                  <div class="field-item">
                    <div class="field-label">Type</div>
                    <div class="field-value">${agent.agent_type || "N/A"}</div>
                  </div>
                  <div class="field-item">
                    <div class="field-label">First Observed</div>
                    <div class="field-value">${agent.metadata?.created || "N/A"}</div>
                  </div>
                  <div class="field-item">
                    <div class="field-label">Researcher</div>
                    <div class="field-value">${agent.metadata?.author || "N/A"}</div>
                  </div>
                </div>
              </div>

              <div class="section">
                <div class="section-title">Knowledge Graph (Ontology)</div>
                <div class="field-grid">
                  <div class="field-item">
                    <div class="field-label">Entities</div>
                    <div class="field-value">${ontology.entities || 0}</div>
                  </div>
                  <div class="field-item">
                    <div class="field-label">Relationships</div>
                    <div class="field-value">${ontology.relationships || 0}</div>
                  </div>
                  <div class="field-item">
                    <div class="field-label">Evolution Commits</div>
                    <div class="field-value">${ontology.evolution_commits || 0}</div>
                  </div>
                  <div class="field-item">
                    <div class="field-label">Last Updated</div>
                    <div class="field-value">${ontology.last_updated ? new Date(ontology.last_updated).toLocaleDateString() : "N/A"}</div>
                  </div>
                </div>
                <a href="/agent/${agentId}/ontology" class="view-link">
                  View Knowledge Graph →
                </a>
                <a href="/agent/${agentId}/projector" class="view-link" style="margin-top: 6px;">
                  Embedding Projector →
                </a>
              </div>

              ${
                agent.dreaming
                  ? `
              <div class="section">
                <div class="section-title">Active Dreaming Memory</div>
                <div class="field-grid">
                  <div class="field-item">
                    <div class="field-label">Budget Credits</div>
                    <div class="field-value">${agent.dreaming.budget_credits}</div>
                  </div>
                  <div class="field-item">
                    <div class="field-label">Credits Used</div>
                    <div class="field-value">${agent.dreaming.credits_used}</div>
                  </div>
                  <div class="field-item">
                    <div class="field-label">Credits Remaining</div>
                    <div class="field-value">${agent.dreaming.credits_remaining}</div>
                  </div>
                </div>
                <div class="dream-bar">
                  <div class="dream-bar-fill" style="width: ${agent.dreaming.budget_credits > 0 ? (agent.dreaming.credits_used / agent.dreaming.budget_credits) * 100 : 0}%"></div>
                </div>
              </div>
              `
                  : ""
              }

              ${
                wallet || cost > 0
                  ? `
              <div class="section">
                <div class="section-title">Economic Ledger</div>
                <div class="field-grid">
                  ${
                    wallet?.public_address
                      ? `
                  <div class="field-item" style="grid-column: span 2;">
                    <div class="field-label">Public Crypto Wallet</div>
                    <div class="field-value" style="font-family: 'SF Mono', monospace; font-size: 0.85em;">${wallet.public_address}</div>
                  </div>
                  `
                      : ""
                  }
                  ${
                    wallet?.balance !== undefined
                      ? `
                  <div class="field-item">
                    <div class="field-label">Balance</div>
                    <div class="field-value">${wallet.balance} ${wallet.currency || "USD"}</div>
                  </div>
                  `
                      : ""
                  }
                  ${
                    wallet?.budget
                      ? `
                  <div class="field-item">
                    <div class="field-label">Budget</div>
                    <div class="field-value">${wallet.budget} ${wallet.currency || "USD"}</div>
                  </div>
                  `
                      : ""
                  }
                </div>
                <div class="field-label" style="margin-top: 20px; margin-bottom: 12px;">Cost Statistics</div>
                <div class="stats-grid">
                  <div class="stat-card">
                    <div class="stat-value">$${cost.toFixed(6)}</div>
                    <div class="stat-label">Total Cost</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-value">$${totalExec > 0 ? (cost / totalExec).toFixed(6) : "0.00"}</div>
                    <div class="stat-label">Per Execution</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-value">$${agent.usage?.last_30_days?.cost_usd?.toFixed(6) || "0.00"}</div>
                    <div class="stat-label">Last 30 Days</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-value">${agent.usage?.total_tokens_used || 0}</div>
                    <div class="stat-label">Total Tokens</div>
                  </div>
                </div>
              </div>
              `
                  : ""
              }

              ${
                mcpTools.length > 0
                  ? `
              <div class="section">
                <div class="section-title">MCP Tools</div>
                <div class="field-grid">
                  ${mcpTools
                    .map(
                      (tool) => `
                    <div class="field-item">
                      <div class="field-label">${tool.name || tool}</div>
                      <div class="field-value">${tool.description || "MCP Tool"}</div>
                    </div>
                  `,
                    )
                    .join("")}
                </div>
              </div>
              `
                  : ""
              }

              ${
                secrets
                  ? `
              <div class="section">
                <div class="section-title">Credentials Registry</div>
                <div class="notice-box">
                  <strong>Security Notice</strong>
                  This specimen requires ${Object.keys(secrets).length} credential(s) to operate.
                </div>
                ${Object.keys(secrets)
                  .map(
                    (key) => `
                  <div class="credential-item">
                    <span class="credential-key">${key}</span>
                    <span class="${secrets[key] ? "status-ok" : "status-missing"}">
                      ${secrets[key] ? "✓ Configured" : "✗ Missing"}
                    </span>
                  </div>
                `,
                  )
                  .join("")}
              </div>
              `
                  : ""
              }

              ${
                skills.length > 0 || agent.metadata?.tags
                  ? `
              <div class="section">
                <div class="section-title">Taxonomic Classifications</div>
                ${
                  skills.length > 0
                    ? `
                <div class="field-label" style="margin-bottom: 8px;">Skills</div>
                <div class="tags">
                  ${skills.map((skill) => `<span class="tag">${skill}</span>`).join("")}
                </div>
                `
                    : ""
                }
                ${
                  agent.metadata?.tags
                    ? `
                <div class="field-label" style="margin-top: 16px; margin-bottom: 8px;">Tags</div>
                <div class="tags">
                  ${agent.metadata.tags.map((tag) => `<span class="tag">${tag}</span>`).join("")}
                </div>
                `
                    : ""
                }
              </div>
              `
                  : ""
              }
            </div>
          `;
        } catch (error) {
          console.error("Error loading agent:", error);
          document.getElementById("agent-content").innerHTML = `
            <div class="error-message">
              Error loading specimen details. Please try again later.
            </div>
          `;
        }
      }

      loadAgentDetail().then(() => initCognitionCanvases());
    </script>

    <script>
      function initCognitionCanvases() {
        const kgCanvas = document.getElementById("canvas-kg");
        const embCanvas = document.getElementById("canvas-emb");
        if (!kgCanvas || !embCanvas) return;

        const agentId = window.location.pathname.split("/").pop();
        const isDark = () =>
          !document.documentElement.classList.contains("theme-op1");

        // ─── Color helpers ───
        function colors() {
          return isDark()
            ? {
                bg: "#3c3836",
                node: "#fabd2f",
                edge: "#504945",
                nodeAlt: "#83a598",
                nodeWarm: "#fe8019",
                nodePurple: "#d3869b",
                text: "#bdae93",
                particle: "#83a598",
                pRule: "#b8bb26",
                pEntity: "#fe8019",
                pComm: "#d3869b",
              }
            : {
                bg: "#f0f0eb",
                node: "#ff6b00",
                edge: "#e0e0db",
                nodeAlt: "#1e88e5",
                nodeWarm: "#ef6c00",
                nodePurple: "#8e24aa",
                text: "#6b6b6b",
                particle: "#1e88e5",
                pRule: "#43a047",
                pEntity: "#ef6c00",
                pComm: "#8e24aa",
              };
        }

        // ─── Knowledge Graph Canvas ───
        (function () {
          const canvas = kgCanvas;
          const ctx = canvas.getContext("2d");
          const dpr = window.devicePixelRatio || 1;

          function resize() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
          }
          resize();

          // Generate a plausible small graph
          const nodeCount = 12 + Math.floor(Math.random() * 8);
          const nodes = [];
          const edges = [];
          const w = () => canvas.getBoundingClientRect().width;
          const h = () => canvas.getBoundingClientRect().height;

          for (let i = 0; i < nodeCount; i++) {
            const type =
              i < 3 ? "hub" : Math.random() < 0.3 ? "rule" : "entity";
            nodes.push({
              x: 40 + Math.random() * (w() - 80),
              y: 30 + Math.random() * (h() - 60),
              vx: (Math.random() - 0.5) * 0.3,
              vy: (Math.random() - 0.5) * 0.3,
              r: type === "hub" ? 5 : type === "rule" ? 3.5 : 2.5,
              type,
              pulse: Math.random() * Math.PI * 2,
            });
          }

          // Build edges — hubs connect broadly, others sparsely
          for (let i = 0; i < nodeCount; i++) {
            const conns =
              nodes[i].type === "hub" ? 4 : 1 + Math.floor(Math.random() * 2);
            for (let c = 0; c < conns; c++) {
              const j = Math.floor(Math.random() * nodeCount);
              if (j !== i) edges.push([i, j]);
            }
          }

          let kgNodeCount = nodeCount;
          let kgEdgeCount = edges.length;

          // Try loading real ontology data for stat display
          fetch(`/api/agents/${agentId}/ontology`)
            .then((r) => (r.ok ? r.json() : null))
            .then((data) => {
              if (data && data.stats) {
                kgNodeCount = data.stats.entity_count || nodeCount;
                kgEdgeCount = data.stats.fact_count || edges.length;
              }
              const el = document.getElementById("kg-stat");
              if (el)
                el.textContent = `${kgNodeCount} entities / ${kgEdgeCount} facts`;
            })
            .catch(() => {});

          function tick() {
            const c = colors();
            const cw = w();
            const ch = h();
            ctx.clearRect(0, 0, cw, ch);

            // Simple force simulation
            for (let i = 0; i < nodes.length; i++) {
              const n = nodes[i];
              // Repulsion
              for (let j = i + 1; j < nodes.length; j++) {
                const m = nodes[j];
                let dx = n.x - m.x,
                  dy = n.y - m.y;
                let d2 = dx * dx + dy * dy;
                if (d2 < 1) d2 = 1;
                const f = 30 / d2;
                n.vx += dx * f;
                n.vy += dy * f;
                m.vx -= dx * f;
                m.vy -= dy * f;
              }
            }

            // Edge attraction
            for (const [i, j] of edges) {
              const a = nodes[i],
                b = nodes[j];
              const dx = b.x - a.x,
                dy = b.y - a.y;
              const d = Math.sqrt(dx * dx + dy * dy);
              const f = (d - 50) * 0.003;
              a.vx += dx * f;
              a.vy += dy * f;
              b.vx -= dx * f;
              b.vy -= dy * f;
            }

            // Center gravity + integration
            const cx = cw / 2,
              cy = ch / 2;
            for (const n of nodes) {
              n.vx += (cx - n.x) * 0.001;
              n.vy += (cy - n.y) * 0.001;
              n.vx *= 0.92;
              n.vy *= 0.92;
              n.x += n.vx;
              n.y += n.vy;
              n.x = Math.max(10, Math.min(cw - 10, n.x));
              n.y = Math.max(10, Math.min(ch - 10, n.y));
              n.pulse += 0.02;
            }

            // Draw edges
            ctx.strokeStyle = c.edge;
            ctx.lineWidth = 0.5;
            for (const [i, j] of edges) {
              ctx.beginPath();
              ctx.moveTo(nodes[i].x, nodes[i].y);
              ctx.lineTo(nodes[j].x, nodes[j].y);
              ctx.stroke();
            }

            // Draw nodes
            for (const n of nodes) {
              const pulseFactor = 1 + Math.sin(n.pulse) * 0.15;
              const r = n.r * pulseFactor;
              const fill =
                n.type === "hub"
                  ? c.node
                  : n.type === "rule"
                    ? c.nodeAlt
                    : c.nodeWarm;

              ctx.beginPath();
              ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
              ctx.fillStyle = fill;
              ctx.globalAlpha = 0.8;
              ctx.fill();

              // Glow
              ctx.beginPath();
              ctx.arc(n.x, n.y, r + 3, 0, Math.PI * 2);
              ctx.fillStyle = fill;
              ctx.globalAlpha = 0.08;
              ctx.fill();
              ctx.globalAlpha = 1;
            }

            requestAnimationFrame(tick);
          }
          tick();

          window.addEventListener("resize", resize);
        })();

        // ─── Embedding Space Canvas ───
        (function () {
          const canvas = embCanvas;
          const ctx = canvas.getContext("2d");
          const dpr = window.devicePixelRatio || 1;

          function resize() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
          }
          resize();

          const w = () => canvas.getBoundingClientRect().width;
          const h = () => canvas.getBoundingClientRect().height;

          // Generate particle cloud
          const particles = [];
          const count = 60 + Math.floor(Math.random() * 40);
          for (let i = 0; i < count; i++) {
            const type = Math.random();
            particles.push({
              // Spherical coordinates for 3D rotation
              theta: Math.random() * Math.PI * 2,
              phi: Math.acos(2 * Math.random() - 1),
              r: 0.3 + Math.random() * 0.6,
              size: 1 + Math.random() * 2.5,
              source:
                type < 0.5
                  ? "episode"
                  : type < 0.7
                    ? "rule"
                    : type < 0.9
                      ? "entity"
                      : "community",
            });
          }

          let angle = 0;
          let embPointCount = count;

          // Try loading real projection data for stat display
          fetch(`/api/agents/${agentId}/projections?dimensions=3`)
            .then((r) => (r.ok ? r.json() : null))
            .then((data) => {
              if (data && data.point_count) {
                embPointCount = data.point_count;
                const ev = data.explained_variance;
                const evStr = ev ? ` / ${(ev[0] * 100).toFixed(0)}% var` : "";
                const el = document.getElementById("emb-stat");
                if (el) el.textContent = `${embPointCount} vectors${evStr}`;
              }
            })
            .catch(() => {
              const el = document.getElementById("emb-stat");
              if (el) el.textContent = `${embPointCount} vectors`;
            });

          function tick() {
            const c = colors();
            const cw = w();
            const ch = h();
            ctx.clearRect(0, 0, cw, ch);
            angle += 0.004;

            const cx = cw / 2,
              cy = ch / 2;
            const scale = Math.min(cw, ch) * 0.35;

            // Sort by z for painter's algorithm
            const projected = particles
              .map((p) => {
                const x3 = p.r * Math.sin(p.phi) * Math.cos(p.theta + angle);
                const y3 = p.r * Math.sin(p.phi) * Math.sin(p.theta + angle);
                const z3 = p.r * Math.cos(p.phi);
                // Rotate around Y axis
                const rx =
                  x3 * Math.cos(angle * 0.3) - z3 * Math.sin(angle * 0.3);
                const rz =
                  x3 * Math.sin(angle * 0.3) + z3 * Math.cos(angle * 0.3);
                return {
                  x: cx + rx * scale,
                  y: cy + y3 * scale,
                  z: rz,
                  size: p.size,
                  source: p.source,
                };
              })
              .sort((a, b) => a.z - b.z);

            for (const p of projected) {
              const depth = (p.z + 1) / 2; // 0..1
              const alpha = 0.3 + depth * 0.6;
              const s = p.size * (0.6 + depth * 0.8);

              let fill;
              switch (p.source) {
                case "episode":
                  fill = c.particle;
                  break;
                case "rule":
                  fill = c.pRule;
                  break;
                case "entity":
                  fill = c.pEntity;
                  break;
                case "community":
                  fill = c.pComm;
                  break;
              }

              ctx.beginPath();
              ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
              ctx.fillStyle = fill;
              ctx.globalAlpha = alpha;
              ctx.fill();

              // Subtle glow for foreground particles
              if (depth > 0.7) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, s + 2, 0, Math.PI * 2);
                ctx.fillStyle = fill;
                ctx.globalAlpha = 0.06;
                ctx.fill();
              }
              ctx.globalAlpha = 1;
            }

            // Axis lines (subtle)
            ctx.strokeStyle = c.edge;
            ctx.lineWidth = 0.5;
            ctx.globalAlpha = 0.3;
            // X axis
            ctx.beginPath();
            ctx.moveTo(cx - scale * 0.8, cy);
            ctx.lineTo(cx + scale * 0.8, cy);
            ctx.stroke();
            // Y axis
            ctx.beginPath();
            ctx.moveTo(cx, cy - scale * 0.8);
            ctx.lineTo(cx, cy + scale * 0.8);
            ctx.stroke();
            ctx.globalAlpha = 1;

            requestAnimationFrame(tick);
          }
          tick();

          window.addEventListener("resize", resize);
        })();
      }
    </script>

    <script>
      const themes = ["hasui", "op1"];
      const labels = { hasui: "OP-1", op1: "HASUI" };
      function setTheme(theme) {
        document.documentElement.className = "theme-" + theme;
        localStorage.setItem("fermi-theme", theme);
        document.getElementById("theme-toggle").textContent = labels[theme];
      }
      const saved = localStorage.getItem("fermi-theme");
      if (saved && themes.includes(saved)) setTheme(saved);
      document.getElementById("theme-toggle").addEventListener("click", () => {
        const current = localStorage.getItem("fermi-theme") || "hasui";
        setTheme(current === "hasui" ? "op1" : "hasui");
      });
      document.addEventListener("keydown", (e) => {
        if (e.ctrlKey && e.key === "t") {
          e.preventDefault();
          document.getElementById("theme-toggle").click();
        }
      });
    </script>
    <script>
      (async function () {
        const area = document.getElementById("user-area");
        try {
          const res = await fetch("/api/auth/me");
          if (res.ok) {
            const user = await res.json();
            const name = user.display_name || user.email || "User";
            area.innerHTML =
              '<span class="auth-user">' +
              name +
              "</span>" +
              "<button class=\"auth-logout\" onclick=\"fetch('/auth/logout',{method:'POST'}).then(()=>location.reload())\">sign out</button>";
          } else {
            area.innerHTML =
              '<a href="/auth/google" class="auth-btn">Google</a>' +
              '<a href="/auth/github" class="auth-btn">GitHub</a>';
          }
        } catch (e) {
          area.innerHTML =
            '<a href="/auth/google" class="auth-btn">Google</a>' +
            '<a href="/auth/github" class="auth-btn">GitHub</a>';
        }
      })();
    </script>
    <script>
      function toggleExecutePanel() {
        const panel = document.getElementById("execute-panel");
        panel.style.display = panel.style.display === "none" ? "block" : "none";
        if (panel.style.display === "block")
          document.getElementById("exec-query").focus();
      }
      async function executeAgent() {
        const query = document.getElementById("exec-query").value.trim();
        if (!query) return;
        const resultEl = document.getElementById("exec-result");
        resultEl.textContent = "Executing...";
        const agentId = window.location.pathname
          .split("/")
          .filter(Boolean)
          .pop();
        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/execute`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ query }),
            },
          );
          if (res.ok) {
            const data = await res.json();
            resultEl.textContent = JSON.stringify(data, null, 2);
          } else {
            resultEl.textContent = "Error: " + (await res.text());
          }
        } catch (e) {
          resultEl.textContent = "Network error: " + e.message;
        }
      }
    </script>
  </body>
