<!doctype html>
<html lang="en" class="theme-hasui">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Specimen Details - Agent Bestiary</title>
    <link rel="stylesheet" href="/static/css/variables.css" />
    <link rel="stylesheet" href="/static/css/common.css" />
    <link rel="stylesheet" href="/static/css/components.css" />
    <style>
      body {
        padding: 20px;
        line-height: 1.5;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .back-button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--fg3);
        text-decoration: none;
        font-size: 0.85em;
        margin-bottom: 20px;
        padding: 6px 12px;
        background: transparent;
        border: 1px solid var(--bg2);
        border-radius: 4px;
        transition: all 0.2s ease;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .back-button:hover {
        background: var(--bg1);
        border-color: var(--yellow);
        color: var(--yellow);
      }

      .specimen-header {
        display: flex;
        gap: 24px;
        margin-bottom: 24px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--bg2);
        align-items: flex-start;
      }

      .hire-button {
        margin-left: auto;
        padding: 10px 20px;
        background: var(--yellow);
        color: var(--bg0-hard);
        border: none;
        border-radius: 4px;
        font-size: 0.9em;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
      }

      .hire-button:hover {
        background: var(--orange);
        transform: translateY(-1px);
      }

      .hire-button:active {
        transform: translateY(0);
      }

      .specimen-avatar-large {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: var(--bg2);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 2px solid var(--bg3);
        flex-shrink: 0;
      }

      .specimen-avatar-large img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: sepia(10%) saturate(90%);
      }

      .specimen-avatar-large.loading {
        animation: pulse 2s ease-in-out infinite;
      }

      .specimen-avatar-large .placeholder {
        font-size: 4em;
        filter: grayscale(100%);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .specimen-header-info {
        flex: 1;
      }

      .specimen-title {
        font-size: 1.6em;
        font-weight: 400;
        color: var(--fg0);
        margin-bottom: 8px;
        text-transform: capitalize;
        letter-spacing: -0.01em;
      }

      .specimen-description {
        color: var(--fg3);
        font-size: 0.9em;
        margin-bottom: 12px;
        line-height: 1.5;
      }

      .badges {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .badge {
        padding: 3px 10px;
        background: transparent;
        color: var(--yellow);
        border-radius: 3px;
        font-size: 0.75em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 500;
      }

      .sections {
        display: grid;
        gap: 16px;
      }

      .section {
        background: var(--bg1);
        padding: 16px 20px;
        border-radius: 4px;
        border: 1px solid var(--bg2);
      }

      .section-title {
        font-size: 0.95em;
        font-weight: 400;
        color: var(--fg0);
        margin-bottom: 14px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 12px;
      }

      .field-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .field-label {
        color: var(--gray);
        font-size: 0.7em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 500;
      }

      .field-value {
        color: var(--fg1);
        font-size: 0.9em;
        word-break: break-word;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 16px;
      }

      .stat-card {
        text-align: center;
        padding: 12px;
        background: var(--bg0);
        border-radius: 4px;
        border: 1px solid var(--bg2);
      }

      .stat-value {
        font-size: 1.6em;
        font-weight: 400;
        color: var(--yellow);
        line-height: 1;
      }

      .stat-label {
        color: var(--gray);
        margin-top: 6px;
        font-size: 0.7em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 400;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tag {
        background: var(--bg2);
        color: var(--aqua);
        padding: 6px 12px;
        border: 1px solid var(--bg3);
        border-radius: 4px;
        font-size: 0.85em;
        font-weight: 500;
      }

      .notice-box {
        background: var(--bg0);
        border-left: 3px solid var(--orange);
        padding: 16px;
        margin-top: 12px;
        color: var(--fg2);
        font-size: 0.9em;
        border-radius: 0 4px 4px 0;
      }

      .notice-box strong {
        color: var(--orange);
        display: block;
        margin-bottom: 8px;
      }

      .credential-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        background: var(--bg2);
        border: 1px solid var(--bg3);
        border-radius: 4px;
        margin-top: 8px;
        font-size: 0.9em;
      }

      .credential-key {
        font-family: "SF Mono", "Monaco", "Courier New", monospace;
        color: var(--fg1);
        font-size: 0.9em;
      }

      .status-ok {
        color: var(--green);
        font-weight: 600;
      }

      .status-missing {
        color: var(--red);
        font-weight: 600;
      }

      .view-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        background: transparent;
        color: var(--yellow);
        text-decoration: none;
        border: 1px solid var(--bg3);
        border-radius: 3px;
        font-size: 0.8em;
        font-weight: 400;
        transition: all 0.2s ease;
        margin-top: 10px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .view-link:hover {
        background: var(--bg2);
        border-color: var(--yellow);
      }

      .loading-spinner {
        text-align: center;
        color: var(--fg3);
        font-size: 1.2em;
        padding: 40px;
      }

      .error-message {
        background: var(--bg1);
        border: 1px solid var(--red);
        color: var(--red);
        padding: 30px;
        border-radius: 6px;
        text-align: center;
      }

      .empty-state {
        color: var(--gray);
        font-size: 0.9em;
        font-style: italic;
      }

      /* ─── Dual Cognition Canvas ─── */
      .cognition-panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 20px;
      }

      .cognition-card {
        background: var(--bg1);
        border: 1px solid var(--bg2);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
      }

      .cognition-label {
        position: absolute;
        top: 8px;
        left: 12px;
        font-size: 0.65em;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--fg3);
        z-index: 2;
        background: var(--bg1);
        padding: 2px 6px;
        border-radius: 2px;
      }

      .cognition-stat {
        position: absolute;
        bottom: 8px;
        right: 12px;
        font-size: 0.7em;
        color: var(--fg3);
        z-index: 2;
        font-variant-numeric: tabular-nums;
      }

      .cognition-canvas {
        width: 100%;
        height: 180px;
        display: block;
      }

      @media (max-width: 640px) {
        .cognition-panel {
          grid-template-columns: 1fr;
        }
      }

      /* ─── Dreaming Section ─── */
      .dream-bar {
        height: 6px;
        background: var(--bg2);
        border-radius: 3px;
        overflow: hidden;
        margin-top: 8px;
      }

      .dream-bar-fill {
        height: 100%;
        background: var(--purple);
        border-radius: 3px;
        transition: width 0.5s ease;
      }

      /* OP-1 Theme — page-specific overrides */
      .theme-op1 .specimen-avatar-large {
        border: 3px solid #1a1a1a;
        background: #5ac8fa;
      }

      .theme-op1 .specimen-avatar-large img {
        display: none;
      }

      .theme-op1 .specimen-avatar-large .placeholder {
        display: none;
      }

      .theme-op1 .specimen-card {
        border-radius: 0;
      }

      .theme-op1 .section {
        border-radius: 0;
      }

      .theme-op1 .stat-card {
        border-radius: 0;
      }

      .theme-op1 .tag {
        border-radius: 0;
        color: var(--blue);
      }

      .detail-header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      /* Owner Actions Panel */
      .owner-panel {
        background: var(--bg1);
        border: 1px solid var(--yellow);
        padding: 16px 20px;
        margin-bottom: 16px;
      }
      .owner-panel-title {
        font-size: 0.75em;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--yellow);
        margin-bottom: 12px;
      }
      .owner-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .owner-btn {
        background: transparent;
        border: 1px solid var(--bg3);
        color: var(--fg3);
        padding: 6px 14px;
        font-size: 0.8em;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.2s;
      }
      .owner-btn:hover {
        border-color: var(--yellow);
        color: var(--yellow);
      }
      .owner-btn.danger {
        border-color: var(--red);
        color: var(--red);
      }
      .owner-btn.danger:hover {
        background: var(--red);
        color: var(--bg0);
      }

      /* Inline Edit */
      .edit-field {
        display: none;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--bg3);
      }
      .edit-field.visible {
        display: block;
      }
      .edit-field label {
        display: block;
        font-size: 0.75em;
        color: var(--gray);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 4px;
        margin-top: 10px;
      }
      .edit-field input,
      .edit-field textarea,
      .edit-field select {
        width: 100%;
        background: var(--bg0);
        border: 1px solid var(--bg3);
        color: var(--fg1);
        padding: 8px 10px;
        font-family: inherit;
        font-size: 0.9em;
      }
      .edit-field textarea {
        min-height: 80px;
        resize: vertical;
      }
      .edit-field .edit-save-row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      /* Execution History */
      .episodes-list {
        margin-top: 12px;
      }
      .episode-row {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--bg2);
        font-size: 0.85em;
        align-items: center;
      }
      .episode-query {
        color: var(--fg1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .episode-status {
        padding: 2px 8px;
        font-size: 0.75em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .episode-status.success {
        color: var(--green);
        border: 1px solid var(--green);
      }
      .episode-status.failure {
        color: var(--red);
        border: 1px solid var(--red);
      }
      .episode-status.partial {
        color: var(--yellow);
        border: 1px solid var(--yellow);
      }
      .episode-time {
        color: var(--gray);
        font-size: 0.8em;
      }
      .episode-cost {
        color: var(--fg3);
        font-size: 0.8em;
      }
      .episodes-pagination {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 12px;
      }

      /* Delete Confirmation Modal */
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 1000;
        justify-content: center;
        align-items: center;
      }
      .modal-overlay.visible {
        display: flex;
      }
      .modal-box {
        background: var(--bg1);
        border: 1px solid var(--red);
        padding: 24px;
        max-width: 400px;
        width: 90%;
      }
      .modal-box h3 {
        color: var(--red);
        margin-bottom: 12px;
        font-size: 1em;
      }
      .modal-box p {
        color: var(--fg2);
        font-size: 0.9em;
        margin-bottom: 16px;
      }
      .modal-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      /* Topup */
      .topup-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
      }
      .topup-row input[type="number"] {
        width: 80px;
        background: var(--bg0);
        border: 1px solid var(--bg3);
        color: var(--fg1);
        padding: 6px 8px;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 12px 20px;
          border-bottom: 1px solid var(--bg2);
        "
      >
        <a
          href="/"
          style="
            color: var(--fg1);
            text-decoration: none;
            font-size: 1.1em;
            font-weight: 600;
          "
          >Agent Bestiary</a
        >
        <div style="display: flex; align-items: center; gap: 16px">
          <a href="/catalogue">Catalogue</a>
          <a href="/dashboard">Dashboard</a>
          <div id="user-area" class="auth-area"></div>
          <button
            id="theme-toggle"
            class="theme-toggle-btn"
            title="Toggle Theme (Ctrl+T)"
          >
            OP-1
          </button>
        </div>
      </header>

      <div id="owner-panel-slot"></div>
      <div id="agent-content">
        <div class="loading-spinner">Loading specimen details...</div>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="delete-modal">
      <div class="modal-box">
        <h3>Delete Agent</h3>
        <p>
          This action cannot be undone. The agent and all its episodes, rules,
          and ontology data will be permanently deleted.
        </p>
        <div class="modal-actions">
          <button
            class="owner-btn"
            onclick="
              document
                .getElementById('delete-modal')
                .classList.remove('visible')
            "
          >
            Cancel
          </button>
          <button class="owner-btn danger" onclick="confirmDelete()">
            Delete Permanently
          </button>
        </div>
      </div>
    </div>

    <script src="/static/js/widgets/toast.js"></script>
    <script src="/static/js/widgets/modal.js"></script>
    <script src="/static/js/widgets/fork-modal.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
      async function loadAgentDetail() {
        const pathParts = window.location.pathname.split("/");
        const agentId = pathParts[pathParts.length - 1];

        try {
          const response = await fetch("/api/agents");
          const data = await response.json();

          const agent = data.agents.find((a) => a.agent_id === agentId);

          if (!agent) {
            document.getElementById("agent-content").innerHTML = `
              <div class="error-message">
                Specimen not found in catalogue
              </div>
            `;
            return;
          }

          // Load cached avatar
          const avatarResponse = await fetch(`/api/agents/${agentId}/avatar`);
          let avatarUrl = null;
          if (avatarResponse.ok) {
            const avatarData = await avatarResponse.json();
            avatarUrl = `data:${avatarData.image.mime_type};base64,${avatarData.image.data}`;
          }

          const displayName =
            agent.display_alias && agent.display_alias !== ""
              ? agent.display_alias
              : agentId.replace(/_/g, " ");
          const skills = agent.capabilities?.skills || [];
          const mcpTools = agent.capabilities?.mcp_tools || [];
          const model = agent.model || agent.capabilities?.model || "N/A";
          const executor = agent.capabilities?.executor || "N/A";
          const temperature = agent.capabilities?.temperature || "N/A";
          const tags = agent.tags || agent.metadata?.tags || [];

          const totalExec =
            agent.execution_stats?.total_executions ||
            agent.usage?.total_executions ||
            0;
          const successExec =
            agent.execution_stats?.successful_executions ||
            agent.usage?.successful_executions ||
            0;
          const failedExec =
            agent.execution_stats?.failed_executions ||
            agent.usage?.failed_executions ||
            0;
          const accuracy = agent.performance?.accuracy_rate || 0;
          const confidence = agent.performance?.avg_confidence || 0;
          const cost =
            agent.execution_stats?.total_cost_usd ||
            agent.usage?.total_cost_usd ||
            0;
          const avgTime =
            agent.execution_stats?.avg_execution_time_ms ||
            agent.usage?.avg_execution_time_ms ||
            0;

          const ontology = agent.ontology_stats || {};
          const wallet = agent.wallet || null;
          const secrets = agent.secrets || null;

          // Deterministic color for initial dot
          const hues = [200, 140, 30, 340, 270, 50, 170, 10];
          const hue = hues[agentId.charCodeAt(0) % hues.length];
          const initial = displayName.charAt(0).toUpperCase();

          document.getElementById("agent-content").innerHTML = `
            <div class="specimen-header">
              <div class="specimen-avatar-large" id="avatar"
                   style="${avatarUrl ? "" : `background: hsl(${hue}, 45%, 35%); color: #fff; font-size: 2.8em; font-weight: 300;`}">
                ${avatarUrl ? `<img src="${avatarUrl}" alt="${agentId}">` : initial}
              </div>
              <div class="specimen-header-info">
                <div class="specimen-title">${displayName}</div>
                ${agent.display_alias && agent.display_alias !== "" ? `<div style="font-size:0.8em;color:var(--gray);font-family:'SF Mono',monospace;margin-bottom:6px">${agentId}</div>` : ""}
                <div class="specimen-description">${agent.description || agent.metadata?.description || "A mysterious agent"}</div>
                <div class="badges">
                  <span class="badge">${agent.tier || "curated"}</span>
                  <span class="badge">v${agent.version || "1.0.0"}</span>
                  ${agent.visibility ? `<span class="badge">${agent.visibility}</span>` : ""}
                  ${agent.metadata?.author ? `<span class="badge">${agent.metadata.author}</span>` : ""}
                </div>
              </div>
              <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
                <button class="hire-button" id="execute-btn" onclick="toggleExecutePanel()">
                  Execute Agent
                </button>
                ${
                  !avatarUrl
                    ? `<button class="hire-button" style="background:var(--aqua);font-size:0.75em;padding:6px 12px" onclick="generateNewAvatar('${agentId}')">
                  Generate Avatar (3 cr)
                </button>`
                    : ""
                }
              </div>
            </div>

            <!-- Inline Execute Panel (hidden by default) -->
            <div id="execute-panel" style="display:none;background:var(--bg1);border:1px solid var(--bg3);padding:16px;margin-bottom:16px">
              <div style="font-size:0.85rem;color:var(--yellow);margin-bottom:8px">Execute Agent</div>
              ${(() => {
                const sq =
                  agent.metadata?.sample_queries || agent.sample_queries || [];
                if (sq.length > 0) {
                  return (
                    '<div id="sample-chips" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">' +
                    sq
                      .map(
                        (
                          q,
                        ) => `<button onclick="document.getElementById('exec-query').value=this.textContent;document.getElementById('exec-query').focus()"
                      style="background:transparent;border:1px solid var(--yellow);color:var(--yellow);padding:4px 10px;font-size:0.78rem;cursor:pointer;font-family:inherit;opacity:0.85;transition:opacity 0.15s"
                      onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.85'">${q}</button>`,
                      )
                      .join("") +
                    "</div>"
                  );
                }
                return "";
              })()}
              <div style="display:flex;gap:8px">
                <input type="text" id="exec-query" placeholder="Enter your query..."
                  style="flex:1;background:var(--bg0);border:1px solid var(--bg3);color:var(--fg0);padding:8px 12px;font-family:inherit"
                  onkeydown="if(event.key==='Enter')executeAgent()" />
                <button onclick="executeAgent()" id="exec-run-btn"
                  style="background:transparent;border:1px solid var(--yellow);color:var(--yellow);padding:6px 16px;cursor:pointer;font-family:inherit;white-space:nowrap">
                  Run
                </button>
              </div>
              <div id="exec-result" style="margin-top:12px"></div>
              <div id="execute-hint" style="display:none;margin-top:8px;font-size:0.78rem;color:var(--fg3)">
                Direct execution costs credits per query. <a href="#" id="hire-link" style="color:var(--aqua)">Hire to a workspace</a> for team access.
              </div>
            </div>

            <!-- MCP Endpoint -->
            <div style="margin-bottom:16px;padding:10px 14px;background:var(--bg1);border:1px solid var(--bg2);font-size:0.78rem;display:flex;align-items:center;justify-content:space-between;gap:12px">
              <div style="color:var(--fg3)">
                <span style="color:var(--aqua);font-weight:500">MCP</span>
                <code id="mcp-url" style="margin-left:8px;color:var(--fg2);user-select:all">${window.location.origin}/mcp/agents/${agentId}</code>
              </div>
              <button onclick="navigator.clipboard.writeText(document.getElementById('mcp-url').textContent);this.textContent='Copied!';setTimeout(()=>this.textContent='Copy',1500)"
                style="background:none;border:1px solid var(--bg3);color:var(--fg3);padding:3px 10px;cursor:pointer;font-size:0.78rem;font-family:inherit;white-space:nowrap">Copy</button>
            </div>

            <div class="cognition-panel">
              <div class="cognition-card">
                <span class="cognition-label">Cognition / Knowledge Graph</span>

    <script>
      function initCognitionCanvases() {
        const kgCanvas = document.getElementById("canvas-kg");
        const embCanvas = document.getElementById("canvas-emb");
        if (!kgCanvas || !embCanvas) return;

        const agentId = window.location.pathname.split("/").pop();
        const isDark = () =>
          !document.documentElement.classList.contains("theme-op1");

        // ─── Color helpers ───
        function colors() {
          return isDark()
            ? {
                bg: "#3c3836",
                node: "#fabd2f",
                edge: "#504945",
                nodeAlt: "#83a598",
                nodeWarm: "#fe8019",
                nodePurple: "#d3869b",
                text: "#bdae93",
                particle: "#83a598",
                pRule: "#b8bb26",
                pEntity: "#fe8019",
                pComm: "#d3869b",
              }
            : {
                bg: "#f0f0eb",
                node: "#ff6b00",
                edge: "#e0e0db",
                nodeAlt: "#1e88e5",
                nodeWarm: "#ef6c00",
                nodePurple: "#8e24aa",
                text: "#6b6b6b",
                particle: "#1e88e5",
                pRule: "#43a047",
                pEntity: "#ef6c00",
                pComm: "#8e24aa",
              };
        }

        // ─── Knowledge Graph Canvas ───
        (function () {
          const canvas = kgCanvas;
          const ctx = canvas.getContext("2d");
          const dpr = window.devicePixelRatio || 1;

          function resize() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
          }
          resize();

          // Generate a plausible small graph
          const nodeCount = 12 + Math.floor(Math.random() * 8);
          const nodes = [];
          const edges = [];
          const w = () => canvas.getBoundingClientRect().width;
          const h = () => canvas.getBoundingClientRect().height;

          for (let i = 0; i < nodeCount; i++) {
            const type =
              i < 3 ? "hub" : Math.random() < 0.3 ? "rule" : "entity";
            nodes.push({
              x: 40 + Math.random() * (w() - 80),
              y: 30 + Math.random() * (h() - 60),
              vx: (Math.random() - 0.5) * 0.3,
              vy: (Math.random() - 0.5) * 0.3,
              r: type === "hub" ? 5 : type === "rule" ? 3.5 : 2.5,
              type,
              pulse: Math.random() * Math.PI * 2,
            });
          }

          // Build edges — hubs connect broadly, others sparsely
          for (let i = 0; i < nodeCount; i++) {
            const conns =
              nodes[i].type === "hub" ? 4 : 1 + Math.floor(Math.random() * 2);
            for (let c = 0; c < conns; c++) {
              const j = Math.floor(Math.random() * nodeCount);
              if (j !== i) edges.push([i, j]);
            }
          }

          let kgNodeCount = nodeCount;
          let kgEdgeCount = edges.length;

          // Try loading real ontology data for stat display
          fetch(`/api/agents/${agentId}/ontology`)
            .then((r) => (r.ok ? r.json() : null))
            .then((data) => {
              if (data && data.stats) {
                kgNodeCount = data.stats.entity_count || nodeCount;
                kgEdgeCount = data.stats.fact_count || edges.length;
              }
              const el = document.getElementById("kg-stat");
              if (el)
                el.textContent = `${kgNodeCount} entities / ${kgEdgeCount} facts`;
            })
            .catch(() => {});

          function tick() {
            const c = colors();
            const cw = w();
            const ch = h();
            ctx.clearRect(0, 0, cw, ch);

            // Simple force simulation
            for (let i = 0; i < nodes.length; i++) {
              const n = nodes[i];
              // Repulsion
              for (let j = i + 1; j < nodes.length; j++) {
                const m = nodes[j];
                let dx = n.x - m.x,
                  dy = n.y - m.y;
                let d2 = dx * dx + dy * dy;
                if (d2 < 1) d2 = 1;
                const f = 30 / d2;
                n.vx += dx * f;
                n.vy += dy * f;
                m.vx -= dx * f;
                m.vy -= dy * f;
              }
            }

            // Edge attraction
            for (const [i, j] of edges) {
              const a = nodes[i],
                b = nodes[j];
              const dx = b.x - a.x,
                dy = b.y - a.y;
              const d = Math.sqrt(dx * dx + dy * dy);
              const f = (d - 50) * 0.003;
              a.vx += dx * f;
              a.vy += dy * f;
              b.vx -= dx * f;
              b.vy -= dy * f;
            }

            // Center gravity + integration
            const cx = cw / 2,
              cy = ch / 2;
            for (const n of nodes) {
              n.vx += (cx - n.x) * 0.001;
              n.vy += (cy - n.y) * 0.001;
              n.vx *= 0.92;
              n.vy *= 0.92;
              n.x += n.vx;
              n.y += n.vy;
              n.x = Math.max(10, Math.min(cw - 10, n.x));
              n.y = Math.max(10, Math.min(ch - 10, n.y));
              n.pulse += 0.02;
            }

            // Draw edges
            ctx.strokeStyle = c.edge;
            ctx.lineWidth = 0.5;
            for (const [i, j] of edges) {
              ctx.beginPath();
              ctx.moveTo(nodes[i].x, nodes[i].y);
              ctx.lineTo(nodes[j].x, nodes[j].y);
              ctx.stroke();
            }

            // Draw nodes
            for (const n of nodes) {
              const pulseFactor = 1 + Math.sin(n.pulse) * 0.15;
              const r = n.r * pulseFactor;
              const fill =
                n.type === "hub"
                  ? c.node
                  : n.type === "rule"
                    ? c.nodeAlt
                    : c.nodeWarm;

              ctx.beginPath();
              ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
              ctx.fillStyle = fill;
              ctx.globalAlpha = 0.8;
              ctx.fill();

              // Glow
              ctx.beginPath();
              ctx.arc(n.x, n.y, r + 3, 0, Math.PI * 2);
              ctx.fillStyle = fill;
              ctx.globalAlpha = 0.08;
              ctx.fill();
              ctx.globalAlpha = 1;
            }

            requestAnimationFrame(tick);
          }
          tick();

          window.addEventListener("resize", resize);
        })();

        // ─── Embedding Space Canvas ───
        (function () {
          const canvas = embCanvas;
          const ctx = canvas.getContext("2d");
          const dpr = window.devicePixelRatio || 1;

          function resize() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
          }
          resize();

          const w = () => canvas.getBoundingClientRect().width;
          const h = () => canvas.getBoundingClientRect().height;

          // Generate particle cloud
          const particles = [];
          const count = 60 + Math.floor(Math.random() * 40);
          for (let i = 0; i < count; i++) {
            const type = Math.random();
            particles.push({
              // Spherical coordinates for 3D rotation
              theta: Math.random() * Math.PI * 2,
              phi: Math.acos(2 * Math.random() - 1),
              r: 0.3 + Math.random() * 0.6,
              size: 1 + Math.random() * 2.5,
              source:
                type < 0.5
                  ? "episode"
                  : type < 0.7
                    ? "rule"
                    : type < 0.9
                      ? "entity"
                      : "community",
            });
          }

          let angle = 0;
          let embPointCount = count;

          // Try loading real projection data for stat display
          fetch(`/api/agents/${agentId}/projections?dimensions=3`)
            .then((r) => (r.ok ? r.json() : null))
            .then((data) => {
              if (data && data.point_count) {
                embPointCount = data.point_count;
                const ev = data.explained_variance;
                const evStr = ev ? ` / ${(ev[0] * 100).toFixed(0)}% var` : "";
                const el = document.getElementById("emb-stat");
                if (el) el.textContent = `${embPointCount} vectors${evStr}`;
              }
            })
            .catch(() => {
              const el = document.getElementById("emb-stat");
              if (el) el.textContent = `${embPointCount} vectors`;
            });

          function tick() {
            const c = colors();
            const cw = w();
            const ch = h();
            ctx.clearRect(0, 0, cw, ch);
            angle += 0.004;

            const cx = cw / 2,
              cy = ch / 2;
            const scale = Math.min(cw, ch) * 0.35;

            // Sort by z for painter's algorithm
            const projected = particles
              .map((p) => {
                const x3 = p.r * Math.sin(p.phi) * Math.cos(p.theta + angle);
                const y3 = p.r * Math.sin(p.phi) * Math.sin(p.theta + angle);
                const z3 = p.r * Math.cos(p.phi);
                // Rotate around Y axis
                const rx =
                  x3 * Math.cos(angle * 0.3) - z3 * Math.sin(angle * 0.3);
                const rz =
                  x3 * Math.sin(angle * 0.3) + z3 * Math.cos(angle * 0.3);
                return {
                  x: cx + rx * scale,
                  y: cy + y3 * scale,
                  z: rz,
                  size: p.size,
                  source: p.source,
                };
              })
              .sort((a, b) => a.z - b.z);

            for (const p of projected) {
              const depth = (p.z + 1) / 2; // 0..1
              const alpha = 0.3 + depth * 0.6;
              const s = p.size * (0.6 + depth * 0.8);

              let fill;
              switch (p.source) {
                case "episode":
                  fill = c.particle;
                  break;
                case "rule":
                  fill = c.pRule;
                  break;
                case "entity":
                  fill = c.pEntity;
                  break;
                case "community":
                  fill = c.pComm;
                  break;
              }

              ctx.beginPath();
              ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
              ctx.fillStyle = fill;
              ctx.globalAlpha = alpha;
              ctx.fill();

              // Subtle glow for foreground particles
              if (depth > 0.7) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, s + 2, 0, Math.PI * 2);
                ctx.fillStyle = fill;
                ctx.globalAlpha = 0.06;
                ctx.fill();
              }
              ctx.globalAlpha = 1;
            }

            // Axis lines (subtle)
            ctx.strokeStyle = c.edge;
            ctx.lineWidth = 0.5;
            ctx.globalAlpha = 0.3;
            // X axis
            ctx.beginPath();
            ctx.moveTo(cx - scale * 0.8, cy);
            ctx.lineTo(cx + scale * 0.8, cy);
            ctx.stroke();
            // Y axis
            ctx.beginPath();
            ctx.moveTo(cx, cy - scale * 0.8);
            ctx.lineTo(cx, cy + scale * 0.8);
            ctx.stroke();
            ctx.globalAlpha = 1;

            requestAnimationFrame(tick);
          }
          tick();

          window.addEventListener("resize", resize);
        })();
      }
    </script>

    <script>
      function toggleExecutePanel() {
        const panel = document.getElementById("execute-panel");
        panel.style.display = panel.style.display === "none" ? "block" : "none";
        if (panel.style.display === "block")
          document.getElementById("exec-query").focus();
      }
      async function generateNewAvatar(agentId) {
        const btn = event.target;
        btn.textContent = "Generating...";
        btn.disabled = true;
        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/avatar/generate`,
            {
              method: "POST",
            },
          );
          if (res.ok) {
            const data = await res.json();
            const avatarDiv = document.getElementById("avatar");
            if (avatarDiv && data.image) {
              avatarDiv.innerHTML = `<img src="data:${data.image.mime_type};base64,${data.image.data}" alt="${agentId}">`;
              avatarDiv.style.background = "";
              avatarDiv.style.color = "";
              avatarDiv.style.fontSize = "";
            }
            btn.parentElement.removeChild(btn);
          } else {
            const err = await res.text();
            btn.textContent = "Failed";
            setTimeout(() => {
              btn.textContent = "Generate Avatar (3 cr)";
              btn.disabled = false;
            }, 2000);
            alert(err);
          }
        } catch (e) {
          btn.textContent = "Generate Avatar (3 cr)";
          btn.disabled = false;
          alert("Network error: " + e.message);
        }
      }

      async function executeAgent() {
        const query = document.getElementById("exec-query").value.trim();
        if (!query) return;
        const resultEl = document.getElementById("exec-result");
        const btn = document.getElementById("exec-run-btn");
        btn.textContent = "Running...";
        btn.disabled = true;
        resultEl.innerHTML =
          '<div style="color:var(--gray);font-size:0.85rem">Executing...</div>';
        const agentId = window.location.pathname
          .split("/")
          .filter(Boolean)
          .pop();
        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/execute`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ query }),
            },
          );
          if (res.ok) {
            const data = await res.json();
            resultEl.innerHTML = renderExecutionResult(data);
          } else if (res.status === 401) {
            resultEl.innerHTML = `<div style="color:var(--yellow);font-size:0.85rem">Sign in to execute agents — <a href="/auth/google" style="color:var(--yellow);text-decoration:underline">Google</a> or <a href="/auth/github" style="color:var(--yellow);text-decoration:underline">GitHub</a></div>`;
          } else {
            const errText = await res.text().catch(() => "Unknown error");
            resultEl.innerHTML = `<div style="color:var(--red);font-size:0.85rem">Error: ${errText}</div>`;
          }
        } catch (e) {
          resultEl.innerHTML = `<div style="color:var(--red);font-size:0.85rem">Network error: ${e.message}</div>`;
        } finally {
          btn.textContent = "Run";
          btn.disabled = false;
        }
      }

      function renderExecutionResult(data) {
        const confidence = data.confidence ?? data.result?.confidence;
        const reasoning = data.reasoning || data.result?.reasoning || "";
        const evidence = data.evidence || data.result?.evidence || [];
        const answer =
          data.answer || data.result?.answer || data.result?.summary || "";

        let html = '<div style="font-size:0.85rem">';

        // Confidence bar
        if (confidence != null) {
          const pct = Math.round(confidence * 100);
          const barColor =
            pct >= 70
              ? "var(--green)"
              : pct >= 40
                ? "var(--yellow)"
                : "var(--red)";
          html += `<div style="margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px">
              <span style="color:var(--fg2)">Confidence</span>
              <span style="color:${barColor};font-weight:600">${pct}%</span>
            </div>
            <div style="background:var(--bg3);height:4px;border-radius:2px;overflow:hidden">
              <div style="background:${barColor};height:100%;width:${pct}%;transition:width 0.3s"></div>
            </div>
          </div>`;
        }

        // Answer / Summary
        if (answer) {
          html += `<div style="color:var(--fg1);margin-bottom:12px;line-height:1.5">${answer}</div>`;
        }

        // Key findings from evidence
        if (evidence.length > 0) {
          html +=
            '<div style="margin-bottom:12px"><div style="color:var(--aqua);font-size:0.8rem;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em">Key Findings</div><ul style="margin:0;padding-left:16px;color:var(--fg2)">';
          evidence.forEach((e) => {
            const text =
              typeof e === "string"
                ? e
                : e.description || e.text || e.finding || JSON.stringify(e);
            html += `<li style="margin-bottom:4px">${text}</li>`;
          });
          html += "</ul></div>";
        }

        // Reasoning (collapsible)
        if (reasoning) {
          html += `<details style="margin-top:8px">
            <summary style="color:var(--gray);font-size:0.8rem;cursor:pointer;user-select:none">Reasoning</summary>
            <div style="color:var(--fg3);margin-top:6px;padding:8px;background:var(--bg0);border-radius:4px;white-space:pre-wrap;font-size:0.82rem;line-height:1.5">${reasoning}</div>
          </details>`;
        }

        // Raw data fallback (collapsible)
        html += `<details style="margin-top:8px">
          <summary style="color:var(--gray);font-size:0.75rem;cursor:pointer;user-select:none">Raw Response</summary>
          <pre style="color:var(--fg3);margin-top:6px;padding:8px;background:var(--bg0);border-radius:4px;font-size:0.75rem;overflow-x:auto">${JSON.stringify(data, null, 2)}</pre>
        </details>`;

        html += "</div>";
        return html;
      }
    </script>

    <!-- Owner Actions Panel -->
    <script>
      (async function initOwnerPanel() {
        const agentId = window.location.pathname
          .split("/")
          .filter(Boolean)
          .pop();
        let currentUser = null;
        try {
          const res = await fetch("/api/auth/me");
          if (res.ok) currentUser = await res.json();
        } catch (e) {
          return;
        }
        if (!currentUser) return;

        // Wait for agent data to load, then check ownership
        const checkOwnership = setInterval(() => {
          const content = document.getElementById("agent-content");
          if (!content || content.querySelector(".loading-spinner")) return;
          clearInterval(checkOwnership);

          // Re-fetch agent to check owner_id
          fetch("/api/agents")
            .then((r) => r.json())
            .then((data) => {
              const agent = data.agents.find((a) => a.agent_id === agentId);
              if (!agent) return;

              // Check if we need owner_id — it comes from the API
              const userId = currentUser.user_id;
              const isOwner = agent.owner_id === userId;
              if (isOwner) {
                renderOwnerPanel(agentId, agent);
              } else {
                // Show fork button for non-owners on published agents
                if (agent.status === "published") {
                  renderForkButton(agentId);
                }
                const hint = document.getElementById("execute-hint");
                if (hint) {
                  hint.style.display = "block";
                  const link = document.getElementById("hire-link");
                  if (link) link.href = "/dashboard";
                }
              }
            });
        }, 200);
      })();

      function renderForkButton(agentId) {
        const slot = document.getElementById("owner-panel-slot");
        slot.innerHTML = `
          <div class="owner-panel" style="border-color:var(--blue)">
            <div class="owner-actions">
              <button class="owner-btn" style="border-color:var(--blue);color:var(--blue)" onclick="ForkModal.open('${agentId}')">Fork This Agent</button>
            </div>
          </div>`;
      }

      function renderOwnerPanel(agentId, agent) {
        const status = agent.status || "draft";
        const statusColors = {
          draft: "var(--yellow)",
          published: "var(--green)",
          archived: "var(--gray)",
        };
        const statusColor = statusColors[status] || "var(--fg)";

        // Build lifecycle buttons based on current status
        let lifecycleBtns = "";
        if (status === "draft") {
          lifecycleBtns = `
            <button class="owner-btn" style="border-color:var(--green);color:var(--green)" onclick="publishAgent('${agentId}')">Publish</button>
            <button class="owner-btn" style="border-color:var(--gray);color:var(--gray)" onclick="archiveAgent('${agentId}')">Archive</button>`;
        } else if (status === "published") {
          lifecycleBtns = `
            <button class="owner-btn" style="border-color:var(--orange);color:var(--orange)" onclick="archiveAgent('${agentId}')">Archive</button>
            <button class="owner-btn" style="border-color:var(--blue);color:var(--blue)" onclick="toggleForkPricingPanel()">Fork Pricing</button>`;
        } else if (status === "archived") {
          lifecycleBtns = `
            <button class="owner-btn" style="border-color:var(--aqua);color:var(--aqua)" onclick="restoreAgent('${agentId}')">Restore to Draft</button>`;
        }

        const slot = document.getElementById("owner-panel-slot");
        slot.innerHTML = `
          <div class="owner-panel">
            <div class="owner-panel-title">
              Owner Actions
              <span style="float:right;font-size:0.75rem;color:${statusColor};border:1px solid ${statusColor};padding:2px 8px;border-radius:4px">${status.toUpperCase()}</span>
            </div>
            <div class="owner-actions">
              ${lifecycleBtns}
              <button class="owner-btn" onclick="toggleEditPanel()">Edit</button>
              <button class="owner-btn" onclick="toggleHistoryPanel()">Execution History</button>
              <button class="owner-btn" onclick="toggleTopupPanel()">Top Up Dreams</button>
              <button class="owner-btn" onclick="toggleConsolidatePanel()">Run Consolidation</button>
              <button class="owner-btn" onclick="toggleVersionsPanel('${agentId}')">Version History</button>
              <button class="owner-btn danger" onclick="document.getElementById('delete-modal').classList.add('visible')">Delete</button>
            </div>

            <!-- Fork Pricing (published agents only) -->
            <div class="edit-field" id="fork-pricing-panel" style="display:none">
              <label>Base Fork Price (credits)</label>
              <input type="number" id="fork-price-base" value="${(agent.fork_pricing || {}).base_price || 0}" min="0" />
              <label>Ontology Price (credits, leave empty to disable)</label>
              <input type="number" id="fork-price-ontology" value="${(agent.fork_pricing || {}).ontology_price ?? ""}" min="0" placeholder="Disabled" />
              <label>Embeddings Price (credits, leave empty to disable)</label>
              <input type="number" id="fork-price-embeddings" value="${(agent.fork_pricing || {}).embedding_price ?? ""}" min="0" placeholder="Disabled" />
              <div class="edit-save-row">
                <button class="owner-btn" onclick="saveForkPricing('${agentId}')" style="border-color:var(--blue);color:var(--blue)">Save Pricing</button>
                <button class="owner-btn" onclick="toggleForkPricingPanel()">Cancel</button>
              </div>
            </div>

            <!-- Inline Edit -->
            <div class="edit-field" id="edit-panel">
              <label>Description</label>
              <textarea id="edit-description">${agent.description || ""}</textarea>
              <label>System Prompt</label>
              <textarea id="edit-system-prompt" style="min-height:120px">${agent.system_prompt || ""}</textarea>
              <label>Tags (comma-separated)</label>
              <input type="text" id="edit-tags" value="${(agent.tags || []).join(", ")}" />
              <label>Visibility</label>
              <select id="edit-visibility">
                <option value="public" ${agent.visibility === "public" ? "selected" : ""}>Public</option>
                <option value="private" ${agent.visibility === "private" ? "selected" : ""}>Private</option>
                <option value="shared" ${agent.visibility === "shared" ? "selected" : ""}>Shared</option>
              </select>
              <div class="edit-save-row">
                <button class="owner-btn" onclick="saveAgentEdits('${agentId}')" style="border-color:var(--green);color:var(--green)">Save Changes</button>
                <button class="owner-btn" onclick="toggleEditPanel()">Cancel</button>
              </div>
            </div>

            <!-- Execution History -->
            <div class="edit-field" id="history-panel">
              <div id="episodes-container">
                <div style="color:var(--gray);font-size:0.85em">Loading...</div>
              </div>
            </div>

            <!-- Dream Budget Top-up -->
            <div class="edit-field" id="topup-panel">
              <div style="font-size:0.85em;color:var(--fg2);margin-bottom:8px">
                Current budget: <strong>${agent.dreaming?.budget_credits || 0}</strong> |
                Used: <strong>${agent.dreaming?.credits_used || 0}</strong> |
                Remaining: <strong>${agent.dreaming?.credits_remaining || 0}</strong>
              </div>
              <div class="topup-row">
                <input type="number" id="topup-amount" min="1" max="1000" value="10" />
                <button class="owner-btn" onclick="topupDreamBudget('${agentId}')" style="border-color:var(--green);color:var(--green)">Top Up (charges credits)</button>
              </div>
              <div id="topup-result" style="margin-top:8px;font-size:0.85em;color:var(--fg3)"></div>
            </div>

            <!-- Consolidation (Dreaming) -->
            <div class="edit-field" id="consolidate-panel">
              <div style="font-size:0.85em;color:var(--fg2);margin-bottom:8px">
                Run a consolidation cycle to extract rules from unconsolidated episodes.
                Costs <strong>${agent.dreaming?.credits_remaining || 0}</strong> dream credit(s) remaining + 3 gas credits from your wallet.
              </div>
              <button class="owner-btn" id="consolidate-btn" onclick="runConsolidation('${agentId}')" style="border-color:var(--aqua);color:var(--aqua)">Consolidate Now</button>
              <div id="consolidate-result" style="margin-top:8px;font-size:0.85em;color:var(--fg3)"></div>
            </div>

            <!-- Version History -->
            <div class="edit-field" id="versions-panel">
              <div id="versions-list" style="font-size:0.85em;color:var(--fg3)">Loading versions...</div>
            </div>
          </div>
        `;
      }

      const ownerPanelIds = [
        "edit-panel",
        "history-panel",
        "topup-panel",
        "consolidate-panel",
        "versions-panel",
      ];
      function hideAllOwnerPanels(except) {
        ownerPanelIds.forEach((id) => {
          if (id !== except)
            document.getElementById(id)?.classList.remove("visible");
        });
      }

      function toggleEditPanel() {
        hideAllOwnerPanels("edit-panel");
        document.getElementById("edit-panel")?.classList.toggle("visible");
      }

      function toggleHistoryPanel() {
        const panel = document.getElementById("history-panel");
        if (!panel) return;
        const wasVisible = panel.classList.contains("visible");
        hideAllOwnerPanels("history-panel");
        panel.classList.toggle("visible");
        if (!wasVisible) loadEpisodes(0);
      }

      function toggleTopupPanel() {
        hideAllOwnerPanels("topup-panel");
        document.getElementById("topup-panel")?.classList.toggle("visible");
      }

      function toggleConsolidatePanel() {
        hideAllOwnerPanels("consolidate-panel");
        document
          .getElementById("consolidate-panel")
          ?.classList.toggle("visible");
      }

      function toggleVersionsPanel(agentId) {
        const panel = document.getElementById("versions-panel");
        if (!panel) return;
        const wasVisible = panel.classList.contains("visible");
        hideAllOwnerPanels("versions-panel");
        panel.classList.toggle("visible");
        if (!wasVisible) loadVersions(agentId);
      }

      async function loadVersions(agentId) {
        const el = document.getElementById("versions-list");
        el.innerHTML = '<span style="color:var(--gray)">Loading...</span>';
        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/versions`,
          );
          const data = await res.json();
          const versions = data.versions || [];
          if (versions.length === 0) {
            el.innerHTML =
              '<span style="color:var(--fg3)">No version history yet. Versions are created when you edit the agent.</span>';
            return;
          }
          el.innerHTML = versions
            .map(
              (v) => `
            <div style="border-bottom:1px solid var(--bg2);padding:8px 0;display:flex;justify-content:space-between;align-items:center">
              <div>
                <strong style="color:var(--fg1)">v${v.version_number}</strong>
                <span style="color:var(--gray);margin-left:8px">${new Date(v.created_at).toLocaleString()}</span>
                <span style="color:var(--fg3);margin-left:8px">${v.changed_by || ""}</span>
                ${v.description ? '<div style="color:var(--fg2);margin-top:2px;font-size:0.8em">' + v.description.substring(0, 80) + (v.description.length > 80 ? "..." : "") + "</div>" : ""}
              </div>
              <button class="owner-btn" onclick="restoreVersion('${agentId}', ${v.version_number})"
                style="font-size:0.75em;padding:2px 8px;border-color:var(--aqua);color:var(--aqua)">Restore</button>
            </div>
          `,
            )
            .join("");
        } catch (e) {
          el.innerHTML = `<span style="color:var(--red)">Failed to load versions: ${e.message}</span>`;
        }
      }

      async function restoreVersion(agentId, versionNum) {
        if (
          !confirm(
            `Restore to version ${versionNum}? Current state will be saved as a new version first.`,
          )
        )
          return;
        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/versions/${versionNum}/restore`,
            { method: "POST" },
          );
          if (!res.ok) {
            const t = await res.text();
            alert("Restore failed: " + t);
            return;
          }
          alert(`Restored to version ${versionNum}. Reloading...`);
          location.reload();
        } catch (e) {
          alert("Error: " + e.message);
        }
      }

      async function runConsolidation(agentId) {
        const btn = document.getElementById("consolidate-btn");
        const resultEl = document.getElementById("consolidate-result");
        btn.disabled = true;
        btn.textContent = "Consolidating...";
        resultEl.innerHTML =
          '<span style="color:var(--gray)">Running consolidation cycle...</span>';
        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/consolidate`,
            {
              method: "POST",
            },
          );
          const data = await res.json();
          if (!res.ok) {
            resultEl.innerHTML = `<span style="color:var(--red)">${data.message || res.statusText || "Failed"}</span>`;
            return;
          }
          const r = data.result;
          resultEl.innerHTML = `<span style="color:var(--green)">
            ${r.episodes_processed} episodes processed, ${r.clusters_identified} clusters,
            ${r.rules_extracted} rules extracted, ${r.entities_created || 0} entities,
            ${r.facts_created || 0} facts.
            Dream credits remaining: ${data.dreaming_credits_remaining}
          </span>`;
        } catch (e) {
          resultEl.innerHTML = `<span style="color:var(--red)">Error: ${e.message}</span>`;
        } finally {
          btn.disabled = false;
          btn.textContent = "Consolidate Now";
        }
      }

      async function saveAgentEdits(agentId) {
        const desc = document.getElementById("edit-description").value;
        const prompt = document.getElementById("edit-system-prompt").value;
        const tagsStr = document.getElementById("edit-tags").value;
        const visibility = document.getElementById("edit-visibility").value;
        const tags = tagsStr
          .split(",")
          .map((t) => t.trim())
          .filter(Boolean);

        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}`,
            {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                description: desc,
                system_prompt: prompt,
                tags,
                visibility,
              }),
            },
          );
          if (res.ok) {
            alert("Agent updated successfully");
            location.reload();
          } else {
            alert("Update failed: " + (await res.text()));
          }
        } catch (e) {
          alert("Network error: " + e.message);
        }
      }

      async function confirmDelete() {
        const agentId = window.location.pathname
          .split("/")
          .filter(Boolean)
          .pop();
        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}`,
            { method: "DELETE" },
          );
          if (res.ok) {
            window.location.href = "/dashboard";
          } else {
            alert("Delete failed: " + (await res.text()));
          }
        } catch (e) {
          alert("Network error: " + e.message);
        }
      }

      // ─── Lifecycle actions ─────────────────────────────────────

      async function publishAgent(agentId) {
        try {
          const checks = await API.get(`/api/agents/${agentId}/publish-checks`);
          if (!checks.can_publish) {
            const failing = checks.checks.filter(
              (c) => !c.passed && c.severity === "Error",
            );
            Toast.show(
              "Cannot publish: " + failing.map((c) => c.message).join("; "),
              "error",
            );
            return;
          }
          const result = await API.post(`/api/agents/${agentId}/publish`);
          Toast.show("Agent published! (1 cr)", "success");
          setTimeout(() => location.reload(), 1200);
        } catch (e) {
          Toast.show(e.message || "Publish failed", "error");
        }
      }

      async function archiveAgent(agentId) {
        if (
          !confirm("Archive this agent? It will be hidden from the catalogue.")
        )
          return;
        try {
          await API.post(`/api/agents/${agentId}/archive`);
          Toast.show("Agent archived", "success");
          setTimeout(() => location.reload(), 1200);
        } catch (e) {
          Toast.show(e.message || "Archive failed", "error");
        }
      }

      async function restoreAgent(agentId) {
        try {
          await API.post(`/api/agents/${agentId}/restore`);
          Toast.show("Agent restored to draft", "success");
          setTimeout(() => location.reload(), 1200);
        } catch (e) {
          Toast.show(e.message || "Restore failed", "error");
        }
      }

      function toggleForkPricingPanel() {
        const p = document.getElementById("fork-pricing-panel");
        if (p) p.style.display = p.style.display === "none" ? "block" : "none";
      }

      async function saveForkPricing(agentId) {
        const base =
          parseInt(document.getElementById("fork-price-base").value) || 0;
        const ontoVal = document.getElementById("fork-price-ontology").value;
        const embVal = document.getElementById("fork-price-embeddings").value;
        const body = {
          base_price: base,
          ontology_price: ontoVal !== "" ? parseInt(ontoVal) : null,
          embedding_price: embVal !== "" ? parseInt(embVal) : null,
        };
        try {
          await API.put(`/api/agents/${agentId}/fork-pricing`, body);
          Toast.show("Fork pricing updated", "success");
          toggleForkPricingPanel();
        } catch (e) {
          Toast.show(e.message || "Failed to save pricing", "error");
        }
      }

      async function loadEpisodes(offset) {
        const agentId = window.location.pathname
          .split("/")
          .filter(Boolean)
          .pop();
        const container = document.getElementById("episodes-container");
        if (!container) return;
        container.innerHTML =
          '<div style="color:var(--gray);font-size:0.85em">Loading...</div>';

        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/episodes?limit=10&offset=${offset}`,
          );
          if (!res.ok) {
            container.innerHTML =
              '<div style="color:var(--red)">Failed to load episodes</div>';
            return;
          }
          const data = await res.json();

          if (data.episodes.length === 0) {
            container.innerHTML =
              '<div style="color:var(--gray);font-size:0.85em">No executions yet</div>';
            return;
          }

          let html = '<div class="episodes-list">';
          data.episodes.forEach((ep) => {
            const date = new Date(ep.timestamp).toLocaleString();
            const costStr = ep.cost_usd
              ? `$${Number(ep.cost_usd).toFixed(6)}`
              : "—";
            html += `
              <div class="episode-row">
                <div class="episode-query" title="${ep.query.replace(/"/g, "&quot;")}">${ep.query}</div>
                <span class="episode-status ${ep.status}">${ep.status}</span>
                <span class="episode-cost">${costStr}</span>
                <span class="episode-time">${date}</span>
              </div>`;
          });
          html += "</div>";

          // Pagination
          if (data.total > 10) {
            html += '<div class="episodes-pagination">';
            if (offset > 0)
              html += `<button class="owner-btn" onclick="loadEpisodes(${offset - 10})">Prev</button>`;
            html += `<span style="color:var(--gray);font-size:0.8em">${offset + 1}-${Math.min(offset + 10, data.total)} of ${data.total}</span>`;
            if (offset + 10 < data.total)
              html += `<button class="owner-btn" onclick="loadEpisodes(${offset + 10})">Next</button>`;
            html += "</div>";
          }

          container.innerHTML = html;
        } catch (e) {
          container.innerHTML =
            '<div style="color:var(--red)">Error: ' + e.message + "</div>";
        }
      }

      async function askPerformanceCoach(agentId) {
        const btn = document.getElementById("coach-btn");
        const status = document.getElementById("coach-status");
        const responseEl = document.getElementById("coach-response");
        btn.disabled = true;
        status.textContent = "Analyzing...";
        responseEl.style.display = "none";

        // Gather stats from the rendered page
        const stats = {};
        document.querySelectorAll(".stat-card").forEach((card) => {
          const label = card.querySelector(".stat-label")?.textContent?.trim();
          const value = card.querySelector(".stat-value")?.textContent?.trim();
          if (label && value) stats[label] = value;
        });

        const query = `Analyze this agent's performance stats and provide coaching recommendations.\n\nAgent: ${document.title.replace(" - Agent Bestiary", "")}\nStats: ${JSON.stringify(stats)}`;

        try {
          const res = await fetch("/api/agents/performance_coach/execute", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query }),
          });
          if (!res.ok) {
            const errText = await res.text();
            status.textContent = "";
            responseEl.style.display = "block";
            responseEl.style.color = "var(--red)";
            responseEl.textContent = "Error: " + errText;
          } else {
            const data = await res.json();
            status.textContent = "";
            responseEl.style.display = "block";
            responseEl.style.color = "var(--fg1)";
            responseEl.textContent =
              data.response || data.content || JSON.stringify(data, null, 2);
          }
        } catch (e) {
          status.textContent = "";
          responseEl.style.display = "block";
          responseEl.style.color = "var(--red)";
          responseEl.textContent = "Network error: " + e.message;
        }
        btn.disabled = false;
      }

      async function topupDreamBudget(agentId) {
        const amount = parseInt(document.getElementById("topup-amount").value);
        const resultEl = document.getElementById("topup-result");
        if (!amount || amount < 1) {
          resultEl.textContent = "Enter a valid amount";
          return;
        }

        resultEl.textContent = "Processing...";
        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/dreaming/topup`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ credits: amount }),
            },
          );
          if (res.ok) {
            const data = await res.json();
            resultEl.style.color = "var(--green)";
            resultEl.textContent = `Added ${data.credits_added} credits. New budget: ${data.new_budget} (${data.credits_remaining} remaining)`;
          } else {
            resultEl.style.color = "var(--red)";
            resultEl.textContent = await res.text();
          }
        } catch (e) {
          resultEl.style.color = "var(--red)";
          resultEl.textContent = "Network error: " + e.message;
        }
      }
