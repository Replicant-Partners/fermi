      async function loadEpisodes(offset) {
        const agentId = window.location.pathname
          .split("/")
          .filter(Boolean)
          .pop();
        const container = document.getElementById("episodes-container");
        if (!container) return;
        container.innerHTML =
          '<div style="color:var(--gray);font-size:0.85em">Loading...</div>';

        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/episodes?limit=10&offset=${offset}`,
          );
          if (!res.ok) {
            container.innerHTML =
              '<div style="color:var(--red)">Failed to load episodes</div>';
            return;
          }
          const data = await res.json();

          if (data.episodes.length === 0) {
            container.innerHTML =
              '<div style="color:var(--gray);font-size:0.85em">No executions yet</div>';
            return;
          }

          let html = '<div class="episodes-list">';
          data.episodes.forEach((ep) => {
            const date = new Date(ep.timestamp).toLocaleString();
            const costStr = ep.cost_usd
              ? `$${Number(ep.cost_usd).toFixed(6)}`
              : "—";
            const safeId = ep.episode_id.replace(/"/g, "&quot;");
            html += `
              <div class="episode-row clickable" onclick="toggleEpisodeDetail('${safeId}', this)" id="ep-row-${safeId}">
                <div class="episode-query" title="${ep.query.replace(/"/g, "&quot;")}">${ep.query}</div>
                <span class="episode-status ${ep.status}">${ep.status}</span>
                <span class="episode-tags">${TagRenderer.render(ep.tags || [], { max: 3 })}</span>
                <span class="episode-cost">${costStr}</span>
                <span class="episode-time">${date}</span>
              </div>
              <div class="episode-detail" id="ep-detail-${safeId}" style="display:none"></div>`;
          });
          html += "</div>";

          // Pagination
          if (data.total > 10) {
            html += '<div class="episodes-pagination">';
            if (offset > 0)
              html += `<button class="owner-btn" onclick="loadEpisodes(${offset - 10})">Prev</button>`;
            html += `<span style="color:var(--gray);font-size:0.8em">${offset + 1}-${Math.min(offset + 10, data.total)} of ${data.total}</span>`;
            if (offset + 10 < data.total)
              html += `<button class="owner-btn" onclick="loadEpisodes(${offset + 10})">Next</button>`;
            html += "</div>";
          }

          container.innerHTML = html;
        } catch (e) {
          container.innerHTML =
            '<div style="color:var(--red)">Error: ' + e.message + "</div>";
        }
      }

      async function toggleEpisodeDetail(episodeId, rowEl) {
        const detail = document.getElementById("ep-detail-" + episodeId);
        if (!detail) return;

        // Collapse if already expanded
        if (detail.style.display !== "none") {
          detail.style.display = "none";
          rowEl.classList.remove("expanded");
          return;
        }

        // Expand — fetch detail from API
        rowEl.classList.add("expanded");
        detail.style.display = "block";
        detail.innerHTML = '<span style="color:var(--gray)">Loading...</span>';

        try {
          const res = await fetch(
            `/api/episodes/${encodeURIComponent(episodeId)}`,
          );
          if (!res.ok) {
            detail.innerHTML =
              '<span style="color:var(--red)">Failed to load</span>';
            return;
          }
          const ep = await res.json();

          let html = "";

          // Timing waterfall bar
          const totalMs = ep.timing?.total_ms || ep.execution_time_ms || 0;
          const toolMs = ep.timing?.tool_ms || 0;
          const llmMs = ep.timing?.llm_ms || totalMs - toolMs;
          if (totalMs > 0) {
            const llmPct =
              totalMs > 0 ? ((llmMs / totalMs) * 100).toFixed(1) : 100;
            const toolPct =
              totalMs > 0 ? ((toolMs / totalMs) * 100).toFixed(1) : 0;
            html += `<div class="detail-timing">
              <span>${totalMs.toLocaleString()}ms total</span>
              <div class="timing-bar">
                <div class="llm-seg" style="width:${llmPct}%" title="LLM: ${llmMs}ms"></div>
                <div class="tool-seg" style="width:${toolPct}%" title="Tools: ${toolMs}ms"></div>
              </div>
              <span style="font-size:0.8em">
                <span style="color:var(--yellow)">■</span> LLM ${llmMs}ms
                <span style="color:var(--aqua);margin-left:6px">■</span> Tools ${toolMs}ms
              </span>
            </div>`;
          }

          // Model + iterations summary
          const iters = ep.loop_iterations || 0;
          const model = ep.model_used || "—";
          html += `<div style="display:flex;gap:16px;margin-bottom:12px;font-size:0.85em;color:var(--fg3);flex-wrap:wrap;align-items:center">
            <span>Model: <strong style="color:var(--fg1)">${model}</strong></span>
            <span>Iterations: <strong style="color:var(--fg1)">${iters}</strong></span>
            <span>Tokens: <strong style="color:var(--fg1)">${(ep.tokens_used || 0).toLocaleString()}</strong></span>
            ${ep.tags && ep.tags.length ? TagRenderer.render(ep.tags) : ""}
          </div>`;

          // Iteration timeline with tool calls
          const tools = ep.tool_invocations || [];
          if (tools.length > 0) {
            html +=
              '<div class="detail-section-title">Iteration Timeline</div>';
            html += '<div class="iteration-timeline">';

            // Group tool calls by iteration
            const byIter = {};
            tools.forEach((t) => {
              const iter = t.iteration || 1;
              if (!byIter[iter]) byIter[iter] = [];
              byIter[iter].push(t);
            });

            const maxIter =
              ep.loop_iterations ||
              Math.max(...Object.keys(byIter).map(Number), 1);
            for (let i = 1; i <= maxIter; i++) {
              const iterTools = byIter[i] || [];
              if (iterTools.length > 0) {
                iterTools.forEach((t) => {
                  const inputStr =
                    typeof t.input === "object"
                      ? JSON.stringify(t.input, null, 2)
                      : String(t.input || "");
                  const outputStr = String(t.output || "");
                  const outputTrunc =
                    outputStr.length > 500
                      ? outputStr.substring(0, 500) + "..."
                      : outputStr;
                  html += `<div class="iteration-step tool-step">
                    <div class="step-header">
                      <span class="step-badge tool">${t.tool_name}</span>
                      <span class="step-badge duration">${t.duration_ms || 0}ms</span>
                      <span style="color:var(--gray);font-size:0.8em">iteration ${i}</span>
                    </div>
                    <div class="tool-detail-block">
                      <details><summary>Input</summary><pre>${escapeHtml(inputStr)}</pre></details>
                      <details><summary>Output</summary><pre>${escapeHtml(outputTrunc)}</pre></details>
                    </div>
                  </div>`;
                });
              } else {
                html += `<div class="iteration-step">
                  <div class="step-header">
                    <span class="step-badge llm">LLM</span>
                    <span style="color:var(--gray);font-size:0.8em">iteration ${i}</span>
                  </div>
                </div>`;
              }
            }

            // Final response step
            html += `<div class="iteration-step final-step">
              <div class="step-header">
                <span class="step-badge llm">Final Response</span>
              </div>
            </div>`;
            html += "</div>";
          }

          // Reasoning
          if (ep.reasoning) {
            html += '<div class="detail-section-title">Reasoning</div>';
            html += `<div style="color:var(--fg2);line-height:1.5">${escapeHtml(ep.reasoning)}</div>`;
          }

          // Evidence
          const evidence = ep.evidence || [];
          if (evidence.length > 0) {
            html += '<div class="detail-section-title">Evidence</div>';
            evidence.forEach((ev) => {
              html += `<div class="evidence-card">
                <div class="ev-source">${escapeHtml(ev.source || "")}</div>
                <div class="ev-summary">${escapeHtml(ev.summary || "")}</div>
                ${ev.key_findings ? `<div class="ev-findings">${escapeHtml(Array.isArray(ev.key_findings) ? ev.key_findings.join(", ") : String(ev.key_findings))}</div>` : ""}
              </div>`;
            });
          }

          if (!html)
            html =
              '<span style="color:var(--gray)">No detailed execution data available</span>';
          detail.innerHTML = html;
        } catch (e) {
          detail.innerHTML =
            '<span style="color:var(--red)">Error: ' +
            escapeHtml(e.message) +
            "</span>";
        }
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }



      async function loadAgentWallet(agentId) {
        const el = document.getElementById("agent-wallet-content");
        if (!el) return;
        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/wallet`,
          );
          if (res.status === 403) {
            el.textContent = "Not authorized";
            return;
          }
          if (!res.ok) {
            el.textContent = "Could not load wallet";
            return;
          }
          const w = await res.json();
          el.innerHTML = `
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:14px">
              <div><div style="font-size:0.75em;color:var(--fg4);text-transform:uppercase;letter-spacing:0.06em">Balance</div>
                <div style="font-size:1.6em;font-weight:bold;color:var(--green)">${w.balance} cr</div></div>
              <div><div style="font-size:0.75em;color:var(--fg4);text-transform:uppercase;letter-spacing:0.06em">Total Earned</div>
                <div style="font-size:1.2em;color:var(--fg1)">${w.total_earned} cr</div></div>
              <div><div style="font-size:0.75em;color:var(--fg4);text-transform:uppercase;letter-spacing:0.06em">Collected</div>
                <div style="font-size:1.2em;color:var(--fg1)">${w.total_collected} cr</div></div>
              <div><div style="font-size:0.75em;color:var(--fg4);text-transform:uppercase;letter-spacing:0.06em">Allocated</div>
                <div style="font-size:1.2em;color:var(--fg1)">${w.total_allocated} cr</div></div>
            </div>

            <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px;background:var(--bg0);border:1px solid var(--bg3);border-radius:6px">
              <label style="font-size:0.8em;color:var(--fg3);white-space:nowrap">Auto-collect</label>
              <input type="range" id="auto-collect-slider" min="0" max="100" value="${w.auto_collect_pct}" style="flex:1" oninput="document.getElementById('auto-collect-val').textContent=this.value+'%'" />
              <span id="auto-collect-val" style="font-size:0.85em;color:var(--fg1);min-width:36px">${w.auto_collect_pct}%</span>
              <button class="owner-btn" style="border-color:var(--blue);color:var(--blue);font-size:0.8em;padding:4px 10px" onclick="setAutoCollect('${agentId}')">Set</button>
            </div>

            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
              <div style="display:flex;align-items:center;gap:6px">
                <input type="number" id="collect-amount" min="1" max="${w.balance}" value="${w.balance}" style="width:80px;background:var(--bg0);border:1px solid var(--bg3);color:var(--fg1);padding:5px 8px;font-family:inherit;font-size:0.85em" />
                <button class="owner-btn" style="border-color:var(--green);color:var(--green);font-size:0.8em;padding:4px 10px" onclick="collectFromAgent('${agentId}')">Collect</button>
                <button class="owner-btn" style="border-color:var(--green);color:var(--green);font-size:0.8em;padding:4px 10px" onclick="collectFromAgent('${agentId}','all')">Collect All</button>
              </div>
              <div style="display:flex;align-items:center;gap:6px">
                <select id="allocate-service" style="background:var(--bg0);border:1px solid var(--bg3);color:var(--fg1);padding:5px 8px;font-family:inherit;font-size:0.85em">
                  <option value="dream_cycle">Dream Cycle</option>
                  <option value="education">Education</option>
                  <option value="coherence_eval">Coherence Eval</option>
                </select>
                <input type="number" id="allocate-amount" min="1" value="5" style="width:60px;background:var(--bg0);border:1px solid var(--bg3);color:var(--fg1);padding:5px 8px;font-family:inherit;font-size:0.85em" />
                <button class="owner-btn" style="border-color:var(--purple);color:var(--purple);font-size:0.8em;padding:4px 10px" onclick="allocateAgentCredits('${agentId}')">Allocate</button>
              </div>
            </div>
            <div id="wallet-action-result" style="font-size:0.85em;color:var(--fg3);min-height:1.2em"></div>
          `;
        } catch (e) {
          el.innerHTML =
            '<span style="color:var(--red)">Error: ' +
            escapeHtml(e.message) +
            "</span>";
        }
      }

      async function collectFromAgent(agentId, mode) {
        const resultEl = document.getElementById("wallet-action-result");
        const body =
          mode === "all"
            ? { amount: "all" }
            : {
                amount: parseInt(
                  document.getElementById("collect-amount").value,
                ),
              };
        if (mode !== "all" && (!body.amount || body.amount < 1)) {
          resultEl.style.color = "var(--red)";
          resultEl.textContent = "Enter a valid amount";
          return;
        }
        resultEl.style.color = "var(--fg3)";
        resultEl.textContent = "Collecting...";
        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/collect`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            },
          );
          if (res.ok) {
            const d = await res.json();
            resultEl.style.color = "var(--green)";
            resultEl.textContent = `Collected ${d.collected} cr. Agent balance: ${d.agent_balance} cr, Your balance: ${d.owner_balance} cr`;
            loadAgentWallet(agentId);
          } else {
            resultEl.style.color = "var(--red)";
            resultEl.textContent = await res.text();
          }
        } catch (e) {
          resultEl.style.color = "var(--red)";
          resultEl.textContent = "Network error: " + e.message;
        }
      }

      async function allocateAgentCredits(agentId) {
        const resultEl = document.getElementById("wallet-action-result");
        const service = document.getElementById("allocate-service").value;
        const amount = parseInt(
          document.getElementById("allocate-amount").value,
        );
        if (!amount || amount < 1) {
          resultEl.style.color = "var(--red)";
          resultEl.textContent = "Enter a valid amount";
          return;
        }
        resultEl.style.color = "var(--fg3)";
        resultEl.textContent = "Allocating...";
        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/allocate`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ service, amount }),
            },
          );
          if (res.ok) {
            const d = await res.json();
            resultEl.style.color = "var(--green)";
            resultEl.textContent = `Allocated ${d.allocated} cr to ${d.service}. Agent balance: ${d.agent_balance} cr`;
            loadAgentWallet(agentId);
          } else {
            resultEl.style.color = "var(--red)";
            resultEl.textContent = await res.text();
          }
        } catch (e) {
          resultEl.style.color = "var(--red)";
          resultEl.textContent = "Network error: " + e.message;
        }
      }

      async function setAutoCollect(agentId) {
        const pct = parseInt(
          document.getElementById("auto-collect-slider").value,
        );
        const resultEl = document.getElementById("wallet-action-result");
        resultEl.style.color = "var(--fg3)";
        resultEl.textContent = "Saving...";
        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/auto-collect`,
            {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ pct }),
            },
          );
          if (res.ok) {
            const d = await res.json();
            resultEl.style.color = "var(--green)";
            resultEl.textContent = `Auto-collect set to ${d.auto_collect_pct}%`;
          } else {
            resultEl.style.color = "var(--red)";
            resultEl.textContent = await res.text();
          }
        } catch (e) {
          resultEl.style.color = "var(--red)";
          resultEl.textContent = "Network error: " + e.message;
        }
      }

      async function topupDreamBudget(agentId) {
        const amount = parseInt(document.getElementById("topup-amount").value);
        const resultEl = document.getElementById("topup-result");
        if (!amount || amount < 1) {
          resultEl.textContent = "Enter a valid amount";
          return;
        }

        resultEl.textContent = "Processing...";
        try {
          const res = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/dreaming/topup`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ credits: amount }),
            },
          );
          if (res.ok) {
            const data = await res.json();
            resultEl.style.color = "var(--green)";
            resultEl.textContent = `Added ${data.credits_added} credits. New budget: ${data.new_budget} (${data.credits_remaining} remaining)`;
          } else {
            resultEl.style.color = "var(--red)";
            resultEl.textContent = await res.text();
          }
        } catch (e) {
          resultEl.style.color = "var(--red)";
          resultEl.textContent = "Network error: " + e.message;
        }
      }
    </script>
  </body>
</html>
