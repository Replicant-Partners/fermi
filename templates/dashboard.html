<!doctype html>
<html lang="en" class="theme-hasui">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Agent Bestiary</title>
    <link rel="stylesheet" href="/static/css/variables.css" />
    <link rel="stylesheet" href="/static/css/common.css" />
    <link rel="stylesheet" href="/static/css/components.css" />
    <style>
      /* Page-specific body overrides (shared common.css provides base) */
      body {
        font-family: "Berkeley Mono", "JetBrains Mono", monospace;
        line-height: 1.6;
      }
      header {
        background: var(--bg0);
        border-bottom: 1px solid var(--bg2);
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header h1 {
        font-size: 1.2rem;
        color: var(--fg0);
      }
      header a {
        color: var(--fg3);
        text-decoration: none;
        font-size: 0.85rem;
        margin-left: 16px;
      }
      header a:hover {
        color: var(--yellow);
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        margin-bottom: 24px;
      }
      @media (max-width: 768px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .section {
        background: var(--bg0);
        border: 1px solid var(--bg2);
        padding: 20px;
      }
      .section-title {
        font-size: 0.9rem;
        color: var(--yellow);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .btn {
        background: transparent;
        border: 1px solid var(--bg3);
        padding: 4px 12px;
        cursor: pointer;
        font-size: 0.8rem;
        color: var(--fg3);
        font-family: inherit;
        text-decoration: none;
      }
      .btn:hover {
        border-color: var(--green);
        color: var(--green);
      }
      .btn-primary {
        border-color: var(--yellow);
        color: var(--yellow);
      }
      .btn-primary:hover {
        background: var(--yellow);
        color: var(--bg0-hard);
      }
      .wallet-balance {
        font-size: 2rem;
        color: var(--green);
        font-weight: bold;
      }
      .wallet-label {
        font-size: 0.8rem;
        color: var(--fg3);
      }
      .agent-row,
      .workspace-row,
      .tx-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--bg1);
      }
      .agent-row:last-child,
      .workspace-row:last-child,
      .tx-row:last-child {
        border-bottom: none;
      }
      .agent-name {
        color: var(--fg0);
        font-size: 0.9rem;
      }
      .agent-meta {
        color: var(--fg3);
        font-size: 0.75rem;
      }
      /* ─── Micro sparklines ─── */
      .agent-row-detail {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 10px 0;
        border-bottom: 1px solid var(--bg1);
        gap: 12px;
      }
      .agent-row-detail:last-child {
        border-bottom: none;
      }
      .agent-info {
        flex: 1;
        min-width: 0;
      }
      .agent-sparks {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        flex-shrink: 0;
      }
      .spark-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      .spark-label {
        font-size: 0.55rem;
        color: var(--fg3);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .spark-total {
        font-size: 0.65rem;
        font-weight: bold;
      }
      .spark-bars {
        display: flex;
        align-items: flex-end;
        gap: 1px;
        height: 20px;
      }
      .spark-bar {
        width: 3px;
        min-height: 1px;
        border-radius: 1px 1px 0 0;
      }
      .badge {
        font-size: 0.7rem;
        padding: 2px 6px;
        border: 1px solid var(--bg3);
        color: var(--fg3);
      }
      .badge-public {
        border-color: var(--green);
        color: var(--green);
      }
      .badge-private {
        border-color: var(--gray);
        color: var(--gray);
      }
      .badge-shared {
        border-color: var(--aqua);
        color: var(--aqua);
      }
      .tx-amount-positive {
        color: var(--green);
      }
      .tx-amount-negative {
        color: var(--red);
      }
      .tx-type {
        color: var(--fg3);
        font-size: 0.75rem;
      }
      .empty-state {
        color: var(--fg3);
        font-size: 0.85rem;
        font-style: italic;
        padding: 12px 0;
      }
      .budget-bar {
        height: 6px;
        background: var(--bg2);
        margin-top: 4px;
      }
      .budget-fill {
        height: 100%;
        background: var(--aqua);
      }
      /* Buy credits cards */
      .pricing-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 12px;
      }
      @media (max-width: 600px) {
        .pricing-grid {
          grid-template-columns: 1fr;
        }
      }
      .pricing-card {
        background: var(--bg1);
        border: 1px solid var(--bg2);
        padding: 16px;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.2s;
        position: relative;
      }
      .pricing-card:hover {
        border-color: var(--yellow);
      }
      .pricing-card.loading {
        opacity: 0.6;
        pointer-events: none;
      }
      .pricing-credits {
        font-size: 1.5rem;
        font-weight: bold;
        color: var(--fg0);
      }
      .pricing-price {
        font-size: 1.1rem;
        color: var(--green);
        margin: 4px 0;
      }
      .pricing-per {
        font-size: 0.75rem;
        color: var(--fg3);
      }
      .pricing-discount {
        position: absolute;
        top: 8px;
        right: 8px;
        font-size: 0.65rem;
        background: var(--yellow);
        color: var(--bg0-hard);
        padding: 2px 6px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <a href="/" style="color: var(--fg1); text-decoration: none"
          ><h1>Agent Bestiary</h1></a
        >
      </div>
      <div>
        <a href="/catalogue">Catalogue</a>
        <a href="/dashboard" style="color: var(--yellow)">Dashboard</a>
        <a href="/profile">Profile</a>
        <div id="user-area" class="auth-area" style="display: inline"></div>
        <button
          id="theme-toggle"
          class="theme-toggle-btn"
          title="Toggle Theme (Ctrl+T)"
        >
          OP-1
        </button>
      </div>
    </header>

    <div class="container">
      <!-- Wallet -->
      <div class="section" style="margin-bottom: 24px">
        <div class="section-title">Wallet</div>
        <div style="display: flex; gap: 48px; align-items: center">
          <div>
            <div class="wallet-balance" id="wallet-balance">--</div>
            <div class="wallet-label">credits available</div>
          </div>
          <div>
            <div style="color: var(--fg2)" id="wallet-deposited">--</div>
            <div class="wallet-label">total deposited</div>
          </div>
          <div>
            <div style="color: var(--fg2)" id="wallet-spent">--</div>
            <div class="wallet-label">total spent</div>
          </div>
        </div>
      </div>

      <!-- Buy Credits -->
      <div class="section" style="margin-bottom: 24px" id="buy-credits-section">
        <div class="section-title">Buy Credits</div>
        <div class="pricing-grid" id="pricing-grid">
          <div class="empty-state">Loading pricing...</div>
        </div>
      </div>

      <div class="grid">
        <!-- My Agents -->
        <div class="section">
          <div class="section-title">
            My Agents
            <a href="/agents/new" class="btn btn-primary">+ New</a>
          </div>
          <div id="agents-list">
            <div class="empty-state">Loading...</div>
          </div>
        </div>

        <!-- My Workspaces -->
        <div class="section">
          <div class="section-title">
            Workspaces
            <button class="btn btn-primary" id="create-ws-btn">+ New</button>
          </div>
          <div id="workspaces-list">
            <div class="empty-state">Loading...</div>
          </div>
        </div>
      </div>

      <!-- Recent Transactions -->
      <div class="section">
        <div class="section-title">Recent Transactions</div>
        <div id="transactions-list">
          <div class="empty-state">Loading...</div>
        </div>
      </div>
    </div>

    <script src="/static/js/widgets/toast.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
      // Check for payment return
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("payment") === "success") {
        Toast.show(
          "Payment successful! Credits have been added to your wallet.",
        );
        window.history.replaceState({}, "", "/dashboard");
      } else if (urlParams.get("payment") === "cancelled") {
        Toast.show("Payment cancelled.", "error");
        window.history.replaceState({}, "", "/dashboard");
      }

      function showAuthPrompt() {
        document.querySelector(".dashboard-grid").innerHTML = `
          <div style="grid-column:1/-1;text-align:center;padding:48px 24px">
            <div style="font-size:1.5rem;color:var(--fg1);margin-bottom:16px">Sign in to access your dashboard</div>
            <div style="color:var(--fg3);margin-bottom:24px">Your agents, wallet, and workspaces are waiting.</div>
            <a href="/auth/google" style="display:inline-block;border:1px solid var(--yellow);color:var(--yellow);padding:8px 20px;text-decoration:none;margin-right:8px">Sign in with Google</a>
            <a href="/auth/github" style="display:inline-block;border:1px solid var(--yellow);color:var(--yellow);padding:8px 20px;text-decoration:none">Sign in with GitHub</a>
          </div>`;
      }

      // Auth check
      (async () => {
        try {
          const res = await fetch("/api/auth/me");
          if (!res.ok) {
            showAuthPrompt();
            return;
          }
          await res.json();
          // user-area is populated by /static/js/auth.js
        } catch {
          showAuthPrompt();
          return;
        }

        // Load wallet
        try {
          const res = await fetch("/api/wallet");
          if (res.ok) {
            const w = await res.json();
            document.getElementById("wallet-balance").textContent = w.balance;
            document.getElementById("wallet-deposited").textContent =
              w.total_deposited;
            document.getElementById("wallet-spent").textContent = w.total_spent;
            // Low balance warning
            if (w.balance < 10) {
              const banner = document.createElement("div");
              banner.style.cssText =
                "background:var(--red);color:var(--bg0);padding:10px 20px;text-align:center;font-size:0.9em;margin-bottom:16px";
              banner.innerHTML = `Low balance: <strong>${w.balance}</strong> credits remaining. <a href="#buy-credits-section" style="color:var(--bg0);text-decoration:underline;font-weight:500">Buy More</a>`;
              const container = document.querySelector(".container");
              if (container) container.prepend(banner);
            }
          }
        } catch {}

        // Load agents
        try {
          const res = await fetch("/api/agents/mine");
          if (res.ok) {
            const data = await res.json();
            const el = document.getElementById("agents-list");
            if (!data.agents || data.agents.length === 0) {
              el.innerHTML =
                '<div class="empty-state">No agents yet. <a href="/agents/new" style="color:var(--yellow)">Create one</a></div>';
            } else {
              const groups = { published: [], draft: [], archived: [] };
              data.agents.forEach((a) => {
                const s = a.status || "draft";
                (groups[s] || groups.draft).push(a);
              });

              const renderRow = (a) => {
                const mock = mockAgentEconomics(
                  a.agent_name,
                  a.total_executions,
                );
                const statusColors = {
                  draft: "var(--yellow)",
                  published: "var(--green)",
                  archived: "var(--gray)",
                };
                const statusColor =
                  statusColors[a.status || "draft"] || "var(--fg3)";
                return `
                <a href="/agent/${a.agent_name}" style="text-decoration:none;color:inherit">
                <div class="agent-row-detail" style="cursor:pointer;border-left:3px solid ${statusColor}">
                  <div class="agent-info">
                    <div class="agent-name">${a.display_alias || a.agent_name}${a.fork_count > 0 ? ` <span style="font-size:0.75em;color:var(--blue)">&#9906;${a.fork_count}</span>` : ""}</div>
                    <div class="agent-meta">${a.agent_type || "agent"} | ${a.total_executions || 0} exec | <span class="badge badge-${a.visibility || "private"}">${a.visibility || "private"}</span></div>
                  </div>
                  <div class="agent-sparks">
                    <div class="spark-group">
                      <div class="spark-label">earn</div>
                      ${renderSparkBars(mock.earnings, "var(--green)")}
                      <div class="spark-total" style="color:var(--green)">${mock.totalEarnings}</div>
                    </div>
                    <div class="spark-group">
                      <div class="spark-label">cost</div>
                      ${renderSparkBars(mock.costs, "var(--red)")}
                      <div class="spark-total" style="color:var(--red)">${mock.totalCosts}</div>
                    </div>
                  </div>
                </div></a>`;
              };

              let html = "";
              if (groups.published.length) {
                html += `<div style="font-size:0.75em;color:var(--green);text-transform:uppercase;letter-spacing:0.1em;margin:12px 0 6px;font-weight:600">Published (${groups.published.length})</div>`;
                html += groups.published.map(renderRow).join("");
              }
              if (groups.draft.length) {
                html += `<div style="font-size:0.75em;color:var(--yellow);text-transform:uppercase;letter-spacing:0.1em;margin:12px 0 6px;font-weight:600">Drafts (${groups.draft.length})</div>`;
                html += groups.draft.map(renderRow).join("");
              }
              if (groups.archived.length) {
                html += `<details style="margin-top:12px"><summary style="font-size:0.75em;color:var(--gray);text-transform:uppercase;letter-spacing:0.1em;cursor:pointer;font-weight:600">Archived (${groups.archived.length})</summary>`;
                html += groups.archived.map(renderRow).join("");
                html += "</details>";
              }
              el.innerHTML = html;
            }
          }
        } catch {}

        // Load workspaces
        try {
          const res = await fetch("/api/workspaces");
          if (res.ok) {
            const data = await res.json();
            const el = document.getElementById("workspaces-list");
            if (!data.workspaces || data.workspaces.length === 0) {
              el.innerHTML =
                '<div class="empty-state">No workspaces yet.</div>';
            } else {
              el.innerHTML = data.workspaces
                .map((w) => {
                  const pct =
                    w.workspace_budget > 0
                      ? Math.min(
                          100,
                          (w.workspace_spent / w.workspace_budget) * 100,
                        )
                      : 0;
                  return `
                  <a href="/workspace/${w.id}" style="text-decoration:none;color:inherit">
                    <div class="workspace-row" style="cursor:pointer">
                      <div>
                        <div class="agent-name">${w.name || "Unnamed Workspace"}</div>
                        <div class="agent-meta">${w.workspace_remaining || 0} / ${w.workspace_budget || 0} credits remaining</div>
                        <div class="budget-bar"><div class="budget-fill" style="width:${pct}%"></div></div>
                      </div>
                    </div>
                  </a>
                `;
                })
                .join("");
            }
          }
        } catch {}

        // Load pricing tiers
        try {
          const res = await fetch("/api/billing/tiers");
          if (res.ok) {
            const data = await res.json();
            const grid = document.getElementById("pricing-grid");
            if (!data.stripe_configured) {
              grid.innerHTML =
                '<div class="empty-state">Credit purchases coming soon. Contact admin for beta credits.</div>';
            } else if (data.tiers && data.tiers.length > 0) {
              grid.innerHTML = data.tiers
                .map(
                  (t) => `
                <div class="pricing-card" onclick="buyCredits(${t.credits})" id="tier-${t.credits}">
                  ${t.discount_pct > 0 ? `<div class="pricing-discount">${t.discount_pct}% off</div>` : ""}
                  <div class="pricing-credits">${t.credits}</div>
                  <div style="font-size:0.75rem;color:var(--fg3)">credits</div>
                  <div class="pricing-price">${t.price_display}</div>
                  <div class="pricing-per">${t.per_credit_cents}c / credit</div>
                </div>
              `,
                )
                .join("");
            }
          }
        } catch {}

        // Load transactions
        try {
          const res = await fetch("/api/wallet/transactions?limit=10");
          if (res.ok) {
            const data = await res.json();
            const el = document.getElementById("transactions-list");
            if (!data.transactions || data.transactions.length === 0) {
              el.innerHTML =
                '<div class="empty-state">No transactions yet.</div>';
            } else {
              el.innerHTML = data.transactions
                .map(
                  (t) => `
                <div class="tx-row">
                  <div>
                    <span class="tx-type">${t.tx_type || "transfer"}</span>
                    ${t.description ? `<span style="color:var(--fg2);font-size:0.8rem;margin-left:8px">${t.description}</span>` : ""}
                  </div>
                  <div class="${(t.amount || 0) >= 0 ? "tx-amount-positive" : "tx-amount-negative"}">
                    ${(t.amount || 0) >= 0 ? "+" : ""}${t.amount || 0}
                  </div>
                </div>
              `,
                )
                .join("");
            }
          }
        } catch {}
      })();

      // Buy credits — redirect to Stripe Checkout
      async function buyCredits(credits) {
        const card = document.getElementById("tier-" + credits);
        if (card) card.classList.add("loading");
        try {
          const res = await fetch("/api/billing/checkout", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ credits }),
          });
          if (!res.ok) {
            const err = await res.text();
            Toast.show(err, "error");
            if (card) card.classList.remove("loading");
            return;
          }
          const data = await res.json();
          if (data.checkout_url) {
            window.location.href = data.checkout_url;
          }
        } catch (e) {
          Toast.show("Failed to start checkout", "error");
          if (card) card.classList.remove("loading");
        }
      }

      // Create workspace
      document
        .getElementById("create-ws-btn")
        .addEventListener("click", async () => {
          const name = prompt("Workspace name:");
          if (!name || !name.trim()) return;
          const slug = name
            .trim()
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-|-$/g, "");
          try {
            const res = await fetch("/api/teams", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                name: name.trim(),
                slug,
                description: "",
              }),
            });
            if (!res.ok) {
              const err = await res.text();
              alert("Failed to create workspace: " + err);
              return;
            }
            const team = await res.json();
            window.location.href = "/workspace/" + team.id;
          } catch (e) {
            alert("Failed to create workspace");
          }
        });

      // ─── Sparkline rendering ───
      function renderSparkBars(values, color) {
        const max = Math.max(...values, 1);
        const bars = values
          .map((v) => {
            const h = Math.max(1, Math.round((v / max) * 20));
            const opacity = v === 0 ? 0.2 : 0.4 + (v / max) * 0.6;
            return `<div class="spark-bar" style="height:${h}px;background:${color};opacity:${opacity.toFixed(2)}"></div>`;
          })
          .join("");
        return `<div class="spark-bars">${bars}</div>`;
      }

      // Generate deterministic mock economics for 12 weeks (3 months)
      // Seeded by agent name hash so each agent gets consistent data across refreshes
      function mockAgentEconomics(name, executions) {
        let seed = 0;
        for (let i = 0; i < name.length; i++)
          seed = ((seed << 5) - seed + name.charCodeAt(i)) | 0;
        const rng = () => {
          seed = (seed * 16807 + 0) % 2147483647;
          return (seed & 0x7fffffff) / 2147483647;
        };

        // Base activity level from actual executions (or mock if 0)
        const activity = Math.max(executions, Math.floor(rng() * 50) + 5);
        const earningPower = rng() * 0.8 + 0.2; // 0.2-1.0 multiplier
        const costBase = rng() * 0.3 + 0.1; // cost is 10-40% of earnings

        const weeks = 12;
        const earnings = [];
        const costs = [];

        for (let w = 0; w < weeks; w++) {
          // Trend upward slightly over time
          const trend = 1 + (w / weeks) * 0.5;
          const noise = 0.5 + rng();
          const weekExecs = Math.floor((activity / 4) * trend * noise);
          const earn = Math.floor(weekExecs * earningPower * (1 + rng() * 0.3));
          const cost = Math.floor(weekExecs * costBase * (0.8 + rng() * 0.4));
          earnings.push(earn);
          costs.push(cost);
        }

        return {
          earnings,
          costs,
          totalEarnings: earnings.reduce((a, b) => a + b, 0),
          totalCosts: costs.reduce((a, b) => a + b, 0),
        };
      }
    </script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/auth.js"></script>
  </body>
</html>
