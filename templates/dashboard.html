<!doctype html>
<html lang="en" class="theme-hasui">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Agent Bestiary</title>
    <style>
      :root {
        --bg0-hard: #1d2021;
        --bg0: #282828;
        --bg1: #3c3836;
        --bg2: #504945;
        --bg3: #665c54;
        --fg0: #fbf1c7;
        --fg1: #ebdbb2;
        --fg2: #d5c4a1;
        --fg3: #bdae93;
        --yellow: #fabd2f;
        --green: #b8bb26;
        --red: #fb4934;
        --aqua: #8ec07c;
        --gray: #928374;
      }
      .theme-op1 {
        --bg0-hard: #f5f5f0;
        --bg0: #ffffff;
        --bg1: #f0f0eb;
        --bg2: #e0e0db;
        --bg3: #c8c8c3;
        --fg0: #1a1a1a;
        --fg1: #2d2d2d;
        --fg2: #4a4a4a;
        --fg3: #6b6b6b;
        --yellow: #ff6b00;
        --green: #00c853;
        --red: #ff1744;
        --aqua: #00b8d4;
        --gray: #9e9e9e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg0-hard);
        color: var(--fg1);
        font-family: "Berkeley Mono", "JetBrains Mono", monospace;
        line-height: 1.6;
      }
      header {
        background: var(--bg0);
        border-bottom: 1px solid var(--bg2);
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header h1 {
        font-size: 1.2rem;
        color: var(--fg0);
      }
      header a {
        color: var(--fg3);
        text-decoration: none;
        font-size: 0.85rem;
        margin-left: 16px;
      }
      header a:hover {
        color: var(--yellow);
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        margin-bottom: 24px;
      }
      @media (max-width: 768px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .section {
        background: var(--bg0);
        border: 1px solid var(--bg2);
        padding: 20px;
      }
      .section-title {
        font-size: 0.9rem;
        color: var(--yellow);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .btn {
        background: transparent;
        border: 1px solid var(--bg3);
        padding: 4px 12px;
        cursor: pointer;
        font-size: 0.8rem;
        color: var(--fg3);
        font-family: inherit;
        text-decoration: none;
      }
      .btn:hover {
        border-color: var(--green);
        color: var(--green);
      }
      .btn-primary {
        border-color: var(--yellow);
        color: var(--yellow);
      }
      .btn-primary:hover {
        background: var(--yellow);
        color: var(--bg0-hard);
      }
      .wallet-balance {
        font-size: 2rem;
        color: var(--green);
        font-weight: bold;
      }
      .wallet-label {
        font-size: 0.8rem;
        color: var(--fg3);
      }
      .agent-row,
      .workspace-row,
      .tx-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--bg1);
      }
      .agent-row:last-child,
      .workspace-row:last-child,
      .tx-row:last-child {
        border-bottom: none;
      }
      .agent-name {
        color: var(--fg0);
        font-size: 0.9rem;
      }
      .agent-meta {
        color: var(--fg3);
        font-size: 0.75rem;
      }
      /* ─── Micro sparklines ─── */
      .agent-row-detail {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 10px 0;
        border-bottom: 1px solid var(--bg1);
        gap: 12px;
      }
      .agent-row-detail:last-child {
        border-bottom: none;
      }
      .agent-info {
        flex: 1;
        min-width: 0;
      }
      .agent-sparks {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        flex-shrink: 0;
      }
      .spark-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      .spark-label {
        font-size: 0.55rem;
        color: var(--fg3);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .spark-total {
        font-size: 0.65rem;
        font-weight: bold;
      }
      .spark-bars {
        display: flex;
        align-items: flex-end;
        gap: 1px;
        height: 20px;
      }
      .spark-bar {
        width: 3px;
        min-height: 1px;
        border-radius: 1px 1px 0 0;
      }
      .badge {
        font-size: 0.7rem;
        padding: 2px 6px;
        border: 1px solid var(--bg3);
        color: var(--fg3);
      }
      .badge-public {
        border-color: var(--green);
        color: var(--green);
      }
      .badge-private {
        border-color: var(--gray);
        color: var(--gray);
      }
      .badge-shared {
        border-color: var(--aqua);
        color: var(--aqua);
      }
      .tx-amount-positive {
        color: var(--green);
      }
      .tx-amount-negative {
        color: var(--red);
      }
      .tx-type {
        color: var(--fg3);
        font-size: 0.75rem;
      }
      .empty-state {
        color: var(--fg3);
        font-size: 0.85rem;
        font-style: italic;
        padding: 12px 0;
      }
      .budget-bar {
        height: 6px;
        background: var(--bg2);
        margin-top: 4px;
      }
      .budget-fill {
        height: 100%;
        background: var(--aqua);
      }
      .theme-toggle-btn {
        background: transparent;
        border: 1px solid var(--bg3);
        padding: 4px 10px;
        cursor: pointer;
        font-size: 0.8rem;
        color: var(--fg3);
        font-family: inherit;
      }
      .theme-toggle-btn:hover {
        border-color: var(--yellow);
        color: var(--yellow);
      }
      /* Buy credits cards */
      .pricing-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 12px;
      }
      @media (max-width: 600px) {
        .pricing-grid {
          grid-template-columns: 1fr;
        }
      }
      .pricing-card {
        background: var(--bg1);
        border: 1px solid var(--bg2);
        padding: 16px;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.2s;
        position: relative;
      }
      .pricing-card:hover {
        border-color: var(--yellow);
      }
      .pricing-card.loading {
        opacity: 0.6;
        pointer-events: none;
      }
      .pricing-credits {
        font-size: 1.5rem;
        font-weight: bold;
        color: var(--fg0);
      }
      .pricing-price {
        font-size: 1.1rem;
        color: var(--green);
        margin: 4px 0;
      }
      .pricing-per {
        font-size: 0.75rem;
        color: var(--fg3);
      }
      .pricing-discount {
        position: absolute;
        top: 8px;
        right: 8px;
        font-size: 0.65rem;
        background: var(--yellow);
        color: var(--bg0-hard);
        padding: 2px 6px;
        font-weight: bold;
      }
      .toast {
        position: fixed;
        top: 16px;
        right: 16px;
        padding: 12px 20px;
        font-family: inherit;
        font-size: 0.85rem;
        z-index: 1000;
        opacity: 0;
        transform: translateY(-10px);
        transition: all 0.3s ease;
      }
      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      .toast-success {
        background: var(--bg0);
        border: 1px solid var(--green);
        color: var(--green);
      }
      .toast-error {
        background: var(--bg0);
        border: 1px solid var(--red);
        color: var(--red);
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <a href="/" style="color: var(--fg1); text-decoration: none"
          ><h1>Agent Bestiary</h1></a
        >
      </div>
      <div>
        <a href="/catalogue">Catalogue</a>
        <a href="/dashboard" style="color: var(--yellow)">Dashboard</a>
        <a href="/profile">Profile</a>
        <div id="user-area" class="auth-area" style="display: inline"></div>
        <button
          id="theme-toggle"
          class="theme-toggle-btn"
          title="Toggle Theme (Ctrl+T)"
        >
          OP-1
        </button>
      </div>
    </header>

    <div class="container">
      <!-- Wallet -->
      <div class="section" style="margin-bottom: 24px">
        <div class="section-title">Wallet</div>
        <div style="display: flex; gap: 48px; align-items: center">
          <div>
            <div class="wallet-balance" id="wallet-balance">--</div>
            <div class="wallet-label">credits available</div>
          </div>
          <div>
            <div style="color: var(--fg2)" id="wallet-deposited">--</div>
            <div class="wallet-label">total deposited</div>
          </div>
          <div>
            <div style="color: var(--fg2)" id="wallet-spent">--</div>
            <div class="wallet-label">total spent</div>
          </div>
        </div>
      </div>

      <!-- Buy Credits -->
      <div class="section" style="margin-bottom: 24px" id="buy-credits-section">
        <div class="section-title">Buy Credits</div>
        <div class="pricing-grid" id="pricing-grid">
          <div class="empty-state">Loading pricing...</div>
        </div>
      </div>

      <div class="grid">
        <!-- My Agents -->
        <div class="section">
          <div class="section-title">
            My Agents
            <a href="/agents/new" class="btn btn-primary">+ New</a>
          </div>
          <div id="agents-list">
            <div class="empty-state">Loading...</div>
          </div>
        </div>

        <!-- My Workspaces -->
        <div class="section">
          <div class="section-title">
            Workspaces
            <button class="btn btn-primary" id="create-ws-btn">+ New</button>
          </div>
          <div id="workspaces-list">
            <div class="empty-state">Loading...</div>
          </div>
        </div>
      </div>

      <!-- Recent Transactions -->
      <div class="section">
        <div class="section-title">Recent Transactions</div>
        <div id="transactions-list">
          <div class="empty-state">Loading...</div>
        </div>
      </div>
    </div>

    <script>
      // Toast helper
      function showToast(message, type = "success") {
        const existing = document.querySelector(".toast");
        if (existing) existing.remove();
        const toast = document.createElement("div");
        toast.className = `toast toast-${type}`;
        toast.textContent = message;
        document.body.appendChild(toast);
        requestAnimationFrame(() => toast.classList.add("show"));
        setTimeout(() => {
          toast.classList.remove("show");
          setTimeout(() => toast.remove(), 300);
        }, 4000);
      }

      // Check for payment return
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("payment") === "success") {
        showToast(
          "Payment successful! Credits have been added to your wallet.",
        );
        window.history.replaceState({}, "", "/dashboard");
      } else if (urlParams.get("payment") === "cancelled") {
        showToast("Payment cancelled.", "error");
        window.history.replaceState({}, "", "/dashboard");
      }

      // Auth check — redirect to home if not logged in
      (async () => {
        try {
          const res = await fetch("/api/auth/me");
          if (!res.ok) {
            window.location.href = "/";
            return;
          }
          const user = await res.json();
          const ua = document.getElementById("user-area");
          if (ua)
            ua.innerHTML = `<span style="color:var(--fg2);font-size:0.85em">${user.display_name || user.email || "User"}</span>`;
        } catch {
          window.location.href = "/";
          return;
        }

        // Load wallet
        try {
          const res = await fetch("/api/wallet");
          if (res.ok) {
            const w = await res.json();
            document.getElementById("wallet-balance").textContent = w.balance;
            document.getElementById("wallet-deposited").textContent =
              w.total_deposited;
            document.getElementById("wallet-spent").textContent = w.total_spent;
            // Low balance warning
            if (w.balance < 10) {
              const banner = document.createElement("div");
              banner.style.cssText =
                "background:var(--red);color:var(--bg0);padding:10px 20px;text-align:center;font-size:0.9em;margin-bottom:16px";
              banner.innerHTML = `Low balance: <strong>${w.balance}</strong> credits remaining. <a href="#buy-credits-section" style="color:var(--bg0);text-decoration:underline;font-weight:500">Buy More</a>`;
              const container = document.querySelector(".container");
              if (container) container.prepend(banner);
            }
          }
        } catch {}

        // Load agents
        try {
          const res = await fetch("/api/agents/mine");
          if (res.ok) {
            const data = await res.json();
            const el = document.getElementById("agents-list");
            if (!data.agents || data.agents.length === 0) {
              el.innerHTML =
                '<div class="empty-state">No agents yet. <a href="/agents/new" style="color:var(--yellow)">Create one</a></div>';
            } else {
              el.innerHTML = data.agents
                .map((a) => {
                  const mock = mockAgentEconomics(
                    a.agent_name,
                    a.total_executions,
                  );
                  return `
                <div class="agent-row-detail">
                  <div class="agent-info">
                    <div class="agent-name">${a.agent_name}</div>
                    <div class="agent-meta">${a.agent_type} | ${a.total_executions} exec | <span class="badge badge-${a.visibility}">${a.visibility}</span></div>
                  </div>
                  <div class="agent-sparks">
                    <div class="spark-group">
                      <div class="spark-label">earn</div>
                      ${renderSparkBars(mock.earnings, "var(--green)")}
                      <div class="spark-total" style="color:var(--green)">${mock.totalEarnings}</div>
                    </div>
                    <div class="spark-group">
                      <div class="spark-label">cost</div>
                      ${renderSparkBars(mock.costs, "var(--red)")}
                      <div class="spark-total" style="color:var(--red)">${mock.totalCosts}</div>
                    </div>
                  </div>
                </div>`;
                })
                .join("");
            }
          }
        } catch {}

        // Load workspaces
        try {
          const res = await fetch("/api/workspaces");
          if (res.ok) {
            const data = await res.json();
            const el = document.getElementById("workspaces-list");
            if (!data.workspaces || data.workspaces.length === 0) {
              el.innerHTML =
                '<div class="empty-state">No workspaces yet.</div>';
            } else {
              el.innerHTML = data.workspaces
                .map((w) => {
                  const pct =
                    w.workspace_budget > 0
                      ? Math.min(
                          100,
                          (w.workspace_spent / w.workspace_budget) * 100,
                        )
                      : 0;
                  return `
                  <a href="/workspace/${w.id}" style="text-decoration:none;color:inherit">
                    <div class="workspace-row" style="cursor:pointer">
                      <div>
                        <div class="agent-name">${w.name}</div>
                        <div class="agent-meta">${w.workspace_remaining} / ${w.workspace_budget} credits remaining</div>
                        <div class="budget-bar"><div class="budget-fill" style="width:${pct}%"></div></div>
                      </div>
                    </div>
                  </a>
                `;
                })
                .join("");
            }
          }
        } catch {}

        // Load pricing tiers
        try {
          const res = await fetch("/api/billing/tiers");
          if (res.ok) {
            const data = await res.json();
            const grid = document.getElementById("pricing-grid");
            if (!data.stripe_configured) {
              grid.innerHTML =
                '<div class="empty-state">Credit purchases coming soon. Contact admin for beta credits.</div>';
            } else if (data.tiers && data.tiers.length > 0) {
              grid.innerHTML = data.tiers
                .map(
                  (t) => `
                <div class="pricing-card" onclick="buyCredits(${t.credits})" id="tier-${t.credits}">
                  ${t.discount_pct > 0 ? `<div class="pricing-discount">${t.discount_pct}% off</div>` : ""}
                  <div class="pricing-credits">${t.credits}</div>
                  <div style="font-size:0.75rem;color:var(--fg3)">credits</div>
                  <div class="pricing-price">${t.price_display}</div>
                  <div class="pricing-per">${t.per_credit_cents}c / credit</div>
                </div>
              `,
                )
                .join("");
            }
          }
        } catch {}

        // Load transactions
        try {
          const res = await fetch("/api/wallet/transactions?limit=10");
          if (res.ok) {
            const data = await res.json();
            const el = document.getElementById("transactions-list");
            if (!data.transactions || data.transactions.length === 0) {
              el.innerHTML =
                '<div class="empty-state">No transactions yet.</div>';
            } else {
              el.innerHTML = data.transactions
                .map(
                  (t) => `
                <div class="tx-row">
                  <div>
                    <span class="tx-type">${t.tx_type}</span>
                    ${t.description ? `<span style="color:var(--fg2);font-size:0.8rem;margin-left:8px">${t.description}</span>` : ""}
                  </div>
                  <div class="${t.amount >= 0 ? "tx-amount-positive" : "tx-amount-negative"}">
                    ${t.amount >= 0 ? "+" : ""}${t.amount}
                  </div>
                </div>
              `,
                )
                .join("");
            }
          }
        } catch {}
      })();

      // Buy credits — redirect to Stripe Checkout
      async function buyCredits(credits) {
        const card = document.getElementById("tier-" + credits);
        if (card) card.classList.add("loading");
        try {
          const res = await fetch("/api/billing/checkout", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ credits }),
          });
          if (!res.ok) {
            const err = await res.text();
            showToast(err, "error");
            if (card) card.classList.remove("loading");
            return;
          }
          const data = await res.json();
          if (data.checkout_url) {
            window.location.href = data.checkout_url;
          }
        } catch (e) {
          showToast("Failed to start checkout", "error");
          if (card) card.classList.remove("loading");
        }
      }

      // Create workspace
      document
        .getElementById("create-ws-btn")
        .addEventListener("click", async () => {
          const name = prompt("Workspace name:");
          if (!name || !name.trim()) return;
          const slug = name
            .trim()
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-|-$/g, "");
          try {
            const res = await fetch("/api/teams", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                name: name.trim(),
                slug,
                description: "",
              }),
            });
            if (!res.ok) {
              const err = await res.text();
              alert("Failed to create workspace: " + err);
              return;
            }
            const team = await res.json();
            window.location.href = "/workspace/" + team.id;
          } catch (e) {
            alert("Failed to create workspace");
          }
        });

      // ─── Sparkline rendering ───
      function renderSparkBars(values, color) {
        const max = Math.max(...values, 1);
        const bars = values
          .map((v) => {
            const h = Math.max(1, Math.round((v / max) * 20));
            const opacity = v === 0 ? 0.2 : 0.4 + (v / max) * 0.6;
            return `<div class="spark-bar" style="height:${h}px;background:${color};opacity:${opacity.toFixed(2)}"></div>`;
          })
          .join("");
        return `<div class="spark-bars">${bars}</div>`;
      }

      // Generate deterministic mock economics for 12 weeks (3 months)
      // Seeded by agent name hash so each agent gets consistent data across refreshes
      function mockAgentEconomics(name, executions) {
        let seed = 0;
        for (let i = 0; i < name.length; i++)
          seed = ((seed << 5) - seed + name.charCodeAt(i)) | 0;
        const rng = () => {
          seed = (seed * 16807 + 0) % 2147483647;
          return (seed & 0x7fffffff) / 2147483647;
        };

        // Base activity level from actual executions (or mock if 0)
        const activity = Math.max(executions, Math.floor(rng() * 50) + 5);
        const earningPower = rng() * 0.8 + 0.2; // 0.2-1.0 multiplier
        const costBase = rng() * 0.3 + 0.1; // cost is 10-40% of earnings

        const weeks = 12;
        const earnings = [];
        const costs = [];

        for (let w = 0; w < weeks; w++) {
          // Trend upward slightly over time
          const trend = 1 + (w / weeks) * 0.5;
          const noise = 0.5 + rng();
          const weekExecs = Math.floor((activity / 4) * trend * noise);
          const earn = Math.floor(weekExecs * earningPower * (1 + rng() * 0.3));
          const cost = Math.floor(weekExecs * costBase * (0.8 + rng() * 0.4));
          earnings.push(earn);
          costs.push(cost);
        }

        return {
          earnings,
          costs,
          totalEarnings: earnings.reduce((a, b) => a + b, 0),
          totalCosts: costs.reduce((a, b) => a + b, 0),
        };
      }

      // Theme toggle
      const themes = ["hasui", "op1"];
      const labels = { hasui: "OP-1", op1: "Hasui" };
      function setTheme(t) {
        document.documentElement.className = "theme-" + t;
        localStorage.setItem("fermi-theme", t);
        document.getElementById("theme-toggle").textContent = labels[t];
      }
      const saved = localStorage.getItem("fermi-theme");
      if (saved && themes.includes(saved)) setTheme(saved);
      document.getElementById("theme-toggle").addEventListener("click", () => {
        const current = localStorage.getItem("fermi-theme") || "hasui";
        setTheme(current === "hasui" ? "op1" : "hasui");
      });
      document.addEventListener("keydown", (e) => {
        if (e.ctrlKey && e.key === "t") {
          e.preventDefault();
          document.getElementById("theme-toggle").click();
        }
      });
    </script>
  </body>
</html>
