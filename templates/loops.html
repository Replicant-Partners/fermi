<!doctype html>
<html lang="en" class="theme-hasui">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Loops &amp; Gates — Agent Bestiary</title>
  <link rel="stylesheet" href="/static/css/variables.css"/>
  <link rel="stylesheet" href="/static/css/common.css"/>
  <link rel="stylesheet" href="/static/css/components.css"/>
  <style>
  body{font-family:"Berkeley Mono","JetBrains Mono",monospace;line-height:1.5;background:var(--bg0-hard);font-size:13px;margin:0;}
  a{color:var(--fg3);text-decoration:none;} a:hover{color:var(--yellow);}
  .wrap{max-width:1060px;margin:0 auto;padding:0 20px 60px;}

  .head{padding:18px 0 10px;}
  .head h1{font-size:1.05rem;color:var(--yellow);margin:0 0 3px;}
  .head .sub{font-size:0.74rem;color:var(--fg4);}

  .tabs{display:flex;gap:0;border-bottom:1px solid var(--bg2);margin-bottom:16px;}
  .tab{padding:6px 16px;font-size:0.78rem;color:var(--fg4);cursor:pointer;background:transparent;
       border:none;border-bottom:2px solid transparent;font-family:inherit;}
  .tab:hover{color:var(--fg2);} .tab.active{color:var(--yellow);border-bottom-color:var(--yellow);}

  /* ── The three readings. `unknown` is neither good nor bad and must not
        borrow either colour: it gets its own hue and a hatched edge. ── */
  .r-idle   {color:var(--fg3);   border-color:var(--bg3);}
  .r-fault  {color:var(--red,#fb4934); border-color:var(--red,#fb4934);}
  .r-unknown{color:var(--purple,#d3869b); border-color:var(--purple,#d3869b);
             border-style:dashed;}
  .badge{display:inline-block;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.06em;
         padding:1px 6px;border:1px solid;}

  /* ── Tally: five buckets, never collapsed ── */
  .tally{display:flex;flex-wrap:wrap;gap:1px;background:var(--bg2);margin-bottom:8px;}
  .tb{background:var(--bg0);padding:8px 12px;min-width:112px;}
  .tb-v{font-size:1.05rem;} .tb-l{font-size:0.61rem;color:var(--fg4);text-transform:uppercase;
        letter-spacing:0.06em;margin-top:1px;}
  .tb.neutral .tb-v{color:var(--fg3);}
  .tb.good .tb-v{color:var(--green);}
  .tb.bad .tb-v{color:var(--red,#fb4934);}
  .tb.indet .tb-v{color:var(--purple,#d3869b);}
  /* Demoted, not deleted. The five buckets still must never collapse into
     one number — they just are not what the page is about. */
  .census .tb{min-width:100px;padding:7px 11px;}
  .census .tb-v{font-size:0.88rem;}

  /* ── Hierarchy table: two columns that must never be merged ──────────── */
  .ts{color:var(--fg4);font-size:0.68rem;text-transform:uppercase;letter-spacing:0.05em;
      white-space:nowrap;}
  .wire{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.06em;padding:1px 5px;
        border:1px solid;}
  .wire.yes{color:var(--fg4);border-color:var(--bg3);}
  .wire.no{color:var(--red,#fb4934);border-color:var(--red,#fb4934);}
  /* Ok / Silent / Inert. `Silent` is the actionable one and reads as a finding;
     `Inert` is indeterminate and explicitly not a pass. */
  .lv{font-size:0.66rem;text-transform:uppercase;letter-spacing:0.06em;padding:1px 6px;
      border:1px solid;}
  .lv.good{color:var(--green);border-color:var(--green);}
  .lv.bad{color:var(--red,#fb4934);border-color:var(--red,#fb4934);}
  .lv.indet{color:var(--purple,#d3869b);border-color:var(--purple,#d3869b);border-style:dashed;}
  /* The one number that carries the finding, beside the token. Not a sentence. */
  .metric{font-size:0.68rem;color:var(--fg4);margin-left:7px;font-variant-numeric:tabular-nums;
          cursor:help;}
  .lv[title],.wire[title]{cursor:help;}
  .contract{font-size:0.71rem;color:var(--fg4);font-style:italic;line-height:1.5;margin:6px 0 16px;}

  /* ── Section headers, so the page has an argument and not just blocks ── */
  .sec{margin:26px 0 10px;padding-bottom:4px;border-bottom:1px solid var(--bg2);}
  .sec h2{font-size:0.72rem;color:var(--fg2);margin:0;text-transform:uppercase;letter-spacing:0.07em;}
  .sec .why{font-size:0.71rem;color:var(--fg4);margin-top:3px;line-height:1.5;}

  /* ── The lead: an artifact you can open, not a count of them ──────────
     A loop is a path an artifact takes, so the page opens with artifacts.
     Until there is a thing to point at, the path is a diagram. ── */
  .lead{border-left:3px solid var(--yellow);background:var(--bg1);padding:11px 14px;margin-bottom:6px;}
  .lead .said{font-size:0.84rem;color:var(--fg2);line-height:1.5;}
  .lead .said b{color:var(--yellow);font-weight:normal;}
  .lead .gloss{font-size:0.71rem;color:var(--fg4);margin-top:5px;line-height:1.5;max-width:82ch;}

  .arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:1px;
        background:var(--bg2);border:1px solid var(--bg2);}
  .art{background:var(--bg0);padding:8px 10px;display:block;}
  .art:hover{background:var(--bg1);}
  .art-h{display:flex;align-items:baseline;gap:7px;}
  .art-a{font-size:0.75rem;color:var(--fg2);}
  .art:hover .art-a{color:var(--yellow);}
  .art-t{font-size:0.62rem;color:var(--fg4);margin-left:auto;}
  .art-q{font-size:0.68rem;color:var(--fg4);margin-top:3px;line-height:1.4;
         max-height:2.8em;overflow:hidden;}
  /* Contracted = the trace has graded checkpoints. Uncontracted is the
     default and is not an error, so it is dim rather than red. */
  .art-mark{font-size:0.57rem;text-transform:uppercase;letter-spacing:0.05em;padding:0 4px;
            border:1px solid var(--bg3);color:var(--fg4);}
  .art.contracted{border-left:2px solid var(--green);}
  .art.contracted .art-mark{border-color:var(--green);color:var(--green);}

  /* ── Loop card ── */
  .loop{border:1px solid var(--bg2);margin-bottom:12px;background:var(--bg0);}
  .loop-h{display:flex;align-items:baseline;gap:9px;padding:10px 12px 6px;}
  .loop-id{font-size:0.63rem;color:var(--fg4);border:1px solid var(--bg3);padding:1px 5px;}
  .loop-n{font-size:0.86rem;color:var(--fg2);}
  .loop-scope{font-size:0.63rem;color:var(--fg4);}
  .loop-b{margin-left:auto;}
  .claim{padding:0 12px 8px;font-size:0.74rem;color:var(--fg4);font-style:italic;line-height:1.5;max-width:80ch;}
  .detail{padding:0 12px 10px;font-size:0.77rem;color:var(--fg3);line-height:1.5;max-width:85ch;}

  /* ── The chain, drawn as the path it is ─────────────────────────────────
     Same drawing as the checkpoints on /trace: a rail, and a node per step. What
     the step IS reads first; how many rows it has read is secondary text.
     The count was the primary object here and that was the census. ── */
  .chain{padding:2px 12px 10px;}
  .stage{position:relative;display:flex;align-items:flex-start;gap:11px;padding:7px 0;}
  .stage.consequence{opacity:0.45;}
  .stage.first-empty{background:rgba(251,73,52,0.06);margin:0 -12px;padding:8px 12px;}
  .st-node{width:11px;flex-shrink:0;position:relative;padding-top:4px;}
  .st-dot{width:9px;height:9px;border-radius:50%;background:var(--bg0);
          border:2px solid var(--bg3);position:relative;z-index:2;}
  /* The rail is drawn on every step, including the ones nothing reached —
     a path that omits the steps it cannot report on looks shorter and
     safer than it is. */
  .st-rail{position:absolute;left:4px;top:13px;bottom:-14px;width:1px;background:var(--bg2);}
  .stage:last-child .st-rail{display:none;}
  .stage.flowed .st-dot{border-color:var(--green);background:var(--green);}
  .stage.stops  .st-dot{border-color:var(--red,#fb4934);}
  .stage.unread .st-dot{border-style:dashed;}
  .st-body{flex:1;min-width:0;}
  .st-what{font-size:0.78rem;color:var(--fg3);}
  .st-meta{font-size:0.66rem;color:var(--fg4);margin-top:2px;}
  .st-rows{font-variant-numeric:tabular-nums;color:var(--fg4);}
  .st-rows.none{font-style:italic;}
  .st-writer{font-size:0.64rem;color:var(--fg4);}
  .trig{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.05em;padding:0 4px;border:1px solid var(--bg3);color:var(--fg4);}
  .trig.dead{border-color:var(--red,#fb4934);color:var(--red,#fb4934);}
  .trig.agent{border-color:var(--purple,#d3869b);color:var(--purple,#d3869b);}
  .marker{font-size:0.62rem;color:var(--red,#fb4934);text-transform:uppercase;letter-spacing:0.06em;}

  /* ── Doors ── */
  .door{margin-top:5px;padding:7px 9px;background:var(--bg1);border-left:2px solid var(--aqua);}
  .door-t{font-size:0.72rem;color:var(--aqua);}
  .door-does{font-size:0.7rem;color:var(--fg3);margin-top:2px;line-height:1.45;}
  .door-why{font-size:0.68rem;color:var(--fg4);margin-top:4px;line-height:1.45;
            padding-left:8px;border-left:1px solid var(--bg3);}
  .door-path{font-size:0.63rem;color:var(--fg4);margin-top:3px;}

  /* ── Outcomes ── */
  .outcome{margin:0 12px 10px;padding:8px 10px;border:1px solid var(--bg2);background:var(--bg1);}
  .oc-h{font-size:0.68rem;color:var(--fg4);text-transform:uppercase;letter-spacing:0.06em;}
  .oc-p{font-size:0.74rem;color:var(--green);margin-top:3px;line-height:1.45;}
  .oc-n{font-size:0.73rem;color:var(--fg3);margin-top:5px;line-height:1.5;}
  .oc-n b{color:var(--yellow);}
  .oc-gap{font-size:0.71rem;color:var(--fg4);margin-top:6px;line-height:1.5;
          padding-left:8px;border-left:2px solid var(--yellow);}

  /* ── Gates ── */
  table{width:100%;border-collapse:collapse;font-size:0.74rem;}
  th{text-align:left;color:var(--fg4);font-weight:normal;font-size:0.62rem;text-transform:uppercase;
     letter-spacing:0.06em;padding:5px 8px;border-bottom:1px solid var(--bg3);}
  td{padding:6px 8px;border-bottom:1px solid var(--bg2);color:var(--fg3);vertical-align:top;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .dim{color:var(--fg4);}
  .since-boot{color:var(--yellow);}
  .caveat{font-size:0.69rem;color:var(--fg4);line-height:1.45;margin-top:3px;
          padding-left:8px;border-left:1px solid var(--bg3);}
  .nodoors{border:1px dashed var(--bg3);padding:10px 12px;font-size:0.73rem;color:var(--fg4);
           line-height:1.5;margin-top:8px;}
  .enf{font-size:0.61rem;text-transform:uppercase;letter-spacing:0.05em;padding:1px 5px;border:1px solid;}
  .e-control{color:var(--green);border-color:var(--green);}
  .e-metric{color:var(--red,#fb4934);border-color:var(--red,#fb4934);}
  .e-declared{color:var(--yellow);border-color:var(--yellow);}
  .e-none{color:var(--fg4);border-color:var(--bg3);}
  .warn{border-left:3px solid var(--red,#fb4934);background:rgba(251,73,52,0.07);padding:9px 12px;
        margin-bottom:12px;font-size:0.74rem;color:var(--fg3);line-height:1.5;}
  .warn b{color:var(--red,#fb4934);}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:0.68rem;color:var(--fg4);margin-bottom:14px;}
  .empty{padding:16px 8px;font-size:0.76rem;color:var(--fg4);}
  </style>
</head>
<body>
  <div id="nav-root"></div>
  <div class="wrap">
    <div class="head">
      <h1>Loops &amp; Gates</h1>
      <div class="sub">A loop is a path an artifact takes. A gate is a checkpoint on that path.</div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="loops">Loops</button>
      <button class="tab" data-tab="gates">Gates</button>
      <button class="tab" data-tab="enforcement">Enforcement</button>
    </div>
    <div class="legend">
      <span><span class="badge r-idle">idle</span> correctly empty — nothing that should have happened has failed to</span>
      <span><span class="badge r-fault">fault</span> something should have happened and did not</span>
      <span><span class="badge r-unknown">unknown</span> no contract can say. Not a pass and not a failure</span>
    </div>
    <div id="content"><div class="empty">Loading…</div></div>
  </div>

  <script src="/static/js/widgets/nav.js"></script>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/widgets/xaman-ek.js"></script>
  <script>
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  let LOOPS = null, GATES = null, ACTIONS = null, ENF = null, ARTS = null, TAB = "loops";

  // An unrecognised reading must render as `unknown`, never as healthy — a new
  // token falling through to a benign default is how "nothing has been watched"
  // once displayed as "the system is idle" on every panel backed by a loop.
  const READINGS = ["idle", "fault", "unknown"];
  const reading = r => READINGS.includes(r) ? r : "unknown";

  // The tally buckets partition the set. They are never collapsed into one
  // number: "2 of 6 turning" invites the reader to conclude four are broken,
  // and "0 stalled" invites the opposite. Both are wrong.
  const BUCKETS = [
    ["turning",          "turning",          "good",    "every stage produced"],
    ["stalled_by_fault", "stopped by fault", "bad",     "stopped, and the reason is in the code"],
    ["stalled_idle",     "idle",             "neutral", "stopped correctly — nothing has had occasion"],
    ["no_reading",       "no reading",       "indet",   "stopped, and no contract can say why"],
    ["unreadable",       "unreadable",       "indet",   "a probe did not run, so no verdict is supported"],
  ];

  function tally(t, buckets) {
    return `<div class="tally">${buckets.map(([k, label, tone, title]) =>
      `<div class="tb ${tone}" title="${esc(title)}">
         <div class="tb-v">${t[k] ?? 0}</div><div class="tb-l">${esc(label)}</div></div>`).join("")}</div>`;
  }

  // ── The hierarchy ──────────────────────────────────────────────────────
  //
  // From FEEDBACK_LOOPS.md §2, which is the legible version of this screen and
  // which this page previously ignored in favour of the endpoint's flat shape.
  //
  // Timescale is now SERVED on the loop (`timescale`). The client-side copy
  // that used to live here is gone: it was a duplicate of a declaration, which
  // is the shape of thing that drifts, and the whole point of the surface is to
  // render declarations rather than re-derive them.
  //
  // Only the sort order is local, because ordering is a presentation choice and
  // not a fact about the loop. An unrecognised timescale sorts last rather than
  // being dropped.
  const SCALE_ORDER = { hours: 1, days: 2, session: 3, weeks: 4,
                        months: 5, "months+": 6, offline: 7 };
  const scaleOf = l => [l.timescale || "not declared",
                        SCALE_ORDER[l.timescale] ?? 99];

  // The nesting, also from §2. "Measurement is one loop, and the things that
  // act on it are others" - which is why 5a has three consumers and no
  // correction of its own, and why six independent cards was the wrong drawing.
  const FEEDS = {
    loop2:  ["loop1"],
    loop3:  ["loop1"],
    loop5a: ["loop4", "loop5b"],
    loop1:  ["loop2"],
  };

  // Two columns, two claims, never merged.
  //
  // §2: "Wiring means every hop has an executing call site. Observed turning
  // means it has moved on production data. Conflating them is how the
  // 2026-06-03 revision came to report closed loops that had never run."
  // This page merged them, and then built a five-bucket tally on the merged
  // value, so the buckets were a mush of two orthogonal facts.
  function wiring(l) {
    const dead = (l.stages || []).filter(s => s.trigger_label === "nothing_calls_it");
    return dead.length
      ? { ok: false, why: `no code path invokes ${dead.map(s => s.id).join(", ")}` }
      : { ok: true, why: null };
  }

  // Ok / Silent / Inert — the liveness verdict, with the opportunity count as
  // the disambiguator.
  //
  // §3.1 of the verification paper: "Zero claims beside twenty-two episodes that
  // each stated a claim is broken. Zero beside zero is merely unused. Same
  // number, opposite meanings, and only the second is acceptable." The
  // opportunity count here is the row count of the stage immediately upstream of
  // the one that stopped - the thing that should have caused the write.
  // The served `reason` decides this wherever it can. It comes from a closed
  // ten-value vocabulary that the platform computes with more information than
  // this page has - `scheduler_off`, for instance, reads the actual env var and
  // treats "unset with default_on false" and "set to 0" as the same outage.
  //
  // An earlier version of this function derived the verdict from row arithmetic
  // alone, which re-answered a question the API already answers. Row arithmetic
  // is kept only as the tie-breaker for `unobserved`, where the reason names the
  // symptom without settling whether there were opportunities.
  const REASON_LIVENESS = {
    // Something should have happened and did not.
    scheduler_off:            ["Silent", "bad"],
    no_trigger:               ["Silent", "bad"],
    writes_refused:           ["Silent", "bad"],
    gate_refuses_everything:  ["Silent", "bad"],
    // No occasion yet. Not a pass.
    no_input:                 ["Inert", "indet"],
    awaiting_upstream:        ["Inert", "indet"],
    awaiting_agent:           ["Inert", "indet"],
    // No verdict is supported at all.
    probe_failed:             ["unreadable", "indet"],
    upstream_unmeasured:      ["unreadable", "indet"],
  };

  // Returns a token, a SHORT metric for the cell, and the long form for a
  // hover. A table cell holds a value or a token, never a sentence - the
  // paragraph-per-row version of this table was unreadable, and repeating the
  // same explanation on every `Silent` row is what a legend is for.
  function liveness(l) {
    if (l.status === "turning") return { v: "Ok", cls: "good", short:
      "every stage produced", why: "Every stage in the chain has rows." };
    if (l.status === "unmeasured" || !(l.stages || []).length) return { v: "unreadable",
      cls: "indet", short: "probe did not run",
      why: "A stage's count query did not run, so the chain supports no verdict either way." };

    // Branch on the served reason before doing any arithmetic of our own.
    const mapped = REASON_LIVENESS[l.reason];
    if (mapped) {
      // `scheduler_off` now names the knob, so the finding ends in an action
      // rather than in a diagnosis. `trigger_env` is served per stage.
      let short = String(l.reason).replace(/_/g, " ");
      let action = "";
      if (l.reason === "scheduler_off") {
        const s = (l.stages || []).find(x => x.trigger_env);
        if (s) {
          short = `set ${s.trigger_env}`;
          action = ` Set ${s.trigger_env} to a non-zero number of seconds.` +
            (s.trigger_default_on === false
              ? ` It defaults to off, so this engine has never run unless someone set it.`
              : "");
        }
      }
      return { v: mapped[0], cls: mapped[1], short,
        why: `${l.detail || ""}${action}` };
    }
    // An unrecognised reason must not read as healthy.
    if (l.reason && l.reason !== "unobserved") {
      return { v: "unreadable", cls: "indet", short: String(l.reason),
        why: `The platform reports "${l.reason}", which this page does not recognise. ` +
             `Treated as indeterminate rather than assumed benign.` };
    }

    const stages = l.stages || [];
    const at = stages.findIndex(s => s.is_first_empty);
    if (at < 0) return { v: "Ok", cls: "good", short: "no stage reported empty",
      why: "No stage reported itself empty." };

    const stop = stages[at].id;
    const upstream = at > 0 ? stages[at - 1] : null;
    const opportunities = upstream && upstream.measured !== false ? Number(upstream.rows) : null;

    if (opportunities === null) {
      return { v: "Inert", cls: "indet", short: `${stop} is first`,
        why: `"${stop}" is the first stage, so nothing upstream can have created an ` +
             `occasion for it. Nothing has exercised this path.` };
    }
    if (opportunities > 0) {
      return { v: "Silent", cls: "bad",
        short: `${opportunities.toLocaleString()} → ${stop}: 0`,
        why: `${opportunities.toLocaleString()} upstream row(s) should have caused ` +
             `"${stop}" to write, and it has none.` };
    }
    return { v: "Inert", cls: "indet", short: `no occasion yet`,
      why: `Nothing upstream of "${stop}" has produced either, so there has been no ` +
           `occasion for it to write.` };
  }

  function hierarchy(d) {
    const loops = (d.loops || []).slice().sort((a, b) =>
      scaleOf(a)[1] - scaleOf(b)[1]);

    const rows = loops.map(l => {
      const w = wiring(l), lv = liveness(l);
      const feeds = (FEEDS[l.id] || []).filter(t => loops.some(x => x.id === t));
      // Token in the cell, sentence in the hover. Nothing here is a paragraph.
      return `<tr>
        <td class="ts">${esc(scaleOf(l)[0])}</td>
        <td><a href="#${esc(l.id)}" style="color:var(--fg2)">${esc(l.id)}</a>
            <div class="dim" style="font-size:0.68rem">${esc(l.name)}</div></td>
        <td>${w.ok
          ? `<span class="wire yes">wired</span>`
          : `<span class="wire no" title="${esc(w.why)}">not wired</span>`}</td>
        <td><span class="lv ${lv.cls}" title="${esc(lv.why)}">${esc(lv.v)}</span>
            <span class="metric" title="${esc(lv.why)}">${esc(lv.short || "")}</span></td>
        <td class="dim" style="font-size:0.68rem">${feeds.length
          ? feeds.map(esc).join(" · ")
          : "—"}</td>
      </tr>`;
    }).join("");

    // One legend, once - not the same explanation repeated on every row.
    return `<div class="sec"><h2>The hierarchy</h2>
        <div class="why">Wiring and liveness are two claims and are never merged.
          Hover any token for the reason.</div></div>
      <table><thead><tr>
        <th>Timescale</th><th>Loop</th><th>Wired</th>
        <th>Liveness</th><th>Feeds</th>
      </tr></thead><tbody>${rows}</tbody></table>
      <div class="legend">
        <span><span class="lv good">Ok</span> moved on production data</span>
        <span><span class="lv bad">Silent</span> opportunities exist, sink empty — <b>act on this</b></span>
        <span><span class="lv indet">Inert</span> no occasion yet — not a pass</span>
        <span><span class="wire no">not wired</span> a stage nothing calls</span>
      </div>`;
  }

  // ── Loops ──────────────────────────────────────────────────────────────
  function stageRow(s, isConsequence) {
    // `measured: false` means show nothing, not zero. `rows: -1` is a sentinel
    // and never a value. The count is secondary text now: what the step IS is
    // the thing an artifact passes through, and the count is only how many did.
    const unread = s.measured === false;
    const rows = unread
      ? `<span class="st-rows none">not read</span>`
      : `<span class="st-rows">${Number(s.rows).toLocaleString()} through</span>`;

    const flowed = !unread && Number(s.rows) > 0;
    const node = `<div class="st-node"><div class="st-dot"></div><div class="st-rail"></div></div>`;

    // `nothing_calls_it` is a finding in its own right, whatever the loop's
    // own reading says: no code path invokes that writer at all.
    const dead = s.trigger_label === "nothing_calls_it";
    const agentDriven = s.trigger_label === "prompted";
    const trig = `<span class="trig ${dead ? "dead" : agentDriven ? "agent" : ""}">${
      esc((s.trigger_label || "").replace(/_/g, " "))}</span>`;

    const door = s.action ? `
      <div class="door">
        <div class="door-t">▸ ${esc(s.action.does.split(":")[0])}</div>
        <div class="door-does">${esc(s.action.does)}</div>
        <div class="door-why">Why a person: ${esc(s.action.why_manual)}</div>
        <div class="door-path">${esc(s.action.method)} ${esc(s.action.path)}</div>
      </div>` : "";

    return `<div class="stage ${s.is_first_empty ? "first-empty stops" : ""} ${
        isConsequence ? "consequence" : ""} ${unread ? "unread" : flowed ? "flowed" : ""}">
      ${node}
      <div class="st-body">
        <div class="st-what">${esc(s.what)}</div>
        <div class="st-meta">${rows} · ${trig}
          ${s.is_first_empty ? `<span class="marker">← the path stops here</span>` : ""}
          ${dead ? `<span class="marker">nothing calls this writer</span>` : ""}</div>
        <div class="st-writer">${esc(s.writer || "")}</div>
        ${door}
      </div>
    </div>`;
  }

  function outcome(o) {
    // Every check is narrower than the claim it serves. A tick rendered against
    // the claim would be a lie, so what the check does NOT establish is shown
    // beside it, never hidden behind a hover.
    return `<div class="outcome">
      <div class="oc-h">Checked at stage <b>${esc(o.stage)}</b></div>
      <div class="oc-p">✓ ${esc(o.proposition)}</div>
      <div class="oc-n"><b>Does not show:</b> ${esc(o.does_not_show)}</div>
      ${o.declared_gap ? `<div class="oc-gap"><b>Known gap, not a failure.</b>
        ${esc(o.declared_gap)}</div>` : ""}
    </div>`;
  }

  function loopCard(l) {
    const rd = reading(l.reading);
    // Stages below the first empty one are empty *because of* it. Dimming them
    // keeps one finding from reading as four, which is how these reports
    // stopped being read.
    let seenFirstEmpty = false;
    const stages = (l.stages || []).map(s => {
      const row = stageRow(s, seenFirstEmpty);
      if (s.is_first_empty) seenFirstEmpty = true;
      return row;
    }).join("");

    return `<div class="loop" id="${esc(l.id)}">
      <div class="loop-h">
        <span class="loop-id">${esc(l.id)}</span>
        <span class="loop-n">${esc(l.name)}</span>
        <span class="loop-scope">${esc(l.scope || "")}</span>
        <span class="loop-b badge r-${rd}">${esc(l.status)}${
          l.reason ? " · " + esc(l.reason.replace(/_/g, " ")) : ""}</span>
      </div>
      <div class="claim">Asserts: ${esc(l.claim)}</div>
      <div class="detail">${esc(l.detail)}</div>
      <div class="chain">${stages}</div>
      ${(l.outcomes || []).map(outcome).join("")}
    </div>`;
  }

  const shortTime = t => {
    if (!t) return "";
    const d = new Date(t);
    return isNaN(d) ? "" : d.toISOString().slice(5, 16).replace("T", " ");
  };

  // The lead. A loop is a path an artifact takes, so the surface opens with
  // artifacts you can actually open, and the population is demoted to the
  // bottom of the page. Leading with the census made this screen legible only
  // to someone already holding the machine in their head.
  function paneArtifacts() {
    if (!ARTS) {
      // "Nothing ran" and "I could not ask" are different sentences and must
      // never share one rendering.
      return `<div class="nodoors">Could not read recent artifacts
        (<code>/api/episodes/recent</code> did not answer). This is not the same as
        nothing having run — the page cannot tell you which.</div>`;
    }
    const eps = ARTS.episodes || [], graded = ARTS.graded || [];
    if (!eps.length) {
      return `<div class="nodoors">No episode has been recorded with a response.
        The paths below are declared and nothing has travelled them yet.</div>`;
    }

    const strip = list => `<div class="arts">${list.map(e => `
      <a class="art ${e.contracted ? "contracted" : ""}"
         href="/trace/${encodeURIComponent(e.episode_id)}">
        <div class="art-h">
          <span class="art-a">${esc(e.agent)}</span>
          <span class="art-mark">${e.contracted ? "graded" : "ungraded"}</span>
          <span class="art-t">${esc(shortTime(e.at))}</span>
        </div>
        <div class="art-q">${esc(e.query || "—")}</div>
      </a>`).join("")}</div>`;

    // The proportion is the finding, so it is stated rather than left to be
    // counted off the tiles. Most artifacts cross checkpoints with nothing to
    // grade.
    const n = ARTS.graded_in_recent ?? 0;
    const mix = `<div class="contract"><b style="color:var(--fg3)">${n} of the last
      ${eps.length}</b> were produced by an agent that declares a field contract.
      The rest crossed checkpoints with nothing to grade — that is the default, and
      it is not an error.</div>`;

    const gradedBlock = graded.length ? `<div class="sec" style="margin-top:18px">
        <h2>… and the most recent with graded checkpoints</h2>
        <div class="why">Listed separately so there is always one to open. Ten of 761
          agents declare a contract, so these are rarely the recent ones.</div></div>`
        + strip(graded) : "";

    return strip(eps) + mix + gradedBlock
      + `<div class="contract">${esc(ARTS.note || "")}</div>`;
  }

  function paneLoops() {
    const d = LOOPS;
    const orphanDoors = (ACTIONS?.actions || []).filter(a =>
      !(d.loops || []).some(l => (l.stages || []).some(s => s.action &&
        s.action.subject === a.subject)));

    const lead = `<div class="lead">
      <div class="said">A loop is <b>a path an artifact takes</b>.
        A gate is <b>a checkpoint on that path</b>.</div>
      <div class="gloss">Open one and you get its checkpoints: every one it crossed,
        which of them could have refused it, and which only watched.</div>
    </div>`;

    const doors = orphanDoors.length ? `<div class="loop"><div class="loop-h">
          <span class="loop-n">Other doors</span></div>
          <div class="detail">Declared actions not attached to a stage above.</div>
          <div class="chain">${orphanDoors.map(a => `
            <div class="stage">
              <div class="st-node"><div class="st-dot"></div><div class="st-rail"></div></div>
              <div class="st-body">
                <div class="st-what">${esc(a.subject)}</div>
                <div class="door"><div class="door-does">${esc(a.does)}</div>
                <div class="door-why">Why a person: ${esc(a.why_manual)}</div>
                <div class="door-path">${esc(a.method)} ${esc(a.path)}</div></div>
              </div>
            </div>`).join("")}</div></div>` : "";

    return lead
      + hierarchy(d)
      + `<div class="sec"><h2>Artifacts to open</h2>
         <div class="why">Most recent runs, contracted agents first. <b>Graded</b> means the
           agent declares a field contract, so its checkpoints actually fired;
           the rest cross checkpoints with nothing to grade, which is the default and not
           an error.</div></div>`
      + paneArtifacts()
      + `<div class="sec"><h2>The declared paths</h2>
         <div class="why">Each loop asserts something. The chain is the route, and the
           marked step is where it currently stops — everything below it is empty
           <i>because of</i> it.</div></div>`
      + (d.loops || []).map(loopCard).join("")
      + doors
      + `<div class="sec"><h2>The population view</h2>
         <div class="why">How many paths are in each state. Five buckets, never one
           number: “2 of 6 turning” invites the reader to conclude four are broken, and
           “0 stalled” invites the opposite. Both are wrong.</div></div>`
      + `<div class="census">${tally(d.tally, BUCKETS)}</div>`
      + `<div class="contract">${esc(d.contract || "")}</div>`;
  }

  // ── Gates ──────────────────────────────────────────────────────────────
  const GATE_BUCKETS = [
    ["discriminating", "discriminating", "good",    "has both approved and refused"],
    ["inverted",       "inverted",       "bad",     "asked, and approved nothing"],
    ["never_refused",  "never refused",  "indet",   "run, and refused nothing. Reported, never asserted"],
    ["unexercised",    "unexercised",    "indet",   "not exercised. Not a pass"],
  ];

  function paneGates() {
    const d = GATES;
    const cav = {};
    (d.caveats || []).forEach(c => { if (c.token) cav[c.token] = c; });

    const rows = (d.gates || []).map(g => {
      const rd = reading(g.reading);
      const c = cav[g.token];
      // `since: "boot"` in the text, not a tooltip. A gate with boot-scoped
      // counters and 0 refusals has not "never refused anything" — it has not
      // refused anything since the last deploy.
      const since = g.since === "boot"
        ? `<span class="since-boot">since boot only — resets on deploy</span>`
        : `<span class="dim">durable ledger</span>`;
      return `<tr>
        <td><a href="/gate/${encodeURIComponent(g.id)}"
               style="color:var(--fg2)">${esc(g.id)}</a>
            <div class="dim" style="font-size:0.66rem">${esc(g.refuses || "")}</div></td>
        <td class="num">${g.approved}</td>
        <td class="num">${g.refused}</td>
        <td>${since}</td>
        <td><span class="badge r-${rd}">${esc((g.token || "").replace(/_/g, " "))}</span>
          ${c ? `<div class="caveat"><b>Checked:</b> ${esc(c.checked)}<br/>
                 <b>Does not show:</b> ${esc(c.does_not_show)}</div>` : ""}
          ${g.if_never_refuses ? `<div class="caveat">${esc(g.if_never_refuses)}</div>` : ""}
          <div class="caveat"><a href="/gate/${encodeURIComponent(g.id)}">What it refused, and what anybody said about it →</a></div>
        </td></tr>`;
    }).join("");

    return tally(d.tally, GATE_BUCKETS)
      + `<div class="contract">${esc(d.contract || "")}</div>`
      + `<table><thead><tr><th>Gate</th><th class="num">Approved</th><th class="num">Refused</th>
         <th>Counter scope</th><th>Reading</th></tr></thead><tbody>${rows}</tbody></table>`
      + (!(d.doors || []).length ? `<div class="nodoors">
          <b style="color:var(--fg3)">No actions available on any gate.</b>
          There is no endpoint anywhere that lets a person review what a gate refused,
          override it, or record that a refusal was wrong. That may be correct — a gate
          a person can wave through is not much of a gate — but nobody has decided it
          explicitly, and this space is where that decision gets made rather than
          quietly assumed.</div>` : "");
  }

  // ── Enforcement ────────────────────────────────────────────────────────
  function paneEnforcement() {
    if (!ENF) return `<div class="empty">Enforcement map unavailable.</div>`;
    const disc = ENF.discarded || [], ung = ENF.ungoverned || [];
    const warn = disc.length ? `<div class="warn">
        <b>${disc.length} verb${disc.length === 1 ? "" : "s"} run a gate and discard its verdict.</b>
        From the caller's side that is indistinguishable from having no gate at all: the
        gate is asked, it answers, and control flow is identical either way — so the
        counters on the Gates tab look healthy while nothing is being stopped. No count
        can reveal this; only a declaration of intended enforcement compared against the
        call site.</div>` : "";
    const ungw = ung.length ? `<div class="warn"><b>${ung.length} write(s) no gate can refuse,
        with no reason recorded:</b> ${ung.map(esc).join(", ")}.</div>` : "";

    const rows = (ENF.commands || []).map(c => {
      const gates = (c.gates || []).length
        ? c.gates.map(g => `<div style="margin-bottom:4px">
            <span class="enf e-${esc(g.enforcement)}">${esc(g.enforcement)}</span>
            <span style="color:var(--fg2)">${esc(g.gate)}</span>
            <div class="dim" style="font-size:0.64rem">${esc(g.site)}</div>
            ${g.why_not_control ? `<div class="caveat">${esc(g.why_not_control)}</div>` : ""}
          </div>`).join("")
        : `<span class="enf e-none">none</span>${c.ungated_because
            ? `<div class="caveat">${esc(c.ungated_because)}</div>` : ""}`;
      return `<tr><td><span style="color:var(--fg2)">${esc(c.label)}</span>
        <div class="dim" style="font-size:0.64rem">${esc(c.route)}</div></td>
        <td class="dim">${esc(c.effect)}</td><td>${gates}</td></tr>`;
    }).join("");

    return `<div class="contract">Which verbs a gate can actually stop.
      <b>control</b> runs before the effect and can refuse it; <b>metric</b> runs and the
      verdict is discarded; <b>declared</b> is typed, persisted and never compared. The
      check that runs after the write is a metric; the check that runs before it is a
      control.</div>${warn}${ungw}
      <table><thead><tr><th>Verb</th><th>Effect</th><th>Gates</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }

  function render() {
    document.querySelectorAll(".tab").forEach(b =>
      b.classList.toggle("active", b.dataset.tab === TAB));
    const el = document.getElementById("content");
    try {
      el.innerHTML = TAB === "loops" ? paneLoops()
                   : TAB === "gates" ? paneGates()
                   : paneEnforcement();
    } catch (e) {
      el.innerHTML = `<div class="empty">Could not render: ${esc(e.message)}</div>`;
    }
  }

  async function boot() {
    if (window.Nav) Nav.init({ current: "loops" });
    document.querySelectorAll(".tab").forEach(b =>
      b.addEventListener("click", () => { TAB = b.dataset.tab; render(); }));

    const get = async u => { const r = await fetch(u); return r.ok ? r.json() : null; };
    try {
      // Doors are fetched separately and at startup: the actions are the same
      // whether or not a loop is turning, and a surface that only showed a door
      // when the queue was non-empty would hide it precisely when someone
      // wanted to ask why the queue was empty.
      [LOOPS, GATES, ACTIONS, ENF, ARTS] = await Promise.all([
        get("/api/loops"), get("/api/gates"),
        get("/api/loops/actions"), get("/api/gates/enforcement"),
        get("/api/episodes/recent"),
      ]);
    } catch (e) { /* handled below */ }

    if (!LOOPS) {
      document.getElementById("content").innerHTML =
        `<div class="empty">Sign in to see the control surface.
         <a href="/auth/google">Google</a> · <a href="/auth/github">GitHub</a></div>`;
      return;
    }
    render();
  }

  boot();
  </script>
</body>
</html>
