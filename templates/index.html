<!doctype html>
<html lang="en" class="theme-hasui">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Bestiary</title>
    <link rel="stylesheet" href="/static/css/variables.css" />
    <link rel="stylesheet" href="/static/css/common.css" />
    <link rel="stylesheet" href="/static/css/components.css" />
    <style>
      /* OP-1 page-specific overrides */
      .theme-op1 .specimen-card {
        border-radius: 12px;
        border: 2px solid var(--bg2);
      }

      .theme-op1 .specimen-card:hover {
        border-color: var(--yellow);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }

      .theme-op1 .specimen-avatar {
        border-radius: 50%;
        border: 2px solid #1a1a1a;
      }

      .theme-op1 .specimen-avatar img {
        display: none;
      }

      .theme-op1 .specimen-avatar .placeholder {
        display: none;
      }

      /* OP-1 colored dots for each agent */
      .theme-op1 .specimen-card:nth-child(8n + 1) .specimen-avatar {
        background: #5ac8fa;
      }
      .theme-op1 .specimen-card:nth-child(8n + 2) .specimen-avatar {
        background: #4cd964;
      }
      .theme-op1 .specimen-card:nth-child(8n + 3) .specimen-avatar {
        background: #ff6b35;
      }
      .theme-op1 .specimen-card:nth-child(8n + 4) .specimen-avatar {
        background: #ffffff;
      }
      .theme-op1 .specimen-card:nth-child(8n + 5) .specimen-avatar {
        background: #af52de;
      }
      .theme-op1 .specimen-card:nth-child(8n + 6) .specimen-avatar {
        background: #ff2d55;
      }
      .theme-op1 .specimen-card:nth-child(8n + 7) .specimen-avatar {
        background: #ffcc00;
      }
      .theme-op1 .specimen-card:nth-child(8n + 8) .specimen-avatar {
        background: #ff9500;
      }

      .theme-op1 .specimens-grid {
        gap: 1px;
        background: #1a1a1a;
      }

      .theme-op1 header {
        border-bottom: 1px solid #1a1a1a;
      }

      /* Architectural Header - Lacaton & Vassal Style */
      .header-left {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      h1 {
        font-size: 1.4em;
        font-weight: 400;
        color: var(--fg0);
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .subtitle {
        color: var(--gray);
        font-size: 0.85em;
        font-weight: 400;
        letter-spacing: 0.02em;
      }

      .header-right {
        display: flex;
        gap: 30px;
        font-size: 0.85em;
        color: var(--fg3);
        align-items: baseline;
      }

      .header-stat {
        display: flex;
        flex-direction: column;
        gap: 2px;
        text-align: right;
      }

      .stat-value-header {
        font-size: 1.8em;
        color: var(--yellow);
        font-weight: 300;
        line-height: 1;
      }

      .stat-label-header {
        text-transform: uppercase;
        font-size: 0.75em;
        letter-spacing: 0.08em;
        color: var(--gray);
      }

      /* Container */
      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 30px;
      }

      .section-title {
        font-size: 0.85em;
        font-weight: 400;
        color: var(--fg2);
        margin-bottom: 20px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-bottom: 1px solid var(--bg2);
        padding-bottom: 8px;
      }

      .specimens-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 16px;
      }

      .specimen-card {
        background: var(--bg1);
        border: 1px solid var(--bg2);
        padding: 0;
        transition: all 0.2s ease;
        cursor: pointer;
        overflow: hidden;
      }

      .specimen-card:hover {
        border-color: var(--yellow);
        transform: translateY(-1px);
      }

      .specimen-header {
        padding: 20px;
        border-bottom: 1px solid var(--bg2);
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .specimen-avatar {
        width: 64px;
        height: 64px;
        background: var(--bg2);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid var(--bg3);
        flex-shrink: 0;
      }

      .specimen-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: sepia(10%) saturate(90%);
      }

      .specimen-avatar.loading {
        animation: pulse 2s ease-in-out infinite;
      }

      .specimen-avatar .placeholder {
        font-size: 2em;
        filter: grayscale(100%);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .specimen-name {
        font-size: 1.1em;
        font-weight: 400;
        color: var(--fg0);
        text-transform: capitalize;
        letter-spacing: 0.01em;
      }

      .specimen-system-name {
        font-size: 0.7em;
        color: var(--gray);
        font-family: "SF Mono", "Monaco", "Courier New", monospace;
        letter-spacing: 0.02em;
        margin-top: 2px;
      }

      .specimen-body {
        padding: 16px 20px 20px;
      }

      .specimen-description {
        color: var(--fg2);
        font-size: 0.9em;
        margin-bottom: 12px;
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .specimen-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 12px;
      }

      .specimen-tag {
        background: var(--bg2);
        color: var(--aqua);
        padding: 2px 8px;
        font-size: 0.7em;
        letter-spacing: 0.03em;
        border: 1px solid var(--bg3);
      }

      .theme-op1 .specimen-tag {
        border-radius: 10px;
        color: var(--aqua);
      }

      .specimen-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 10px;
        border-top: 1px solid var(--bg2);
      }

      .specimen-stat {
        font-size: 0.75em;
        color: var(--gray);
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .specimen-stat-value {
        color: var(--fg2);
        font-weight: 500;
      }

      .specimen-meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        font-size: 0.85em;
      }

      .meta-item {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid var(--bg2);
      }

      .meta-label {
        color: var(--gray);
        font-weight: 400;
        font-size: 0.85em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .meta-value {
        color: var(--fg2);
      }

      .badge {
        display: inline-block;
        padding: 3px 8px;
        background: transparent;
        color: var(--yellow);
        border: 1px solid var(--yellow);
        font-size: 0.75em;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 400;
      }

      .loading {
        text-align: center;
        color: var(--fg3);
        font-size: 1.1em;
        padding: 40px;
      }

      .error {
        background: var(--bg1);
        border: 1px solid var(--red);
        color: var(--red);
        padding: 20px;
        text-align: center;
      }

      /* Catalogue Header */
      .catalogue-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 12px;
      }
      .catalogue-header .section-title {
        margin-bottom: 0;
        border-bottom: none;
        padding-bottom: 0;
      }
      .sort-select {
        background: var(--bg1);
        border: 1px solid var(--bg3);
        color: var(--fg2);
        padding: 8px 12px;
        font-size: 0.85em;
        font-family: inherit;
        cursor: pointer;
        outline: none;
      }
      .sort-select:focus {
        border-color: var(--yellow);
      }
      .category-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 16px;
      }
      .category-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg1);
        border: 1px solid var(--bg2);
        padding: 8px 14px;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.8em;
      }
      .category-badge:hover {
        border-color: var(--yellow);
      }
      .category-badge.active {
        border-color: var(--yellow);
        background: var(--bg2);
      }
      .category-badge .cat-icon {
        font-size: 1.2em;
      }
      .category-badge .cat-count {
        background: var(--bg3);
        color: var(--fg3);
        padding: 1px 6px;
        font-size: 0.85em;
        border-radius: 8px;
        min-width: 18px;
        text-align: center;
      }
      /* ── Compound / Deck indicators ── */
      .specimen-avatar-wrap {
        position: relative;
        flex-shrink: 0;
      }
      .specimen-avatar-wrap.compound .specimen-avatar {
        border: 2px solid var(--purple);
        box-shadow:
          0 0 0 3px var(--bg1),
          0 0 0 5px var(--purple);
      }
      .specimen-avatar-wrap.system-tier .specimen-avatar {
        border: 2px solid var(--yellow);
        box-shadow:
          0 0 0 3px var(--bg1),
          0 0 0 5px var(--yellow);
      }
      .tool-count-ring {
        position: absolute;
        top: -4px;
        right: -4px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--purple);
        color: #fff;
        font-size: 0.65em;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--bg1);
        z-index: 1;
      }
      .system-tier .tool-count-ring {
        background: var(--yellow);
        color: var(--bg0);
      }
      .complexity-badge {
        display: inline-block;
        padding: 2px 7px;
        font-size: 0.65em;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border: 1px solid;
        margin-left: 4px;
        vertical-align: middle;
      }
      .complexity-badge.compound {
        color: var(--purple);
        border-color: var(--purple);
      }
      .complexity-badge.deck {
        color: var(--orange);
        border-color: var(--orange);
      }
      .complexity-badge.system {
        color: var(--yellow);
        border-color: var(--yellow);
      }
      .theme-op1 .complexity-badge {
        border-radius: 8px;
      }
      .theme-op1 .tool-count-ring {
        border-radius: 50%;
      }
      .theme-op1 .sort-select {
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <script src="/static/js/widgets/nav.js"></script>
    <script>
      Nav.init({
        current: "catalogue",
        subtitle: "make your agents dreams come true",
        stat: { value: "--", label: "Specimens", id: "total-agents" },
      });
    </script>

    <div class="container">
      <div class="catalogue-header">
        <h2 class="section-title">Catalogue</h2>
        <select class="sort-select" id="sort-select">
          <option value="newest">Newest</option>
          <option value="executions">Most Executions</option>
          <option value="complexity">Most Complex</option>
          <option value="name">Name A-Z</option>
        </select>
      </div>

      <div class="category-badges" id="category-badges"></div>

      <div class="specimens-grid" id="specimens-grid">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <script src="/static/js/widgets/toast.js"></script>
    <script src="/static/js/widgets/agent-card.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
      async function generateAvatar(agentId) {
        try {
          const response = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/avatar`,
          );
          if (!response.ok) return null;
          const data = await response.json();
          return `data:${data.image.mime_type};base64,${data.image.data}`;
        } catch {
          return null;
        }
      }

      // Throttled avatar loading — 5 concurrent requests max
      const avatarQueue = [];
      let avatarLoading = 0;
      const AVATAR_CONCURRENCY = 5;
      function queueAvatar(agentId) {
        avatarQueue.push(agentId);
        drainAvatarQueue();
      }
      async function drainAvatarQueue() {
        while (avatarQueue.length > 0 && avatarLoading < AVATAR_CONCURRENCY) {
          const id = avatarQueue.shift();
          avatarLoading++;
          generateAvatar(id).then((url) => {
            avatarLoading--;
            const el = document.getElementById(`avatar-${CSS.escape(id)}`);
            if (el && url) {
              el.innerHTML = `<img src="${url}" alt="${id}">`;
              el.style.background = "";
              el.classList.remove("loading");
            }
            drainAvatarQueue();
          });
        }
      }

      // Category definitions
      const CATEGORIES = [
        {
          id: "research",
          label: "Research",
          tags: [
            "forecasting",
            "economics",
            "macro",
            "monte-carlo",
            "simulation",
            "probability",
            "quantitative",
            "risk",
            "research",
            "analysis",
          ],
        },
        {
          id: "creative",
          label: "Creative",
          tags: [
            "creative",
            "art",
            "patron",
            "image",
            "style",
            "artist",
            "ar",
            "augmented-reality",
            "avatar",
          ],
        },
        {
          id: "social",
          label: "Social Media",
          tags: [
            "social-media",
            "instagram",
            "bluesky",
            "publishing",
            "marketing",
            "cross-posting",
          ],
        },
        {
          id: "coherence",
          label: "Coherence",
          tags: ["coherence", "coordination", "thagard", "discourse-analysis"],
        },
        {
          id: "billing",
          label: "Billing",
          tags: ["billing", "stripe", "payments", "checkout", "payout"],
        },
        {
          id: "meta",
          label: "Meta",
          tags: [
            "meta",
            "performance",
            "coaching",
            "agent-improvement",
            "dreams",
            "consolidation",
            "companion",
            "navigation",
            "platform-guide",
          ],
        },
        {
          id: "games",
          label: "Games",
          tags: ["puzzle", "daily", "engagement", "demo", "wordle"],
        },
        {
          id: "osint",
          label: "OSINT",
          tags: [
            "osint",
            "investigation",
            "entity-resolution",
            "knowledge-graph",
            "due-diligence",
          ],
        },
        {
          id: "compound",
          label: "Compound",
          tags: ["compound-agent"],
          special: true,
        },
      ];

      // State — world view: load everything once, filter client-side
      let allAgents = [];
      let currentCategory = "";
      let currentSort = "newest";

      // ── Load all agents once ──
      async function loadWorld() {
        try {
          const response = await fetch(`/api/agents?limit=200`);
          const data = await response.json();
          allAgents = data.agents || [];

          const totalEl = document.getElementById("total-agents");
          if (totalEl) totalEl.textContent = allAgents.length;

          renderCategoryBadges();
          renderWorld();
        } catch (error) {
          console.error("Error loading agents:", error);
          document.getElementById("specimens-grid").innerHTML =
            '<div class="error">Error loading specimens. Please try again later.</div>';
        }
      }

      // ── Classify agent complexity ──
      function classifyAgent(agent) {
        const tags = agent.tags || agent.metadata?.tags || [];
        const tools = agent.capabilities?.mcp_tools || [];
        const tier = (agent.tier || "").toLowerCase();
        const isCompound = tags.includes("compound-agent");
        const isDeck = tools.length >= 5 && !isCompound;
        const isSystem = tier === "system";
        const toolCount = tools.length;
        return { isCompound, isDeck, isSystem, toolCount };
      }

      // ── Render the grid from allAgents ──
      function renderWorld() {
        let filtered = [...allAgents];

        // Category filter (client-side)
        if (currentCategory) {
          const cat = CATEGORIES.find((c) => c.id === currentCategory);
          if (cat) {
            filtered = filtered.filter((a) => {
              const tags = a.tags || a.metadata?.tags || [];
              return tags.some((t) => cat.tags.includes(t));
            });
          }
        }

        // Sort
        switch (currentSort) {
          case "executions":
            filtered.sort(
              (a, b) =>
                (b.execution_stats?.total_executions || 0) -
                (a.execution_stats?.total_executions || 0),
            );
            break;
          case "name":
            filtered.sort((a, b) => {
              const na = a.display_alias || a.agent_id || "";
              const nb = b.display_alias || b.agent_id || "";
              return na.toLowerCase().localeCompare(nb.toLowerCase());
            });
            break;
          case "complexity":
            filtered.sort((a, b) => {
              const ca = (a.capabilities?.mcp_tools || []).length;
              const cb = (b.capabilities?.mcp_tools || []).length;
              return cb - ca;
            });
            break;
          default: // newest
            break;
        }

        const grid = document.getElementById("specimens-grid");
        grid.innerHTML = "";

        if (filtered.length === 0) {
          grid.innerHTML =
            '<div class="loading">No specimens match this filter</div>';
          return;
        }

        filtered.forEach((agent) => {
          const card = document.createElement("div");
          card.className = "specimen-card";
          const agentId = agent.agent_id || "unknown";
          const displayName =
            agent.display_alias && agent.display_alias !== ""
              ? agent.display_alias
              : agentId.replace(/_/g, " ");
          const description =
            agent.description && agent.description !== ""
              ? agent.description
              : agent.metadata?.description || "A mysterious agent";
          const tier = agent.tier || "curated";
          const executions =
            agent.execution_stats?.total_executions ||
            agent.usage?.total_executions ||
            0;
          const model = (agent.model || agent.capabilities?.model || "unknown")
            .replace("claude-3-", "")
            .replace("-20240307", "");
          const tags = agent.tags || agent.metadata?.tags || [];
          const initial = displayName.charAt(0).toUpperCase();

          const hues = [200, 140, 30, 340, 270, 50, 170, 10];
          const hue = hues[agentId.charCodeAt(0) % hues.length];

          const tagHtml = tags
            .slice(0, 4)
            .map((t) => `<span class="specimen-tag">${t}</span>`)
            .join("");

          const wsCount = agent.workspace_count || 0;
          const compositionLine =
            wsCount > 0
              ? `<div style="font-size:0.72em;color:var(--purple);margin:4px 0 2px;letter-spacing:0.03em">in ${wsCount} composition${wsCount !== 1 ? "s" : ""}</div>`
              : "";

          // Complexity classification
          const cx = classifyAgent(agent);
          const wrapClass = cx.isCompound
            ? "compound"
            : cx.isSystem
              ? "system-tier"
              : "";
          const toolRing =
            cx.toolCount > 0
              ? `<div class="tool-count-ring" title="${cx.toolCount} tools">${cx.toolCount}</div>`
              : "";

          let complexityBadge = "";
          if (cx.isCompound)
            complexityBadge =
              '<span class="complexity-badge compound">compound</span>';
          else if (cx.isDeck)
            complexityBadge = '<span class="complexity-badge deck">deck</span>';
          if (cx.isSystem)
            complexityBadge +=
              '<span class="complexity-badge system">system</span>';

          card.innerHTML = `
            <div class="specimen-header">
              <div class="specimen-avatar-wrap ${wrapClass}">
                <div class="specimen-avatar" id="avatar-${CSS.escape(agentId)}"
                     style="background: hsl(${hue}, 45%, 35%); color: #fff; font-size: 1.4em; font-weight: 300;">
                  ${initial}
                </div>
                ${toolRing}
              </div>
              <div>
                <div class="specimen-name">${displayName}</div>
                ${agent.display_alias && agent.display_alias !== "" ? `<div class="specimen-system-name">${agentId}</div>` : ""}
                <span class="badge">${tier}</span>
                ${complexityBadge}
                ${agent.fork_count > 0 ? `<span class="badge" style="background:var(--blue);color:#fff;margin-left:4px" title="${agent.fork_count} forks">&#9906; ${agent.fork_count}</span>` : ""}
                ${agent.forked_from ? `<span class="badge" style="background:var(--purple);color:#fff;margin-left:4px" title="Forked agent">fork</span>` : ""}
              </div>
            </div>
            <div class="specimen-body">
              <div class="specimen-description">${description}</div>
              ${tagHtml ? `<div class="specimen-tags">${tagHtml}</div>` : ""}
              ${compositionLine}
              <div class="specimen-footer">
                <div class="specimen-stat">
                  <span class="meta-label">Runs</span>
                  <span class="specimen-stat-value">${executions}</span>
                </div>
                <div class="specimen-stat">
                  <span class="meta-label">Model</span>
                  <span class="specimen-stat-value">${model}</span>
                </div>
                <div class="specimen-stat">
                  <span class="meta-label">Tools</span>
                  <span class="specimen-stat-value">${cx.toolCount}</span>
                </div>
              </div>
            </div>
          `;

          card.addEventListener("click", () => {
            window.location.href = `/agent/${agentId}`;
          });

          grid.appendChild(card);

          queueAvatar(agentId);
        });
      }

      // ── Category badges with counts from full dataset ──
      function renderCategoryBadges() {
        const el = document.getElementById("category-badges");
        const counts = {};
        CATEGORIES.forEach((cat) => {
          counts[cat.id] = allAgents.filter((a) => {
            const tags = a.tags || a.metadata?.tags || [];
            return tags.some((t) => cat.tags.includes(t));
          }).length;
        });

        el.innerHTML = CATEGORIES.map((cat) => {
          const count = counts[cat.id] || 0;
          if (count === 0 && !cat.special) return "";
          const active = currentCategory === cat.id ? "active" : "";
          const special = cat.special ? ' style="border-style:dashed"' : "";
          return `<div class="category-badge ${active}"${special} onclick="toggleCategory('${cat.id}')">
            <span>${cat.label}</span>
            <span class="cat-count">${count}</span>
          </div>`;
        }).join("");
      }

      function toggleCategory(catId) {
        currentCategory = currentCategory === catId ? "" : catId;
        renderCategoryBadges();
        renderWorld();
      }

      // Wire up sort
      document.getElementById("sort-select").addEventListener("change", (e) => {
        currentSort = e.target.value;
        renderWorld();
      });

      loadWorld();
    </script>
