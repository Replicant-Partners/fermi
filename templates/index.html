<!doctype html>
<html lang="en" class="theme-hasui">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Bestiary</title>
    <link rel="stylesheet" href="/static/css/variables.css" />
    <link rel="stylesheet" href="/static/css/common.css" />
    <style>
      /* OP-1 page-specific overrides */
      .theme-op1 .specimen-card {
        border-radius: 12px;
        border: 2px solid var(--bg2);
      }

      .theme-op1 .specimen-card:hover {
        border-color: var(--yellow);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }

      .theme-op1 .specimen-avatar {
        border-radius: 50%;
        border: 2px solid #1a1a1a;
      }

      .theme-op1 .specimen-avatar img {
        display: none;
      }

      .theme-op1 .specimen-avatar .placeholder {
        display: none;
      }

      /* OP-1 colored dots for each agent */
      .theme-op1 .specimen-card:nth-child(8n + 1) .specimen-avatar {
        background: #5ac8fa;
      }
      .theme-op1 .specimen-card:nth-child(8n + 2) .specimen-avatar {
        background: #4cd964;
      }
      .theme-op1 .specimen-card:nth-child(8n + 3) .specimen-avatar {
        background: #ff6b35;
      }
      .theme-op1 .specimen-card:nth-child(8n + 4) .specimen-avatar {
        background: #ffffff;
      }
      .theme-op1 .specimen-card:nth-child(8n + 5) .specimen-avatar {
        background: #af52de;
      }
      .theme-op1 .specimen-card:nth-child(8n + 6) .specimen-avatar {
        background: #ff2d55;
      }
      .theme-op1 .specimen-card:nth-child(8n + 7) .specimen-avatar {
        background: #ffcc00;
      }
      .theme-op1 .specimen-card:nth-child(8n + 8) .specimen-avatar {
        background: #ff9500;
      }

      .theme-op1 .specimens-grid {
        gap: 1px;
        background: #1a1a1a;
      }

      .theme-op1 header {
        border-bottom: 1px solid #1a1a1a;
      }

      /* Architectural Header - Lacaton & Vassal Style */
      header {
        border-bottom: 1px solid var(--bg3);
        padding: 20px 30px;
        background: var(--bg0);
      }

      .header-grid {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 40px;
        align-items: baseline;
      }

      .header-left {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      h1 {
        font-size: 1.4em;
        font-weight: 400;
        color: var(--fg0);
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .subtitle {
        color: var(--gray);
        font-size: 0.85em;
        font-weight: 400;
        letter-spacing: 0.02em;
      }

      .header-right {
        display: flex;
        gap: 30px;
        font-size: 0.85em;
        color: var(--fg3);
        align-items: baseline;
      }

      .header-stat {
        display: flex;
        flex-direction: column;
        gap: 2px;
        text-align: right;
      }

      .stat-value-header {
        font-size: 1.8em;
        color: var(--yellow);
        font-weight: 300;
        line-height: 1;
      }

      .stat-label-header {
        text-transform: uppercase;
        font-size: 0.75em;
        letter-spacing: 0.08em;
        color: var(--gray);
      }

      /* Container */
      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 30px;
      }

      .section-title {
        font-size: 0.85em;
        font-weight: 400;
        color: var(--fg2);
        margin-bottom: 20px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-bottom: 1px solid var(--bg2);
        padding-bottom: 8px;
      }

      .specimens-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 16px;
      }

      .specimen-card {
        background: var(--bg1);
        border: 1px solid var(--bg2);
        padding: 0;
        transition: all 0.2s ease;
        cursor: pointer;
        overflow: hidden;
      }

      .specimen-card:hover {
        border-color: var(--yellow);
        transform: translateY(-1px);
      }

      .specimen-header {
        padding: 20px;
        border-bottom: 1px solid var(--bg2);
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .specimen-avatar {
        width: 64px;
        height: 64px;
        background: var(--bg2);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid var(--bg3);
        flex-shrink: 0;
      }

      .specimen-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: sepia(10%) saturate(90%);
      }

      .specimen-avatar.loading {
        animation: pulse 2s ease-in-out infinite;
      }

      .specimen-avatar .placeholder {
        font-size: 2em;
        filter: grayscale(100%);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .specimen-name {
        font-size: 1.1em;
        font-weight: 400;
        color: var(--fg0);
        text-transform: capitalize;
        letter-spacing: 0.01em;
      }

      .specimen-system-name {
        font-size: 0.7em;
        color: var(--gray);
        font-family: "SF Mono", "Monaco", "Courier New", monospace;
        letter-spacing: 0.02em;
        margin-top: 2px;
      }

      .specimen-body {
        padding: 16px 20px 20px;
      }

      .specimen-description {
        color: var(--fg2);
        font-size: 0.9em;
        margin-bottom: 12px;
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .specimen-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 12px;
      }

      .specimen-tag {
        background: var(--bg2);
        color: var(--aqua);
        padding: 2px 8px;
        font-size: 0.7em;
        letter-spacing: 0.03em;
        border: 1px solid var(--bg3);
      }

      .theme-op1 .specimen-tag {
        border-radius: 10px;
        color: var(--aqua);
      }

      .specimen-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 10px;
        border-top: 1px solid var(--bg2);
      }

      .specimen-stat {
        font-size: 0.75em;
        color: var(--gray);
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .specimen-stat-value {
        color: var(--fg2);
        font-weight: 500;
      }

      .specimen-meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        font-size: 0.85em;
      }

      .meta-item {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid var(--bg2);
      }

      .meta-label {
        color: var(--gray);
        font-weight: 400;
        font-size: 0.85em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .meta-value {
        color: var(--fg2);
      }

      .badge {
        display: inline-block;
        padding: 3px 8px;
        background: transparent;
        color: var(--yellow);
        border: 1px solid var(--yellow);
        font-size: 0.75em;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 400;
      }

      .loading {
        text-align: center;
        color: var(--fg3);
        font-size: 1.1em;
        padding: 40px;
      }

      .error {
        background: var(--bg1);
        border: 1px solid var(--red);
        color: var(--red);
        padding: 20px;
        text-align: center;
      }

      /* Search & Filter Controls */
      .catalogue-controls {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
        align-items: center;
      }
      .search-input {
        flex: 1;
        min-width: 200px;
        background: var(--bg1);
        border: 1px solid var(--bg3);
        color: var(--fg1);
        padding: 8px 14px;
        font-size: 0.9em;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s;
      }
      .search-input:focus {
        border-color: var(--yellow);
      }
      .search-input::placeholder {
        color: var(--gray);
      }
      .sort-select {
        background: var(--bg1);
        border: 1px solid var(--bg3);
        color: var(--fg2);
        padding: 8px 12px;
        font-size: 0.85em;
        font-family: inherit;
        cursor: pointer;
        outline: none;
      }
      .sort-select:focus {
        border-color: var(--yellow);
      }
      .category-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 16px;
      }
      .category-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg1);
        border: 1px solid var(--bg2);
        padding: 8px 14px;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.8em;
      }
      .category-badge:hover {
        border-color: var(--yellow);
      }
      .category-badge.active {
        border-color: var(--yellow);
        background: var(--bg2);
      }
      .category-badge .cat-icon {
        font-size: 1.2em;
      }
      .category-badge .cat-count {
        background: var(--bg3);
        color: var(--fg3);
        padding: 1px 6px;
        font-size: 0.85em;
        border-radius: 8px;
        min-width: 18px;
        text-align: center;
      }
      .tag-filters {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        margin-bottom: 16px;
        align-items: baseline;
      }
      .tag-word {
        color: var(--fg3);
        cursor: pointer;
        transition: color 0.15s;
        letter-spacing: 0.02em;
        line-height: 1.6;
        border: none;
        background: none;
        padding: 0;
        font-family: inherit;
      }
      .tag-word:hover {
        color: var(--fg1);
      }
      .tag-word.active {
        color: var(--yellow);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid var(--bg2);
      }
      .page-btn {
        background: var(--bg1);
        border: 1px solid var(--bg3);
        color: var(--fg3);
        padding: 6px 14px;
        font-size: 0.85em;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.2s;
      }
      .page-btn:hover:not(:disabled) {
        border-color: var(--yellow);
        color: var(--yellow);
      }
      .page-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .page-btn.active {
        border-color: var(--yellow);
        color: var(--yellow);
      }
      .page-info {
        color: var(--gray);
        font-size: 0.8em;
      }
      .theme-op1 .search-input,
      .theme-op1 .sort-select {
        border-radius: 8px;
      }
      .theme-op1 .tag-word.active {
        color: var(--orange);
      }
      .theme-op1 .page-btn {
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-grid">
        <div class="header-left">
          <a href="/" style="color: var(--fg1); text-decoration: none"
            ><h1>Agent Bestiary</h1></a
          >
          <div class="subtitle">make your agents dreams come true</div>
        </div>
        <div class="header-right">
          <div class="header-stat">
            <div class="stat-value-header" id="total-agents">--</div>
            <div class="stat-label-header">Specimens</div>
          </div>
          <a href="/catalogue" style="color: var(--yellow)">Catalogue</a>
          <a href="/dashboard">Dashboard</a>
          <div id="user-area" class="auth-area"></div>
          <button
            id="theme-toggle"
            class="theme-toggle-btn"
            title="Toggle Theme (Ctrl+T)"
          >
            OP-1
          </button>
        </div>
      </div>
    </header>

    <div class="container">
      <h2 class="section-title">Catalogue</h2>

      <div class="category-badges" id="category-badges"></div>

      <div class="catalogue-controls">
        <input
          type="text"
          class="search-input"
          id="search-input"
          placeholder="Search agents by name, description, or tag..."
        />
        <select class="sort-select" id="sort-select">
          <option value="newest">Newest</option>
          <option value="executions">Most Executions</option>
          <option value="name">Name A-Z</option>
        </select>
      </div>
      <div class="tag-filters" id="tag-filters"></div>

      <div class="specimens-grid" id="specimens-grid">
        <div class="loading">Loading...</div>
      </div>

      <div class="pagination" id="pagination" style="display: none"></div>
    </div>

    <script>
      async function generateAvatar(agentId) {
        try {
          const response = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/avatar`,
          );
          if (!response.ok) throw new Error("Avatar generation failed");
          const data = await response.json();
          return `data:${data.image.mime_type};base64,${data.image.data}`;
        } catch (error) {
          console.error(`Error generating avatar for ${agentId}:`, error);
          return null;
        }
      }

      // Category definitions
      const CATEGORIES = [
        {
          id: "research",
          label: "Research & Analysis",
          tags: [
            "forecasting",
            "economics",
            "macro",
            "monte-carlo",
            "simulation",
            "probability",
            "quantitative",
            "risk",
          ],
        },
        {
          id: "creative",
          label: "Creative & Art",
          tags: [
            "creative",
            "art",
            "patron",
            "monetization",
            "artist",
            "ar",
            "augmented-reality",
            "avatar",
          ],
        },
        {
          id: "games",
          label: "Games & Engagement",
          tags: ["puzzle", "daily", "engagement", "demo", "wordle"],
        },
        {
          id: "meta",
          label: "Meta & Platform",
          tags: [
            "meta",
            "performance",
            "coaching",
            "agent-improvement",
            "dreams",
            "consolidation",
            "tutorial",
            "companion",
            "getting-started",
          ],
        },
        {
          id: "osint",
          label: "OSINT & Investigation",
          tags: [
            "osint",
            "investigation",
            "entity-resolution",
            "knowledge-graph",
            "due-diligence",
          ],
        },
        {
          id: "coherence",
          label: "Coherence",
          tags: ["coherence", "thagard", "discourse-analysis"],
        },
      ];

      // State
      let currentPage = 1;
      let currentSearch = "";
      let currentTag = "";
      let currentCategory = "";
      let currentSort = "newest";
      let allTags = new Map();
      let categoryCounts = {};

      async function loadAgents(page = 1) {
        currentPage = page;
        const params = new URLSearchParams();
        params.set("page", page);
        params.set("limit", "20");
        if (currentSearch) params.set("search", currentSearch);
        if (currentTag) params.set("tag", currentTag);
        if (currentCategory && !currentTag) {
          const cat = CATEGORIES.find((c) => c.id === currentCategory);
          if (cat) params.set("tags", cat.tags.join(","));
        }
        if (currentSort) params.set("sort", currentSort);

        try {
          const response = await fetch(`/api/agents?${params}`);
          const data = await response.json();

          const totalEl = document.getElementById("total-agents");
          if (totalEl) totalEl.textContent = data.total;

          const grid = document.getElementById("specimens-grid");
          grid.innerHTML = "";

          if (data.agents.length === 0) {
            grid.innerHTML =
              '<div class="loading">No specimens match your search</div>';
            renderPagination(0, 1, 1);
            return;
          }

          // Collect all tags for the filter pills + count categories
          categoryCounts = {};
          data.agents.forEach((agent) => {
            const tags = agent.tags || [];
            tags.forEach((t) => allTags.set(t, (allTags.get(t) || 0) + 1));
            CATEGORIES.forEach((cat) => {
              if (tags.some((t) => cat.tags.includes(t))) {
                categoryCounts[cat.id] = (categoryCounts[cat.id] || 0) + 1;
              }
            });
          });
          renderCategoryBadges();
          renderTagCloud();

          data.agents.forEach((agent) => {
            const card = document.createElement("div");
            card.className = "specimen-card";
            const agentId = agent.agent_id || "unknown";
            const displayName =
              agent.display_alias && agent.display_alias !== ""
                ? agent.display_alias
                : agentId.replace(/_/g, " ");
            const description =
              agent.description && agent.description !== ""
                ? agent.description
                : agent.metadata?.description || "A mysterious agent";
            const tier = agent.tier || "curated";
            const executions =
              agent.execution_stats?.total_executions ||
              agent.usage?.total_executions ||
              0;
            const model = (
              agent.model ||
              agent.capabilities?.model ||
              "unknown"
            )
              .replace("claude-3-", "")
              .replace("-20240307", "");
            const tags = agent.tags || agent.metadata?.tags || [];
            const initial = displayName.charAt(0).toUpperCase();

            const hues = [200, 140, 30, 340, 270, 50, 170, 10];
            const hue = hues[agentId.charCodeAt(0) % hues.length];

            const tagHtml = tags
              .slice(0, 4)
              .map((t) => `<span class="specimen-tag">${t}</span>`)
              .join("");

            card.innerHTML = `
              <div class="specimen-header">
                <div class="specimen-avatar" id="avatar-${CSS.escape(agentId)}"
                     style="background: hsl(${hue}, 45%, 35%); color: #fff; font-size: 1.4em; font-weight: 300;">
                  ${initial}
                </div>
                <div>
                  <div class="specimen-name">${displayName}</div>
                  ${agent.display_alias && agent.display_alias !== "" ? `<div class="specimen-system-name">${agentId}</div>` : ""}
                  <span class="badge">${tier}</span>
                </div>
              </div>
              <div class="specimen-body">
                <div class="specimen-description">${description}</div>
                ${tagHtml ? `<div class="specimen-tags">${tagHtml}</div>` : ""}
                <div class="specimen-footer">
                  <div class="specimen-stat">
                    <span class="meta-label">Runs</span>
                    <span class="specimen-stat-value">${executions}</span>
                  </div>
                  <div class="specimen-stat">
                    <span class="meta-label">Model</span>
                    <span class="specimen-stat-value">${model}</span>
                  </div>
                  <div class="specimen-stat">
                    <span class="meta-label">Type</span>
                    <span class="specimen-stat-value">${agent.agent_type || "—"}</span>
                  </div>
                </div>
              </div>
            `;

            card.addEventListener("click", () => {
              window.location.href = `/agent/${agentId}`;
            });

            grid.appendChild(card);

            generateAvatar(agentId).then((avatarUrl) => {
              const avatarDiv = document.getElementById(
                `avatar-${CSS.escape(agentId)}`,
              );
              if (avatarDiv && avatarUrl) {
                avatarDiv.innerHTML = `<img src="${avatarUrl}" alt="${agentId}">`;
                avatarDiv.style.background = "";
                avatarDiv.classList.remove("loading");
              }
            });
          });

          renderPagination(data.total, data.page, data.pages);
        } catch (error) {
          console.error("Error loading agents:", error);
          const grid = document.getElementById("specimens-grid");
          grid.innerHTML =
            '<div class="error">Error loading specimens. Please try again later.</div>';
        }
      }

      function renderPagination(total, page, pages) {
        const el = document.getElementById("pagination");
        if (pages <= 1) {
          el.style.display = "none";
          return;
        }
        el.style.display = "flex";
        let html = `<button class="page-btn" onclick="loadAgents(${page - 1})" ${page <= 1 ? "disabled" : ""}>&laquo; Prev</button>`;
        const start = Math.max(1, page - 2);
        const end = Math.min(pages, page + 2);
        for (let i = start; i <= end; i++) {
          html += `<button class="page-btn ${i === page ? "active" : ""}" onclick="loadAgents(${i})">${i}</button>`;
        }
        html += `<button class="page-btn" onclick="loadAgents(${page + 1})" ${page >= pages ? "disabled" : ""}>Next &raquo;</button>`;
        html += `<span class="page-info">${total} total</span>`;
        el.innerHTML = html;
      }

      function renderCategoryBadges() {
        const el = document.getElementById("category-badges");
        el.innerHTML = CATEGORIES.map((cat) => {
          const count = categoryCounts[cat.id] || 0;
          const active = currentCategory === cat.id ? "active" : "";
          return `<div class="category-badge ${active}" onclick="toggleCategory('${cat.id}')">
            <span>${cat.label}</span>
            <span class="cat-count">${count}</span>
          </div>`;
        }).join("");
      }

      function toggleCategory(catId) {
        if (currentCategory === catId) {
          currentCategory = "";
        } else {
          currentCategory = catId;
        }
        currentTag = "";
        currentPage = 1;
        loadAgents(1);
      }

      function renderTagCloud() {
        const el = document.getElementById("tag-filters");
        if (allTags.size === 0) {
          el.innerHTML = "";
          return;
        }
        const counts = [...allTags.entries()];
        const maxCount = Math.max(...counts.map(([, c]) => c));
        const minCount = Math.min(...counts.map(([, c]) => c));
        const range = maxCount - minCount || 1;
        const sorted = counts.sort((a, b) => a[0].localeCompare(b[0]));
        el.innerHTML = sorted
          .map(([t, count]) => {
            const weight = (count - minCount) / range;
            const size = (0.72 + weight * 0.56).toFixed(2);
            const opacity = (0.55 + weight * 0.45).toFixed(2);
            return `<span class="tag-word ${currentTag === t ? "active" : ""}"
              style="font-size:${size}em;opacity:${opacity}"
              onclick="toggleTag('${t.replace(/'/g, "\\'")}')">${t}</span>`;
          })
          .join("");
      }

      function toggleTag(tag) {
        currentTag = currentTag === tag ? "" : tag;
        currentPage = 1;
        loadAgents(1);
      }

      // Wire up search (debounced)
      let searchTimer = null;
      document.getElementById("search-input").addEventListener("input", (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          currentSearch = e.target.value.trim();
          currentPage = 1;
          loadAgents(1);
        }, 300);
      });

      // Wire up sort
      document.getElementById("sort-select").addEventListener("change", (e) => {
        currentSort = e.target.value;
        currentPage = 1;
        loadAgents(1);
      });

      loadAgents();
    </script>
