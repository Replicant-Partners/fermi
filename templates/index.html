<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Bestiary - Make your agents dreams come true</title>
    <style>
      /* Gruvbox Dark Theme Colors */
      :root {
        --bg0-hard: #1d2021;
        --bg0: #282828;
        --bg1: #3c3836;
        --bg2: #504945;
        --bg3: #665c54;
        --fg0: #fbf1c7;
        --fg1: #ebdbb2;
        --fg2: #d5c4a1;
        --fg3: #bdae93;
        --red: #fb4934;
        --green: #b8bb26;
        --yellow: #fabd2f;
        --blue: #83a598;
        --purple: #d3869b;
        --aqua: #8ec07c;
        --orange: #fe8019;
        --gray: #928374;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Georgia", "Palatino", "Times New Roman", serif;
        background: var(--bg0-hard);
        color: var(--fg1);
        min-height: 100vh;
        padding: 40px 20px;
      }

      .page-wrapper {
        max-width: 1200px;
        margin: 0 auto;
        background: var(--bg0);
        border: 1px solid var(--bg2);
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
        min-height: calc(100vh - 80px);
      }

      .page-content {
        padding: 60px;
      }

      header {
        text-align: center;
        margin-bottom: 60px;
        padding-bottom: 40px;
        border-bottom: 2px solid var(--bg2);
      }

      h1 {
        font-family: "Palatino", "Georgia", serif;
        font-size: 3.5em;
        font-weight: 400;
        color: var(--fg0);
        margin-bottom: 15px;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-variant: small-caps;
      }

      .subtitle {
        color: var(--fg3);
        font-size: 1.1em;
        font-style: italic;
        letter-spacing: 1px;
      }

      .stats {
        background: var(--bg1);
        padding: 30px;
        border-radius: 4px;
        margin-bottom: 50px;
        border: 1px solid var(--bg3);
        text-align: center;
      }

      .stat-value {
        font-size: 3em;
        font-weight: 400;
        color: var(--yellow);
        font-family: "Georgia", serif;
      }

      .stat-label {
        color: var(--fg3);
        margin-top: 10px;
        text-transform: uppercase;
        font-size: 0.85em;
        letter-spacing: 2px;
        font-family: "Helvetica", "Arial", sans-serif;
      }

      .section-title {
        font-family: "Palatino", "Georgia", serif;
        font-size: 1.8em;
        font-weight: 400;
        color: var(--fg0);
        margin-bottom: 30px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--bg3);
        text-transform: uppercase;
        font-variant: small-caps;
        letter-spacing: 2px;
      }

      .specimens-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 40px;
        margin-top: 40px;
      }

      .specimen-card {
        background: var(--bg1);
        border: 1px solid var(--bg3);
        padding: 0;
        transition: all 0.3s ease;
        cursor: pointer;
        position: relative;
        overflow: hidden;
      }

      .specimen-card:hover {
        border-color: var(--yellow);
        box-shadow: 0 0 20px rgba(250, 189, 47, 0.2);
      }

      .specimen-header {
        padding: 30px;
        text-align: center;
        border-bottom: 1px solid var(--bg3);
      }

      .specimen-avatar {
        width: 180px;
        height: 180px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: var(--bg2);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 3px solid var(--bg3);
        position: relative;
      }

      .specimen-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: sepia(20%) saturate(80%);
      }

      .specimen-avatar.loading {
        animation: pulse 2s ease-in-out infinite;
      }

      .specimen-avatar .placeholder {
        font-size: 4em;
        filter: grayscale(100%);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .specimen-name {
        font-family: "Palatino", "Georgia", serif;
        font-size: 1.6em;
        font-weight: 400;
        color: var(--fg0);
        margin-bottom: 15px;
        text-transform: capitalize;
        font-variant: small-caps;
        letter-spacing: 1px;
      }

      .specimen-body {
        padding: 30px;
      }

      .specimen-description {
        color: var(--fg2);
        line-height: 1.8;
        font-size: 1em;
        margin-bottom: 20px;
        text-align: justify;
      }

      .specimen-meta {
        display: flex;
        flex-direction: column;
        gap: 12px;
        font-size: 0.9em;
        color: var(--fg3);
        font-family: "Helvetica", "Arial", sans-serif;
      }

      .meta-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px dotted var(--bg3);
      }

      .meta-label {
        color: var(--gray);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 0.85em;
      }

      .meta-value {
        color: var(--fg2);
      }

      .badge {
        display: inline-block;
        padding: 4px 12px;
        background: var(--bg3);
        color: var(--yellow);
        border-radius: 3px;
        font-size: 0.85em;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-family: "Helvetica", "Arial", sans-serif;
      }

      .loading {
        text-align: center;
        color: var(--fg3);
        font-size: 1.3em;
        padding: 60px;
        font-style: italic;
      }

      .error {
        background: var(--bg1);
        border: 1px solid var(--red);
        color: var(--red);
        padding: 30px;
        border-radius: 4px;
        text-align: center;
        font-size: 1.1em;
      }

      /* Decorative elements */
      .page-wrapper::before,
      .page-wrapper::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--bg3),
          transparent
        );
      }

      .ornament {
        text-align: center;
        color: var(--bg3);
        font-size: 1.5em;
        margin: 40px 0;
        letter-spacing: 10px;
      }
    </style>
  </head>
  <body>
    <div class="page-wrapper">
      <div class="page-content">
        <header>
          <h1>Agent Bestiary</h1>
          <div class="subtitle">Make your agents dreams come true</div>
        </header>

        <div class="stats">
          <div class="stat-value" id="total-agents">—</div>
          <div class="stat-label">Documented Specimens</div>
        </div>

        <div class="ornament">❦ ❦ ❦</div>

        <h2 class="section-title">Catalogue of Specimens</h2>

        <div class="specimens-grid" id="specimens-grid">
          <div class="loading">Cataloguing specimens...</div>
        </div>
      </div>
    </div>

    <script>
      async function generatePortrait(specimenId) {
        try {
          const response = await fetch(
            `/api/specimens/${encodeURIComponent(specimenId)}/portrait`,
          );
          if (!response.ok) throw new Error("Portrait generation failed");
          const data = await response.json();
          return `data:${data.image.mime_type};base64,${data.image.data}`;
        } catch (error) {
          console.error(`Error generating portrait for ${specimenId}:`, error);
          return null;
        }
      }

      async function loadSpecimens() {
        try {
          const response = await fetch("/api/specimens");
          const data = await response.json();

          document.getElementById("total-agents").textContent = data.total;

          const grid = document.getElementById("specimens-grid");
          grid.innerHTML = "";

          if (data.agents.length === 0) {
            grid.innerHTML =
              '<div class="loading">No specimens catalogued</div>';
            return;
          }

          data.agents.forEach((agent) => {
            const card = document.createElement("div");
            card.className = "specimen-card";
            const agentId = agent.agent_id || "unknown";
            const description =
              agent.metadata?.description || "A mysterious agent";
            const tier = agent.tier || "curated";
            const created = agent.metadata?.created || "";
            const executions = agent.usage?.total_executions || 0;
            const model = agent.capabilities?.model || "unknown";

            card.innerHTML = `
              <div class="specimen-header">
                <div class="specimen-avatar loading" id="avatar-${CSS.escape(agentId)}">
                  <span class="placeholder">◈</span>
                </div>
                <div class="specimen-name">${agentId.replace(/_/g, " ")}</div>
              </div>
              <div class="specimen-body">
                <div class="specimen-description">${description}</div>
                <div class="specimen-meta">
                  <div class="meta-row">
                    <span class="meta-label">Classification</span>
                    <span class="meta-value"><span class="badge">${tier}</span></span>
                  </div>
                  <div class="meta-row">
                    <span class="meta-label">First Observed</span>
                    <span class="meta-value">${created || "—"}</span>
                  </div>
                  <div class="meta-row">
                    <span class="meta-label">Encounters</span>
                    <span class="meta-value">${executions}</span>
                  </div>
                  <div class="meta-row">
                    <span class="meta-label">Cognitive Model</span>
                    <span class="meta-value">${model.replace("claude-3-", "").replace("-20240307", "")}</span>
                  </div>
                </div>
              </div>
            `;

            card.addEventListener("click", () => {
              window.location.href = `/specimen/${agentId}`;
            });

            grid.appendChild(card);

            // Generate portrait asynchronously
            generatePortrait(agentId).then((avatarUrl) => {
              const avatarDiv = document.getElementById(
                `avatar-${CSS.escape(agentId)}`,
              );
              if (avatarDiv && avatarUrl) {
                avatarDiv.innerHTML = `<img src="${avatarUrl}" alt="${agentId}">`;
                avatarDiv.classList.remove("loading");
              }
            });
          });
        } catch (error) {
          console.error("Error loading agents:", error);
          const grid = document.getElementById("specimens-grid");
          grid.innerHTML =
            '<div class="error">Error cataloguing specimens. Please try again later.</div>';
        }
      }

      loadSpecimens();
    </script>
  </body>
</html>
