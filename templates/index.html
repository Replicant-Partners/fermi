<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Bestiary</title>
    <style>
      :root {
        --bg0-hard: #1d2021;
        --bg0: #282828;
        --bg1: #3c3836;
        --bg2: #504945;
        --bg3: #665c54;
        --fg0: #fbf1c7;
        --fg1: #ebdbb2;
        --fg2: #d5c4a1;
        --fg3: #bdae93;
        --yellow: #fabd2f;
        --green: #b8bb26;
        --red: #fb4934;
        --aqua: #8ec07c;
        --gray: #928374;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: var(--bg0-hard);
        color: var(--fg1);
        min-height: 100vh;
        padding: 0;
        line-height: 1.4;
      }

      /* Architectural Header - Lacaton & Vassal Style */
      header {
        border-bottom: 1px solid var(--bg3);
        padding: 20px 30px;
        background: var(--bg0);
      }

      .header-grid {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 40px;
        align-items: baseline;
      }

      .header-left {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      h1 {
        font-size: 1.4em;
        font-weight: 400;
        color: var(--fg0);
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .subtitle {
        color: var(--gray);
        font-size: 0.85em;
        font-weight: 400;
        letter-spacing: 0.02em;
      }

      .header-right {
        display: flex;
        gap: 30px;
        font-size: 0.85em;
        color: var(--fg3);
        align-items: baseline;
      }

      .header-stat {
        display: flex;
        flex-direction: column;
        gap: 2px;
        text-align: right;
      }

      .stat-value-header {
        font-size: 1.8em;
        color: var(--yellow);
        font-weight: 300;
        line-height: 1;
      }

      .stat-label-header {
        text-transform: uppercase;
        font-size: 0.75em;
        letter-spacing: 0.08em;
        color: var(--gray);
      }

      /* Container */
      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 30px;
      }

      .section-title {
        font-size: 0.85em;
        font-weight: 400;
        color: var(--fg2);
        margin-bottom: 20px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-bottom: 1px solid var(--bg2);
        padding-bottom: 8px;
      }

      .specimens-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 16px;
      }

      .specimen-card {
        background: var(--bg1);
        border: 1px solid var(--bg2);
        padding: 0;
        transition: all 0.2s ease;
        cursor: pointer;
        overflow: hidden;
      }

      .specimen-card:hover {
        border-color: var(--yellow);
        transform: translateY(-1px);
      }

      .specimen-header {
        padding: 20px;
        border-bottom: 1px solid var(--bg2);
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .specimen-avatar {
        width: 64px;
        height: 64px;
        background: var(--bg2);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid var(--bg3);
        flex-shrink: 0;
      }

      .specimen-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: sepia(10%) saturate(90%);
      }

      .specimen-avatar.loading {
        animation: pulse 2s ease-in-out infinite;
      }

      .specimen-avatar .placeholder {
        font-size: 2em;
        filter: grayscale(100%);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .specimen-name {
        font-size: 1.1em;
        font-weight: 400;
        color: var(--fg0);
        text-transform: capitalize;
        letter-spacing: 0.01em;
      }

      .specimen-body {
        padding: 16px 20px 20px;
      }

      .specimen-description {
        color: var(--fg2);
        font-size: 0.9em;
        margin-bottom: 16px;
        line-height: 1.5;
      }

      .specimen-meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        font-size: 0.85em;
      }

      .meta-item {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid var(--bg2);
      }

      .meta-label {
        color: var(--gray);
        font-weight: 400;
        font-size: 0.85em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .meta-value {
        color: var(--fg2);
      }

      .badge {
        display: inline-block;
        padding: 3px 8px;
        background: transparent;
        color: var(--yellow);
        border: 1px solid var(--yellow);
        font-size: 0.75em;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 400;
      }

      .loading {
        text-align: center;
        color: var(--fg3);
        font-size: 1.1em;
        padding: 40px;
      }

      .error {
        background: var(--bg1);
        border: 1px solid var(--red);
        color: var(--red);
        padding: 20px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-grid">
        <div class="header-left">
          <h1>Agent Bestiary</h1>
          <div class="subtitle">make your agents dreams come true</div>
        </div>
        <div class="header-right">
          <div class="header-stat">
            <div class="stat-value-header" id="total-agents">—</div>
            <div class="stat-label-header">Specimens</div>
          </div>
        </div>
      </div>
    </header>

    <div class="container">
      <h2 class="section-title">Catalogue</h2>

      <div class="specimens-grid" id="specimens-grid">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <script>
      async function generateAvatar(agentId) {
        try {
          const response = await fetch(
            `/api/agents/${encodeURIComponent(agentId)}/avatar`,
          );
          if (!response.ok) throw new Error("Avatar generation failed");
          const data = await response.json();
          return `data:${data.image.mime_type};base64,${data.image.data}`;
        } catch (error) {
          console.error(`Error generating avatar for ${agentId}:`, error);
          return null;
        }
      }

      async function loadAgents() {
        try {
          const response = await fetch("/api/agents");
          const data = await response.json();

          document.getElementById("total-agents").textContent = data.total;

          const grid = document.getElementById("specimens-grid");
          grid.innerHTML = "";

          if (data.agents.length === 0) {
            grid.innerHTML =
              '<div class="loading">No specimens catalogued</div>';
            return;
          }

          data.agents.forEach((agent) => {
            const card = document.createElement("div");
            card.className = "specimen-card";
            const agentId = agent.agent_id || "unknown";
            const description =
              agent.metadata?.description || "A mysterious agent";
            const tier = agent.tier || "curated";
            const created = agent.metadata?.created || "";
            const executions = agent.usage?.total_executions || 0;
            const model =
              agent.capabilities?.model
                ?.replace("claude-3-", "")
                .replace("-20240307", "") || "unknown";

            card.innerHTML = `
              <div class="specimen-header">
                <div class="specimen-avatar loading" id="avatar-${CSS.escape(agentId)}">
                  <span class="placeholder">◈</span>
                </div>
                <div>
                  <div class="specimen-name">${agentId.replace(/_/g, " ")}</div>
                  <span class="badge">${tier}</span>
                </div>
              </div>
              <div class="specimen-body">
                <div class="specimen-description">${description}</div>
                <div class="specimen-meta">
                  <div class="meta-item">
                    <span class="meta-label">First Obs.</span>
                    <span class="meta-value">${created || "—"}</span>
                  </div>
                  <div class="meta-item">
                    <span class="meta-label">Encounters</span>
                    <span class="meta-value">${executions}</span>
                  </div>
                  <div class="meta-item">
                    <span class="meta-label">Model</span>
                    <span class="meta-value">${model}</span>
                  </div>
                  <div class="meta-item">
                    <span class="meta-label">Type</span>
                    <span class="meta-value">${agent.agent_type || "—"}</span>
                  </div>
                </div>
              </div>
            `;

            card.addEventListener("click", () => {
              window.location.href = `/agent/${agentId}`;
            });

            grid.appendChild(card);

            // Generate avatar asynchronously
            generateAvatar(agentId).then((avatarUrl) => {
              const avatarDiv = document.getElementById(
                `avatar-${CSS.escape(agentId)}`,
              );
              if (avatarDiv && avatarUrl) {
                avatarDiv.innerHTML = `<img src="${avatarUrl}" alt="${agentId}">`;
                avatarDiv.classList.remove("loading");
              }
            });
          });
        } catch (error) {
          console.error("Error loading agents:", error);
          const grid = document.getElementById("specimens-grid");
          grid.innerHTML =
            '<div class="error">Error loading specimens. Please try again later.</div>';
        }
      }

      loadAgents();
    </script>
  </body>
</html>
