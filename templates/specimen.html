<!doctype html>
<html lang="en" class="theme-hasui">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Specimen — Agent Bestiary</title>
  <link rel="stylesheet" href="/static/css/variables.css"/>
  <link rel="stylesheet" href="/static/css/common.css"/>
  <link rel="stylesheet" href="/static/css/components.css"/>
  <style>
  body{font-family:"Berkeley Mono","JetBrains Mono",monospace;line-height:1.5;background:var(--bg0-hard);font-size:13px;margin:0;}
  a{color:var(--fg3);text-decoration:none;}
  a:hover{color:var(--yellow);}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px 60px;}

  /* ── Head: the card, full size ── */
  .sp-head{padding:18px 0 0;border-bottom:1px solid var(--bg2);margin-bottom:0;}
  .sp-top{display:flex;align-items:flex-start;gap:14px;}
  .sp-id{flex:1;min-width:0;}
  .sp-label{font-size:1.15rem;color:var(--yellow);margin:0;}
  .sp-sys{font-size:0.7rem;color:var(--fg4);}
  .sp-type{font-size:0.74rem;color:var(--fg4);margin-top:5px;}
  .sp-type .gen{color:var(--purple,#d3869b);font-style:italic;}
  .sp-desc{font-size:0.8rem;color:var(--fg3);margin-top:8px;max-width:70ch;line-height:1.5;}
  .sp-cost{text-align:right;flex-shrink:0;}
  .tierbox{font-size:0.63rem;text-transform:uppercase;letter-spacing:0.06em;padding:2px 7px;border:1px solid;}
  .t-system{color:#d4af37;border-color:#d4af37;}
  .t-curated{color:var(--aqua);border-color:var(--aqua);}
  .t-community{color:var(--green);border-color:var(--green);}
  .t-none{color:var(--fg4);border-color:var(--bg3);}
  .sp-min{font-size:0.63rem;color:var(--fg4);margin-top:3px;}
  .sp-marks{display:flex;gap:8px;align-items:center;margin-top:9px;font-size:0.68rem;color:var(--fg4);}
  .prov{width:7px;height:7px;border-radius:50%;}
  .p-approved{background:var(--green);} .p-curated_seed{background:var(--aqua);}
  .p-admin_grant{background:var(--yellow);} .p-implicit{background:var(--bg3);}
  .p-none{background:transparent;border:1px solid var(--bg3);}
  .lvl{color:var(--yellow);}

  /* ── Tabs ── */
  .tabs{display:flex;gap:0;margin-top:14px;}
  .tab{padding:6px 16px;font-size:0.76rem;color:var(--fg4);cursor:pointer;background:transparent;
       border:none;border-bottom:2px solid transparent;font-family:inherit;}
  .tab:hover{color:var(--fg2);}
  .tab.active{color:var(--yellow);border-bottom-color:var(--yellow);}
  .tab .badge{font-size:0.6rem;color:var(--fg4);margin-left:5px;}
  /* A tab that leaves. Same position and size as the two that switch panes,
     deliberately not the same emphasis, and never `.active` — it is a
     destination rather than a state of this page. The arrow is the tell. */
  .tab-out{text-decoration:none;display:inline-block;}
  .tab-out:hover{color:var(--aqua);border-bottom-color:var(--aqua);}
  .drawer-btn{margin-left:auto;align-self:center;background:transparent;border:1px solid var(--bg3);
              padding:3px 10px;font-size:0.7rem;color:var(--fg4);cursor:pointer;font-family:inherit;}
  .drawer-btn:hover{border-color:var(--yellow);color:var(--yellow);}

  .pane{padding-top:16px;}
  .block{margin-bottom:22px;}
  .block h3{font-size:0.72rem;color:var(--fg2);margin:0 0 7px;text-transform:uppercase;letter-spacing:0.07em;
            padding-bottom:4px;border-bottom:1px solid var(--bg2);}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:3px 10px;font-size:0.76rem;}
  .kv dt{color:var(--fg4);}
  .kv dd{margin:0;color:var(--fg3);}
  .chips{display:flex;flex-wrap:wrap;gap:4px;}
  .chip{font-size:0.66rem;padding:1px 6px;border:1px solid var(--bg3);color:var(--fg4);}
  .chip.filled{border-color:var(--green);color:var(--green);background:rgba(152,151,26,0.1);}
  /* Schema ID chips (e.g. scro/bom-query/1) — verified typed interface declarations,
     not author labels. Monospace so the namespace/name/version structure is legible. */
  .chip.schema-id{border-color:var(--aqua);color:var(--aqua);background:rgba(69,133,136,0.1);
                  font-family:monospace;font-size:0.6rem;letter-spacing:-0.01em;}
  /* Competition credential display — platform-computed stats below the editable fields */
  .comp-stats{margin-top:7px;font-size:0.62rem;color:var(--fg4);display:flex;flex-direction:column;gap:3px;}
  .comp-stat b{color:var(--fg2);}
  .chip.orphan{border-style:dashed;opacity:0.7;}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--bg2);}
  .stat{background:var(--bg0);padding:9px 11px;}
  .stat-l{font-size:0.62rem;color:var(--fg4);text-transform:uppercase;letter-spacing:0.06em;}
  .stat-v{font-size:1.02rem;color:var(--aqua);margin-top:2px;}
  .stat-s{font-size:0.64rem;color:var(--fg4);}
  .absent{color:var(--fg4);font-style:italic;font-size:0.8rem;}

  table{width:100%;border-collapse:collapse;font-size:0.73rem;}
  th{text-align:left;color:var(--fg4);font-weight:normal;font-size:0.62rem;text-transform:uppercase;
     letter-spacing:0.06em;padding:4px 7px;border-bottom:1px solid var(--bg3);}
  td{padding:5px 7px;border-bottom:1px solid var(--bg2);color:var(--fg3);}
  tr:hover td{background:var(--bg1);}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .dim{color:var(--fg4);}
  .ok{color:var(--green);} .bad{color:var(--red,#fb4934);}

  /* The `.h-*` and `.m-*` rules were here, for the Health pane's eleven
     panel-absence rows. Removed with it: unused CSS is how a deleted view comes
     back. */

  /* ── Coordination notes: the one place Loop 3 meets Loop 1 ──────────────

     `consolidated` is the field that matters. A note sitting in an agent's
     memory that consolidation has not run over has changed nothing about the
     agent's behaviour — it is indistinguishable, in what the agent does, from
     a note nobody sent. So the two states are drawn differently and the
     un-dreamt one is not drawn as an absence. */
  .cn{border:1px solid var(--bg2);background:var(--bg0);padding:8px 11px;margin-bottom:7px;}
  .cn-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
  .cn-about{font-size:0.75rem;color:var(--fg2);}
  .cn-when{font-size:0.66rem;color:var(--fg4);}
  .cn-state{margin-left:auto;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.05em;
            padding:1px 6px;border:1px solid;white-space:nowrap;}
  .cn-state.dreamt{color:var(--green);border-color:var(--green);}
  .cn-state.not{color:var(--purple,#d3869b);border-color:var(--purple,#d3869b);border-style:dashed;}
  .cn-note{font-size:0.73rem;color:var(--fg3);line-height:1.5;margin-top:5px;
           white-space:pre-wrap;max-height:9em;overflow:hidden;}
  .cn-proxy{font-size:0.68rem;color:var(--fg4);line-height:1.5;margin-top:9px;
            padding-left:9px;border-left:2px solid var(--bg3);}

  /* ── Drawer ── */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;z-index:40;}
  .scrim.open{display:block;}
  /* A shelf, not a page. The subject stays on screen while you configure it,
     because configuration is something you do TO the thing you are looking at —
     which is exactly what the eight-tab page got wrong: it replaced the agent
     with a form about the agent.

     Width is a CSS variable so one drag handle can set it, and it is persisted,
     because a width you have to set twice is a width the tool forgot. */
  .drawer{position:fixed;top:0;right:0;bottom:0;width:var(--shelf-w,520px);
          max-width:96vw;min-width:380px;background:var(--bg0);
          border-left:1px solid var(--bg2);z-index:41;transform:translateX(100%);
          transition:transform 0.18s ease;overflow-y:auto;padding:18px 20px 40px;}
  .drawer.open{transform:translateX(0);}
  /* The handle. Wide enough to hit, invisible until you are near it. */
  .grip{position:absolute;top:0;left:0;bottom:0;width:9px;cursor:col-resize;
        z-index:2;background:transparent;}
  .grip:hover, .grip.dragging{background:var(--yellow);opacity:0.5;}
  /* No transition mid-drag, or the shelf lags the pointer by 180ms. */
  .drawer.resizing{transition:none;}
  body.resizing{user-select:none;cursor:col-resize;}
  .drawer h2{font-size:0.9rem;color:var(--yellow);margin:0 0 3px;}
  .drawer .sub{font-size:0.7rem;color:var(--fg4);margin-bottom:16px;}
  .drawer .close{position:absolute;top:14px;right:16px;background:transparent;border:none;
                 color:var(--fg4);cursor:pointer;font-size:1rem;font-family:inherit;}
  .note{font-size:0.71rem;color:var(--fg4);font-style:italic;line-height:1.5;margin:-2px 0 10px;}
  .empty{padding:14px 8px;font-size:0.76rem;color:var(--fg4);}

  /* ── The declaration ladder, as the shelf's one rankable group ──────────
     Each rung says what it unlocks and what reads `unknown` without it, which
     is the difference between a checklist and an argument. */
  .rung{display:grid;grid-template-columns:18px 1fr;gap:9px;padding:8px 0;
        border-top:1px solid var(--bg2);}
  .rung-mark{font-size:0.72rem;line-height:1.4;}
  .rung.on .rung-mark{color:var(--green);}
  .rung.off .rung-mark{color:var(--bg4,#7c6f64);}
  .rung-n{font-size:0.74rem;color:var(--fg2);}
  .rung.off .rung-n{color:var(--fg4);}
  .rung-d{font-size:0.68rem;color:var(--fg3);margin-top:2px;line-height:1.5;}
  .rung-x{font-size:0.66rem;color:var(--fg4);margin-top:4px;line-height:1.5;}
  .rung-x b{color:var(--fg3);font-weight:normal;}
  .rung-own{font-size:0.62rem;color:var(--bg4,#7c6f64);margin-top:3px;
            overflow-wrap:anywhere;}
  /* The one the platform recommends. Exactly one, or it is not a recommendation. */
  .rung.next{background:var(--bg1);}
  .rung.next .rung-n{color:var(--yellow);}
  .next-tag{font-size:0.57rem;text-transform:uppercase;letter-spacing:0.06em;
            border:1px solid var(--yellow);color:var(--yellow);padding:0 5px;
            margin-left:6px;white-space:nowrap;}
  .shelf-count{font-size:0.66rem;color:var(--fg4);margin-bottom:2px;}
  /* The rung's own control. `unlocks`/`without_it` says why it matters; this is
     the thing that closes it — and a rung the shelf recommends and cannot act on
     is a description, which is the defect the trace's act column was rebuilt to
     end. */
  .rung-act{margin-top:6px;font-size:0.64rem;font-family:inherit;background:none;
            cursor:pointer;border:1px solid var(--yellow);color:var(--yellow);
            padding:2px 9px;}
  .rung-act:hover:not(:disabled){background:var(--yellow);color:var(--bg0-hard);}
  .rung-act:disabled{opacity:0.4;cursor:default;}
  /* Which editor closes this rung. Three of the four are one save, and a button
     on only one of them implied the other two needed something that does not
     exist. */
  .rung-own2{display:block;font-size:0.62rem;color:var(--aqua);margin-top:3px;
             opacity:0.8;}
  /* Does the contract resolve. `pending` is deliberately NOT red: it is a
     declared gap with no source yet, which is a standing request rather than a
     defect, and colouring it like a fault is what made the only route to a
     healthy agent deleting its ambition. */
  .cmp{margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid var(--bg2);}
  .cmp-head{font-size:0.7rem;color:var(--fg3);margin-bottom:5px;}
  .cmp-head.ok b{color:var(--green);}
  .cmp-head.bad b{color:var(--red,#fb4934);}
  .cmp-tally{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px;}
  .cmp-chip{font-size:0.6rem;border:1px solid var(--bg3);padding:1px 6px;color:var(--fg4);}
  .cmp-chip b{color:var(--fg2);font-weight:normal;}
  .cmp-leg{display:grid;grid-template-columns:22px 74px 1fr;gap:8px;align-items:baseline;
           padding:2px 0;font-size:0.64rem;}
  .cmp-n{text-align:right;color:var(--fg2);}
  .cmp-t{font-size:0.6rem;}
  .cmp-w{color:var(--fg4);line-height:1.45;}
  .cmp-row{display:grid;grid-template-columns:74px 1fr 130px;gap:8px;align-items:baseline;
           padding:2px 0;font-size:0.64rem;border-top:1px solid var(--bg2);}
  .cmp-path{color:var(--fg2);overflow-wrap:anywhere;}
  .cmp-tool{color:var(--fg4);text-align:right;overflow-wrap:anywhere;}
  /* error is the only one that is somebody's fault today. */
  .c-error{color:var(--red,#fb4934);}
  .c-resolved{color:var(--green);}
  .c-pending{color:var(--aqua);}
  .c-derived, .c-inferred, .c-narrative{color:var(--fg4);}
  .cmp-chip.c-error{border-color:var(--red,#fb4934);}
  .cmp-chip.c-resolved{border-color:var(--green);}
  .cmp-chip.c-pending{border-color:var(--aqua);}
  /* The parts of a living thing, not a settings screen. A glyph per part, so the
     shelf reads as an anatomy rather than a form. */
  .drawer h3 .g-mark{color:var(--yellow);margin-right:7px;font-size:0.8rem;}
  /* One line of context per part, where a paragraph used to be. */
  .af-meta{font-size:0.63rem;color:var(--fg4);margin:-2px 0 7px;}
  /* Three rungs, one save. Bracketed rather than told three times. */
  .rung.grouped{border-left:2px solid var(--bg3);padding-left:7px;}
  .rung.grouped.next{border-left-color:var(--yellow);}

  /* ── Ports, drawn as the connectors they are ─────────────────────────
     A port is a stud. Another agent's `produces` clicks into this agent's
     `accepts` where the label matches, and that join is the whole basis of
     composition on this platform — 289 distinct produce labels, 236 accept
     labels, 13 that appear on both.

     It was rendered as two rows of a definition list and three lines of prose,
     which is the same information and none of the idea. Studs, on a rail, with
     the count of what can click into each one. A stud that matches nothing
     anywhere is drawn hollow and dashed, because that is not a smaller version
     of connected — it is a connector facing a wall. */
  .seams{margin:2px 0 4px;}
  .seam-side{position:relative;padding-left:15px;margin-bottom:3px;}
  /* The rail. One line the studs sit on, so a column of labels reads as one
     connector strip rather than as a list that happens to be indented. */
  .seam-side:before{content:"";position:absolute;left:4px;top:9px;bottom:7px;
                    width:1px;background:var(--bg3);}
  .seam-h{display:flex;align-items:baseline;gap:7px;font-size:0.62rem;
          text-transform:uppercase;letter-spacing:0.07em;color:var(--fg4);
          margin-bottom:1px;}
  .seam-h b{color:var(--fg2);font-weight:normal;}
  .seam-dir{color:var(--aqua);}
  .seam-side[data-dir="out"] .seam-dir{color:var(--yellow);}
  .seam-sub{font-size:0.58rem;text-transform:none;letter-spacing:0;color:var(--bg4,#7c6f64);}
  .stud{position:relative;display:grid;grid-template-columns:1fr auto;gap:6px;
        align-items:baseline;padding:2px 0 2px 13px;font-size:0.67rem;}
  /* The nub itself, on the rail. Filled where the label can actually join. */
  .stud:before{content:"";position:absolute;left:-4px;top:6px;width:9px;height:9px;
               border-radius:50%;border:1px solid var(--aqua);
               background:var(--bg0-hard);box-sizing:border-box;}
  .seam-side[data-dir="out"] .stud:before{border-color:var(--yellow);}
  .stud.joined:before{background:var(--aqua);box-shadow:0 0 0 2px rgba(69,133,136,0.22);}
  .seam-side[data-dir="out"] .stud.joined:before{background:var(--yellow);
               box-shadow:0 0 0 2px rgba(250,189,47,0.2);}
  /* Facing a wall. Dashed and dim — not a lesser join, a different fact. */
  .stud.orphan:before{border-style:dashed;border-color:var(--bg4,#7c6f64);}
  .stud-l{color:var(--fg2);overflow-wrap:anywhere;}
  .stud.orphan .stud-l{color:var(--fg4);}
  /* A schema id is a checkable type; a bare noun is an author's word for one. */
  .stud-k{font-size:0.55rem;text-transform:uppercase;letter-spacing:0.06em;
          border:1px solid var(--bg3);color:var(--fg4);padding:0 4px;margin-left:5px;
          white-space:nowrap;}
  .stud-k.schema{border-color:var(--aqua);color:var(--aqua);}
  .stud-c{font-size:0.61rem;color:var(--fg4);white-space:nowrap;}
  .stud.joined .stud-c{color:var(--fg3);}
  .stud-c b{color:var(--aqua);font-weight:normal;}
  .seam-side[data-dir="out"] .stud-c b{color:var(--yellow);}
  /* Who clicks in. Names, linked, because "4 agents" you cannot open is a
     statistic and four names are a composition you can go and build. */
  .stud-who{grid-column:1/-1;font-size:0.61rem;color:var(--fg4);line-height:1.6;
            padding:1px 0 3px;}
  .stud-who a{color:var(--aqua);}
  .stud-who a:hover{color:var(--yellow);}
  .seam-none{font-size:0.63rem;color:var(--fg4);font-style:italic;padding:2px 0 2px 13px;}
  /* The body between the two faces. The agent, so the direction of the two
     strips is never something the reader has to work out. */
  .seam-body{display:flex;align-items:center;gap:8px;margin:5px 0;padding:3px 9px;
             border:1px solid var(--bg3);background:var(--bg1);font-size:0.66rem;
             color:var(--fg3);}
  .seam-body b{color:var(--yellow);font-weight:normal;}
  .seam-body .dim{margin-left:auto;font-size:0.6rem;}

  /* ── The contract, as one card with three parts ────────────────────────
     `output_type`, `output_schema` and `field_contract` are ONE save through
     ONE editor. Three rungs each carrying its own paragraph implied three
     separate pieces of work and buried the single button that does all of
     them. */
  .ccard{border:1px solid var(--bg3);padding:8px 10px;margin:6px 0 2px;}
  .ccard.next{border-color:var(--yellow);}
  .ccard-h{display:flex;align-items:baseline;gap:8px;font-size:0.7rem;color:var(--fg2);}
  .ccard-h .dim{margin-left:auto;font-size:0.62rem;}
  .ccard-segs{display:flex;gap:3px;margin:7px 0 5px;}
  /* One segment per part, sized by weight rather than by name length: the
     progress bar IS the three rungs, so there is no second thing to read. */
  .cseg{flex:1;padding:3px 6px;font-size:0.6rem;text-transform:uppercase;
        letter-spacing:0.06em;text-align:center;border:1px solid var(--bg3);
        color:var(--fg4);background:var(--bg0-hard);}
  .cseg.on{border-color:var(--green);color:var(--green);background:rgba(152,151,26,0.1);}
  .cseg.next{border-color:var(--yellow);color:var(--yellow);}
  .ccard-w{font-size:0.63rem;color:var(--fg4);line-height:1.5;margin-bottom:6px;}

  /* Why a rung matters, on request. `unlocks` and `without_it` are two to four
     lines each and four rungs of them at the top of the shelf is the wall of
     text the panel notes were cut to remove, rebuilt by the same hand. */
  .why{margin-top:4px;}
  .why>summary{font-size:0.61rem;color:var(--fg4);cursor:pointer;list-style:none;
               text-transform:uppercase;letter-spacing:0.06em;}
  .why>summary::-webkit-details-marker{display:none;}
  .why>summary:before{content:"\25b8 ";color:var(--bg4,#7c6f64);}
  .why[open]>summary:before{content:"\25be ";}
  .why>summary:hover{color:var(--aqua);}

  /* The editor's own action bar, in the shelf.
     The builder writes no save button of its own — its host provides one, and
     /contracts does. The shelf mounted it and did not, so every edit made here
     was discarded on close with no warning and no way to keep it. */
  .cbbar{position:sticky;bottom:0;display:flex;gap:9px;align-items:center;
         flex-wrap:wrap;margin-top:10px;padding:9px 0;background:var(--bg0-hard);
         border-top:1px solid var(--bg3);}
  .cbbar-msg{font-size:0.63rem;color:var(--fg4);overflow-wrap:anywhere;flex:1;}
  .cbbar-msg.ok{color:var(--green);}
  .cbbar-msg.bad{color:var(--red,#fb4934);}

  /* The bank account. Four measurements, none of them a setting. */
  .bank{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--bg2);
        border:1px solid var(--bg2);}
  .bank-cell{background:var(--bg0);padding:7px 8px;}
  .bank-n{display:block;font-size:0.82rem;color:var(--fg2);
          font-variant-numeric:tabular-nums;}
  .bank-l{display:block;font-size:0.58rem;color:var(--fg4);text-transform:uppercase;
          letter-spacing:0.06em;margin-top:2px;}
  /* Out of credits is not a neutral zero: the agent keeps answering and stops
     learning, which is the quietest way for a loop to die. */
  .bank-cell.dry .bank-n{color:var(--yellow);}
  @media (max-width:620px){ .bank{grid-template-columns:repeat(2,1fr);} }

  /* What the prompt does to execution. Three facts in the compile's vocabulary,
     and `error` is reserved for the contradiction: a contract naming tools and a
     prompt that removed the loop which could call them. */
  /* The one verdict about the agent, said once and at the top. Everything
     below it reports a fact and names its own subject; nothing below it
     repeats the word `compile`. */
  .verdict{margin:10px 0 14px;padding:9px 11px;border-left:2px solid var(--bg3);
           background:var(--bg1);}
  .verdict b{font-size:0.78rem;}
  .verdict.ok{border-left-color:var(--green);}
  .verdict.ok b{color:var(--green);}
  .verdict.bad{border-left-color:var(--red,#fb4934);}
  .verdict.bad b{color:var(--red,#fb4934);}
  .verdict-w{font-size:0.64rem;color:var(--fg4);line-height:1.5;margin-top:4px;}
  .verdict-f{display:block;}
  .verdict-f i{color:var(--fg3);font-style:normal;text-transform:uppercase;
               letter-spacing:0.05em;font-size:0.58rem;margin-right:6px;}
  .pchk{margin-bottom:9px;}
  .pchk-row{display:grid;grid-template-columns:74px 1fr;gap:8px;align-items:baseline;
            padding:4px 0;border-top:1px solid var(--bg2);}
  .pchk-t{font-size:0.68rem;color:var(--fg2);}
  .pchk-w{grid-column:2;font-size:0.64rem;color:var(--fg4);line-height:1.5;margin-top:2px;}
  .pchk-w code{color:var(--yellow);font-family:inherit;}
  .shelf-mount{margin-top:10px;}
  .shelf-mount:empty{display:none;}
  /* ── A pulse row is a door, and it has to look like one ──────────────────
     The date was already a link and rendered in the body colour, so nothing
     about the row said it could be opened. The whole row is the target now. */
  tr.rowlink{cursor:pointer;}
  tr.rowlink:hover{background:var(--bg1);}
  tr.rowlink:hover td{color:var(--fg2);}
  tr.rowlink .go{color:var(--bg3);font-size:0.66rem;text-align:right;white-space:nowrap;}
  tr.rowlink:hover .go{color:var(--yellow);}
  </style>
  <link rel="stylesheet" href="/static/css/pulse.css">
</head>
<body>
  <div id="nav-root"></div>
  <div class="wrap"><div id="content"><div class="empty">Loading…</div></div></div>
  <div class="scrim" id="scrim"></div>
  <div class="drawer" id="drawer"></div>

  <script src="/static/js/widgets/pulse.js"></script>
  <!-- The contract editor, already shared by the create wizard (step 4) and
       the standalone page at /contracts. The shelf is its third host: a rung
       the shelf recommends and cannot act on is a description, and a second
       copy of a 1,700-line editor is the drift this repo keeps finding. -->
  <link rel="stylesheet" href="/static/css/contract-builder.css">
  <!-- One renderer for every configurable field, driven by a spec, so the shelf
       and a future creation flow cannot drift into two forms. Only fields the
       PUT actually accepts; status and visibility are lifecycle ACTIONS there,
       because the PUT refuses them. -->
  <link rel="stylesheet" href="/static/css/agent-fields.css">
  <script src="/static/js/widgets/contract-builder.js"></script>
  <script src="/static/js/widgets/agent-fields.js"></script>
  <script src="/static/js/widgets/nav.js"></script>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/widgets/xaman-ek.js"></script>
  <script>
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const NAME = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
  let D = null, TAB = "profile", SEAM = new Set();
  // Who is on the other side of each label.
  //
  // `SEAM` answers "could this label ever join" and the shelf needs the next
  // question: join to WHOM. Same one fetch — `/api/bestiary` already returns
  // every specimen's `accepts` and `produces`, and boot() was throwing the
  // per-agent detail away to keep a set of bare labels. "4 agents" you cannot
  // open is a statistic; four names are a composition somebody can go and build.
  const PRODUCERS = new Map();   // label -> [{ name, label }] that PRODUCE it
  const CONSUMERS = new Map();   // label -> [{ name, label }] that ACCEPT it
  const counterparts = (m, l) => m.get(l) || [];
  // Did the register load at all. Without it every port would read "nothing on
  // the other side", which is a claim about the fleet made by an empty map.
  let REG = false;
  // Whether the mounted contract editor holds work that is not on the card.
  // Closing the shelf destroys the editor, so this is what stands between an
  // afternoon's contract and a stray click on the scrim.
  let CONTRACT_DIRTY = false;
  // Carried across the one redraw that follows a save, so the confirmation
  // survives the rebuild that shows the result.
  let CONTRACT_FLASH = null;
  // Schema ID pattern: namespace/name/version (e.g. scro/bom-query/1).
  // These chips render distinctly from bare author labels.
  const SCHEMA_ID_RE = /^[a-z][a-z0-9-]*\/[a-z][a-z0-9-]*\/[0-9]+$/;

  const num = n => n == null ? `<span class="absent">not measured</span>` : n;
  const pct = v => v == null ? `<span class="absent">no runs yet</span>`
                             : (v * 100).toFixed(1) + "%";
  const usd = v => v == null ? `<span class="absent">not measured</span>` : "$" + v.toFixed(4);
  const when = t => t ? new Date(t).toISOString().slice(0, 10) : `<span class="absent">never</span>`;
  const tierC = t => ["system","curated","community"].includes(t) ? t : "none";

  function head() {
    const p = D.profile;
    const tx = p.taxonomy;
    const typeLine = tx && tx.genus
      ? `${esc(p.agent_type || "unclassified")} — <span class="gen">${esc(tx.genus)} ${esc(tx.species || "")}</span>`
      : `${esc(p.agent_type || "unclassified")} — <span class="dim"><i>undescribed</i></span>`;
    const lvl = p.level != null
      ? `<span class="lvl">lv ${p.level}</span>${p.peak_level > p.level ? ` <span class="dim">(peak ${p.peak_level})</span>` : ""}`
      : `<span class="dim"><i>untried, not failing</i></span>`;

    return `<div class="sp-head">
      <div class="sp-top">
        <div class="sp-id">
          <h1 class="sp-label">${esc(p.label)}</h1>
          ${p.label !== p.agent_name ? `<div class="sp-sys">${esc(p.agent_name)}</div>` : ""}
          <div class="sp-type">${typeLine}</div>
          <div class="sp-desc">${esc(p.description || "No description.")}</div>
          <div class="sp-marks">
            <span class="prov p-${esc(p.provenance || "none")}"
                  title="${esc(p.provenance || "no orchestra membership")}"></span>
            ${lvl}
            <span class="dim">${D.record.runs} runs</span>
            ${p.fork_count ? `<span class="dim">⚯ ${p.fork_count}</span>` : ""}
            ${p.status && p.status !== "published" ? `<span class="dim">${esc(p.status)}</span>` : ""}
          </div>
        </div>
        <div class="sp-cost">
          <div class="tierbox t-${tierC(p.tier)}">${esc(p.tier || "—")}</div>
          ${p.min_tier ? `<div class="sp-min">needs ${esc(p.min_tier)}</div>` : ""}
        </div>
      </div>
      <div class="tabs">
        <button class="tab ${TAB==="profile"?"active":""}" data-tab="profile">Profile</button>
        <button class="tab ${TAB==="record"?"active":""}" data-tab="record">Record</button>
        <!-- Health was a third tab here and is now a link out.

             It rendered eleven rows of panel-absence prose: "6 rows against 0
             opportunities", "20 rows against 218 opportunities", each
             explaining that an empty panel is a fact about the filter rather
             than about the subject. Careful, correct, and a reader cannot act
             on any of it. Two rows read out-of-scope and said so at length.

             The Observatory already answers the question that tab was reaching
             for, per agent and in numbers with a subject: eval score, runs,
             open flags, relationships, persona version, and the latest scores
             by dimension. Two surfaces answering "how is this agent doing" is
             one too many, and the weaker one was here.

             No backticks in this comment. An HTML comment inside a JS template
             literal is string content, so the first backtick ends the literal
             and everything after it parses as code. -->
        <a class="tab tab-out"
           href="/observatory?agent=${encodeURIComponent(p.agent_name)}">Health ↗</a>
        <button class="drawer-btn" id="open-drawer">Configure ⚙</button>
      </div>
    </div>`;
  }

  // `faults()` was here, counting `D.health` rows whose reading was `fault` for
  // a badge on the Health tab. The tab is a link now and the count went with
  // it. `specimen_handler` still serves `health`; nothing on this page reads it,
  // and that is a loose end worth naming rather than a thing to leave implied.

  function studChips(list, typed) {
    if (!list.length) return `<span class="dim">none declared</span>`;
    return `<div class="chips">${list.map(l => {
      // Schema IDs (e.g. scro/bom-query/1) get a distinct chip class:
      // they are verified typed interface declarations, not author labels.
      const isSchema = SCHEMA_ID_RE.test(l);
      const cls = isSchema ? "schema-id" : typed ? "filled" : "";
      return `<span class="chip ${cls} ${SEAM.has(l) ? "" : "orphan"}">${esc(l)}</span>`;
    }).join("")}</div>`;
  }

  function paneProfile() {
    const p = D.profile, s = p.substrate, tx = p.taxonomy || {};
    const ranks = ["kingdom","phylum","class","order","family","genus","species"];
    return `<div class="pane">
      <div class="block">
        <h3>Interface</h3>
        <div class="note">
          Ports are labels, not types. A stud is filled only where a schema resolves,
          and dashed where the label appears on no counterpart anywhere in the
          population — composability through it is not merely unverified but impossible.
        </div>
        <dl class="kv">
          <dt>Accepts</dt><dd>${studChips(p.accepts, p.typed)}</dd>
          <dt>Produces</dt><dd>${studChips(p.produces, p.typed)}</dd>
          <dt>Output contract</dt><dd>${
            p.typed ? '<span class="ok">typed — schema resolves</span>'
            : p.declares_contract ? '<span class="dim">declared, untyped — names a schema rather than carrying one</span>'
            : '<span class="dim">none</span>'}</dd>
        </dl>
      </div>

      <div class="block">
        <h3>Classification</h3>
        ${tx.genus ? `<dl class="kv">${ranks.map(r =>
            `<dt>${r}</dt><dd>${esc(tx[r] || "—")}</dd>`).join("")}</dl>`
          : `<div class="absent">Undescribed — no taxonomy on this card. It sits in
             <i>Incertae sedis</i> in the register, which is a real placement and not a gap.</div>`}
      </div>

      <div class="block">
        <h3>Substrate</h3>
        <dl class="kv">
          <dt>Provider</dt><dd>${esc(s.provider || "—")}</dd>
          <dt>Model</dt><dd>${esc(s.model || "—")}</dd>
          <dt>Executor</dt><dd>${esc(s.executor || "—")}</dd>
          <dt>Temperature</dt><dd>${s.temperature ?? "—"}</dd>
          <dt>Persona version</dt><dd>v${s.persona_version ?? 1}</dd>
        </dl>
      </div>

      ${p.tags.length ? `<div class="block"><h3>Tags</h3>
        <div class="chips">${p.tags.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div></div>` : ""}

      ${p.sample_queries.length ? `<div class="block"><h3>Observed use</h3>
        ${p.sample_queries.map(q => `<div class="dim" style="margin-bottom:4px">“${esc(q)}”</div>`).join("")}</div>` : ""}

      ${p.forked_from ? `<div class="block"><h3>Lineage</h3>
        <dl class="kv"><dt>Descends from</dt>
        <dd><a href="/specimen/${encodeURIComponent(p.forked_from)}">${esc(p.forked_from)}</a></dd>
        <dt>Descendants</dt><dd>${p.fork_count}</dd></dl></div>` : ""}
    </div>`;
  }

  function paneRecord() {
    const r = D.record;
    return `<div class="pane">
      <div class="block">
        <h3>Execution</h3>
        <div class="note">
          Measured from the episode log, which recorded every run. The
          <code>agents.total_executions</code> rollup is deliberately not read: it was
          added with the table and never wired, so it reads zero for almost every agent.
        </div>
        <div class="stats">
          <div class="stat"><div class="stat-l">Runs</div><div class="stat-v">${r.runs}</div></div>
          <div class="stat"><div class="stat-l">Succeeded</div><div class="stat-v">${r.succeeded}</div>
            <div class="stat-s">${r.failed} failed</div></div>
          <div class="stat"><div class="stat-l">Success rate</div><div class="stat-v">${pct(r.success_rate)}</div></div>
          <div class="stat"><div class="stat-l">Cost</div><div class="stat-v">${usd(r.cost_usd)}</div>
            <div class="stat-s">${r.cost_per_run != null ? "$" + r.cost_per_run.toFixed(5) + " / run" : ""}</div></div>
          <div class="stat"><div class="stat-l">Last run</div><div class="stat-v" style="font-size:0.8rem">${when(r.last_run)}</div></div>
        </div>
      </div>

      <div class="block">
        <h3>What it has learned</h3>
        <div class="stats">
          <div class="stat"><div class="stat-l">Entities</div><div class="stat-v">${r.entities}</div></div>
          <div class="stat"><div class="stat-l">Facts</div><div class="stat-v">${r.facts}</div></div>
          <div class="stat"><div class="stat-l">Rules</div><div class="stat-v">${r.rules}</div>
            <div class="stat-s">${r.rules_retrieved} ever retrieved</div></div>
          <div class="stat"><div class="stat-l">Dream cycles</div><div class="stat-v">${r.dream_cycles}</div>
            <div class="stat-s">last ${when(r.last_dreamt)}</div></div>
          <div class="stat"><div class="stat-l">Dream credits</div>
            <div class="stat-v">${r.dream_budget - r.dream_used}</div>
            <div class="stat-s">of ${r.dream_budget}</div></div>
        </div>
        ${r.rules > 0 && r.rules_retrieved === 0 ? `<div class="note" style="color:var(--yellow)">
          This agent has ${r.rules} rule(s) and none has ever been retrieved into a prompt:
          it writes what it learns and reads none of it back.</div>` : ""}
      </div>

      <div class="block">
        <h3>Evaluation</h3>
        <dl class="kv">
          <dt>Eval runs</dt><dd>${r.eval_runs}</dd>
          <dt>Last eval</dt><dd>${when(r.last_eval)}</dd>
        </dl>
      </div>

      <div class="block">
        <h3>Pulses</h3>
        <div class="note">Every invocation and its output, in the stream's own grammar:
          <b>who addressed whom</b>, whether grounding graded the contents, and whether any
          checkpoint recorded a decision. <b>Open one</b> to see what it claimed and what
          could not be sourced.</div>
        ${r.episodes_error
          ? `<div class="absent">The pulse list could not be read — <b>${
              esc(r.episodes_error)}</b>. That is unknown, not empty: this agent may have
              any number of pulses and this page cannot currently see them.</div>`
          : r.episodes.length ? Pulse.rows(r.episodes)
            : `<div class="absent">No pulse recorded.</div>`}
      </div>
      <!-- Coordination notes came from the Health tab when it became a link.
           They belong here on their own merits: a note is something a
           strategist's coherence run WROTE into this agent's episodic memory,
           which is a record of what happened to it, not a measure of how it is
           doing. The Observatory has no view of them. -->
      ${coordinationBlock()}
    </div>`;
  }

  // ── Coordination notes ──────────────────────────────────────────
  //
  // Loaded when the Record tab is first drawn rather than at boot. The request
  // is keyed by the agent_id the first response carries, so fetching it eagerly
  // would put a sequential hop on every page load for a panel most readers
  // never open.
  //
  //   undefined  not asked yet
  //   "loading"  in flight
  //   null       asked and unreadable — unknown, NOT an absence of notes
  //   object     the payload
  let NOTES;

  function loadNotes() {
    const id = (D.profile || {}).agent_id;
    if (!id) { NOTES = null; return; }
    NOTES = "loading";
    fetch(`/api/agents/${encodeURIComponent(id)}/coordination-notes`)
      .then(r => r.ok ? r.json() : null)
      .catch(() => null)
      .then(v => { NOTES = v; if (TAB === "record") render(); });
  }

  function coordinationBlock() {
    const head = `<h3>Coordination notes</h3>
      <div class="note">What a strategist's coherence run wrote into this agent's
        episodic memory, and — the column that decides whether it mattered — whether
        consolidation has run over it since. Dreaming reads episodes, not workspace
        git, which is why a coordination finding is an episode at all.</div>`;

    if (NOTES === undefined) loadNotes();
    if (NOTES === "loading")
      return `<div class="block">${head}<div class="absent">Reading…</div></div>`;
    if (!NOTES)
      return `<div class="block">${head}<div class="absent">The coordination notes
        could not be read. That is <b>unknown</b>, not an absence of notes — this agent
        may have any number and this page cannot currently see them.</div></div>`;

    const notes = NOTES.notes || [];
    // Empty is never blank, and which empty it is decides what a reader should
    // do about it. `detail` distinguishes the two: nobody anywhere has one, or
    // others have and this one has not. They are not the same instruction and
    // this page does not compose its own sentence for either.
    const body = notes.length
      ? notes.map(n => `<div class="cn">
          <div class="cn-h">
            <span class="cn-about">${esc(n.about || "—")}</span>
            <span class="cn-when">${esc(String(n.received_at || "").slice(0, 16).replace("T", " "))}</span>
            <span class="cn-state ${n.consolidated ? "dreamt" : "not"}">${
              n.consolidated ? "dreamt on" : "not consolidated"}</span>
          </div>
          ${n.note ? `<div class="cn-note">${esc(n.note)}</div>` : ""}
          ${n.episode_id ? `<div class="cn-when" style="margin-top:5px">
            <a href="/trace/${encodeURIComponent(n.episode_id)}">the pulse that carried it →</a>
          </div>` : ""}
        </div>`).join("")
        + (notes.some(n => !n.consolidated) ? `<div class="cn-proxy">
            A note marked <b>not consolidated</b> is in memory and has changed nothing
            yet. Until dreaming runs over it, it is indistinguishable — in what this
            agent does — from a note nobody sent.</div>` : "")
      : `<div class="absent">${esc(NOTES.detail || "No coordination note on file.")}</div>`;

    // Not served, and worth knowing: `consolidation_jobs` records a window over
    // an agent's episodes rather than a list of ids, so `consolidated` is
    // answered by "did a completed job finish after this note arrived". A job
    // that ran afterwards and processed nothing reads as having consolidated it.
    const proxy = notes.length ? `<div class="cn-proxy">
      <b>How “dreamt on” is decided:</b> consolidation records a window over this
      agent's episodes rather than a list of ids, so this asks whether a completed job
      finished after the note arrived. A job that ran afterwards and processed nothing
      would read here as having consolidated it.</div>` : "";

    return `<div class="block">${head}${body}${proxy}</div>`;
  }

  // `paneHealth()` was here.
  //
  // Its own last block already said the thing that removed it: "Eval
  // dimensions, persona drift, dyad state and the anomaly timeline live in the
  // Observatory, which is the surface built for them." Above that sentence sat
  // eleven rows of `panel_absence::scoped` explaining, one panel at a time,
  // that an empty panel is a fact about the filter and not about the subject.
  // True every time, and never actionable.
  //
  // So the tab is a link to the surface built for it, and the one panel here
  // the Observatory does not have — coordination notes — moved to Record.

  // ── The declaration group ────────────────────────────────────────────
  //
  // The one configuration group the platform can RANK. Ports, a type name, a
  // checkable schema, a field contract — in the order they cost an author, each
  // carrying what it unlocks and what reads `unknown` without it. That last
  // field is what makes this a workbench panel rather than a checklist: it says
  // what the agent's pulses cannot be checked for until you declare it.
  //
  // Exactly one rung is marked `next`, and it is the first absent one. A
  // recommendation that points at four things is a list.
  // Which rungs one editor closes.
  //
  // `ContractBuilder` compiles a sketch into `output_contract` and writes
  // `produces_schema`, `schema` AND `grounding` in one save — so three rungs
  // close together and there is no separate editor for the first two. The shelf
  // put its only button on `field_contract`, which implied the other two needed
  // something else that does not exist. Marked on each, and the control sits on
  // the last of them.
  const CONTRACT_RUNGS = ["output_type", "output_schema", "field_contract"];

  // Does the contract resolve? Three states, and the third is the point.
  //
  // `pending` is not a lesser `resolved`. `Grounding::Unsourced` means no tool
  // exists for this field YET — the field must be null and a value would be the
  // violation — so it is a standing request for an integration and nobody's
  // fault. Every surface before this collapsed it into failure, which made the
  // only route to a healthy agent deleting its ambition: `genome_profiler`
  // declares seven and is the best-declared agent on the platform.
  //
  // **Green means zero errors.** Said in the headline, not in a tooltip.
  //
  // Explain once: the reason belongs to the STATE, so it is one legend keyed by
  // the token the rows print, and the rows carry only what differs.
  const COMPILE_ORDER = ["error", "resolved", "pending", "derived", "inferred", "narrative"];
  const COMPILE_WORD = {
    error: "cannot be settled by anything",
    resolved: "a tool is named and the platform can run it",
    pending: "no source exists yet \u2014 a standing request, not a defect",
    derived: "computed by the platform from other fields",
    inferred: "a judgement, and an endorsement is the terminal verdict",
    narrative: "prose, with no proposition to settle",
  };

  function compileBlock(d) {
    const fields = d.fields || [];
    if (!fields.length) return "";
    const counts = d.counts || {};
    const errors = counts.error || 0;
    const present = COMPILE_ORDER.filter(k => counts[k]);
    // No verdict word here. This block is about the STORED contract's fields,
    // which is one input to the agent's verdict at the top of the shelf and not
    // the verdict itself — it used to say "Compiles." three inches above an
    // editor saying "Not compiled" about a different subject.
    return `<div class="cmp">
      <div class="cmp-head ${errors ? "bad" : "ok"}">The contract as stored:
        <b>${fields.length} declared field(s)</b>${errors
          ? `, and <b>${errors}</b> that nothing can settle.`
          : `, nothing unresolvable.`}</div>
      <div class="cmp-tally">${present.map(k =>
        `<span class="cmp-chip c-${k}"><b>${counts[k]}</b> ${esc(k)}</span>`).join("")}</div>
      ${counts.pending ? `<div class="af-note">Green means zero <b>errors</b>. The
        ${counts.pending} pending field(s) are declared gaps with no source yet \u2014 each
        one a standing request for an integration, and pruning them to reach green would
        delete the ambition the contract exists to record.</div>` : ""}
      ${present.map(k => `<div class="cmp-leg">
        <span class="cmp-n">${counts[k]}</span>
        <span class="cmp-t c-${k}">${esc(k)}</span>
        <span class="cmp-w">${esc(COMPILE_WORD[k] || "")}${k === "error"
          ? ` \u2014 ${esc([...new Set(fields.filter(f => f.state === "error")
              .map(f => f.tool).filter(Boolean))].join(", "))}` : ""}</span>
      </div>`).join("")}
      <details class="expert"><summary>every declared field</summary>
        ${fields.map(f => `<div class="cmp-row">
          <span class="cmp-t c-${esc(f.state)}">${esc(f.state)}</span>
          <span class="cmp-path">${esc(f.path)}</span>
          <span class="cmp-tool">${esc(f.tool || "\u2014")}</span>
        </div>`).join("")}
      </details>
    </div>`;
  }

  // Why a rung matters, on request.
  //
  // `unlocks` and `without_it` are two to four lines each. Four rungs of them,
  // at the top of the shelf, is per-row documentation \u2014 the wall of text the
  // panel notes were cut to remove, rebuilt by the same hand that removed them.
  // The sentences are good and they are not what an author is here to read, so
  // they are one keystroke away instead of always open.
  //
  // Which sentence shows still depends on the state, because that is the whole
  // distinction: a declared rung says what it BOUGHT, an absent one says what
  // reads `unknown` without it. Swap them and the panel is a checklist.
  function whyDetails(r) {
    return `<details class="why"><summary>${esc(r.rung)} \u00b7 ${
      r.present ? "what it unlocks" : "what is unknown without it"}</summary>
      <div class="rung-d">${esc(r.declares)}</div>
      <div class="rung-x">${r.present
        ? `<b>Unlocks:</b> ${esc(r.unlocks)}`
        : `<b>Without it:</b> ${esc(r.without_it)}`}</div>
      ${r.present ? "" : `<div class="rung-own">declared in ${esc(r.owner)}</div>`}
    </details>`;
  }

  const nextTag = (on) => on ? `<span class="next-tag">do this next</span>` : "";

  // One port, drawn as the connector it is.
  //
  // `dir` is which face it is on: `in` is `accepts` and its counterparts are
  // agents that PRODUCE the label; `out` is `produces` and its counterparts
  // ACCEPT it. Naming the counterparts is the point \u2014 a port is only worth
  // declaring because something on the other side can click into it, and the
  // shelf knew the labels and never said who was holding them.
  function stud(label, dir) {
    const isSchema = SCHEMA_ID_RE.test(label);
    const others = counterparts(dir === "in" ? PRODUCERS : CONSUMERS, label);
    const n = others.length;
    // Unknown is not zero. If the register did not load, every stud would read
    // "nothing on the platform" \u2014 a false claim about the fleet, written by the
    // arithmetic, on the surface an owner opens. Absent must look different
    // from bad, and this is the third place on this page that rule applies.
    const cls = !REG ? "" : n ? "joined" : "orphan";
    const shown = others.slice(0, 4);
    return `<div class="${cls ? "stud " + cls : "stud"}">
      <span class="stud-l">${esc(label)}<span class="${
        isSchema ? "stud-k schema" : "stud-k"}">${isSchema ? "schema" : "label"}</span></span>
      <span class="stud-c">${!REG
        ? "counterparts unknown"
        : n ? `<b>${n}</b> ${dir === "in" ? "produce" : "accept"} this`
            : "nothing on the other side"}</span>
      ${n ? `<span class="stud-who">${shown.map(o =>
          `<a href="/specimen/${encodeURIComponent(o.name)}">${esc(o.label)}</a>`
        ).join(" \u00b7 ")}${n > shown.length
          ? ` <span class="dim">+${n - shown.length} more</span>` : ""}</span>` : ""}
    </div>`;
  }

  // The two faces, and the agent between them.
  //
  // Ports were two rows of a definition list and three lines of prose, which is
  // the same information and none of the idea. They are studs: another agent's
  // `produces` clicks into this agent's `accepts` wherever the label matches,
  // and that join is the entire basis of composition here. Drawn as two
  // connector strips so the direction is seen rather than parsed.
  function seams(p) {
    // The two strips read top to bottom — what goes in, the agent, what comes
    // out — so both chevrons point down the flow rather than at each other.
    // The colour carries the face, and the rail carries the grouping.
    const side = (list, dir, head, sub) => `<div class="seam-side" data-dir="${dir}">
      <div class="seam-h"><span class="seam-dir">\u25be</span>
        <b>${head}</b><span class="seam-sub">${sub}</span></div>
      ${list.length ? list.map(l => stud(l, dir)).join("")
        : `<div class="seam-none">none declared \u2014 nothing can be bound to this face</div>`}
    </div>`;
    const joined = (l, dir) => REG
      && counterparts(dir === "in" ? PRODUCERS : CONSUMERS, l).length > 0;
    const live = (p.accepts || []).filter(l => joined(l, "in")).length
      + (p.produces || []).filter(l => joined(l, "out")).length;
    const total = (p.accepts || []).length + (p.produces || []).length;
    return `<div class="seams">
      ${side(p.accepts || [], "in", "accepts", "what can be plugged into it")}
      <div class="seam-body">\u25a3 <b>${esc(p.label)}</b>
        <span class="dim">${REG
          ? `${live} of ${total} port(s) have somebody on the other side`
          : "the register did not load, so counterparts are unknown"}</span></div>
      ${side(p.produces || [], "out", "produces", "what clicks into another agent")}
    </div>`;
  }

  // Three rungs, one document, one save.
  //
  // `output_type`, `output_schema` and `field_contract` are written by the same
  // editor in the same PUT. Rendering them as three rows, each with its own
  // paragraph and only the last carrying a button, implied three separate
  // pieces of work and hid the single control that does all three.
  function contractRung(d, rungs) {
    const three = CONTRACT_RUNGS.map(k => rungs.find(r => r.rung === k)).filter(Boolean);
    if (!three.length) return "";
    const done = three.filter(r => r.present).length;
    const isNext = CONTRACT_RUNGS.includes(d.next);
    const SEG = { output_type: "type", output_schema: "schema", field_contract: "fields" };
    return `<div class="rung ${done === three.length ? "on" : "off"} grouped${
      isNext ? " next" : ""}">
      <div class="rung-mark">${done === three.length ? "\u25c9" : "\u25cb"}</div>
      <div>
        <div class="rung-n">the contract${nextTag(isNext)}</div>
        <div class="${isNext ? "ccard next" : "ccard"}">
          <div class="ccard-h">what it returns, and where each value came from
            <span class="dim">${done} of ${three.length} written</span></div>
          <div class="ccard-segs">${three.map(r =>
            `<span class="${["cseg", r.present ? "on" : "", r.rung === d.next ? "next" : ""]
              .filter(Boolean).join(" ")}">${SEG[r.rung]}</span>`).join("")}</div>
          <div class="ccard-w">One document and one save \u2014 the editor below writes
            all three. ${done === three.length
              ? "Editing it rewrites the schema, the type name and the grounding map together."
              : "They cannot be closed separately, so the cheapest next step is the same button as the last one."}</div>
          <button class="rung-act" data-open-contract="1">${
            done ? "edit the contract" : "build it"} \u2192</button>
        </div>
        ${three.map(whyDetails).join("")}
      </div>
    </div>`;
  }

  function declarationPanel() {
    const d = D.declaration || {};
    const rungs = d.rungs || [];
    if (!rungs.length) {
      return `<div class="block"><h3><span class="g-mark">\u25c8</span>What it can be trusted about</h3>
        <div class="note">The ladder did not load, so nothing is claimed about what
        this agent has declared \u2014 which is different from it having declared
        nothing.</div></div>`;
    }
    const p = D.profile || {};
    const portsRung = rungs.find(r => r.rung === "ports");
    const flash = CONTRACT_FLASH;
    CONTRACT_FLASH = null;
    return `<div class="block" id="shelf-declaration"><h3><span class="g-mark">\u25c8</span>What it can be trusted about</h3>
      <div class="shelf-count"><b>${d.declared} of ${d.total}</b> rungs declared${
        d.next ? ` \u00b7 cheapest next: <b>${esc(d.next)}</b>` : " \u00b7 nothing left to declare"}</div>
      ${flash ? `<div class="cbbar-msg ok">${esc(flash)}</div>` : ""}

      ${compileBlock(d)}

      ${portsRung ? `<div class="rung ${portsRung.present ? "on" : "off"}${
        d.next === "ports" ? " next" : ""}">
        <div class="rung-mark">${portsRung.present ? "\u25c9" : "\u25cb"}</div>
        <div>
          <div class="rung-n">ports${nextTag(d.next === "ports")}</div>
          ${seams(p)}
          <div id="af-ports"></div>
          <span class="rung-own2">Produces is set by the contract compiler, not
            here \u2014 it follows the type the contract declares.</span>
          ${whyDetails(portsRung)}
        </div>
      </div>` : ""}

      ${contractRung(d, rungs)}
      <div id="shelf-contract" class="shelf-mount"></div></div>`;
  }

  // The bank account.
  //
  // An agent that pulses spends money doing it, and the shelf could tell you
  // what model it runs on but not what that costs. Read-only: every figure is a
  // measurement, and the two that ARE settings \u2014 fork price, dreaming budget \u2014
  // are not editable yet and do not pretend to be.
  function bankBlock(r, p) {
    const money = (n) => (n == null ? "\u2014" : "$" + Number(n).toFixed(Number(n) < 1 ? 4 : 2));
    // Absent is not zero.
    //
    // `(undefined ?? 0) - (undefined ?? 0)` is 0, which is `<= 0`, which told an
    // agent whose record had not loaded that it was out of dream credits and its
    // learning had stopped. That is a false claim about the platform, made by the
    // arithmetic, on the surface an owner opens \u2014 and it is the exact rule this
    // project keeps re-learning: absent must look different from bad.
    const known = r.dream_budget != null;
    const dreamLeft = known ? r.dream_budget - (r.dream_used ?? 0) : null;
    return `<div class="block"><h3><span class="g-mark">\u25f7</span>Bank account</h3>
      <div class="af-meta">what it has spent, and what it has left to think with</div>
      <div class="bank">
        <div class="bank-cell"><span class="bank-n">${money(r.cost_usd)}</span>
          <span class="bank-l">spent, all time</span></div>
        <div class="bank-cell"><span class="bank-n">${money(r.cost_per_run)}</span>
          <span class="bank-l">per pulse</span></div>
        <div class="bank-cell"><span class="bank-n">${r.runs ?? 0}</span>
          <span class="bank-l">pulses</span></div>
        <div class="bank-cell ${known && dreamLeft <= 0 ? "dry" : ""}">
          <span class="bank-n">${known ? dreamLeft : "\u2014"}</span>
          <span class="bank-l">dream credits left</span></div>
      </div>
      ${known && dreamLeft <= 0 ? `<div class="af-note">Out of dream credits, so Loop 1
        cannot run for this agent \u2014 it will keep answering and stop learning.</div>` : ""}
    </div>`;
  }

  // What the prompt does to execution, and whether that agrees with the contract.
  //
  // The first thing an author needs, and until now no surface said any of it.
  // Before an agent runs, the platform scans its system prompt for phrases that
  // demand a JSON-only answer; finding one makes `ToolAwareExecutor` hand the
  // request straight to the model, so the agent gets **no tools** for that run.
  // The prompt is not documentation, it is an input to how the agent runs.
  //
  // Said in those words on purpose. This read "nothing in the prompt trips
  // `prompt_demands_structured_output`", which named a Rust function nobody
  // outside the repo can look up and used a verb \u2014 "trips" \u2014 that an author
  // reasonably read as the prompt INVOKING something. Both halves of the
  // sentence were wrong for its reader: the direction is the platform reading
  // the prompt, and what it decides is whether tools are switched on.
  //
  // Three facts, in the compile's own vocabulary. `error` is reserved for the one
  // that is a contradiction the platform authored: a contract naming tools for N
  // fields, and a prompt that removed the loop which could call them.
  function promptRows(c) {
    if (!c) return [];
    const rows = [];
    // The phrases come from the one Rust definition
    // (`STRUCTURED_OUTPUT_PATTERNS`), never from a copy here \u2014 a second list
    // would state a rule the executor does not follow.
    const phrases = Array.isArray(c.patterns) && c.patterns.length
      ? c.patterns.map(p => `<code>${esc(p)}</code>`).join(", ")
      : null;

    if (c.contradicts_contract) {
      rows.push(["error", "tools switched off, and the contract needs them",
        `The prompt contains the phrase <code>${esc(c.trigger)}</code>. The platform
         reads that as \u201canswer in JSON and nothing else\u201d and switches this agent's
         tools off for every run \u2014 while ${c.sourced_fields} contracted field(s) name a
         tool to source them from. Those fields can never be filled. Remove the
         phrase, or regrade the fields.`]);
    } else if (!c.gets_tools) {
      rows.push(["pending", "tools switched off",
        `The prompt contains the phrase <code>${esc(c.trigger)}</code>. The platform
         reads that as \u201canswer in JSON and nothing else\u201d and returns the model's
         answer directly instead of letting the agent call tools. Correct for an
         agent that reasons over what it is given; a problem the moment a field
         needs sourcing.`]);
    } else {
      rows.push(["resolved", "tools stay switched on",
        `The platform scans every prompt for phrases that demand a JSON-only answer
         and switches tools off when it finds one. None of them appear here, so this
         agent can call its tools while it answers.${
           phrases ? ` The phrases are ${phrases}.` : ""}`]);
    }

    if (c.names_its_type === false) {
      rows.push(["error", "does not name its type",
        `The contract declares <code>${esc(c.produces_schema)}</code> and the prompt
         never mentions it, so nothing tells the agent what document to emit. The
         contract editor generates the exact wording.`]);
    } else if (c.names_its_type === true) {
      rows.push(["resolved", "names its type",
        `The prompt names <code>${esc(c.produces_schema)}</code>, the type the contract
         declares.`]);
    }

    return rows;
  }

  function promptCheck(c) {
    const rows = promptRows(c);
    if (!rows.length) return "";
    return `<div class="pchk">${rows.map(([state, token, why]) => `<div class="pchk-row">
      <span class="cmp-t c-${state}">${esc(state)}</span>
      <span class="pchk-t">${esc(token)}</span>
      <div class="pchk-w">${why}</div>
    </div>`).join("")}</div>`;
  }

  // ── One verdict, and it is about the AGENT ───────────────────────────────
  //
  // Three headlines used to disagree on one screen, and all three were right:
  //
  //   the prompt panel   "2 errors"      — about the prompt against the contract
  //   the compile block  "Compiles."     — about the STORED contract's fields
  //   the builder        "Not compiled"  — about the DRAFT in the editor
  //
  // One word, three subjects, no way for a reader to tell which. "Does this
  // agent work?" had no answer on a page that answered it three times.
  //
  // So: `compile` is a verb with exactly one subject now — the agent — and it
  // is said once, at the top, over every check the shelf runs. The panels below
  // keep their detail and lose their verdicts: the compile block names its own
  // subject (the stored contract) and the editor's chip talks about a draft and
  // says `saveable`, never `compiled`.
  //
  // Green means zero ERRORS, not zero pending — the same rule the compile block
  // already followed, now applied to the thing a reader was asking about.
  function agentVerdict() {
    const p = D.profile || {};
    const d = D.declaration || {};
    const faults = [];

    promptRows(p.prompt_check).forEach(([state, token]) => {
      if (state === "error") faults.push(["what it says", token]);
    });
    const fieldErrors = (d.counts || {}).error || 0;
    if (fieldErrors) {
      faults.push(["its contract",
        `${fieldErrors} field(s) nothing can settle`]);
    }

    const pending = (d.counts || {}).pending || 0;
    if (!faults.length) {
      return `<div class="verdict ok">
        <b>This agent compiles.</b>
        <div class="verdict-w">Its prompt and its contract agree, and nothing it
          declares is unsettleable.${pending ? ` ${pending} field(s) are pending —
          declared gaps with no source yet, which is a standing request rather than
          a fault.` : ""}</div>
      </div>`;
    }
    return `<div class="verdict bad">
      <b>This agent does not compile — ${faults.length} error(s).</b>
      <div class="verdict-w">${faults.map(([where, what]) =>
        `<span class="verdict-f"><i>${esc(where)}</i> ${esc(what)}</span>`).join("")}</div>
    </div>`;
  }

  function drawer() {
    const p = D.profile;
    document.getElementById("drawer").innerHTML = `
      <div class="grip" id="shelf-grip" title="drag to resize"></div>
      <button class="close" id="close-drawer">\u2715</button>
      <h2>Configure</h2>
      <div class="sub">${esc(p.label)}</div>
      ${agentVerdict()}

      <div class="block"><h3><span class="g-mark">\u25a4</span>What it says</h3>
        <div class="af-meta">the platform reads this before every run and decides
          from it \u2014 the prompt is an input to how the agent runs, not a note about
          it</div>
        ${promptCheck((D.profile || {}).prompt_check)}
        <div id="af-prompt"></div></div>
      ${declarationPanel()}
      <div class="block"><h3><span class="g-mark">\u25d1</span>Brain</h3>
        <div class="af-meta">${esc((p.substrate || {}).executor || "no executor")}
          \u00b7 persona v${(p.substrate || {}).persona_version ?? 1}</div>
        <div id="af-intelligence"></div></div>
      <div class="block"><h3><span class="g-mark">\u25c9</span>Personality</h3>
        <div class="af-meta">how it reads, and how far that is from its teammates</div>
        <div id="af-personality"></div></div>
      ${bankBlock(D.record || {}, p)}
      <div class="block"><h3><span class="g-mark">◇</span>Competition</h3>
        <div class="af-meta">how this agent competes for open coordination graph slots</div>
        <div id="af-competition"></div>
        <div class="comp-stats" id="af-comp-stats">
          <span class="comp-stat">Fidelity: <b>…</b></span>
          <span class="comp-stat">Selection rate: <b>…</b></span>
        </div></div>
      <div class="block"><h3><span class="g-mark">◎</span>Identity and reach</h3>
        <div class="af-meta">${p.fork_count ?? 0} fork(s)${
          p.forked_from ? ` \u00b7 from ${esc(p.forked_from)}` : ""}</div>
        <div id="af-manage"></div>
        <a href="/agent/${encodeURIComponent(p.agent_name)}#manage">The old page, for
          what has not moved yet \u2192</a></div>`;
    document.getElementById("close-drawer").onclick = closeDrawer;
    wireGrip();

    // Fetch platform-computed competition credentials and fill them in once
    // the data arrives. These are read-only signals (gate history + selection
    // records) so they come from dedicated endpoints, not the profile.
    //
    // The shelf renders immediately with … placeholders; the update is
    // non-blocking. If either fetch fails, the placeholder stays and the
    // author is not left with a broken panel.
    (async () => {
      const name = encodeURIComponent(p.agent_name);
      const [fid, stats] = await Promise.all([
        fetch(`/api/agents/${name}/fidelity`).then(r => r.ok ? r.json() : null).catch(() => null),
        fetch(`/api/agents/${name}/competition-stats`).then(r => r.ok ? r.json() : null).catch(() => null),
      ]);
      const el = document.getElementById("af-comp-stats");
      if (!el) return;

      // Fidelity: approved / (approved + refused) from Gate::OutputSchema ledger.
      let fidHtml;
      if (fid && fid.fidelity != null) {
        const pct = (fid.fidelity * 100).toFixed(1);
        fidHtml = `Fidelity: <b>${pct}%</b>
          <span class="dim">· ${fid.approved} valid, ${fid.refused} refused</span>`;
      } else if (fid && fid.total === 0) {
        fidHtml = `Fidelity: <b>no data yet</b>
          <span class="dim">· accrues as delegation hops run</span>`;
      } else {
        fidHtml = `Fidelity: <b>N/A</b>`;
      }

      // Selection rate: how often chosen when in the candidate set.
      let selHtml;
      if (stats && stats.selection_rate != null) {
        const pct = (stats.selection_rate * 100).toFixed(1);
        selHtml = `Selection rate: <b>${pct}%</b>
          <span class="dim">· ${stats.selected} of ${stats.considered} considered</span>`;
      } else if (stats && stats.considered === 0) {
        selHtml = `Selection rate: <b>no data yet</b>
          <span class="dim">· accrues as select_agent calls run</span>`;
      } else {
        selHtml = `Selection rate: <b>N/A</b>`;
      }

      el.innerHTML = `<span class="comp-stat">${fidHtml}</span>
        <span class="comp-stat">${selHtml}</span>`;
    })();

    // Both groups, from one spec. `profile` is the served object and the widget
    // reads each field out of it by path, so there is no second copy of "where
    // does the model live" — which is the mistake that made the old page render
    // thirteen metrics twice under different names.
    if (typeof AgentFields !== "undefined") {
      ["prompt", "intelligence", "personality", "competition", "manage", "ports"].forEach(group => {
        const host = document.getElementById("af-" + group);
        if (!host) return;
        AgentFields.mount({
          container: host,
          agentId: p.agent_name,
          group,
          profile: p,
          // Re-read rather than patch the local copy: the PUT may normalise a
          // value, and a shelf showing what you typed while the platform holds
          // something else is the drift this whole surface exists to prevent.
          onSaved: () => boot(),
        });
      });
    } else {
      ["prompt", "intelligence", "personality", "competition", "manage", "ports"].forEach(group => {
        const host = document.getElementById("af-" + group);
        if (host) {
          host.innerHTML = `<div class="note">The field editor did not load, so this
            group cannot be changed from here.
            <a href="/agent/${encodeURIComponent(p.agent_name)}">The old page \u2192</a></div>`;
        }
      });
    }

    // Mounted on the press, not on render. The widget fetches tool names and
    // type definitions on mount, and paying for that every time the shelf opens
    // \u2014 including to read the Manage panel \u2014 is a cost nobody asked for.
    //
    // Once mounted it stays: it holds unsaved edits, and remounting would throw
    // them away silently, which is the worst way for an editor to behave.
    const openBtn = document.querySelector("[data-open-contract]");
    if (openBtn) {
      openBtn.onclick = () => {
        const host = document.getElementById("shelf-contract");
        if (host.dataset.mounted === "1") { host.scrollIntoView({ block: "nearest" }); return; }
        if (typeof ContractBuilder === "undefined") {
          host.innerHTML = `<div class="note">The contract editor did not load, so this
            rung cannot be built from here. <a href="/contracts">The standalone page
            \u2192</a></div>`;
          return;
        }
        host.dataset.mounted = "1";
        openBtn.disabled = true;
        // A wider shelf, because a contract editor in 520px is a form in a
        // corridor. Only widens \u2014 a reader who has already dragged it wider
        // keeps their width.
        const cur = parseInt(getComputedStyle(document.documentElement)
          .getPropertyValue("--shelf-w"), 10) || 520;
        if (cur < 860) setShelfWidth(860);
        ContractBuilder.mount({ container: host, agentId: D.profile.agent_name });
        mountContractBar(host, D.profile.agent_name);
      };
    }
  }

  // ── The editor's save, which the shelf never had ─────────────────────
  //
  // `ContractBuilder` writes no save button of its own. Its host provides one:
  // /contracts has `Save to agent`, the create wizard saves at the end of the
  // flow, and the shelf \u2014 the surface an owner actually configures an agent
  // from \u2014 mounted the editor and provided nothing. Every edit made here was
  // discarded on close, with no warning and no way to keep it. The editor's own
  // status chip said `Draft is ready to save` next to no way to save it.
  //
  // `saveTo` refuses a draft that does not compile, which is the right refusal
  // and is the editor's to make: a partial contract saved onto a card is a
  // publish refusal deferred to publish time.
  function mountContractBar(host, agentName) {
    const bar = document.createElement("div");
    bar.className = "cbbar";
    bar.innerHTML = `
      <button class="rung-act" data-cb-save>save the contract to ${esc(agentName)}</button>
      <span class="cbbar-msg" data-cb-msg>Nothing saved yet. The editor keeps this
        draft only while the shelf stays open.</span>`;
    host.appendChild(bar);

    const msg = bar.querySelector("[data-cb-msg]");
    const btn = bar.querySelector("[data-cb-save]");
    const say = (t, cls) => { msg.className = "cbbar-msg " + (cls || ""); msg.textContent = t; };

    // Dirty is tracked here rather than asked of the builder, because the
    // builder has no such concept to expose and inventing one inside a
    // 1,800-line editor to serve one host is the wrong place for it. Any input
    // inside the mount means there is work to lose.
    host.addEventListener("input", () => { CONTRACT_DIRTY = true; }, true);
    host.addEventListener("change", () => { CONTRACT_DIRTY = true; }, true);

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      say("saving\u2026");
      let okSave = false;
      try {
        okSave = await ContractBuilder.saveTo(agentName);
      } catch (err) {
        say("Could not reach the platform: " + err.message, "bad");
        btn.disabled = false;
        return;
      }
      if (!okSave) {
        // The builder puts the reason in its own status chip, which is right
        // there and says more than a second copy of it would.
        say("Not saved \u2014 the editor's status above says why. A draft that does "
          + "not compile is refused here rather than at publish.", "bad");
        btn.disabled = false;
        return;
      }
      CONTRACT_DIRTY = false;
      // Re-read and redraw. The work is on the card now, so discarding the
      // editor loses nothing \u2014 and the rungs turning green is better
      // confirmation than any sentence this bar could carry.
      CONTRACT_FLASH = `Saved to ${agentName}. The ladder below is re-read from `
        + `the card, not from the editor.`;
      await boot();
      drawer();
      const blk = document.getElementById("shelf-declaration");
      if (blk) blk.scrollIntoView({ block: "nearest" });
    });
  }

  // ── The drag handle ──────────────────────────────────────────────────
  //
  // One handle, on the shelf's leading edge, and the width is remembered. A
  // width you have to set twice is a width the tool forgot.
  //
  // Pointer events rather than mouse events, so a trackpad and a stylus behave
  // the same, and `setPointerCapture` so the drag survives the pointer leaving
  // the 9px strip — which it does immediately, every time.
  const SHELF_MIN = 380, SHELF_KEY = "abw.shelf.width";
  function setShelfWidth(px) {
    const w = Math.max(SHELF_MIN, Math.min(px, Math.round(window.innerWidth * 0.96)));
    document.documentElement.style.setProperty("--shelf-w", w + "px");
    return w;
  }
  function wireGrip() {
    const grip = document.getElementById("shelf-grip");
    const shelf = document.getElementById("drawer");
    if (!grip || !shelf) return;
    grip.addEventListener("pointerdown", ev => {
      ev.preventDefault();
      grip.setPointerCapture(ev.pointerId);
      grip.classList.add("dragging");
      shelf.classList.add("resizing");
      document.body.classList.add("resizing");
      const move = e => setShelfWidth(window.innerWidth - e.clientX);
      const up = e => {
        grip.releasePointerCapture(ev.pointerId);
        grip.classList.remove("dragging");
        shelf.classList.remove("resizing");
        document.body.classList.remove("resizing");
        grip.removeEventListener("pointermove", move);
        grip.removeEventListener("pointerup", up);
        // Persisted on release, not on every move: one write per drag.
        try { localStorage.setItem(SHELF_KEY, String(setShelfWidth(window.innerWidth - e.clientX))); }
        catch (_) { /* private mode: the width is still applied, just not kept */ }
      };
      grip.addEventListener("pointermove", move);
      grip.addEventListener("pointerup", up);
    });
  }
  // Applied before the shelf is ever opened, so it does not visibly jump.
  try {
    const saved = parseInt(localStorage.getItem(SHELF_KEY) || "", 10);
    if (saved) setShelfWidth(saved);
  } catch (_) { /* no storage: the CSS default stands */ }
  const openDrawer = () => { drawer();
    document.getElementById("drawer").classList.add("open");
    document.getElementById("scrim").classList.add("open"); };
  // Closing rebuilds the shelf on the next open, which destroys the mounted
  // contract editor. That is fine for a saved draft and is the loss of an
  // afternoon for an unsaved one, and the scrim is one stray click wide \u2014 so
  // the only unrecoverable action on this surface asks first.
  const closeDrawer = () => {
    if (CONTRACT_DIRTY && !confirm(
        "The contract editor has changes that are not on the agent yet. "
        + "Closing the shelf discards them. Close anyway?")) return;
    CONTRACT_DIRTY = false;
    document.getElementById("drawer").classList.remove("open");
    document.getElementById("scrim").classList.remove("open"); };

  function render() {
    // Two panes, and `profile` is the default rather than the fallthrough.
    //
    // This read `TAB === "profile" ? paneProfile() : TAB === "record" ?
    // paneRecord() : paneHealth()`, so the pane for an unrecognised TAB was
    // whatever happened to be last in the chain. With Health gone that would
    // have called a function that no longer exists; written this way an
    // unknown TAB shows the profile, which is the honest default for a page
    // about one specimen.
    const pane = TAB === "record" ? paneRecord() : paneProfile();
    document.getElementById("content").innerHTML = head() + pane;
    // `.tab[data-tab]`, not `.tab`. The Health entry is an anchor that carries
    // the tab class for position and no `data-tab`, so the bare selector would
    // bind a handler setting `TAB = undefined` to a link that then navigates
    // anyway — a pane switch racing a page load, for no reason.
    document.querySelectorAll(".tab[data-tab]").forEach(b =>
      b.onclick = () => { TAB = b.dataset.tab; render(); });
    document.getElementById("open-drawer").onclick = openDrawer;
  }

  async function boot() {
    if (window.Nav) Nav.init({ current: "bestiary" });
    document.getElementById("scrim").onclick = closeDrawer;
    try {
      const [res, reg] = await Promise.all([
        fetch(`/api/specimen/${encodeURIComponent(NAME)}`),
        fetch("/api/bestiary").catch(() => null),
      ]);
      if (res.status === 404) {
        document.getElementById("content").innerHTML =
          `<div class="empty">No specimen named <b>${esc(NAME)}</b>.
           <a href="/bestiary">Back to the register</a></div>`;
        return;
      }
      if (!res.ok) throw new Error("HTTP " + res.status);
      D = await res.json();

      // Which labels can form a seam anywhere in the population — so a stud that
      // cannot connect is drawn differently from one that merely is not typed.
      if (reg && reg.ok) {
        const r = await reg.json();
        // Cleared, not appended to. `boot()` runs again after a contract save,
        // and a Map that is only ever pushed into would report every port as
        // having twice the counterparts it has — a number that grows each time
        // the author saves, which is the most convincing kind of wrong.
        PRODUCERS.clear();
        CONSUMERS.clear();
        const acc = new Set(), prod = new Set();
        const push = (m, l, s) => {
          // Self is not a counterpart. An agent whose own `produces` matched
          // its own `accepts` would otherwise read as a joinable port with one
          // partner, and the partner is itself.
          if (s.agent_name === NAME) return;
          if (!m.has(l)) m.set(l, []);
          m.get(l).push({ name: s.agent_name, label: s.label || s.agent_name });
        };
        (r.specimens || []).forEach(s => {
          (s.accepts || []).forEach(l => { acc.add(l); push(CONSUMERS, l, s); });
          (s.produces || []).forEach(l => { prod.add(l); push(PRODUCERS, l, s); });
        });
        acc.forEach(l => { if (prod.has(l)) SEAM.add(l); });
        REG = true;
      }
    } catch (e) {
      document.getElementById("content").innerHTML =
        `<div class="empty">Could not load the specimen: ${esc(e.message)}.</div>`;
      return;
    }
    render();
  }

  // Delegated, so it survives every re-render of the panes.
  // Any row that carries a destination. `tr.rowlink` for the tables still built
  // here, and `Pulse.wire` for the pulse list, which is the shared widget's.
  document.addEventListener("click", ev => {
    const tr = ev.target.closest && ev.target.closest("tr.rowlink");
    if (tr && tr.dataset.href) location.href = tr.dataset.href;
    const ex = ev.target.closest && ev.target.closest(".ex[data-href]");
    if (ex) location.href = ex.dataset.href;
  });

  boot();
  </script>
</body>
</html>
