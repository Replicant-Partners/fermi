<!doctype html>
<html lang="en" class="theme-hasui">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workspace - Agent Bestiary</title>
    <style>
      :root {
        --bg0-hard: #1d2021;
        --bg0: #282828;
        --bg1: #3c3836;
        --bg2: #504945;
        --bg3: #665c54;
        --fg0: #fbf1c7;
        --fg1: #ebdbb2;
        --fg2: #d5c4a1;
        --fg3: #bdae93;
        --yellow: #fabd2f;
        --green: #b8bb26;
        --red: #fb4934;
        --aqua: #8ec07c;
        --gray: #928374;
      }
      .theme-op1 {
        --bg0-hard: #f5f5f0;
        --bg0: #ffffff;
        --bg1: #f0f0eb;
        --bg2: #e0e0db;
        --bg3: #c8c8c3;
        --fg0: #1a1a1a;
        --fg1: #2d2d2d;
        --fg2: #4a4a4a;
        --fg3: #6b6b6b;
        --yellow: #ff6b00;
        --green: #00c853;
        --red: #ff1744;
        --aqua: #00b8d4;
        --gray: #9e9e9e;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: var(--bg0-hard);
        color: var(--fg1);
        font-family: "Berkeley Mono", "JetBrains Mono", monospace;
        line-height: 1.6;
      }
      header {
        background: var(--bg0);
        border-bottom: 1px solid var(--bg2);
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header h1 { font-size: 1.2rem; color: var(--fg0); }
      header a { color: var(--fg3); text-decoration: none; font-size: 0.85rem; margin-left: 16px; }
      header a:hover { color: var(--yellow); }
      .container { max-width: 900px; margin: 0 auto; padding: 24px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
      @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
      .section { background: var(--bg0); border: 1px solid var(--bg2); padding: 20px; margin-bottom: 16px; }
      .section-title {
        font-size: 0.85rem;
        color: var(--yellow);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 16px;
      }
      .budget-bar { height: 8px; background: var(--bg2); margin-top: 8px; }
      .budget-fill { height: 100%; background: var(--aqua); transition: width 0.3s; }
      .stat-row { display: flex; gap: 32px; margin-bottom: 8px; }
      .stat-value { font-size: 1.5rem; color: var(--aqua); font-weight: bold; }
      .stat-label { font-size: 0.75rem; color: var(--fg3); }
      .item-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--bg1);
      }
      .item-row:last-child { border-bottom: none; }
      .item-name { color: var(--fg0); font-size: 0.9rem; }
      .item-meta { color: var(--fg3); font-size: 0.75rem; }
      .empty-state { color: var(--fg3); font-size: 0.85rem; font-style: italic; padding: 12px 0; }
      .theme-toggle-btn {
        background: transparent;
        border: 1px solid var(--bg3);
        padding: 4px 10px;
        cursor: pointer;
        font-size: 0.8rem;
        color: var(--fg3);
        font-family: inherit;
      }
      .theme-toggle-btn:hover { border-color: var(--yellow); color: var(--yellow); }
    </style>
  </head>
  <body>
    <header>
      <div><h1 id="ws-name">Workspace</h1></div>
      <div>
        <a href="/dashboard">Dashboard</a>
        <a href="/">Catalogue</a>
        <button id="theme-toggle" class="theme-toggle-btn" title="Toggle Theme (Ctrl+T)">OP-1</button>
      </div>
    </header>

    <div class="container">
      <!-- Budget -->
      <div class="section">
        <div class="section-title">Budget</div>
        <div class="stat-row">
          <div>
            <div class="stat-value" id="budget-remaining">--</div>
            <div class="stat-label">remaining</div>
          </div>
          <div>
            <div class="stat-value" style="color:var(--fg2)" id="budget-total">--</div>
            <div class="stat-label">total budget</div>
          </div>
          <div>
            <div class="stat-value" style="color:var(--fg3)" id="budget-spent">--</div>
            <div class="stat-label">spent</div>
          </div>
        </div>
        <div class="budget-bar"><div class="budget-fill" id="budget-bar-fill"></div></div>
      </div>

      <div class="grid">
        <!-- Agents -->
        <div class="section">
          <div class="section-title">Agents</div>
          <div id="agents-list"><div class="empty-state">Loading...</div></div>
        </div>

        <!-- Members -->
        <div class="section">
          <div class="section-title">Members</div>
          <div id="members-list"><div class="empty-state">Loading...</div></div>
        </div>
      </div>

      <!-- Description -->
      <div class="section">
        <div class="section-title">About</div>
        <div id="ws-description" class="empty-state">Loading...</div>
      </div>
    </div>

    <script>
      // Get workspace ID from URL
      const wsId = window.location.pathname.split("/").pop();

      (async () => {
        // Auth check
        const authRes = await fetch("/api/auth/me");
        if (!authRes.ok) { window.location.href = "/"; return; }

        // Load workspace
        try {
          const res = await fetch(`/api/workspaces/${wsId}`);
          if (!res.ok) { document.getElementById("ws-name").textContent = "Not Found"; return; }
          const ws = await res.json();

          document.getElementById("ws-name").textContent = ws.name;
          document.title = ws.name + " - Agent Bestiary";
          document.getElementById("ws-description").textContent = ws.description || "No description.";

          // Budget
          document.getElementById("budget-remaining").textContent = ws.workspace_remaining;
          document.getElementById("budget-total").textContent = ws.workspace_budget;
          document.getElementById("budget-spent").textContent = ws.workspace_spent;
          const pct = ws.workspace_budget > 0 ? Math.min(100, (ws.workspace_spent / ws.workspace_budget) * 100) : 0;
          document.getElementById("budget-bar-fill").style.width = pct + "%";

          // Agents
          const agentsEl = document.getElementById("agents-list");
          if (!ws.agents || ws.agents.length === 0) {
            agentsEl.innerHTML = '<div class="empty-state">No agents in this workspace.</div>';
          } else {
            agentsEl.innerHTML = ws.agents.map(a => `
              <div class="item-row">
                <div>
                  <div class="item-name">${a.agent_name}</div>
                  <div class="item-meta">${a.total_executions} executions</div>
                </div>
              </div>
            `).join("");
          }

          // Members
          const membersEl = document.getElementById("members-list");
          if (!ws.members || ws.members.length === 0) {
            membersEl.innerHTML = '<div class="empty-state">No members.</div>';
          } else {
            membersEl.innerHTML = ws.members.map(m => `
              <div class="item-row">
                <div class="item-name">${m.member_id}</div>
                <div class="item-meta">${m.role}</div>
              </div>
            `).join("");
          }
        } catch (e) {
          document.getElementById("ws-name").textContent = "Error loading workspace";
        }
      })();

      // Theme toggle
      const themes = ["hasui", "op1"];
      const labels = { hasui: "OP-1", op1: "Hasui" };
      function setTheme(t) {
        document.documentElement.className = "theme-" + t;
        localStorage.setItem("fermi-theme", t);
        document.getElementById("theme-toggle").textContent = labels[t];
      }
      const saved = localStorage.getItem("fermi-theme");
      if (saved && themes.includes(saved)) setTheme(saved);
      document.getElementById("theme-toggle").addEventListener("click", () => {
        const current = localStorage.getItem("fermi-theme") || "hasui";
        setTheme(current === "hasui" ? "op1" : "hasui");
      });
      document.addEventListener("keydown", (e) => {
        if (e.ctrlKey && e.key === "t") { e.preventDefault(); document.getElementById("theme-toggle").click(); }
      });
    </script>
  </body>
</html>
