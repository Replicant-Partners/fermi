<!doctype html>
<html lang="en" class="theme-hasui">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App — Agent Bestiary</title>
    <link rel="stylesheet" href="/static/css/variables.css" />
    <link rel="stylesheet" href="/static/css/common.css" />
    <style>
      body { padding: 20px; line-height: 1.5; }
      .container { max-width: 900px; margin: 0 auto; }
      .app-hero {
        display: flex;
        align-items: flex-start;
        gap: 20px;
        padding: 24px;
        background: var(--bg1);
        border: 1px solid var(--bg2);
        border-radius: 4px;
        margin-bottom: 20px;
      }
      .app-icon {
        width: 64px;
        height: 64px;
        border-radius: 8px;
        background: var(--bg2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8em;
        flex-shrink: 0;
        overflow: hidden;
      }
      .app-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
      .app-name { font-size: 1.6em; font-weight: 400; color: var(--fg0); margin-bottom: 4px; }
      .app-tagline { font-size: 0.9em; color: var(--fg3); margin-bottom: 10px; }
      .app-badges { display: flex; gap: 8px; flex-wrap: wrap; }
      .badge { font-size: 0.72em; padding: 2px 8px; border-radius: 3px; border: 1px solid var(--bg3); color: var(--fg3); text-transform: uppercase; letter-spacing: 0.04em; }
      .badge.public { border-color: var(--green); color: var(--green); }
      .badge.private { border-color: var(--gray); color: var(--gray); }
      .badge.unlisted { border-color: var(--yellow); color: var(--yellow); }
      .section { background: var(--bg1); border: 1px solid var(--bg2); border-radius: 4px; padding: 20px; margin-bottom: 16px; }
      .section-title { font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg3); margin-bottom: 14px; }
      .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .field-label { font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg3); margin-bottom: 3px; }
      .field-value { font-size: 0.88em; color: var(--fg1); word-break: break-word; }
      .agent-pill {
        display: inline-flex; align-items: center; gap: 5px;
        padding: 3px 8px; background: var(--bg0); border: 1px solid var(--bg2);
        border-radius: 3px; font-size: 0.78em; color: var(--fg2);
        text-decoration: none;
      }
      .agent-pill:hover { border-color: var(--yellow); color: var(--yellow); }
      .spawn-btn {
        display: inline-block; padding: 10px 20px;
        background: var(--yellow); color: var(--bg0);
        border: none; border-radius: 4px; cursor: pointer;
        font-family: inherit; font-size: 0.88em; font-weight: 600;
        text-decoration: none; letter-spacing: 0.02em;
        transition: opacity 0.15s;
      }
      .spawn-btn:hover { opacity: 0.85; }
      .spawn-btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .ws-list { display: flex; flex-direction: column; gap: 8px; }
      .ws-item {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 12px; background: var(--bg0); border: 1px solid var(--bg2);
        border-radius: 3px; text-decoration: none; color: var(--fg2);
        font-size: 0.85em; transition: border-color 0.15s;
      }
      .ws-item:hover { border-color: var(--yellow); color: var(--fg1); }
      .ws-meta { font-size: 0.75em; color: var(--fg3); }
      .error-state { color: var(--red); font-size: 0.88em; padding: 12px 0; }
      .admin-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
      .admin-btn { padding: 6px 12px; background: none; border: 1px solid var(--bg3); border-radius: 3px; color: var(--fg3); cursor: pointer; font-family: inherit; font-size: 0.78em; transition: all 0.15s; }
      .admin-btn:hover { border-color: var(--yellow); color: var(--yellow); }
      .admin-btn.danger:hover { border-color: var(--red); color: var(--red); }
    </style>
  </head>
  <body>
    <div class="container">
      <script src="/static/js/widgets/nav.js"></script>
      <script>
        const appSlug = window.location.pathname.split("/apps/")[1]?.split("/")[0];
        Nav.init({ title: "App", back: { label: "← Apps", href: "/apps" } });
      </script>

      <div id="app-hero" class="app-hero" style="display:none">
        <div class="app-icon" id="app-icon">⚙</div>
        <div style="flex:1">
          <div class="app-name" id="app-name">Loading…</div>
          <div class="app-tagline" id="app-tagline"></div>
          <div class="app-badges" id="app-badges"></div>
        </div>
        <div>
          <button class="spawn-btn" id="spawn-btn" onclick="spawnWorkspace()" style="display:none">
            + New Workspace
          </button>
        </div>
      </div>

      <div id="app-body" style="display:none">
        <div class="section">
          <div class="section-title">About</div>
          <div id="app-description" style="font-size:0.88em;color:var(--fg2);line-height:1.6;margin-bottom:14px"></div>
          <div class="field-grid">
            <div><div class="field-label">Slug</div><div class="field-value" id="app-slug-val">—</div></div>
            <div><div class="field-label">Owner</div><div class="field-value" id="app-owner">—</div></div>
            <div><div class="field-label">Schema</div><div class="field-value" id="app-schema">—</div></div>
            <div><div class="field-label">Homepage</div><div class="field-value" id="app-homepage">—</div></div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Workspace Template</div>
          <div class="field-grid" style="margin-bottom:12px">
            <div><div class="field-label">Initial Budget</div><div class="field-value" id="tmpl-budget">—</div></div>
            <div><div class="field-label">Default Name</div><div class="field-value" id="tmpl-name-pattern">—</div></div>
          </div>
          <div class="field-label" style="margin-bottom:6px">Auto-hired agents</div>
          <div id="tmpl-agents" style="display:flex;flex-wrap:wrap;gap:6px"></div>
        </div>

        <div class="section" id="workspaces-section">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
            <div class="section-title" style="margin-bottom:0">Workspaces</div>
          </div>
          <div id="workspaces-list" class="ws-list">
            <div style="color:var(--fg3);font-size:0.85em">Loading…</div>
          </div>
        </div>

        <div class="section" id="admin-section" style="display:none">
          <div class="section-title">Admin</div>
          <div class="admin-actions">
            <button class="admin-btn" onclick="showGrantModal()">Grant Credits to Workspace</button>
            <button class="admin-btn danger" onclick="archiveApp()">Archive App</button>
          </div>
        </div>
      </div>

      <div id="app-error" class="error-state" style="display:none"></div>
    </div>

    <!-- Grant credits modal -->
    <div id="grant-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:500;align-items:center;justify-content:center">
      <div style="background:var(--bg0);border:1px solid var(--bg2);border-radius:4px;padding:24px;width:340px;max-width:90vw">
        <div style="font-size:0.9em;color:var(--fg0);margin-bottom:4px;font-weight:500">Grant Credits to Workspace</div>
        <div style="font-size:0.78em;color:var(--fg3);margin-bottom:16px">Credits are granted directly — not deducted from your wallet.</div>
        <select id="grant-ws-select" style="width:100%;background:var(--bg1);border:1px solid var(--bg3);color:var(--fg1);padding:8px;font-family:inherit;font-size:0.85em;margin-bottom:10px;border-radius:3px"></select>
        <input type="number" id="grant-amount" value="200" min="1" max="10000"
          style="width:100%;background:var(--bg1);border:1px solid var(--bg3);color:var(--fg1);padding:8px;font-family:inherit;font-size:0.85em;margin-bottom:10px;border-radius:3px;box-sizing:border-box" placeholder="Credits" />
        <input type="text" id="grant-reason" value="Admin top-up"
          style="width:100%;background:var(--bg1);border:1px solid var(--bg3);color:var(--fg1);padding:8px;font-family:inherit;font-size:0.85em;margin-bottom:16px;border-radius:3px;box-sizing:border-box" placeholder="Reason" />
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button onclick="closeGrantModal()" style="background:none;border:1px solid var(--bg3);color:var(--fg3);padding:7px 14px;border-radius:3px;cursor:pointer;font-family:inherit;font-size:0.85em">Cancel</button>
          <button onclick="submitGrant()" style="background:var(--yellow);color:var(--bg0);border:none;padding:7px 14px;border-radius:3px;cursor:pointer;font-family:inherit;font-size:0.85em;font-weight:600">Grant</button>
        </div>
        <div id="grant-status" style="font-size:0.78em;color:var(--green);margin-top:10px;display:none"></div>
      </div>
    </div>

    <script>
      let _app = null;
      let _workspaces = [];
      let _isAdmin = false;

      async function loadApp() {
        try {
          const [appRes, meRes] = await Promise.all([
            fetch(`/api/apps/${encodeURIComponent(appSlug)}`),
            fetch("/api/auth/me").catch(() => null),
          ]);

          if (meRes?.ok) {
            const me = await meRes.json();
            _isAdmin = me.role === "admin";
          }

          if (!appRes.ok) {
            document.getElementById("app-error").style.display = "block";
            document.getElementById("app-error").textContent =
              appRes.status === 404
                ? `App '${appSlug}' not found.`
                : `Error loading app (${appRes.status}).`;
            return;
          }

          _app = await appRes.json();
          renderApp(_app);
          loadWorkspaces();
        } catch (e) {
          document.getElementById("app-error").style.display = "block";
          document.getElementById("app-error").textContent = e.message;
        }
      }

      function renderApp(app) {
        document.title = `${app.name || app.slug} — Agent Bestiary`;
        Nav.setTitle(app.name || app.slug);

        // Hero
        const iconEl = document.getElementById("app-icon");
        if (app.icon_url) {
          iconEl.innerHTML = `<img src="${esc(app.icon_url)}" alt="" onerror="this.parentElement.textContent='⚙'" />`;
        } else {
          iconEl.textContent = (app.name || "A").charAt(0).toUpperCase();
        }
        document.getElementById("app-name").textContent = app.name || app.slug;
        document.getElementById("app-tagline").textContent = app.tagline || "";
        const badges = document.getElementById("app-badges");
        badges.innerHTML = `<span class="badge ${app.visibility || 'private'}">${app.visibility || 'private'}</span>`;
        if (app.composition_slug) badges.innerHTML += `<span class="badge">${esc(app.composition_slug)}</span>`;

        // Body
        document.getElementById("app-description").textContent = app.description || "";
        document.getElementById("app-slug-val").textContent = app.slug;
        document.getElementById("app-owner").textContent = app.owner_display_name || app.owner_user_id || "—";
        document.getElementById("app-schema").textContent = app.schema_slug || "—";
        const hp = app.homepage_url;
        document.getElementById("app-homepage").innerHTML = hp
          ? `<a href="${esc(hp)}" target="_blank" style="color:var(--aqua)">${esc(hp)}</a>`
          : "—";

        const tmpl = app.workspace_template || {};
        document.getElementById("tmpl-budget").textContent = (tmpl.initial_budget ?? "—") + " cr";
        document.getElementById("tmpl-name-pattern").textContent = tmpl.default_name_pattern || "—";

        const agentsEl = document.getElementById("tmpl-agents");
        const autoHire = tmpl.auto_hire || [];
        agentsEl.innerHTML = autoHire.length
          ? autoHire.map(id => `<a href="/agent/${esc(id)}" class="agent-pill">⚙ ${esc(id)}</a>`).join("")
          : '<span style="color:var(--fg3);font-size:0.82em">None auto-hired</span>';

        // Show spawn button for authenticated users
        document.getElementById("spawn-btn").style.display = "inline-block";

        // Admin section
        if (_isAdmin) document.getElementById("admin-section").style.display = "block";

        document.getElementById("app-hero").style.display = "flex";
        document.getElementById("app-body").style.display = "block";
      }

      async function loadWorkspaces() {
        try {
          const res = await fetch(`/api/apps/${encodeURIComponent(appSlug)}/workspaces`);
          if (!res.ok) return;
          const data = await res.json();
          _workspaces = data.workspaces || [];
          renderWorkspaces(_workspaces);
        } catch (_) {}
      }

      function renderWorkspaces(list) {
        const el = document.getElementById("workspaces-list");
        if (!list.length) {
          el.innerHTML = '<div style="color:var(--fg3);font-size:0.85em">No workspaces yet. Click "+ New Workspace" to spawn one.</div>';
          return;
        }
        el.innerHTML = list.map(w => `
          <a href="/workspace/${esc(w.id)}" class="ws-item">
            <div>
              <div>${esc(w.name || "Unnamed")}</div>
              <div class="ws-meta">${w.agent_count || 0} agents · ${w.workspace_remaining ?? w.workspace_budget ?? 0} cr remaining</div>
            </div>
            <div class="ws-meta">${w.created_at ? new Date(w.created_at).toLocaleDateString() : ""}</div>
          </a>`).join("");

        // Populate grant modal workspace select
        const sel = document.getElementById("grant-ws-select");
        sel.innerHTML = list.map(w => `<option value="${esc(w.id)}">${esc(w.name || w.id)}</option>`).join("");
      }

      async function spawnWorkspace() {
        const btn = document.getElementById("spawn-btn");
        btn.disabled = true;
        btn.textContent = "Spawning…";
        try {
          const res = await fetch(`/api/apps/${encodeURIComponent(appSlug)}/workspaces`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({}),
          });
          if (!res.ok) {
            const err = await res.text();
            alert("Failed to spawn workspace: " + err);
            return;
          }
          const data = await res.json();
          if (data.workspace_url) {
            window.location.href = data.workspace_url;
          } else if (data.workspace_id) {
            window.location.href = `/workspace/${data.workspace_id}`;
          } else {
            loadWorkspaces();
          }
        } catch (e) {
          alert("Error: " + e.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "+ New Workspace";
        }
      }

      function showGrantModal() {
        document.getElementById("grant-modal").style.display = "flex";
        document.getElementById("grant-status").style.display = "none";
      }

      function closeGrantModal() {
        document.getElementById("grant-modal").style.display = "none";
      }

      async function submitGrant() {
        const wsId = document.getElementById("grant-ws-select").value;
        const credits = parseInt(document.getElementById("grant-amount").value) || 200;
        const reason = document.getElementById("grant-reason").value || "Admin top-up";
        const statusEl = document.getElementById("grant-status");
        statusEl.style.display = "none";
        try {
          const res = await fetch(`/api/admin/workspaces/${encodeURIComponent(wsId)}/grant`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ credits, reason }),
          });
          const data = await res.json();
          if (!res.ok) {
            statusEl.style.color = "var(--red)";
            statusEl.textContent = data.error || "Grant failed";
          } else {
            statusEl.style.color = "var(--green)";
            statusEl.textContent = `✓ Granted ${credits} cr to "${data.workspace_name}"`;
            loadWorkspaces();
          }
          statusEl.style.display = "block";
        } catch (e) {
          statusEl.style.color = "var(--red)";
          statusEl.textContent = e.message;
          statusEl.style.display = "block";
        }
      }

      async function archiveApp() {
        if (!confirm(`Archive app '${appSlug}'? It will no longer be discoverable.`)) return;
        const res = await fetch(`/api/apps/${encodeURIComponent(appSlug)}/archive`, { method: "POST" });
        if (res.ok) { window.location.href = "/apps"; }
        else { alert("Failed to archive: " + await res.text()); }
      }

      function esc(s) {
        return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
      }

      loadApp();
    </script>

    <script src="/static/js/theme.js"></script>
    <script src="/static/js/auth.js"></script>
  </body>
</html>
