<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Fermi Agent Bestiary{% endblock %}</title>
    <style>
      /* Ayu Mirage Theme - Matching Report System */
      :root {
        --bg-primary: #1f2430;
        --bg-secondary: #232834;
        --bg-tertiary: #2a2f3a;
        --fg-primary: #cbccc6;
        --fg-secondary: #707a8c;
        --accent: #ffcc66;
        --primary: #5ccfe6;
        --secondary: #bae67e;
        --tertiary: #ffae57;
        --error: #ff3333;
        --muted: #5c6773;
        --border: #3e4451;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas,
          "DejaVu Sans Mono", monospace;
        background-color: var(--bg-primary);
        color: var(--fg-primary);
        line-height: 1.6;
        font-size: 14px;
      }

      /* Header */
      header {
        background-color: var(--bg-secondary);
        border-bottom: 2px solid var(--accent);
        padding: 1.5rem 2rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      .header-content {
        max-width: 1400px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        font-size: 1.5rem;
        font-weight: bold;
        color: var(--accent);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .logo-icon {
        font-size: 1.8rem;
      }

      nav {
        display: flex;
        gap: 2rem;
      }

      nav a {
        color: var(--fg-primary);
        text-decoration: none;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        transition: all 0.2s;
      }

      nav a:hover {
        background-color: var(--bg-tertiary);
        color: var(--accent);
      }

      nav a.active {
        color: var(--primary);
        background-color: var(--bg-tertiary);
      }

      /* Main Content */
      main {
        max-width: 1400px;
        margin: 2rem auto;
        padding: 0 2rem;
      }

      /* Cards */
      .card {
        background-color: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border);
      }

      .card-title {
        font-size: 1.25rem;
        font-weight: bold;
        color: var(--accent);
      }

      /* Buttons */
      .btn {
        display: inline-block;
        padding: 0.5rem 1.25rem;
        border-radius: 4px;
        text-decoration: none;
        font-weight: 500;
        cursor: pointer;
        border: none;
        font-family: inherit;
        font-size: 0.9rem;
        transition: all 0.2s;
      }

      .btn-primary {
        background-color: var(--primary);
        color: var(--bg-primary);
      }

      .btn-primary:hover {
        background-color: #4fb8d4;
        box-shadow: 0 2px 8px rgba(92, 207, 230, 0.3);
      }

      .btn-secondary {
        background-color: var(--secondary);
        color: var(--bg-primary);
      }

      .btn-secondary:hover {
        background-color: #a8d66e;
      }

      .btn-accent {
        background-color: var(--accent);
        color: var(--bg-primary);
      }

      .btn-accent:hover {
        background-color: #ffd580;
      }

      /* Badges */
      .badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 12px;
        font-size: 0.75rem;
        font-weight: bold;
        text-transform: uppercase;
      }

      .badge-curated {
        background-color: var(--accent);
        color: var(--bg-primary);
      }

      .badge-community {
        background-color: var(--secondary);
        color: var(--bg-primary);
      }

      .badge-success {
        background-color: var(--secondary);
        color: var(--bg-primary);
      }

      .badge-error {
        background-color: var(--error);
        color: white;
      }

      /* Stats */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
        margin: 1.5rem 0;
      }

      .stat-card {
        background-color: var(--bg-tertiary);
        padding: 1.25rem;
        border-radius: 6px;
        border: 1px solid var(--border);
      }

      .stat-label {
        font-size: 0.85rem;
        color: var(--fg-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 0.5rem;
      }

      .stat-value {
        font-size: 1.75rem;
        font-weight: bold;
        color: var(--primary);
      }

      .stat-unit {
        font-size: 1rem;
        color: var(--fg-secondary);
        margin-left: 0.25rem;
      }

      /* Tables */
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 1rem 0;
      }

      th {
        background-color: var(--bg-tertiary);
        color: var(--accent);
        text-align: left;
        padding: 0.75rem 1rem;
        font-weight: bold;
        border-bottom: 2px solid var(--accent);
      }

      td {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--border);
      }

      tr:hover {
        background-color: var(--bg-tertiary);
      }

      /* Forms */
      .form-group {
        margin-bottom: 1.5rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--fg-primary);
        font-weight: 500;
      }

      input[type="text"],
      textarea,
      select {
        width: 100%;
        padding: 0.75rem;
        background-color: var(--bg-tertiary);
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--fg-primary);
        font-family: inherit;
        font-size: 0.95rem;
      }

      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(92, 207, 230, 0.1);
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      /* Loading */
      .loading {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid var(--border);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Footer */
      footer {
        max-width: 1400px;
        margin: 4rem auto 2rem;
        padding: 2rem;
        text-align: center;
        color: var(--fg-secondary);
        border-top: 1px solid var(--border);
      }

      footer a {
        color: var(--primary);
        text-decoration: none;
      }

      footer a:hover {
        color: var(--accent);
      }

      /* Utility Classes */
      .text-muted {
        color: var(--fg-secondary);
      }

      .text-accent {
        color: var(--accent);
      }

      .text-primary {
        color: var(--primary);
      }

      .text-error {
        color: var(--error);
      }

      .mt-1 {
        margin-top: 0.5rem;
      }
      .mt-2 {
        margin-top: 1rem;
      }
      .mt-3 {
        margin-top: 1.5rem;
      }
      .mb-1 {
        margin-bottom: 0.5rem;
      }
      .mb-2 {
        margin-bottom: 1rem;
      }
      .mb-3 {
        margin-bottom: 1.5rem;
      }

      .flex {
        display: flex;
      }

      .flex-between {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .gap-1 {
        gap: 0.5rem;
      }
      .gap-2 {
        gap: 1rem;
      }
      .gap-3 {
        gap: 1.5rem;
      }
    </style>
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <header>
      <div class="header-content">
        <a href="/" class="logo">
          <span class="logo-icon">[AI]</span>
          <span>Fermi Agent Bestiary</span>
        </a>
        <nav>
          <a href="/" class="{% if page == 'agents' %}active{% endif %}"
            >Agents</a
          >
          <a
            href="/dashboard"
            class="{% if page == 'dashboard' %}active{% endif %}"
            >Dashboard</a
          >
          <a href="/docs" class="{% if page == 'docs' %}active{% endif %}"
            >Docs</a
          >
        </nav>
      </div>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer>
      <p>Fermi Agent Bestiary &mdash; AI-Powered Forecasting Research</p>
      <p class="mt-1">
        <a href="https://github.com/fermi-project/fermi" target="_blank"
          >GitHub</a
        >
        &middot; <a href="/docs/api">API</a> &middot;
        <a href="/docs/mcp">MCP Integration</a>
      </p>
    </footer>

    {% block extra_js %}{% endblock %}
  </body>
</html>
