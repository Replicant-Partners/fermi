<!doctype html>
<html lang="en" class="theme-hasui">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Agent Bestiary</title>
    <style>
      :root {
        --bg0-hard: #1d2021;
        --bg0: #282828;
        --bg2: #504945;
        --fg0: #fbf1c7;
        --fg1: #ebdbb2;
        --fg3: #bdae93;
        --yellow: #fabd2f;
        --red: #fb4934;
        --gray: #928374;
      }
      .theme-op1 {
        --bg0-hard: #f5f5f0;
        --bg0: #ffffff;
        --bg2: #e0e0db;
        --fg0: #1a1a1a;
        --fg1: #2d2d2d;
        --fg3: #6b6b6b;
        --yellow: #ff6b00;
        --red: #ff1744;
        --gray: #9e9e9e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg0-hard);
        color: var(--fg1);
        font-family: "Berkeley Mono", "JetBrains Mono", monospace;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .error-container {
        text-align: center;
        padding: 40px;
      }
      .error-code {
        font-size: 8rem;
        font-weight: bold;
        color: var(--yellow);
        line-height: 1;
        opacity: 0.8;
      }
      .error-title {
        font-size: 1.5rem;
        color: var(--fg0);
        margin: 16px 0 8px;
      }
      .error-message {
        color: var(--fg3);
        font-size: 0.9rem;
        max-width: 400px;
        margin: 0 auto 32px;
      }
      .error-links {
        display: flex;
        gap: 16px;
        justify-content: center;
      }
      .error-links a {
        color: var(--yellow);
        text-decoration: none;
        padding: 8px 20px;
        border: 1px solid var(--bg2);
        border-radius: 6px;
        font-size: 0.85rem;
        transition: all 0.15s;
      }
      .error-links a:hover {
        border-color: var(--yellow);
        background: rgba(250, 189, 47, 0.1);
      }
      .ascii-art {
        color: var(--gray);
        font-size: 0.7rem;
        line-height: 1.2;
        margin-bottom: 24px;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <div class="ascii-art">.---. / o o \ ( &gt; ) '---' /| |\ | |</div>
      <div class="error-code">404</div>
      <h1 class="error-title">Agent Not Found</h1>
      <p class="error-message">
        The page you're looking for has wandered off into unexplored territory.
        It may have been moved or never existed.
      </p>
      <div class="error-links">
        <a href="/catalogue">Catalogue</a>
        <a href="/dashboard">Dashboard</a>
      </div>
    </div>
    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        if (saved === "op1") {
          document.documentElement.classList.remove("theme-hasui");
          document.documentElement.classList.add("theme-op1");
        }
      })();
    </script>
  </body>
</html>
