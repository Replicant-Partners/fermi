        {% for agent in agents %}
        <div style="margin-bottom: 1rem;">
            <div class="flex-between mb-1">
                <span style="color: var(--fg-primary);">{{ agent.agent_id }}</span>
                <span style="color: var(--primary); font-weight: bold;">{{ agent.usage.total_executions }}</span>
            </div>
            <div style="background-color: var(--bg-tertiary); height: 8px; border-radius: 4px; overflow: hidden;">
                <div style="background: linear-gradient(90deg, var(--primary), var(--secondary)); height: 100%; width: 75%;"></div>
            </div>
        </div>
        {% endfor %}
