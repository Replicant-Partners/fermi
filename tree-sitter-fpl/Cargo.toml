[package]
name = "tree-sitter-fpl"
version = "0.1.0"
edition = "2021"
authors = ["Replicant Partners"]
description = "FPL grammar for tree-sitter"
license = "MIT"
readme = "README.md"
keywords = ["tree-sitter", "parser", "fpl"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/Replicant-Partners/fermi"

[lib]
path = "src/lib.rs"

[dependencies]
tree-sitter = "~0.22"

[build-dependencies]
cc = "1.0"
