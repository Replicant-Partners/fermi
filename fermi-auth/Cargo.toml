[package]
name = "fermi-auth"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core async runtime
tokio = { version = "1.43", features = ["full"] }

# Web framework
axum = "0.7"

# JWT handling
jsonwebtoken = "9"
once_cell = "1.19"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client (use rustls instead of openssl)
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }

# Crypto for API keys
argon2 = { version = "0.5", features = ["std"] }
rand_core = { version = "0.6", features = ["std"] }

# Symmetric encryption for user secrets
aes-gcm = "0.10"

# Web3 / SIWE (use rustls to avoid OpenSSL)
siwe = { version = "0.6", default-features = false, features = ["serde"] }
ethers = { version = "2.0", default-features = false, features = ["rustls"] }
hex = "0.4"

# UUID and datetime
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"  # For SIWE timestamp handling

# Error handling
thiserror = "2.0"

# URL encoding for OAuth
serde_urlencoded = "0.7"

[dev-dependencies]
