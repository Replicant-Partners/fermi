[package]
name = "fermi-lsp"
version = "0.1.0"
edition = "2021"
authors = ["Replicant Partners"]
description = "FPL Language Server Protocol implementation"

[[bin]]
name = "fermi-lsp"
path = "src/main.rs"

[dependencies]
# Core FPL functionality
fermi = { path = ".." }

# LSP framework
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }

# Lossless syntax tree
rowan = "0.15"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
lsp-types = "0.95"
