[workspace]
members = [
    ".",
    "agent-bestiary/memory",
    "agent-bestiary/evaluators",
    "agent-bestiary/observability",
    "agent-bestiary/coherence-gate",
    "agent-bestiary/evaluator-wildguard",
    "agent-bestiary/evaluator-faithfulness",
    "agent-bestiary/evaluator-sotopia",
    "agent-bestiary/evaluator-lifelong",
    "agent-bestiary/evaluator-character",
    "agent-bestiary/ontology",
    "agent-bestiary/consolidate",
    "agent-bestiary/projector",
    "agent-bestiary/coherence/crates/coherence-core",
    "agent-bestiary/coherence/crates/coherence-engine",
    "agent-bestiary/coherence/crates/coherence-observer",
    "agent-bestiary/coherence/crates/coherence-api",
    "agent-bestiary/coherence/crates/coherence-protocols",
    "fermi-memory",
    "fermi-auth",
    "fermi-lsp", "crates/fermi-console",
    "crates/simops",
]
resolver = "2"

[package]
name = "fermi"
version = "0.1.0"
edition = "2021"
authors = ["Fermi Team"]
description = "Forecasting Programming Language (FPL) - Agent Fermi's Broca Brain"

[dependencies]
# For date/time handling
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# For better error messages
colored = "2.0"

# For serialization (when we need to save/load forecasts)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For REST API
axum = { version = "0.7", features = ["multipart"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# For LLM integration
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
async-trait = "0.1"

# For CLI (will use later)
clap = { version = "4.0", features = ["derive", "env"] }

# For MCP server
rust-mcp-sdk = { version = "0.8", features = ["server", "stdio"] }

# For Web UI
askama = { version = "0.12", features = ["with-axum"] }
askama_axum = "0.4"

# For random number generation (Monte Carlo simulation)
rand = "0.8"
rand_distr = "0.4"

# For regex in examples
regex = "1.10"

# For async runtime
tokio = { version = "1", features = ["full"] }
async-stream = "0.3"
futures-core = "0.3"
http = "1"
http-body-util = "0.1"

# ADM Memory + Ontology + Projector
agent-bestiary-memory = { path = "agent-bestiary/memory" }
agent-bestiary-ontology = { path = "agent-bestiary/ontology" }
agent-bestiary-projector = { path = "agent-bestiary/projector" }

# Social Agent Observability — Plane B evaluator registry
# (see docs/architecture/OBSERVABILITY_IMPL.md, Phase 1+2)
agent-bestiary-evaluators = { path = "agent-bestiary/evaluators" }

# Social Agent Observability — Plane C longitudinal observability
# (see docs/architecture/OBSERVABILITY_IMPL.md, Phase 3)
agent-bestiary-observability = { path = "agent-bestiary/observability" }

# Social Agent Observability — Phase 5 intervention feedback loop
# (coherence gate + two-write memory pattern)
agent-bestiary-coherence-gate = { path = "agent-bestiary/coherence-gate" }

# Track B — native Rust evaluator family (5 evaluators)
evaluator-wildguard    = { path = "agent-bestiary/evaluator-wildguard" }
evaluator-faithfulness = { path = "agent-bestiary/evaluator-faithfulness" }
evaluator-sotopia      = { path = "agent-bestiary/evaluator-sotopia" }
evaluator-lifelong     = { path = "agent-bestiary/evaluator-lifelong" }
evaluator-character    = { path = "agent-bestiary/evaluator-character" }
rust_decimal = { version = "1", features = ["serde-float"] }
sha2 = "0.10"

# Coherence evaluator
coherence-core = { path = "agent-bestiary/coherence/crates/coherence-core" }
coherence-engine = { path = "agent-bestiary/coherence/crates/coherence-engine" }
coherence-observer = { path = "agent-bestiary/coherence/crates/coherence-observer" }

# SimOps — Universal Resource Efficiency Engine (SOSA-aligned)
simops = { path = "crates/simops" }

# Auth
fermi-auth = { path = "fermi-auth" }

# For migration scripts
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
anyhow = "1.0"

# Rate limiting
dashmap = "6"

# Base64 encoding/decoding (for binary file tools)
base64 = "0.22"

# H3 hexagonal grid (AR spatial suite)
h3o = "0.6"

# Web Push notifications — VAPID JWT signing (ES256 / ECDSA P-256)
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
ecdsa = { version = "0.16", features = ["signing", "der"] }
url = "2"

# QR code generation (Rabble events)
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }

# Stripe payments
async-stripe = { version = "0.41", features = ["runtime-tokio-hyper-rustls", "checkout", "webhook-endpoints"] }

[dev-dependencies]
# For testing
criterion = "0.5"

[[bin]]
name = "fermi"
path = "src/main.rs"

[[bin]]
name = "agent-server"
path = "src/bin/agent-server.rs"

[[bin]]
name = "agent-mcp-server"
path = "src/bin/agent-mcp-server.rs"

[[bin]]
name = "agent-web-ui"
path = "src/bin/agent-web-ui.rs"

[[bin]]
name = "migrate-embedding-dimensions"
path = "scripts/migrate_embedding_dimensions.rs"

[lib]
name = "fermi"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Faster release builds for local dev — `cargo build --profile release-fast -p fermi-console`
# ~2x faster than release; still optimized, just no LTO
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

[[bin]]
name = "api-server"
path = "src/api_server.rs"
