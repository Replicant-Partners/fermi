[package]
name = "fermi"
version = "0.1.0"
edition = "2021"
authors = ["Fermi Team"]
description = "Forecasting Programming Language (FPL) - Agent Fermi's Broca Brain"

[dependencies]
# For date/time handling
chrono = "0.4"

# For better error messages
colored = "2.0"

# For serialization (when we need to save/load forecasts)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For CLI (will use later)
clap = { version = "4.0", features = ["derive"] }

# For random number generation (Monte Carlo simulation)
rand = "0.8"
rand_distr = "0.4"

# Vercel runtime (for serverless functions)
vercel_runtime = "2"
tokio = { version = "1", features = ["full"] }
http = "1"
http-body-util = "0.1"

[dev-dependencies]
# For testing
criterion = "0.5"

[[bin]]
name = "fermi"
path = "src/main.rs"

# Vercel API functions
[[bin]]
name = "health"
path = "api/health.rs"

[[bin]]
name = "execute"
path = "api/execute.rs"

[lib]
name = "fermi"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
