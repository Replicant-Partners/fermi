[package]
name = "agent-bestiary-projector"
version = "0.1.0"
edition = "2021"
authors = ["Fermi Team"]
description = "Dimensionality reduction and embedding projection for agent visualization"

[dependencies]
# Fermi crates
agent-bestiary-memory = { path = "../memory" }

# Dimensionality reduction
linfa = "0.7"
linfa-reduction = "0.7"
ndarray = "0.15"

# Caching
dashmap = "6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.35", features = ["full"] }

# Types
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
