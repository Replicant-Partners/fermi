[package]
name = "coherence-protocols"
version = "0.1.0"
edition = "2021"
authors = ["Replicant Partners"]
description = "Integration protocol traits and adapters for MCP, A2A, and AKP"

[dependencies]
coherence-core = { path = "../coherence-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
async-trait = "0.1"
