[package]
name = "coherence-api"
version = "0.1.0"
edition = "2021"
authors = ["Replicant Partners"]
description = "REST API server for the Collaboration Coherence Evaluator Agent"

[dependencies]
coherence-core = { path = "../coherence-core" }
coherence-engine = { path = "../coherence-engine" }
coherence-observer = { path = "../coherence-observer" }
coherence-protocols = { path = "../coherence-protocols" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"

[dev-dependencies]
pretty_assertions = "1"
