[package]
name = "agent-bestiary-observability"
version = "0.1.0"
edition = "2021"
description = "Plane C — longitudinal observability: timeline scorer, persona drift monitor, social interaction tracker, anomaly detector, trend analyzer. See docs/architecture/OBSERVABILITY_IMPL.md (Phase 3)."

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# Phase 0 input contract + storage; Phase 1+2 evaluator types
agent-bestiary-memory = { path = "../memory" }
agent-bestiary-evaluators = { path = "../evaluators" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
