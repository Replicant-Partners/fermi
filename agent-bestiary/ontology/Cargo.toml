[package]
name = "agent-bestiary-ontology"
version = "0.1.0"
edition = "2021"
authors = ["Fermi Team"]
description = "Mermaid ER diagram generation and git-based ontology versioning for Fermi agents"

[dependencies]
# Fermi crates
agent-bestiary-memory = { path = "../memory" }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Git integration
git2 = { version = "0.19", default-features = false, features = ["vendored-openssl", "vendored-libgit2"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.35", features = ["full"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"
