[package]
name = "agent-bestiary-consolidate"
version = "0.1.0"
edition = "2021"
authors = ["Fermi Team"]
description = "Consolidation worker for Fermi Active Dreaming Memory"

[dependencies]
# Fermi crates
agent-bestiary-memory = { path = "../memory" }
agent-bestiary-ontology = { path = "../ontology" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenvy = "0.15"

# Serialization
serde_json = "1.0"

# Database (for budget queries)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }

# Error handling
anyhow = "1.0"

# UUID
uuid = { version = "1.7", features = ["v4"] }
