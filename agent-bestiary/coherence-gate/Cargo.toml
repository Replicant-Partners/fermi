[package]
name = "agent-bestiary-coherence-gate"
version = "0.1.0"
edition = "2021"
description = "Phase 5 — intervention feedback loop: encoder, coherence gate, two-write memory pattern"

[dependencies]
agent-bestiary-memory = { path = "../memory" }
coherence-core   = { path = "../coherence/crates/coherence-core" }
coherence-engine = { path = "../coherence/crates/coherence-engine" }

async-trait = "0.1"
chrono      = { version = "0.4", features = ["serde"] }
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
thiserror   = "1.0"
tracing     = "0.1"
uuid        = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
